html,body{margin:0;height:100%;overflow:hidden;background:#050608;font-family:monospace}

#pauseButton{display:none;position:fixed;right:16px;top:14px;z-index:18;width:38px;height:34px;padding:0;color:#d9ddd8;background:rgba(18,23,24,.84);border:1px solid #687270;font:700 15px monospace;cursor:pointer}
#pauseButton.visible{display:block}#pauseButton:hover{background:#303a3b;border-color:#aab4b0}

#pauseOverlay.open{display:flex}
#pausePanel{box-sizing:border-box;width:min(410px,88vw);padding:25px 26px;color:#d9ddd8;background:rgba(8,11,13,.97);border:1px solid #59615f;box-shadow:0 18px 70px rgba(0,0,0,.7)}
#pauseTitle{margin:0 0 20px;font-size:23px;letter-spacing:4px}
#pauseActions{display:grid;gap:8px}
#pauseActions>button{width:100%;padding:10px 14px;color:#daddd8;background:#202729;border:1px solid #687270;font:700 12px monospace;cursor:pointer}
#pauseActions>button:hover{background:#303a3b;border-color:#9aa5a1}
#pauseSettingsPanel{display:none;margin-top:12px;padding:8px 12px;border:1px solid #3f4745;background:#0b0e0f}
#pauseSettingsPanel.open{display:block}
</style>

<div id="wrap"><canvas id="game" width="1440" height="810"></canvas></div>
<div id="startScreen"><div id="startPanel"><h1>PROJECT<br>LOCKDOWN</h1><p id="menuSubtitle">EXPERIMENTAL BUILD · TEST YARD</p><div id="startActions"><button id="startButton">테스트방</button><button id="settingsButton">설정</button><button id="fullscreenButton" hidden>전체화면</button></div><div id="settingsPanel"><div class="settingRow"><label id="masterLabel" for="masterVolume">마스터 볼륨</label><input id="masterVolume" type="range" min="0" max="100" value="100"><span id="masterValue" class="settingValue">100</span></div><div class="settingRow"><label id="musicLabel" for="musicVolume">음악 볼륨</label><input id="musicVolume" type="range" min="0" max="100" value="38"><span id="musicValue" class="settingValue">38</span></div><div class="settingRow"><span id="languageLabel">언어</span><div class="languageButtons"><button id="langKo">한국어</button><button id="langEn">ENGLISH</button></div><span></span></div><div class="diagnosticGrid"><label class="diagnosticToggle"><input id="showMuzzleDirection" type="checkbox"><span id="showMuzzleLabel">현재 총구 방향</span></label><label class="diagnosticToggle"><input id="showSpread" type="checkbox"><span id="showSpreadLabel">탄착군 표시</span></label><label class="diagnosticToggle"><input id="showHealthHud" type="checkbox"><span id="showHealthLabel">적 체력 바</span></label><label class="diagnosticToggle"><input id="showEnemyHealthNumbers" type="checkbox"><span id="showEnemyHealthNumbersLabel">적 체력 숫자</span></label><label class="diagnosticToggle"><input id="showDamageNumbers" type="checkbox"><span id="showDamageNumbersLabel">피해량 표시</span></label><label class="diagnosticToggle"><input id="combineDamageNumbers" type="checkbox"><span id="combineDamageNumbersLabel">연속 피해 합산</span></label><label class="diagnosticToggle"><input id="showWeaponHud" type="checkbox"><span id="showWeaponLabel">무기 정보</span></label><label class="diagnosticToggle"><input id="showCasingCounts" type="checkbox"><span id="showCasingCountsLabel">탄피 개수 표시</span></label></div></div></div></div>

<div id="pauseOverlay"><div id="pausePanel"><h2 id="pauseTitle">일시정지</h2><div id="pauseActions"><button id="resumeButton">계속하기</button><button id="pauseSettingsButton">설정</button><div id="pauseSettingsPanel"><div class="settingRow"><label id="pauseMasterLabel" for="pauseMasterVolume">마스터 볼륨</label><input id="pauseMasterVolume" type="range" min="0" max="100" value="100"><span id="pauseMasterValue" class="settingValue">100</span></div><div class="settingRow"><label id="pauseMusicLabel" for="pauseMusicVolume">음악 볼륨</label><input id="pauseMusicVolume" type="range" min="0" max="100" value="38"><span id="pauseMusicValue" class="settingValue">38</span></div><div class="settingRow"><span id="pauseLanguageLabel">언어</span><div class="languageButtons"><button id="pauseLangKo">한국어</button><button id="pauseLangEn">ENGLISH</button></div><span></span></div><div class="diagnosticGrid"><label class="diagnosticToggle"><input id="pauseShowMuzzleDirection" type="checkbox"><span id="pauseShowMuzzleLabel">현재 총구 방향</span></label><label class="diagnosticToggle"><input id="pauseShowSpread" type="checkbox"><span id="pauseShowSpreadLabel">탄착군 표시</span></label><label class="diagnosticToggle"><input id="pauseShowHealthHud" type="checkbox"><span id="pauseShowHealthLabel">적 체력 바</span></label><label class="diagnosticToggle"><input id="pauseShowEnemyHealthNumbers" type="checkbox"><span id="pauseShowEnemyHealthNumbersLabel">적 체력 숫자</span></label><label class="diagnosticToggle"><input id="pauseShowDamageNumbers" type="checkbox"><span id="pauseShowDamageNumbersLabel">피해량 표시</span></label><label class="diagnosticToggle"><input id="pauseCombineDamageNumbers" type="checkbox"><span id="pauseCombineDamageNumbersLabel">연속 피해 합산</span></label><label class="diagnosticToggle"><input id="pauseShowWeaponHud" type="checkbox"><span id="pauseShowWeaponLabel">무기 정보</span></label><label class="diagnosticToggle"><input id="pauseShowCasingCounts" type="checkbox"><span id="pauseShowCasingCountsLabel">탄피 개수 표시</span></label></div></div><button id="mainMenuButton">메인 메뉴</button></div></div></div>

<script>
(()=>{'use strict';

// ===== 화면 / 월드 =====
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const spriteRoom={open:false,index:0,zoom:8,angle:0,light:false};
// Keep gallery input out of every gameplay listener, including capture listeners.
for(const type of ['keydown','keyup','mousedown','mouseup','mousemove','wheel','contextmenu']){
  window.addEventListener(type,event=>{
    if(!spriteRoom.open)return;
    if(type==='keydown'&&event.code==='Escape'){closeSpriteRoom();event.preventDefault();}
    if(type==='wheel'&&event.target===canvas){
      spriteRoom.zoom=clamp(spriteRoom.zoom+(event.deltaY<0?1:-1),2,16);
      document.getElementById('spriteRoomZoom').value=spriteRoom.zoom;
      event.preventDefault();
    }
    event.stopImmediatePropagation();
  },{capture:true,passive:false});
}
// 12px 이하의 작은 캔버스 문구는 전체적으로 한 단계 키운다.
// 측정과 실제 출력을 같이 보정해 배경 상자 밖으로 삐져나오지 않게 한다.
const SMALL_TEXT_SCALE=1.28;
const nativeFillText=ctx.fillText.bind(ctx);
const nativeStrokeText=ctx.strokeText.bind(ctx);
const nativeMeasureText=ctx.measureText.bind(ctx);
function scaledCanvasFont(font){
  if(typeof font!=='string')return null;
  const match=font.match(/(\d+(?:\.\d+)?)px/);
  if(!match)return null;
  const size=Number(match[1]);
  if(!Number.isFinite(size)||size>12)return null;
  return font.replace(match[0],`${Math.round(size*SMALL_TEXT_SCALE*10)/10}px`);
}
ctx.fillText=function(...args){
  const original=this.font,scaled=scaledCanvasFont(original);
  if(scaled)this.font=scaled;
  nativeFillText(...args);
  if(scaled)this.font=original;
};
ctx.strokeText=function(...args){
  const original=this.font,scaled=scaledCanvasFont(original);
  if(scaled)this.font=scaled;
  nativeStrokeText(...args);
  if(scaled)this.font=original;
};
ctx.measureText=function(text){
  const original=this.font,scaled=scaledCanvasFont(original);
  if(scaled)this.font=scaled;
  const metrics=nativeMeasureText(text);
  if(scaled)this.font=original;
  return metrics;
};
const startScreen=document.getElementById('startScreen');
const startButton=document.getElementById('startButton');
const settingsButton=document.getElementById('settingsButton');
const settingsPanel=document.getElementById('settingsPanel');
function installFullscreenSetting(panel,pause=false){
  if(!panel||typeof panel.insertBefore!=='function'||typeof panel.querySelector!=='function')return;
  const row=document.createElement('div');
  row.className='settingRow fullscreenSetting';
  const prefix=pause?'pauseFullscreen':'fullscreen';
  row.innerHTML=`<label id="${prefix}Label" for="${prefix}Toggle">전체화면</label>`+
    `<input id="${prefix}Toggle" type="checkbox">`+
    `<span id="${prefix}State" class="settingValue">끔</span>`;
  panel.insertBefore(row,panel.querySelector('.diagnosticGrid'));
}
installFullscreenSetting(settingsPanel,false);
const masterVolume=document.getElementById('masterVolume');
const musicVolume=document.getElementById('musicVolume');
const fullscreenButton=document.getElementById('fullscreenButton');
const pauseButton=document.getElementById('pauseButton');
const pauseOverlay=document.getElementById('pauseOverlay');
const resumeButton=document.getElementById('resumeButton');
const pauseSettingsButton=document.getElementById('pauseSettingsButton');
const pauseSettingsPanel=document.getElementById('pauseSettingsPanel');
installFullscreenSetting(pauseSettingsPanel,true);
const mainMenuButton=document.getElementById('mainMenuButton');
const pauseMasterVolume=document.getElementById('pauseMasterVolume');
const pauseMusicVolume=document.getElementById('pauseMusicVolume');
const fullscreenToggle=document.getElementById('fullscreenToggle');
const pauseFullscreenToggle=document.getElementById('pauseFullscreenToggle');
let gamePaused=false;
ctx.imageSmoothingEnabled=false;

function readPreference(key,fallback){
  try{return localStorage.getItem(key)||fallback;}catch{return fallback;}
}
function savePreference(key,value){try{localStorage.setItem(key,String(value));}catch{}}
let uiLanguage=readPreference('lockdownLanguage','ko');
const clampPreference=value=>Math.max(0,Math.min(100,Number(value)||0));
let masterVolumeLevel=clampPreference(readPreference('lockdownMasterVolume','100'));
let musicVolumeLevel=clampPreference(readPreference('lockdownMusicVolume','38'));
// Capture consumption input before the existing weapon/melee handlers.
window.addEventListener('keydown',event=>{
  if(consumption.active&&!['KeyW','KeyA','KeyS','KeyD','Escape'].includes(event.code)){
    event.preventDefault();event.stopImmediatePropagation();return;
  }
  if(event.code==='KeyF'&&!event.repeat){
    const item=consumableItems.find(item=>!item.used&&pickupFocused(item,65,22));
    if(item&&beginConsume(item)){event.preventDefault();event.stopImmediatePropagation();}
  }
},true);
window.addEventListener('mousedown',event=>{
  if(consumption.active){event.preventDefault();event.stopImmediatePropagation();}
},true);
const diagnosticSettings={
  energy:readPreference('lockdownShowEnergy','1')==='1',
  adrenaline:readPreference('lockdownShowAdrenaline','1')==='1',
  muzzleDirection:readPreference('lockdownShowMuzzleDirection','1')==='1',
  spread:readPreference('lockdownShowSpread','1')==='1',
  health:readPreference('lockdownShowHealth','1')==='1',
  healthNumbers:readPreference('lockdownShowHealthNumbers','1')==='1',
  damageNumbers:readPreference('lockdownShowDamageNumbers','0')==='1',
  combineDamageNumbers:readPreference('lockdownShowCombineDamageNumbers','1')==='1',
  weapon:readPreference('lockdownShowWeapon','1')==='1',
  casingCounts:readPreference('lockdownShowCasingCounts','0')==='1'
};
for(const prefix of ['', 'pause']){
  const panel=document.getElementById(prefix?'pauseSettingsPanel':'settingsPanel');
  panel.insertAdjacentHTML?.('beforeend',`<div class="diagnosticGrid"><label class="diagnosticToggle"><input id="${prefix}Energy" type="checkbox"><span id="${prefix}EnergyLabel">기력 게이지</span></label><label class="diagnosticToggle"><input id="${prefix}Adrenaline" type="checkbox"><span id="${prefix}AdrenalineLabel">아드레날린 게이지</span></label></div>`);
}
const diagnosticInputs={
  energy:['Energy','pauseEnergy'],
  adrenaline:['Adrenaline','pauseAdrenaline'],
  muzzleDirection:['showMuzzleDirection','pauseShowMuzzleDirection'],
  spread:['showSpread','pauseShowSpread'],
  health:['showHealthHud','pauseShowHealthHud'],
  healthNumbers:['showEnemyHealthNumbers','pauseShowEnemyHealthNumbers'],
  damageNumbers:['showDamageNumbers','pauseShowDamageNumbers'],
  combineDamageNumbers:['combineDamageNumbers','pauseCombineDamageNumbers'],
  weapon:['showWeaponHud','pauseShowWeaponHud'],
  casingCounts:['showCasingCounts','pauseShowCasingCounts']
};
function applyDiagnosticSettings(){
  for(const [key,ids] of Object.entries(diagnosticInputs)){
    for(const id of ids)document.getElementById(id).checked=diagnosticSettings[key];
  }
}
function bindDiagnosticSetting(key){
  for(const id of diagnosticInputs[key])document.getElementById(id).addEventListener('change',event=>{
    diagnosticSettings[key]=event.target.checked;
    savePreference(`lockdownShow${key[0].toUpperCase()+key.slice(1)}`,diagnosticSettings[key]?1:0);
    applyDiagnosticSettings();
  });
}
for(const key of Object.keys(diagnosticInputs))bindDiagnosticSetting(key);
applyDiagnosticSettings();

// 앞뒤 무음을 정리한 원본 총성. 단일 HTML로 실행되도록 MP3로 내장한다.
const GUNSHOT_AUDIO={mixkit:'',western:''};
const GunAudioContext=window.AudioContext||window.webkitAudioContext;
const gunAudioContext=GunAudioContext?new GunAudioContext():null;
const masterGainNode=gunAudioContext?gunAudioContext.createGain():null;
if(masterGainNode)masterGainNode.connect(gunAudioContext.destination);
const backgroundMusic=new Audio();
backgroundMusic.loop=true;
backgroundMusic.preload='auto';
backgroundMusic.src='Sub-Level%20Lockdown.mp3';
function applyAudioSettings(){
  if(masterGainNode)masterGainNode.gain.value=masterVolumeLevel/100;
  backgroundMusic.volume=(masterVolumeLevel/100)*(musicVolumeLevel/100);
  masterVolume.value=String(masterVolumeLevel);
  musicVolume.value=String(musicVolumeLevel);
  pauseMasterVolume.value=String(masterVolumeLevel);
  pauseMusicVolume.value=String(musicVolumeLevel);
  document.getElementById('masterValue').textContent=String(masterVolumeLevel);
  document.getElementById('musicValue').textContent=String(musicVolumeLevel);
  document.getElementById('pauseMasterValue').textContent=String(masterVolumeLevel);
  document.getElementById('pauseMusicValue').textContent=String(musicVolumeLevel);
}
applyAudioSettings();
let backgroundMusicStarted=false;
function ensureBackgroundMusic(){
  if(backgroundMusicStarted&&!backgroundMusic.paused)return;
  backgroundMusicStarted=true;
  backgroundMusic.play().catch(error=>{
    backgroundMusicStarted=false;
    console.warn('Background music failed:',error);
  });
}
backgroundMusic.addEventListener('ended',()=>{
  backgroundMusic.currentTime=0;
  backgroundMusic.play().catch(()=>{});
});
const decodeGunshot=dataUrl=>{
  if(!gunAudioContext)return Promise.reject(new Error('Web Audio unavailable'));
  const encoded=dataUrl.slice(dataUrl.indexOf(',')+1);
  const binary=atob(encoded);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  return gunAudioContext.decodeAudioData(bytes.buffer);
};
const gunshotBuffers=gunAudioContext?{
  mixkit:GUNSHOT_AUDIO.mixkit?decodeGunshot(GUNSHOT_AUDIO.mixkit):Promise.resolve(null),
  western:GUNSHOT_AUDIO.western?decodeGunshot(GUNSHOT_AUDIO.western):Promise.resolve(null)
}:{};
// 실제 .22 LR 샘플은 빠른 기관단총 연사와 여러 적의 동시 사격도 잘리지 않도록
// 여러 HTMLAudio 보이스를 순환시킨다. 로컬 file:// 실행에서도 별도 fetch 없이 재생된다.
const rimfireShotVoices=Array.from({length:16},()=>{
  // 쿼리는 이전 .22 샘플이 브라우저 캐시에 남아 재생되는 것을 막는다.
  const audio=new Audio('L2.mp3?v=rimfire-3');
  audio.preload='auto';
  return audio;
});
let rimfireShotVoiceIndex=0;
// Separate shot and rearward/forward pump transients; never replay the full recording.
const shotgunSampleVoices=Object.fromEntries(['shot','pump-back','pump-forward'].map(part=>[
  part,Array.from({length:part==='shot'?8:3},()=>{
    const voice=new Audio(`shotgun-${part}.mp3?v=${part==='shot'?2:3}`);
    voice.preload='auto';return voice;
  })
]));
const shotgunSampleIndices={shot:0,'pump-back':0,'pump-forward':0};
function playShotgunSample(part){
  const voices=shotgunSampleVoices[part];
  const voice=voices[shotgunSampleIndices[part]++%voices.length];
  if(typeof voice.pause==='function')voice.pause();
  try{voice.currentTime=0;}catch(_error){}
  voice.preservesPitch=false;voice.webkitPreservesPitch=false;
  voice.playbackRate=part==='shot'?1:.9;
  voice.volume=clamp(masterVolumeLevel/100*(part==='shot'?.78:.68),0,1);
  const playback=voice.play();
  if(playback&&typeof playback.catch==='function')playback.catch(()=>{});
}
function weaponUses22LR(def){
  return def&&['pistol22','revolver22','smg22'].includes(def.magazineType);
}
function play22LRGunshot(def,ammoId=null){
  const voice=rimfireShotVoices[rimfireShotVoiceIndex++%rimfireShotVoices.length];
  if(!voice)return;
  if(typeof voice.pause==='function')voice.pause();
  try{voice.currentTime=0;}catch(_error){}
  voice.preservesPitch=false;voice.webkitPreservesPitch=false;
  // .22 LR 산탄은 같은 장약 계열이지만 더 둔탁하게 들리도록 피치만 살짝 낮춘다.
  voice.playbackRate=ammoId==='shot'?.94:1;
  const weaponGain=def.id==='smg'?.72:(def.id==='revolver'?.82:.78);
  voice.volume=clamp((masterVolumeLevel/100)*weaponGain,0,1);
  const playback=typeof voice.play==='function'?voice.play():null;
  if(playback&&typeof playback.catch==='function')playback.catch(()=>{});
}
function playFootstepSound(sprinting=false){
  if(!gunAudioContext)return;

  gunAudioContext.resume().then(()=>{
    const now=gunAudioContext.currentTime;
    const oscillator=gunAudioContext.createOscillator();
    const gain=gunAudioContext.createGain();

    // 짧고 둔탁한 실내 발소리. 달릴 때 조금 더 낮고 크게 난다.
    oscillator.type='triangle';
    oscillator.frequency.setValueAtTime(sprinting?74:92,now);
    oscillator.frequency.exponentialRampToValueAtTime(
      sprinting?46:58,now+.055
    );

    gain.gain.setValueAtTime(sprinting?.042:.027,now);
    gain.gain.exponentialRampToValueAtTime(.001,now+.068);

    oscillator.connect(gain).connect(masterGainNode);
    oscillator.start(now);
    oscillator.stop(now+.072);
  }).catch(()=>{});
}

// Temporary contact sounds: cached noise/body samples, never queued on a miss.
const meleeImpactBuffers=new Map();
let meleeImpactVoices=0;
function meleeImpactTone(kind,amount,weaponId=''){
  if(kind==='wall')return {rate:1.2-clamp(amount/300,0,.5),cutoff:4800,gain:.21};
  const weight=({knife:0,armingSword:.48,longsword:1,pistol:.18,revolver:.32,
    smg:.42,assaultRifle:.57,battleRifle:.72,shotgun:.62,pumpShotgun:.86,lmg:1})[weaponId]||0;
  const power=clamp((amount-10)/240,0,1);
  const blade=kind==='blade';
  return {
    rate:clamp((blade?1.48:kind==='fist'?1.26:kind==='shove'?1.16:1.22)-weight*.46-power*.48,.56,1.48),
    cutoff:(blade?6400:kind==='fist'?2600:2100)*(1-weight*.38-power*.25),
    gain:(kind==='shove'?.13:blade?.27:.32)*(1+weight*.35+power*.6)
  };
}
function playMeleeImpactSound(kind,amount,x,y,weaponId=''){
  if(!gunAudioContext||!masterGainNode||meleeImpactVoices>=10)return;
  if(gunAudioContext.state==='suspended'){
    gunAudioContext.resume().catch(()=>{});
    return;
  }
  const distance=Math.hypot(x-player.x,y-player.y);
  if(distance>720)return;
  const blade=kind==='blade',soft=kind==='shove',fist=kind==='fist';
  const duration=blade?.13:soft?.085:fist?.11:.16;
  if(!meleeImpactBuffers.has(kind)){
    const rate=gunAudioContext.sampleRate;
    const buffer=gunAudioContext.createBuffer(1,Math.ceil(rate*duration),rate);
    const data=buffer.getChannelData(0);
    let smooth=0;
    for(let i=0;i<data.length;i++){
      const t=i/rate,noise=Math.random()*2-1;
      smooth=smooth*.72+noise*.28;
      const body=Math.sin(2*Math.PI*((fist?115:soft?85:72)*t-100*t*t));
      const attack=Math.min(1,t/.0015),tail=Math.pow(1-t/duration,2);
      data[i]=attack*tail*(kind==='wall'
        ?noise*.5*Math.exp(-t*85)+Math.sin(t*2*Math.PI*2300)*.18*Math.exp(-t*55)+smooth*.4*Math.exp(-t*35)
        :blade
        ?noise*.48*Math.exp(-t*30)+smooth*.5*Math.exp(-t*12)
        :body*.58*Math.exp(-t*24)+smooth*.65*Math.exp(-t*32)+noise*.18*Math.exp(-t*180));
    }
    meleeImpactBuffers.set(kind,buffer);
  }
  const tone=meleeImpactTone(kind,amount,weaponId);
  const source=gunAudioContext.createBufferSource(),gain=gunAudioContext.createGain();
  const filter=gunAudioContext.createBiquadFilter();
  const pan=typeof gunAudioContext.createStereoPanner==='function'?gunAudioContext.createStereoPanner():null;
  source.buffer=meleeImpactBuffers.get(kind);
  source.playbackRate.value=tone.rate*(.97+Math.random()*.06);
  filter.type='lowpass';
  filter.frequency.value=tone.cutoff;
  gain.gain.value=tone.gain/(1+distance/230);
  source.connect(filter).connect(gain);
  if(pan){pan.pan.value=clamp((x-player.x)/400,-.8,.8);gain.connect(pan).connect(masterGainNode);}
  else gain.connect(masterGainNode);
  meleeImpactVoices++;
  source.onended=()=>{meleeImpactVoices--;source.disconnect();filter.disconnect();gain.disconnect();if(pan)pan.disconnect();};
  source.start();
}

function playProceduralGunshot(def){
  if(!gunAudioContext)return;
  const shotgun=def.id==='shotgun'||def.id==='pumpShotgun';
  const smg=def.id==='smg';
  const rifle=def.id==='battleRifle'||def.id==='assaultRifle'||def.id==='lmg';
  const now=gunAudioContext.currentTime;
  const duration=shotgun?.24:(rifle?.18:(smg?.085:.12));
  const sampleRate=gunAudioContext.sampleRate;
  const buffer=gunAudioContext.createBuffer(1,Math.ceil(sampleRate*duration),sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++){
    const t=i/sampleRate;
    const crack=Math.exp(-t*(shotgun?19:(rifle?23:(smg?43:31))));
    const thump=Math.sin(t*Math.PI*2*(shotgun?74:(rifle?68:(smg?118:96))))*Math.exp(-t*24);
    data[i]=((Math.random()*2-1)*crack+thump*(shotgun?.78:(rifle?.66:.42)))*.72;
  }
  const source=gunAudioContext.createBufferSource();
  const filter=gunAudioContext.createBiquadFilter();
  const gain=gunAudioContext.createGain();
  filter.type='lowpass';
  filter.frequency.value=shotgun?2400:(rifle?2850:(smg?3900:3300));
  gain.gain.setValueAtTime(shotgun?.62:(rifle?.56:(smg?.31:.43)),now);
  gain.gain.exponentialRampToValueAtTime(.001,now+duration);
  source.buffer=buffer;
  source.connect(filter).connect(gain).connect(masterGainNode);
  source.start(now);
}

function playGunshot(def,ammoId=null){
  if(def.id==='shotgun'||def.id==='pumpShotgun'){
    playShotgunSample('shot');return;
  }
  if(weaponUses22LR(def)){
    play22LRGunshot(def,ammoId);
    return;
  }
  if(!gunAudioContext)return;
  if(def.id==='battleRifle'||def.id==='assaultRifle'||def.id==='lmg'){
    playProceduralGunshot(def);
    return;
  }
  const key=(def.id==='shotgun'||def.id==='pumpShotgun')?'western':'mixkit';
  // 실제 포인터 입력에서 컨텍스트를 깨운 뒤 매 발마다 독립 소스를 만든다.
  gunAudioContext.resume().then(()=>gunshotBuffers[key]).then(buffer=>{
    if(!buffer){playProceduralGunshot(def);return}
    const source=gunAudioContext.createBufferSource();
    const gain=gunAudioContext.createGain();
    source.buffer=buffer;
    source.playbackRate.value=def.id==='smg'?1.06:1;
    gain.gain.value=def.id==='smg'?.34:((def.id==='shotgun'||def.id==='pumpShotgun')?.62:.46);
    source.connect(gain).connect(masterGainNode);
    source.start();
  }).catch(()=>playProceduralGunshot(def));
}

window.addEventListener('keydown',event=>{
  if(event.code==='Escape'&&gameStarted){
    event.preventDefault();
    event.stopImmediatePropagation();
    if(typeof simulationControl!=='undefined'&&simulationControl.open){
      simulationControl.open=false;
      simulationControl.pressed=null;
      return;
    }
    setGamePaused(!gamePaused);
    return;
  }
  if(gamePaused){
    event.stopImmediatePropagation();
    const tag=event.target&&event.target.tagName;
    if(tag!=='INPUT'&&tag!=='BUTTON'&&event.code!=='Tab')event.preventDefault();
  }
},true);

function setFullscreen(enabled){
  const request=enabled
    ?(!document.fullscreenElement&&document.documentElement.requestFullscreen
      ?document.documentElement.requestFullscreen():null)
    :(document.fullscreenElement&&document.exitFullscreen?document.exitFullscreen():null);
  if(request&&typeof request.catch==='function')request.catch(()=>syncFullscreenSettings());

}

function bakeBulletImpact(impact){
  if(!impact.fragments||impact.baked)return;
  impact.baked=true;
  const travel=(1-Math.exp(-impact.maxLife*9))/9;
  for(const fragment of impact.fragments){
    const wx=impact.x+fragment.vx*travel,wy=impact.y+fragment.vy*travel;
    const cx=Math.floor(wx/GROUND_BLOOD_CHUNK_SIZE),cy=Math.floor(wy/GROUND_BLOOD_CHUNK_SIZE);
    const chunk=groundCasingChunk(cx,cy,true),c=chunk.context;
    c.save();c.translate(wx-cx*GROUND_BLOOD_CHUNK_SIZE,wy-cy*GROUND_BLOOD_CHUNK_SIZE);
    c.rotate(fragment.rotation+fragment.spin*impact.maxLife);drawBulletChip(c,fragment);
    c.restore();chunk.marks++;

}

function spawnBulletWallImpact(x,y,angle,damage,ammoId='standard'){
  const fragments=[];
  // Use the struck face normal: grazing shots must not spray their fragments into the wall.
  let outward=angle+Math.PI;
  const wall=walls.find(w=>x>=w.x-.02&&x<=w.x+w.w+.02&&y>=w.y-.02&&y<=w.y+w.h+.02);
  if(wall){
    const faces=[{d:Math.abs(x-wall.x),a:Math.PI},{d:Math.abs(x-wall.x-wall.w),a:0},
      {d:Math.abs(y-wall.y),a:-Math.PI/2},{d:Math.abs(y-wall.y-wall.h),a:Math.PI/2}];
    faces.sort((a,b)=>a.d-b.d);outward=faces[0].a;
  }
  // Match the actual flying bullet, not the cartridge/case colour shown in inventory.
  const projectileColor=(AMMO_BY_ID[ammoId]||AMMO_BY_ID.standard).projectileColor;
  const chipColor=[1,3,5].map(offset=>parseInt(projectileColor.slice(offset,offset+2),16)).join(',');
  const rifle=ammoId==='rifle556'||ammoId==='rifle762';
  const pellet=ammoId==='shot'||ammoId==='buckshot';
  const embedded=ammoId==='rifle762';
  if(embedded)embedBulletInWall(x,y,angle,outward);
  const nx=Math.cos(outward),ny=Math.sin(outward),tx=-ny,ty=nx;
  const dx=Math.cos(angle),dy=Math.sin(angle);
  const incidence=clamp(-(dx*nx+dy*ny),0,1);
  const tangent=dx*tx+dy*ty;
  const count=embedded?0:pellet?2:rifle?5:4;
  const scale=pellet?.38:ammoId==='rifle762'?1:rifle?.8:.58;
  const nearChip=Math.floor(Math.random()*count);
  const farChip=(nearChip+1)%count;
  for(let i=0;i<count;i++){
    // Preserve incoming tangential momentum. Only the normal component rebounds.
    // Head-on hits scatter nearby; grazing hits skim along the struck face.
    // Mix chips shed at the wall's foot with energetic fragments; avoid a hollow ring.
    const scatter=i===nearChip?.025+Math.random()*.09:
      i===farChip?.85+Math.random()*.75:.12+Math.pow(Math.random(),1.5)*1.6;
    const energy=(pellet?.65:rifle?1.15:.85)*scatter;
    const normalSpeed=(18+incidence*(48+Math.random()*75))*energy;
    const tangentSpeed=(tangent*(125+Math.random()*80)+(Math.random()-.5)*72*incidence)*energy;
    fragments.push({vx:nx*normalSpeed+tx*tangentSpeed,vy:ny*normalSpeed+ty*tangentSpeed,
      size:scale*(.45+Math.random()*.55),rotation:Math.random()*6.28,spin:(Math.random()-.5)*26,
      color:chipColor});
  }
  if(!embedded)bulletImpacts.push({x:x+nx*2,y:y+ny*2,life:.30,maxLife:.30,fragments});
  if(bulletImpacts.length>180)bakeBulletImpact(bulletImpacts.shift());
  const now=gunAudioContext?gunAudioContext.currentTime:0;
  if(now-lastWallImpactSound>.045){
    lastWallImpactSound=now;
    playObstacleHitSound(x,y,ammoId);
  }
}

  context.setTransform(layer.scale,0,0,layer.scale,-layer.x*layer.scale,-layer.y*layer.scale);
  context.beginPath();context.rect(layer.x,layer.y,layer.w,layer.h);context.clip();
  for(const mark of marks){
    const strength=mark.strength===undefined?1:mark.strength;
    context.fillStyle=mark.color;context.globalAlpha=.82*strength;
    context.beginPath();context.ellipse(mark.x,mark.y,mark.size,mark.size*.58,mark.angle,0,Math.PI*2);context.fill();
    for(const lobe of mark.lobes||[]){
      context.globalAlpha=(.68+lobe.alpha*.18)*strength;
      context.beginPath();
      context.ellipse(mark.x+lobe.x,mark.y+lobe.y,lobe.size,lobe.size*lobe.aspect,mark.angle+lobe.turn,0,Math.PI*2);
      context.fill();
    }
    if(mark.smear>0){
      context.globalAlpha=.44*strength;
      context.beginPath();
      context.ellipse(mark.x-Math.cos(mark.angle)*mark.smear*.32,
        mark.y-Math.sin(mark.angle)*mark.smear*.32,
        mark.size+mark.smear*.45,Math.max(.3,mark.size*.27),mark.angle,0,Math.PI*2);
      context.fill();
    }
  }
  context.restore();layer.dirty=false;
}

// Store stains in each object's local coordinates so they follow its animation.
function drawBloodSurface(owner,key,x,y,w,h){
  const matrix=ctx.getTransform();
  if(!matrix||!Number.isFinite(matrix.a))return;
  // 고해상도 백버퍼 배율은 제거하고 게임의 논리 좌표로 저장한다.
  const m={
    a:matrix.a/RENDER_SCALE,b:matrix.b/RENDER_SCALE,
    c:matrix.c/RENDER_SCALE,d:matrix.d/RENDER_SCALE,
    e:matrix.e/RENDER_SCALE,f:matrix.f/RENDER_SCALE
  };
  const corners=[
    {x:m.a*x+m.c*y+m.e,y:m.b*x+m.d*y+m.f},
    {x:m.a*(x+w)+m.c*y+m.e,y:m.b*(x+w)+m.d*y+m.f},
    {x:m.a*x+m.c*(y+h)+m.e,y:m.b*x+m.d*(y+h)+m.f},
    {x:m.a*(x+w)+m.c*(y+h)+m.e,y:m.b*(x+w)+m.d*(y+h)+m.f}
  ];
  bloodSurfaces.push({owner,key,x,y,w,h,m,
    minX:Math.min(...corners.map(p=>p.x)),maxX:Math.max(...corners.map(p=>p.x)),
    minY:Math.min(...corners.map(p=>p.y)),maxY:Math.max(...corners.map(p=>p.y))});
  let motions=surfaceBloodMotion.get(owner);
  if(!motions){motions={};surfaceBloodMotion.set(owner,motions);}
  const worldE=m.e+camera.x,worldF=m.f+camera.y;
  const worldAngle=Math.atan2(m.b,m.a);
  const previous=motions[key];
  motions[key]={
    worldE,worldF,worldAngle,
    vx:previous?(worldE-previous.worldE)/Math.max(.001,bloodMotionDt):0,
    vy:previous?(worldF-previous.worldF)/Math.max(.001,bloodMotionDt):0,
    angularSpeed:previous?Math.abs(normAngle(worldAngle-previous.worldAngle))/Math.max(.001,bloodMotionDt):0
  };
  const marks=surfaceBlood.get(owner)?.[key];
  if(!marks)return;
  const layer=surfaceBloodLayer(owner,key,x,y,w,h);
  if(layer.dirty)rebuildSurfaceBloodLayer(layer,marks);
  // 얼룩 수와 무관하게 평소 프레임에는 부위당 캐시 이미지 한 장만 그린다.
  ctx.save();ctx.globalAlpha=1;ctx.imageSmoothingEnabled=false;
  ctx.drawImage(layer.canvas,x,y,w,h);ctx.restore();
}

function addSurfaceBloodMark(owner,key,x,y,size,angle,color='#681116',chunky=false){
  let data=surfaceBlood.get(owner);
  if(!data){data={};surfaceBlood.set(owner,data);}
  surfaceBloodOwners.add(owner);
  const marks=data[key]||(data[key]=[]);
  const lobeCount=chunky?5+Math.floor(Math.random()*2):Math.max(2,Math.min(5,Math.round(size*1.7)));
  const lobes=[];
  for(let i=0;i<lobeCount;i++){
    const direction=angle+(Math.random()-.5)*2.15;
    const distance=size*(.28+Math.random()*(chunky?1.12:.72));
    lobes.push({
      x:Math.cos(direction)*distance,y:Math.sin(direction)*distance,
      size:size*(.20+Math.random()*(chunky?.42:.30)),
      aspect:.55+Math.random()*.40,turn:(Math.random()-.5)*1.2,alpha:Math.random()
    });
  }
  marks.push({
    x,y,size,angle,color,lobes,smear:chunky?size*(.7+Math.random()*.7):size*.22,
    age:0,strength:1,fadeStart:18+Math.random()*14,fadeDuration:34+Math.random()*28,
    flingAccumulator:0,nextFling:.10+Math.random()*.12
  });
  if(marks.length>48)marks.shift();
  dirtySurfaceBloodLayer(owner,key);
}

function markBloodAtHit(owner,worldX,worldY,size=1.6,angle=0,color='#681116'){
  if(!owner)return false;
  const point=worldToScreen(worldX,worldY);
  let nearest=null;
  for(let i=bloodSurfaces.length-1;i>=0;i--){
    const s=bloodSurfaces[i];
    if(s.owner!==owner)continue;
    const m=s.m,det=m.a*m.d-m.b*m.c;
    if(Math.abs(det)<.0001)continue;
    const dx=point.x-m.e,dy=point.y-m.f;
    const x=(m.d*dx-m.c*dy)/det,y=(-m.b*dx+m.a*dy)/det;
    const outsideX=Math.max(s.x-x,0,x-(s.x+s.w));
    const outsideY=Math.max(s.y-y,0,y-(s.y+s.h));
    const distance=outsideX*outsideX+outsideY*outsideY;
    if(!nearest||distance<nearest.distance)nearest={s,x,y,distance};
    if(distance===0)break;
  }
  if(nearest){
    const {s}=nearest;
    const m=s.m,det=m.a*m.d-m.b*m.c;
    const ax=Math.cos(angle),ay=Math.sin(angle);
    const localAngle=Math.atan2((-m.b*ax+m.a*ay)/det,(m.d*ax-m.c*ay)/det);
    addSurfaceBloodMark(
      owner,s.key,clamp(nearest.x,s.x+.35,s.x+s.w-.35),clamp(nearest.y,s.y+.35,s.y+s.h-.35),
      size,localAngle,color,size>=2.2
    );
    return true;
  }
  // 첫 렌더 전 피격도 잃지 않고 몸통 좌표에 보관한다.
  const dx=worldX-owner.x,dy=worldY-owner.y;
  const ca=Math.cos(owner.bodyAngle||0),sa=Math.sin(owner.bodyAngle||0);
  addSurfaceBloodMark(owner,'torso',clamp(dx*ca+dy*sa,-5,5),clamp(-dx*sa+dy*ca,-6.5,6.5),size,angle,color);
  return true;
}

function stainBloodContact(drop,oldX,oldY){
  if(drop.age<.025)return false;
  const a=worldToScreen(oldX,oldY),b=worldToScreen(drop.x,drop.y);
  const lift=(drop.z||0)*.42;
  const steps=Math.max(1,Math.min(4,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/3)));
  for(let n=0;n<=steps;n++){
    const sx=a.x+(b.x-a.x)*n/steps,sy=a.y+(b.y-a.y)*n/steps-lift;
    // Last drawn surfaces are on top: a weapon can intercept blood before clothing.
    for(let i=bloodSurfaces.length-1;i>=0;i--){
      const s=bloodSurfaces[i],m=s.m,det=m.a*m.d-m.b*m.c;
      if(sx<s.minX||sx>s.maxX||sy<s.minY||sy>s.maxY)continue;
      if(Math.abs(det)<.0001)continue;
      const dx=sx-m.e,dy=sy-m.f;
      const x=(m.d*dx-m.c*dy)/det,y=(-m.b*dx+m.a*dy)/det;
      if(x<s.x||x>s.x+s.w||y<s.y||y>s.y+s.h)continue;
      const localVX=(m.d*drop.vx-m.c*drop.vy)/det;
      const localVY=(-m.b*drop.vx+m.a*drop.vy)/det;
      const markSize=drop.chunk
        ?Math.min(3.4,Math.max(2.35,drop.size*.82))
        :Math.min(2.2,Math.max(.55,drop.size*.65));
      addSurfaceBloodMark(s.owner,s.key,x,y,markSize,Math.atan2(localVY,localVX),'#681116',!!drop.chunk);
      return true;
    }
  }
  return false;
}
const bloodPools=[];
const GROUND_BLOOD_CHUNK_SIZE=512;
const groundBloodChunks=new Map();
function groundBloodChunk(cx,cy,create=false){
  if(cx<0||cy<0||cx*GROUND_BLOOD_CHUNK_SIZE>=WORLD_W||cy*GROUND_BLOOD_CHUNK_SIZE>=WORLD_H)return null;
  const key=`${cx},${cy}`;
  let chunk=groundBloodChunks.get(key);
  if(!chunk&&create){
    const canvas=document.createElement('canvas');
    canvas.width=GROUND_BLOOD_CHUNK_SIZE;canvas.height=GROUND_BLOOD_CHUNK_SIZE;
    const context=canvas.getContext('2d');
    context.imageSmoothingEnabled=false;
    chunk={key,cx,cy,canvas,context,marks:0};
    groundBloodChunks.set(key,chunk);
  }
  return chunk||null;
}
function bakeGroundBloodPool(pool){
  const rx=pool.rx??(pool.r||2)*1.45;
  const ry=pool.ry??(pool.r||2);
  const minCX=Math.floor((pool.x-rx-2)/GROUND_BLOOD_CHUNK_SIZE);
  const maxCX=Math.floor((pool.x+rx+2)/GROUND_BLOOD_CHUNK_SIZE);
  const minCY=Math.floor((pool.y-ry-2)/GROUND_BLOOD_CHUNK_SIZE);
  const maxCY=Math.floor((pool.y+ry+2)/GROUND_BLOOD_CHUNK_SIZE);
  for(let cy=minCY;cy<=maxCY;cy++)for(let cx=minCX;cx<=maxCX;cx++){
    const chunk=groundBloodChunk(cx,cy,true);
    if(!chunk)continue;
    const context=chunk.context;
    const x=pool.x-cx*GROUND_BLOOD_CHUNK_SIZE;
    const y=pool.y-cy*GROUND_BLOOD_CHUNK_SIZE;
    context.save();
    context.fillStyle=`rgba(${pool.color||'74,10,12'},${pool.alpha??.78})`;
    context.beginPath();context.ellipse(x,y,rx,ry,pool.angle??.2,0,Math.PI*2);context.fill();
    if(rx>2.2){
      context.fillStyle='rgba(154,28,28,.32)';
      context.fillRect(Math.round(x-rx*.20),Math.round(y-ry*.20),Math.max(1,rx*.34),1);
    }
    context.restore();chunk.marks++;
  }
}
function clearGroundBloodChunks(){
  for(const chunk of groundBloodChunks.values())chunk.canvas.width=0;
  groundBloodChunks.clear();
}
function drawGroundBloodChunks(){
  ctx.save();ctx.imageSmoothingEnabled=false;
  for(const chunk of groundBloodChunks.values()){
    const wx=chunk.cx*GROUND_BLOOD_CHUNK_SIZE,wy=chunk.cy*GROUND_BLOOD_CHUNK_SIZE;
    const point=worldToScreen(wx,wy);
    if(point.x>W+32||point.y>H+32||point.x+GROUND_BLOOD_CHUNK_SIZE<-32||point.y+GROUND_BLOOD_CHUNK_SIZE<-32)continue;
    ctx.drawImage(chunk.canvas,point.x,point.y,GROUND_BLOOD_CHUNK_SIZE,GROUND_BLOOD_CHUNK_SIZE);
  }
  ctx.restore();
}
const groundCasingChunks=new Map();
const bakedCasingCounts={pistol22:0,rifle556:0,rifle762:0,shell12:0};
function casingKind(casing){
  if(casing.shell)return'shell12';
  if(casing.ammoId==='rifle762')return'rifle762';
  if(casing.rifle||casing.ammoId==='rifle556')return'rifle556';
  return'pistol22';
}
function groundCasingChunk(cx,cy,create=false){
  const key=`${cx},${cy}`;
  let chunk=groundCasingChunks.get(key);
  if(!chunk&&create){
    const layer=document.createElement('canvas');
    layer.width=GROUND_BLOOD_CHUNK_SIZE;layer.height=GROUND_BLOOD_CHUNK_SIZE;
    chunk={cx,cy,canvas:layer,context:layer.getContext('2d'),marks:0};
    groundCasingChunks.set(key,chunk);
  }
  return chunk;
}
function bakeGroundCasing(casing){
  const cx=Math.floor(casing.x/GROUND_BLOOD_CHUNK_SIZE);
  const cy=Math.floor(casing.y/GROUND_BLOOD_CHUNK_SIZE);
  const chunk=groundCasingChunk(cx,cy,true),context=chunk.context;
  const x=casing.x-cx*GROUND_BLOOD_CHUNK_SIZE;
  const y=casing.y-cy*GROUND_BLOOD_CHUNK_SIZE;
  context.save();context.translate(Math.round(x),Math.round(y));context.rotate(casing.angle);
  if(casing.shell){
    context.fillStyle=casing.color||'#a83d31';context.fillRect(-3,-1,6,3);
    context.fillStyle='#c7a052';context.fillRect(-3,-1,1,3);
  }else if(casing.rifle){
    context.fillStyle='#a88743';context.fillRect(-3,-1,6,2);
    context.fillStyle='#dfbd68';context.fillRect(-3,-1,1,2);
  }else{
    context.fillStyle='#b79a45';context.fillRect(-1,0,3,1);
    context.fillStyle='#e0c66b';context.fillRect(-1,0,1,1);
  }
  context.restore();chunk.marks++;
  bakedCasingCounts[casingKind(casing)]++;
}
function drawGroundCasingChunks(){
  ctx.save();ctx.imageSmoothingEnabled=false;
  for(const chunk of groundCasingChunks.values()){
    const wx=chunk.cx*GROUND_BLOOD_CHUNK_SIZE,wy=chunk.cy*GROUND_BLOOD_CHUNK_SIZE;
    const point=worldToScreen(wx,wy);
    if(point.x>W+16||point.y>H+16||point.x+GROUND_BLOOD_CHUNK_SIZE<-16||point.y+GROUND_BLOOD_CHUNK_SIZE<-16)continue;
    ctx.drawImage(chunk.canvas,point.x,point.y,GROUND_BLOOD_CHUNK_SIZE,GROUND_BLOOD_CHUNK_SIZE);
  }
  ctx.restore();
}

}

function worldToScreen(x,y){return{x:x-camera.x,y:y-camera.y}}
function currentSandboxCameraZoom(){
  return SANDBOX_CAMERA_ZOOM+
    (SANDBOX_ADS_ZOOM-SANDBOX_CAMERA_ZOOM)*smoothStep01(player.aimBlend);
}
function worldToViewportScreen(x,y){
  const point=worldToScreen(x,y);
  const zoom=currentSandboxCameraZoom();
  return{
    x:W*.5+(point.x-W*.5)*zoom,
    y:H*.5+(point.y-H*.5)*zoom
  };
}
function screenToWorld(x,y){
  // 화면에 확대되어 보이는 위치를 다시 확대 전 월드 좌표로 정확히 역산한다.
  const zoom=currentSandboxCameraZoom();
  const viewX=W*.5+(x-W*.5)/zoom;
  const viewY=H*.5+(y-H*.5)/zoom;
  return{x:viewX+camera.x,y:viewY+camera.y};
}

function applySandboxCameraZoom(){
  let layer=applySandboxCameraZoom.layer;
  if(!layer){
    layer=document.createElement('canvas');
    layer.width=canvas.width||Math.round(W*RENDER_SCALE);
    layer.height=canvas.height||Math.round(H*RENDER_SCALE);
    applySandboxCameraZoom.layer=layer;
    applySandboxCameraZoom.layerCtx=layer.getContext('2d');
  }
  const layerCtx=applySandboxCameraZoom.layerCtx;
  layerCtx.setTransform(1,0,0,1,0,0);
  const pixelW=layer.width,pixelH=layer.height;
  layerCtx.clearRect(0,0,pixelW,pixelH);
  layerCtx.drawImage(canvas,0,0);

  const zoom=currentSandboxCameraZoom();
  const sourceW=pixelW/zoom;
  const sourceH=pixelH/zoom;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,pixelW,pixelH);
  ctx.save();
  // 월드 확대 단계에서는 가장자리 색이 번지지 않게 원본 픽셀을 보존한다.
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(
    layer,
    (pixelW-sourceW)*.5,(pixelH-sourceH)*.5,sourceW,sourceH,
    0,0,pixelW,pixelH
  );
  ctx.restore();
  // 이후 HUD와 월드 글자는 확대된 백버퍼의 원래 논리 좌표로 또렷하게 그린다.
  ctx.setTransform(RENDER_SCALE,0,0,RENDER_SCALE,0,0);
}

function pointerNearWorld(x,y,radius=22){
  const target=screenToWorld(mouse.x,mouse.y);
  return Math.hypot(target.x-x,target.y-y)<=radius;
}

function pickupFocused(item,maxDistance=52,pointerRadius=22){
  return !!item&&Math.hypot(player.x-item.x,player.y-item.y)<=maxDistance&&
    pointerNearWorld(item.x,item.y,pointerRadius);
}

function createGuard(x,y,stateTime=0,strafe=1,role='guard'){
  const soldier=role==='soldier';

  // 적도 플레이어와 똑같은 createWeaponState() 구조를 가진다.
  // AI 전용 weaponId/magazine 모형은 더 이상 탄약의 진짜 상태가 아니다.
  const actorWeaponStates={};
  actorWeaponStates.pistol=createWeaponState(
    WEAPON_BY_ID.pistol,
    createMagazine('pistol22',20,Array(20).fill('standard'))
  );
  if(soldier){
    actorWeaponStates.smg=createWeaponState(
      WEAPON_BY_ID.smg,
      createMagazine('smg22',30,Array(30).fill('standard'))
    );
  }

  // 삽입 탄창은 각 weaponState 안에 있고, 여기는 플레이어 inventory.magazines와
  // 동일한 역할의 실제 예비 탄창 목록이다.
  const actorInventoryMagazines=soldier?[
    createMagazine('smg22',30,Array(30).fill('standard')),
    createMagazine('smg22',30,Array(30).fill('tracer')),
    createMagazine('pistol22',20,Array(20).fill('standard')),
    createMagazine('pistol22',20,Array(20).fill('tracer'))
  ]:[
    createMagazine('pistol22',20,Array(20).fill('standard')),
    createMagazine('pistol22',20,Array(20).fill('tracer'))
  ];

  const activeWeapon=soldier?actorWeaponStates.smg:actorWeaponStates.pistol;

  return{
    x,y,r:12,hp:soldier?165:100,maxHp:soldier?165:100,
    angle:Math.PI,aimAngle:Math.PI,
    role,moveSpeed:soldier?112:92,
    reactionScale:soldier?.62:1,fireRateScale:soldier?.62:1,
    state:'move',combatMode:'pistol',stateTime,stagger:0,hitFlash:0,
    movePhase:0,attackTime:0,shotCooldown:0,strafe,aimTime:0,
    targetRef:null,revengeTargetRef:null,revengeLostTime:0,
    aimStableTime:0,lockedShot:null,lockDelay:0,

    weaponStates:actorWeaponStates,
    weaponState:activeWeapon,
    inventoryMagazines:actorInventoryMagazines,
    selectedMagazineByType:{pistol22:0,smg22:0},

    // 아래 값들은 기존 AI 판정과 디버그 표시를 위한 읽기용 alias다.
    // 실제 총기 상태는 항상 weaponState가 단일 진실원천이다.
    weaponId:activeWeapon.weaponId,
    magazine:activeWeapon.magazine,
    reloading:activeWeapon.reloading,
    reloadElapsed:activeWeapon.reloadElapsed,
    reloadMagazine:activeWeapon.reloadMagazine,
    muzzleFlash:activeWeapon.muzzleFlash,

    shotSpread:0,
    volleyRemaining:0,volleyTimer:0,fullAuto:false,
    weaponDrawActive:false,weaponDrawElapsed:0,weaponDrawDuration:.34,
    patrolRouteIndex:-1,patrolPointIndex:0,patrolDirection:strafe>=0?1:-1,

    // 청각 기억. '들었다'와 '봤다'를 분리한다.
    heardX:null,heardY:null,heardTimer:0,heardKind:null,lastHeardSoundId:0,

    coverX:null,coverY:null,spawnAge:0,voiceCooldown:Math.random()*.5
  };
}

  // 두 명은 문 안에서 서로 막지 않도록 서로 다른 통과 레인을 쓴다.

  );

    ally.airborne=true;
    ally.airborneHeight=130;
    ally.initialExit=false;
    ally.holdOutsideUntilPlayerExits=false;
    ally.state='reinforcementDrop';
  }
}


function allyFormationAnchor(ally){
  const aliveCount=squadAllies.filter(a=>a&&a.hp>0&&!a.airborne).length;
  const extraSpread=Math.min(170,Math.max(0,aliveCount-4)*11);
  const ring=Math.min(430,(ally.formationRing||180)+extraSpread);
  return {
    x:player.x+Math.cos(ally.formationAngle||0)*ring,
    y:player.y+Math.sin(ally.formationAngle||0)*ring
  };
}

function allySeparationVector(ally,radius=110){
  let sx=0,sy=0,weight=0;
  for(const other of squadAllies){
    if(other===ally||!other||other.hp<=0||other.airborne)continue;
    const dx=ally.x-other.x,dy=ally.y-other.y;
    const d=Math.hypot(dx,dy);
    if(d<=.001||d>=radius)continue;
    const w=(radius-d)/radius;
    sx+=dx/d*w;
    sy+=dy/d*w;
    weight+=w;
  }
  if(weight<=0)return{x:0,y:0};
  return{x:sx/weight,y:sy/weight};
}

function dropReservationAvailable(drop,ally){
  if(!drop)return false;
  const now=performance.now();
  if(!drop.allyReservedBy)return true;
  if(drop.allyReservedBy===ally.allyId)return true;
  if((drop.allyReservedUntil||0)<=now){
    drop.allyReservedBy=null;
    drop.allyReservedUntil=0;
    return true;
  }
  return false;
}

function reserveMagazineDrop(ally,drop){
  if(!ally||!drop||!dropReservationAvailable(drop,ally))return false;
  releaseMagazineReservation(ally);
  drop.allyReservedBy=ally.allyId;
  drop.allyReservedUntil=performance.now()+5200;
  ally.lootReservation=drop;
  return true;
}

function releaseMagazineReservation(ally){
  if(!ally)return;
  const drop=ally.lootReservation;
  if(drop&&drop.allyReservedBy===ally.allyId){
    drop.allyReservedBy=null;
    drop.allyReservedUntil=0;
  }
  ally.lootReservation=null;
}


function actorWeaponState(actor,key){
  return actor&&actor.weaponStates?actor.weaponStates[key]:null;
}
function actorWeaponLoadedRounds(actor,key){
  const ws=actorWeaponState(actor,key); if(!ws)return 0;
  return (ws.chamberRound?1:0)+(ws.magazine&&ws.magazine.rounds?ws.magazine.rounds.length:0);
}
function actorHasReserveMagazine(actor,key){
  if(!actor||!actor.inventoryMagazines)return false;
  return actor.inventoryMagazines.some(m=>{
    if(!m)return false;
    const mk=m.weaponKey||m.weapon||m.kind||m.type||m.forWeapon;
    const rounds=Array.isArray(m.rounds)?m.rounds.length:(Number.isFinite(m.rounds)?m.rounds:0);
    return mk===key&&rounds>0;
  });
}
function actorHasAnyAmmo(actor,key){
  if(actorWeaponLoadedRounds(actor,key)>0)return true;
  if(actorHasReserveMagazine(actor,key))return true;
  if(actor&&actor.reserveAmmo&&Number.isFinite(actor.reserveAmmo[key])&&actor.reserveAmmo[key]>0)return true;
  return false;
}
function allyForcePistolIfLongGunsDry(ally){
  if(!ally||ally.hp<=0)return false;
  const active=ally.activeWeaponKey||ally.weaponKey||ally.gunKey||ally.activeWeapon;
  const shotDry=!actorHasAnyAmmo(ally,'shotgun');
  const smgDry=!actorHasAnyAmmo(ally,'smg');
  if((active==='shotgun'&&shotDry)||(smgDry&&shotDry)){
    if(actorHasAnyAmmo(ally,'pistol')){
      ally.activeWeaponKey='pistol';
      ally.weaponKey='pistol';
      ally.gunKey='pistol';
      ally.activeWeapon='pistol';
      ally.reload=null; ally.reloadState=null;
      ally.burstRemaining=0; ally.volleyRemaining=0; ally.fullAuto=false;
      ally.weaponDrawActive=true; ally.weaponDrawElapsed=0; ally.weaponDrawDuration=.26;
      return true;
    }
  }
  return false;
}
function aiPlayerStyleSpread(actor,weapon,base){
  let s=Number.isFinite(base)?base:((weapon&&weapon.baseSpread)||0.035);
  const speed=Math.hypot(actor.vx||0,actor.vy||0);
  const aiming=!!(actor.aiming||actor.aim||actor.isAiming);
  const bloom=Math.max(0,actor.bloom||actor.shotSpread||0);
  if(!aiming)s*=1.55;
  if(speed>18)s+=((weapon&&weapon.moveSpread)||0.055);
  s+=bloom;
  return s;
}

function actorAlive(actor){
  return !!actor&&actor.hp>0;
}

function actorDistance(a,b){
  return Math.hypot(b.x-a.x,b.y-a.y);
}

function visibleActorFrom(observer,target,maxDistance=900){
  if(!actorAlive(target))return false;
  const d=actorDistance(observer,target);
  if(d>maxDistance)return false;
  return !lineBlocked(observer.x,observer.y,target.x,target.y);
}

// 조력자의 '확정 시야'. 소리를 들은 것과 실제로 적을 본 것을 분리한다.
// 이 검사를 통과해야 targetRef를 잡고 사격할 수 있다.
function allyConfirmedVision(ally,target,maxDistance=ALLY_CONFIRM_FOV_RADIUS){
  if(!ally||!actorAlive(target))return false;
  const dx=target.x-ally.x,dy=target.y-ally.y;
  const d=Math.hypot(dx,dy);
  const limit=Math.min(maxDistance,ALLY_CONFIRM_FOV_RADIUS);
  if(d>limit)return false;
  const targetAngle=Math.atan2(dy,dx);
  if(Math.abs(normAngle(targetAngle-ally.angle))>ALLY_CONFIRM_FOV_ANGLE/2)return false;
  if(lineBlocked(ally.x,ally.y,target.x,target.y))return false;
  return true;
}

function tryLockRetaliation(victim,attacker){
  if(!victim||!actorAlive(attacker)||victim===attacker)return;
  const current=victim.revengeTargetRef;
  // 현재 보복 대상이 살아 있는 동안에는 제3자에게 새로 맞아도 타겟을 바꾸지 않는다.
  if(actorAlive(current)&&current!==attacker)return;
  victim.revengeTargetRef=attacker;
  victim.revengeLostTime=0;
}

function updateRetaliationLock(actor,dt,maxDistance=1150){
  const target=actor.revengeTargetRef;
  if(!actorAlive(target)){
    actor.revengeTargetRef=null;
    actor.revengeLostTime=0;
    return;
  }
  const usable=actorDistance(actor,target)<=maxDistance&&
    !lineBlocked(actor.x,actor.y,target.x,target.y);
  if(usable){
    actor.revengeLostTime=0;
  }else{
    actor.revengeLostTime=(actor.revengeLostTime||0)+dt;
    // 죽지 않았더라도 3초 넘게 완전히 전투에서 이탈한 상대는 락을 해제한다.
    if(actor.revengeLostTime>3){
      actor.revengeTargetRef=null;
      actor.revengeLostTime=0;
    }
  }
}

function nearestLivingEnemy(ally,maxDistance=ALLY_CONFIRM_FOV_RADIUS){
  // 보복 타겟도 '맞았으니 위치를 안다'만으로는 쏘지 않는다.
  // 실제 전방 시야에 들어와 직접 확인된 경우에만 확정 표적으로 승격한다.
  const visionLimit=Math.min(maxDistance,ALLY_CONFIRM_FOV_RADIUS);
  const revenge=ally.revengeTargetRef;
  if(actorAlive(revenge)&&allyConfirmedVision(ally,revenge,visionLimit)){
    return{enemy:revenge,distance:actorDistance(ally,revenge),revenge:true};
  }

  let best=null,bestDistance=visionLimit;
  for(const enemy of testSubjects){
    if(enemy.hp<=0)continue;
    const d=Math.hypot(enemy.x-ally.x,enemy.y-ally.y);
    if(d>=bestDistance)continue;
    if(!allyConfirmedVision(ally,enemy,visionLimit))continue;
    best=enemy;bestDistance=d;
  }

  // 일반 표적은 가까운 놈 우선이지만, 이미 교전 중인 상대가 계속 직접 보이면
  // 새 상대가 확실히 더 가까운 경우에만 갈아탄다.
  const current=ally.targetRef;
  if(actorAlive(current)&&allyConfirmedVision(ally,current,visionLimit)){
    const currentDistance=actorDistance(ally,current);
    if(!best||best===current||bestDistance>currentDistance*.72){
      return{enemy:current,distance:currentDistance,revenge:false};
    }
  }
  return best?{enemy:best,distance:bestDistance,revenge:false}:null;
}

function nearestHostileForGuard(guard,maxDistance=900){
  const revenge=guard.revengeTargetRef;
  if(actorAlive(revenge)&&visibleActorFrom(guard,revenge,1150)){
    return{actor:revenge,distance:actorDistance(guard,revenge),revenge:true};
  }

  let best=null,bestDistance=maxDistance;
  const candidates=[player,...squadAllies];
  for(const candidate of candidates){
    if(!actorAlive(candidate))continue;
    const d=actorDistance(guard,candidate);
    if(d>=bestDistance)continue;
    const a=Math.atan2(candidate.y-guard.y,candidate.x-guard.x);
    if(d>FOV_RADIUS)continue;
    if(Math.abs(normAngle(a-guard.angle))>FOV_ANGLE/2)continue;
    if(lineBlocked(guard.x,guard.y,candidate.x,candidate.y))continue;
    best=candidate;bestDistance=d;
  }

  const current=guard.targetRef;
  if(actorAlive(current)){
    const d=actorDistance(guard,current);
    const a=Math.atan2(current.y-guard.y,current.x-guard.x);
    const visible=d<=maxDistance&&d<=FOV_RADIUS&&
      Math.abs(normAngle(a-guard.angle))<=FOV_ANGLE/2&&
      !lineBlocked(guard.x,guard.y,current.x,current.y);
    if(visible&&(!best||best===current||bestDistance>d*.72)){
      return{actor:current,distance:d,revenge:false};
    }
  }
  return best?{actor:best,distance:bestDistance,revenge:false}:null;
}


function allyHearNewestHostileSound(ally){
  for(let i=soundEvents.length-1;i>=0;i--){
    const sound=soundEvents[i];
    if(soundSourceTeam(sound.source)!=='enemy')continue;
    if(sound.id<=(ally.lastHeardSoundId||0))continue;
    const distance=Math.hypot(sound.x-ally.x,sound.y-ally.y);
    let audibleRadius=sound.radius;
    if(lineBlocked(ally.x,ally.y,sound.x,sound.y))audibleRadius*=soundWallFactor(sound.kind);
    if(distance>audibleRadius)continue;
    ally.lastHeardSoundId=sound.id;
    const isVoice=sound.kind&&sound.kind.startsWith('voice');
    const uncertainty=isVoice?34:10;
    const a=Math.random()*Math.PI*2,r=Math.random()*uncertainty;
    ally.heardX=sound.x+Math.cos(a)*r;
    ally.heardY=sound.y+Math.sin(a)*r;
    ally.heardKind=sound.kind;
    ally.heardTimer=sound.kind==='gunshot'?NOISE_MEMORY_GUNSHOT:(isVoice?1.45:NOISE_MEMORY_FOOTSTEP);
    return sound;
  }
  return null;
}
function updateAllySoundInvestigation(ally,dt){
  if(!Number.isFinite(ally.heardX)||!Number.isFinite(ally.heardY))return false;
  ally.heardTimer=Math.max(0,(ally.heardTimer||0)-dt);
  const dx=ally.heardX-ally.x,dy=ally.heardY-ally.y,d=Math.hypot(dx,dy);
  const a=Math.atan2(dy,dx);
  ally.angle=normAngle(ally.angle+normAngle(a-ally.angle)*Math.min(1,dt*6.7));
  ally.aimAngle=normAngle(ally.aimAngle+normAngle(a-ally.aimAngle)*Math.min(1,dt*8.2));
  if(d>55){
    const sep=allySeparationVector(ally,105);
    moveGuardSmart(
      ally,
      dx+sep.x*95,
      dy+sep.y*95,
      ally.moveSpeed*(ally.heardKind==='gunshot'?1.00:.90),
      dt
    );
  }
  if(ally.heardTimer<=0||d<42){ally.heardX=null;ally.heardY=null;ally.heardKind=null;return false}
  return true;
}
function allyNeedsSmgAmmo(ally){
  const smg=ally.weaponStates&&ally.weaponStates.smg;
  if(!smg)return false;
  const loaded=(smg.chamberRound?1:0)+(smg.magazine?smg.magazine.rounds.length:0);
  const reserve=(ally.inventoryMagazines||[]).some(
    mag=>mag&&mag.magazineType==='smg22'&&mag.rounds.length>0
  );
  return loaded===0&&!reserve;
}

function allySmgReserveCount(ally){
  return (ally.inventoryMagazines||[]).filter(
    mag=>mag&&mag.magazineType==='smg22'&&mag.rounds.length>0
  ).length;
}

function allySmgTotalRounds(ally){
  const smg=ally.weaponStates&&ally.weaponStates.smg;
  if(!smg)return 0;
  let rounds=(smg.chamberRound?1:0)+(smg.magazine?smg.magazine.rounds.length:0);
  for(const mag of ally.inventoryMagazines||[]){
    if(mag&&mag.magazineType==='smg22')rounds+=mag.rounds.length;
  }
  return rounds;
}

function allyShotgunTotalRounds(ally){
  const shotgun=ally.weaponStates&&ally.weaponStates.shotgun;
  if(!shotgun)return 0;
  return (shotgun.chamberRound?1:0)+(shotgun.magazine?shotgun.magazine.rounds.length:0)+
    ((ally.inventoryLoose&&ally.inventoryLoose.buckshot)||0);
}

function allyShotgunLoadedRounds(ally){
  const shotgun=ally.weaponStates&&ally.weaponStates.shotgun;
  if(!shotgun)return 0;
  return (shotgun.chamberRound?1:0)+(shotgun.magazine?shotgun.magazine.rounds.length:0);
}

function allyCombatQuietEnoughToTopOff(ally){
  if(!ally||ally.hp<=0)return false;
  if(allyIncomingThreatCount(ally)>0)return false;
  if((ally.lastDamageAge||0)<2.2)return false;
  if((ally.heardTimer||0)>0)return false;
  if(nearestLivingEnemy(ally,ALLY_CONFIRM_FOV_RADIUS))return false;
  return true;
}

function allyIncomingThreatCount(ally,maxDistance=560){
  let count=0;
  for(const enemy of testSubjects){
    if(!actorAlive(enemy))continue;
    const d=actorDistance(ally,enemy);
    if(d>maxDistance)continue;
    const focused=enemy.targetRef===ally||enemy.revengeTargetRef===ally;
    if(!focused)continue;
    if(lineBlocked(enemy.x,enemy.y,ally.x,ally.y))continue;
    count++;
  }
  return count;
}

function availableGuardSmgDropCount(){
  let count=0;
  for(const drop of droppedMagazines){
    if(drop.droppedByGuard&&drop.magazine&&drop.magazine.magazineType==='smg22'&&drop.magazine.rounds.length>0)count++;
  }
  return count;
}

function nearestGuardSmgMagazine(ally,maxDistance=430){
  let best=null,bestScore=Infinity,bestDistance=maxDistance;
  const anchor=allyFormationAnchor(ally);
  for(const drop of droppedMagazines){
    if(!drop.droppedByGuard||!drop.magazine)continue;
    if(drop.magazine.magazineType!=='smg22'||drop.magazine.rounds.length<=0)continue;
    if(!dropReservationAvailable(drop,ally))continue;
    // 탄창 때문에 분대 활동반경 밖까지 혼자 튀어나가지 않는다.
    if(Math.hypot(drop.x-player.x,drop.y-player.y)>ALLY_OPERATION_RADIUS-20)continue;
    const d=Math.hypot(drop.x-ally.x,drop.y-ally.y);
    if(d>maxDistance)continue;

    // 자신의 작전 섹터와 가까운 탄창을 조금 더 선호한다.
    // 그래서 여러 명이 같은 시체/탄창 쪽으로 몰리는 현상이 줄어든다.
    const sectorDistance=Math.hypot(drop.x-anchor.x,drop.y-anchor.y);
    const score=d+sectorDistance*.22;
    if(score<bestScore){
      best=drop;
      bestScore=score;
      bestDistance=d;
    }
  }
  return best?{drop:best,distance:bestDistance}:null;
}

function allyTakeDroppedMagazine(ally,drop){
  if(!ally||!drop||!drop.magazine)return false;
  if(ally.magazinePickup&&ally.magazinePickup.active)return false;
  const index=droppedMagazines.indexOf(drop);
  if(index<0){releaseMagazineReservation(ally);return false;}
  if(!reserveMagazineDrop(ally,drop))return false;

  // 평소 예비탄창이 충분해도 각 조력자는 전장에서 SMG 탄창 하나를 추가 확보한다.
  // 시작 예비탄창 2개 + 현장 확보 1개까지 허용하고, 그 뒤에는 기존처럼 과도한 독식을 막는다.
  if(drop.magazine.magazineType==='smg22'){
    const reserveCount=allySmgReserveCount(ally);
    const takingBonus=!ally.bonusSmgMagClaimed;
    const reserveCap=takingBonus?3:2;
    if(reserveCount>=reserveCap){releaseMagazineReservation(ally);return false;}
    // 보너스 한 개를 아직 안 챙긴 조력자는 마지막 탄창이라도 확보할 수 있다.
    // 보너스를 이미 챙긴 뒤에는 마지막 군인산 탄창 하나는 플레이어를 위해 남긴다.
    if(!takingBonus&&availableGuardSmgDropCount()<=1){releaseMagazineReservation(ally);return false;}
  }

  // 여기서는 탄창을 삭제하지 않는다. 플레이어와 같은 0.72초 줍기 모션을 시작하고,
  // 실제 탄창 이동/삭제는 updateMagazinePickup()의 손이 닿는 커밋 프레임에서 일어난다.
  ally.magazinePickup={
    active:true,
    elapsed:0,
    magazine:drop,
    rounds:magazineRoundCount(drop.magazine),
    collected:false
  };
  ally.lootDropRef=drop;
  ally.lootCollected=false;
  ally.burstRemaining=0;
  ally.targetRef=null;
  return true;
}

function updateAllyMagazinePickup(ally,dt){
  if(!ally||!ally.magazinePickup||!ally.magazinePickup.active)return false;
  const drop=ally.magazinePickup.magazine;
  if(drop){
    const a=Math.atan2(drop.y-ally.y,drop.x-ally.x);
    ally.angle=normAngle(ally.angle+normAngle(a-ally.angle)*Math.min(1,dt*9));
    ally.aimAngle=ally.angle;
  }

  const beforeCount=ally.inventoryMagazines.length;
  withGuardWeaponContext(ally,()=>updateMagazinePickup(dt));
  if(ally.inventoryMagazines.length>beforeCount)ally.lootCollected=true;
  const finished=!ally.magazinePickup.active;
  if(finished){
    if(ally.lootCollected){
      if(drop&&drop.magazine&&drop.magazine.magazineType==='smg22'&&!ally.bonusSmgMagClaimed){
        ally.bonusSmgMagClaimed=true;
      }
      speakCombatLine(ally,availableGuardSmgDropCount()<=1?'leaveMag':'ammo','normal',.38);
      if(ally.weaponId!=='smg')switchGuardWeapon(ally,'smg');
      const smg=ally.weaponStates.smg;
      if(!smg.chamberRound&&(!smg.magazine||smg.magazine.rounds.length===0))startGuardReload(ally);
    }
    ally.lootDropRef=null;
    ally.lootCollected=false;
    releaseMagazineReservation(ally);
  }
  return !finished;
}

function allyFire(ally){
  const state=ally.weaponState;
  if(!state)return false;
  if(!state.chamberRound&&(!state.magazine||state.magazine.rounds.length===0)){
    startGuardReload(ally);
    return false;
  }
  const requestedBarrel=ally.weaponId==='shotgun'?state.shotgunNextBarrel:null;
  const fired=withGuardWeaponContext(ally,()=>firePistol(requestedBarrel,'ally',ally));
  if(fired){
    const now=ally.weaponState;
    if(!now.chamberRound&&(!now.magazine||now.magazine.rounds.length===0))startGuardReload(ally);
  }
  return !!fired;
}

function damageAlly(ally,amount,shotAngle=0,attacker=null){
  if(!ally||ally.hp<=0)return;
  const damage=Math.max(1,amount-(ally.defense||0));
  ally.hp=Math.max(0,ally.hp-damage);
  ally.hitFlash=.16;
  ally.lastDamageAge=0;
  if(attacker&&testSubjects.includes(attacker)){
    const wasLocked=actorAlive(ally.revengeTargetRef);
    tryLockRetaliation(ally,attacker);
    if(!wasLocked&&ally.revengeTargetRef===attacker)speakCombatLine(ally,'retaliation','yell',.72);
    // 정확한 좌표를 '본 것'으로 취급하지는 않지만, 피탄 방향은 즉시 안다.
    // 2~5발 정도 무작위 오차를 섞어 억제사격하고 동시에 그 위치를 조사 기억에 넣는다.
    const hitDirection=Math.atan2(attacker.y-ally.y,attacker.x-ally.x);
    ally.suppressAngle=normAngle(hitDirection+(Math.random()-.5)*.18);
    ally.suppressShots=2+Math.floor(Math.random()*4);
    ally.suppressTimer=1.15+Math.random()*.55;
    ally.suppressNextShot=.035+Math.random()*.07;
    ally.heardX=attacker.x+(Math.random()-.5)*36;
    ally.heardY=attacker.y+(Math.random()-.5)*36;
    ally.heardKind='gunshot';
    ally.heardTimer=Math.max(ally.heardTimer||0,NOISE_MEMORY_GUNSHOT);
  }else{
    // 발사자 객체를 잃어도 탄도가 들어온 역방향으로 짧게 대응한다.
    ally.suppressAngle=normAngle(shotAngle+Math.PI+(Math.random()-.5)*.24);
    ally.suppressShots=2+Math.floor(Math.random()*3);
    ally.suppressTimer=.9+Math.random()*.4;
    ally.suppressNextShot=.05;
  }
  speakCombatLine(ally,'hurt','yell',.24);
  spawnBlood(ally,ally.x,ally.y,shotAngle,ally.hp<=0?18:8,'firearm');
  if(ally.hp<=0){
    ally.dead=true;
    ally.deathAngle=shotAngle;
    ally.corpseTurn=(Math.random()>.5?1:-1)*.5;
  }
}

function ensureAllyPrimaryReload(ally){
  if(!ally||ally.hp<=0||!ally.weaponStates||!ally.weaponStates.smg)return false;
  const smg=ally.weaponStates.smg;
  const smgEmpty=!smg.chamberRound&&(!smg.magazine||smg.magazine.rounds.length===0);
  if(!smgEmpty||smg.reloading)return false;
  const hasReserve=(ally.inventoryMagazines||[]).some(
    mag=>mag&&mag.magazineType==='smg22'&&mag.rounds.length>0
  );
  if(!hasReserve)return false;

  const threats=allyIncomingThreatCount(ally);
  const shotgunLoaded=allyShotgunLoadedRounds(ally);

  // SMG가 빈 순간의 판단은 딱 한 번만 한다.
  // 자신을 직접 쏘는 적이 2명 이상이면 산탄총으로 한 명을 정리할 시간을 번다.
  if(threats>=2&&shotgunLoaded>0){
    ally.emergencySmgReloadPending=true;
    if(ally.weaponId!=='shotgun'&&!ally.weaponDrawActive){
      switchGuardWeapon(ally,'shotgun');
      ally.shotCooldown=.10;
      speakCombatLine(ally,'shotgun','yell',.34);
    }
    return false;
  }

  // 위협이 줄었거나 애초에 많지 않으면 지체하지 않고 SMG 재장전.
  ally.emergencySmgReloadPending=false;
  ally.emergencyShotgunTarget=null;
  if(ally.weaponId!=='smg'){
    if(!ally.weaponDrawActive)switchGuardWeapon(ally,'smg');
    return false;
  }
  if(ally.weaponDrawActive||(ally.magazinePickup&&ally.magazinePickup.active))return false;
  return startGuardReload(ally);
}

function updateAllyIdleShotgunTopoff(ally){
  if(!allyCombatQuietEnoughToTopOff(ally))return false;
  const loaded=allyShotgunLoadedRounds(ally);
  const loose=(ally.inventoryLoose&&ally.inventoryLoose.buckshot)||0;
  if(loaded>=2||loose<=0)return false;

  ally.idleShotgunTopoff=true;
  if(ally.weaponId!=='shotgun'){
    if(!ally.weaponDrawActive)switchGuardWeapon(ally,'shotgun');
    return true;
  }
  if(ally.weaponDrawActive)return true;
  if(!ally.weaponState.reloading)startGuardReload(ally);
  return true;
}

function updateSquadAllies(dt){
  for(const ally of squadAllies){
    if(ally.airborne)continue;
    ally.hitFlash=Math.max(0,(ally.hitFlash||0)-dt);
    if(ally.hp<=0)continue;
    ally.lastDamageAge=(ally.lastDamageAge||0)+dt;
    if(ally.lastDamageAge>PLAYER_REGEN_DELAY){
      ally.hp=Math.min(ally.maxHp,ally.hp+PLAYER_REGEN_PER_SECOND*dt);
    }
    ally.stateTime+=dt;
    ally.shotCooldown=Math.max(0,(ally.shotCooldown||0)-dt);
    ally.burstPause=Math.max(0,(ally.burstPause||0)-dt);
    ally.reactionTimer=Math.max(0,(ally.reactionTimer||0)-dt);
    ally.roamTimer=Math.max(0,(ally.roamTimer||0)-dt);
    ally.combatMoveTimer=Math.max(0,(ally.combatMoveTimer||0)-dt);
    ally.moveCommitTimer=Math.max(0,(ally.moveCommitTimer||0)-dt);
    ally.voiceCooldown=Math.max(0,(ally.voiceCooldown||0)-dt);
    ally.suppressTimer=Math.max(0,(ally.suppressTimer||0)-dt);
    ally.suppressNextShot=Math.max(0,(ally.suppressNextShot||0)-dt);
    if(ally.suppressTimer<=0)ally.suppressShots=0;
    updateRetaliationLock(ally,dt,1150);
    allyHearNewestHostileSound(ally);
    if(ally.weaponDrawActive){
      ally.weaponDrawElapsed+=dt;
      if(ally.weaponDrawElapsed>=ally.weaponDrawDuration){
        ally.weaponDrawElapsed=ally.weaponDrawDuration;ally.weaponDrawActive=false;
      }
    }
    updateGuardWeaponState(ally,dt);
    syncGuardWeaponAliases(ally);
    allyForcePistolIfLongGunsDry(ally);
    // SMG가 비었고 예비 탄창이 있으면 AI 판단보다 먼저 재장전 상태를 확보한다.
    ensureAllyPrimaryReload(ally);
    syncGuardWeaponAliases(ally);
    allyForcePistolIfLongGunsDry(ally);

    // 시작 직후 조력자는 전투/청각/루팅 판단보다 먼저 방을 빠져나간다.
    // 플레이어가 아직 방 안에 있어도 문으로 향하며, 방 밖에 나온 뒤에야 평상 AI를 시작한다.
    if(ally.initialExit){
      ally.targetRef=null;
      ally.burstRemaining=0;
      ally.revengeTargetRef=null;
      ally.heardX=null;ally.heardY=null;ally.heardKind=null;ally.heardTimer=0;
      const laneY=ally.exitLaneY||600;
      let tx=414,ty=laneY;
      if(ally.x>=404){tx=500;ty=laneY}
      if(ally.x>=478){tx=548;ty=laneY}
      let dx=tx-ally.x,dy=ty-ally.y;
      // 문 안에서는 앞선 조력자의 등을 밀지 않는다. 가까우면 자기 레인에서 잠깐 옆으로 비킨다.
      const blocker=squadAllies.find(other=>other!==ally&&other.hp>0&&other.initialExit&&other.x>ally.x-4&&Math.hypot(other.x-ally.x,other.y-ally.y)<38);
      if(blocker){
        dy+=(ally.allyId===1?-1:1)*42;
        dx*=.35;
      }
      const a=Math.atan2(dy,dx);
      ally.angle=normAngle(ally.angle+normAngle(a-ally.angle)*Math.min(1,dt*9.5));
      ally.aimAngle=ally.angle;
      ally.moveIntentX=dx;ally.moveIntentY=dy;
      moveGuardSmart(ally,dx,dy,ally.moveSpeed*1.00,dt);
      if(ally.x>=520&&!pointInRect(ally.x,ally.y,PREP_ROOM)){
        ally.initialExit=false;
        ally.roamTimer=.25;
        ally.roamX=548;
        ally.roamY=laneY;
      }
      continue;
    }

    // 플레이어가 아직 준비실에 머무는 동안에는 밖으로 나온 조력자가 다시 방 안으로
    // 배회해 들어가지 않는다. 문 바로 바깥의 자기 레인에서 대기한다.
    if(ally.holdOutsideUntilPlayerExits){
      if(!pointInRect(player.x,player.y,PREP_ROOM)){
        ally.holdOutsideUntilPlayerExits=false;
      }else{
        const holdX=575,holdY=ally.holdOutsideY||(ally.exitLaneY||600);
        const dx=holdX-ally.x,dy=holdY-ally.y,d=Math.hypot(dx,dy);
        if(d>18){
          const a=Math.atan2(dy,dx);
          ally.angle=normAngle(ally.angle+normAngle(a-ally.angle)*Math.min(1,dt*7));
          ally.aimAngle=ally.angle;
          moveGuardSmart(ally,dx,dy,ally.moveSpeed*1.00,dt);
        }else{
          ally.angle=normAngle(ally.angle+normAngle(0-ally.angle)*Math.min(1,dt*4));
          ally.aimAngle=ally.angle;
        }
        continue;
      }
    }

    // 루팅 중에는 플레이어와 동일한 손 뻗기/숙이기 모션을 끝까지 수행한다.
    if(ally.magazinePickup&&ally.magazinePickup.active){
      updateAllyMagazinePickup(ally,dt);
      continue;
    }

    const playerDistance=Math.hypot(player.x-ally.x,player.y-ally.y);
    const formationAnchor=allyFormationAnchor(ally);
    const separation=allySeparationVector(ally,115);

    // 플레이어는 추종 대상이 아니라 작전반경의 중심점이다.
    // 바깥으로 이탈했을 때만 반경 안쪽의 임의 지점으로 복귀한다.
    if(playerDistance>ALLY_OPERATION_RADIUS){
      ally.targetRef=null;ally.burstRemaining=0;
      const returnX=formationAnchor.x;
      const returnY=formationAnchor.y;
      const dx=returnX-ally.x,dy=returnY-ally.y;
      ally.angle=Math.atan2(dy,dx);ally.aimAngle=ally.angle;
      ally.moveIntentX=dx;ally.moveIntentY=dy;
      moveGuardSmart(ally,dx+separation.x*110,dy+separation.y*110,ally.moveSpeed*1.00,dt);
      continue;
    }

    const targetInfo=nearestLivingEnemy(ally,ALLY_CONFIRM_FOV_RADIUS);
    const immediateThreat=nearestLivingEnemy(ally,260);

    // 직접 확인한 적이 없더라도 방금 총을 맞았다면 그 방향으로 몇 발 억제사격한다.
    // 이 사격은 표적 확정이 아니므로 오차가 크고 짧게 끝난다.
    if(!targetInfo&&(ally.suppressShots||0)>0&&(ally.suppressTimer||0)>0){
      const shotgunRounds=allyShotgunTotalRounds(ally);
      const smgRounds=allySmgTotalRounds(ally);
      const currentReloading=!!(ally.weaponState&&ally.weaponState.reloading);
      const incomingThreats=allyIncomingThreatCount(ally);
      // 재장전 중이라는 이유만으로 산탄총으로 갈아타지 않는다.
      // 실제로 둘 이상에게 집중사격을 받는 경우에만 장전을 잠시 포기하고 비상 전환한다.
      if(((currentReloading&&incomingThreats>=2)||smgRounds<=0)&&shotgunRounds>0&&ally.weaponId!=='shotgun'){
        switchGuardWeapon(ally,'shotgun');
        ally.shotCooldown=.10;
      }
      const wobble=(Math.random()-.5)*(ally.weaponId==='shotgun'?.16:.11);
      const suppressAim=normAngle((ally.suppressAngle||ally.angle)+wobble);
      ally.angle=normAngle(ally.angle+normAngle(suppressAim-ally.angle)*Math.min(1,dt*11));
      ally.aimAngle=normAngle(ally.aimAngle+normAngle(suppressAim-ally.aimAngle)*Math.min(1,dt*13));
      if(!ally.weaponState.reloading&&!ally.weaponDrawActive&&ally.suppressNextShot<=0&&ally.shotCooldown<=0){
        if(allyFire(ally)){
          ally.suppressShots-=ally.weaponId==='shotgun'?2:1;
          ally.suppressNextShot=ally.weaponId==='shotgun'?.34+Math.random()*.14:
            Math.max(.055,WEAPON_BY_ID[ally.weaponId].fireDelay*(.72+Math.random()*.36));
          ally.shotCooldown=ally.suppressNextShot;
        }
      }
      continue;
    }

    // 전투가 잠잠하면 탄약이 충분해도 각자 현장 탄창 하나는 챙긴다.
    // 그 한 개를 확보한 뒤에는 예비탄창이 2개 미만일 때만 추가 보충한다.
    const wantsBonusFieldMag=!ally.bonusSmgMagClaimed;
    const wantsReserveRefill=allySmgReserveCount(ally)<2&&availableGuardSmgDropCount()>1;
    if(!immediateThreat&&(wantsBonusFieldMag||wantsReserveRefill)&&availableGuardSmgDropCount()>0){
      const loot=nearestGuardSmgMagazine(ally,ALLY_LOOT_SEARCH_RADIUS);
      if(loot){
        if(reserveMagazineDrop(ally,loot.drop)){
          if(loot.distance>MAGAZINE_PICKUP_RADIUS){
            const dx=loot.drop.x-ally.x,dy=loot.drop.y-ally.y;
            ally.angle=Math.atan2(dy,dx);ally.aimAngle=ally.angle;
            moveGuardSmart(
              ally,
              dx+separation.x*115,
              dy+separation.y*115,
              ally.moveSpeed*1.00,
              dt
            );
            continue;
          }else{
            allyTakeDroppedMagazine(ally,loot.drop);
            // 예약한 탄창 하나만 줍고, 다음 프레임에 새 목표를 고른다.
          }
        }
      }else{
        releaseMagazineReservation(ally);
      }
    }

    if(targetInfo){
      ally.idleShotgunTopoff=false;
      const target=targetInfo.enemy;
      const dx=target.x-ally.x,dy=target.y-ally.y,distance=targetInfo.distance;
      const targetAngle=Math.atan2(dy,dx);

      // 새로운 적을 봤을 때 즉발하지 않는다. 사람처럼 0.30~0.65초 정도 반응 지연.
      if(ally.targetRef!==target){
        ally.targetRef=target;
        speakCombatLine(ally,targetInfo.revenge?'retaliation':'contact',targetInfo.revenge?'yell':'combat',targetInfo.revenge?.82:.38);
        ally.reactionTimer=.24+Math.random()*.28;
        ally.burstRemaining=0;
        ally.burstPause=.05;
        ally.aimWobble=(Math.random()-.5)*.11;
      }

      // 산탄총은 근접 전용이 아니라 비상 보조화기다.
      // 1) 적이 가까움, 2) SMG 탄 전부 소모, 3) SMG 장전 중 둘 이상에게 집중사격을 받음
      // 중 하나면 즉시 산탄총으로 전환한다.
      const smgRounds=allySmgTotalRounds(ally);
      const shotgunRounds=allyShotgunTotalRounds(ally);
      const incomingThreats=allyIncomingThreatCount(ally);
      const emergencyShotgun=!!ally.emergencySmgReloadPending;

      // SMG가 빈 채 다수에게 집중사격을 받으면 현재 직접 확인한 적 하나를
      // '재장전 전에 정리할 대상'으로 잡는다. 그 한 명이 죽거나 위협이 1명 이하로 줄면 즉시 SMG 장전으로 복귀한다.
      if(emergencyShotgun&&!actorAlive(ally.emergencyShotgunTarget)){
        ally.emergencyShotgunTarget=target;
      }
      if(emergencyShotgun&&(incomingThreats<2||!actorAlive(ally.emergencyShotgunTarget))){
        ally.emergencySmgReloadPending=false;
        ally.emergencyShotgunTarget=null;
        if(ally.weaponId!=='smg'&&!ally.weaponDrawActive)switchGuardWeapon(ally,'smg');
      }

      if((distance<165||ally.emergencySmgReloadPending)&&shotgunRounds>0&&ally.weaponId!=='shotgun'){
        speakCombatLine(ally,'shotgun','yell',distance<165?.58:.42);
        switchGuardWeapon(ally,'shotgun');
        ally.shotCooldown=.12;
      }else if(ally.weaponId==='shotgun'){
        if(shotgunRounds<=0){
          ally.emergencySmgReloadPending=false;
          ally.emergencyShotgunTarget=null;
          switchGuardWeapon(ally,smgRounds>0?'smg':'pistol');
          ally.shotCooldown=.16;
        }else if(distance>215&&!ally.emergencySmgReloadPending&&smgRounds>0&&!ally.idleShotgunTopoff){
          switchGuardWeapon(ally,'smg');
          ally.shotCooldown=.16;
        }
      }

      const preferred=ally.weaponId==='shotgun'?(emergencyShotgun?155:115):(ally.weaponId==='smg'?320:255);

      // 이동 의도는 일정 시간 유지한다. 예전처럼 거리 경계/랜덤값 때문에
      // 프레임마다 전진↔후퇴가 뒤집히며 부들부들 떨지 않게 한다.
      if(ally.combatMoveTimer<=0){
        ally.combatMoveTimer=.62+Math.random()*.72;
        const roll=Math.random();
        ally.combatStrafe=(Math.random()<.5?-1:1)*(.38+Math.random()*.48);
        if(roll<.24)ally.combatRadial=1;
        else if(roll<.48)ally.combatRadial=-1;
        else ally.combatRadial=0;
      }

      // 거리 유지에도 히스테리시스를 둔다. 좁은 경계선을 넘나들어도 즉시 반전하지 않는다.
      if(distance>preferred+125)ally.rangeMode=1;
      else if(distance<preferred-90)ally.rangeMode=-1;
      else if(Math.abs(distance-preferred)<48)ally.rangeMode=0;

      let radial=ally.rangeMode!==0?ally.rangeMode:ally.combatRadial*.42;
      let strafe=(distance<170?.30:.62)*ally.combatStrafe;
      let desiredX=Math.cos(targetAngle)*radial+Math.cos(targetAngle+Math.PI/2)*strafe;
      let desiredY=Math.sin(targetAngle)*radial+Math.sin(targetAngle+Math.PI/2)*strafe;

      // 인원이 많을수록 자기 작전 슬롯 쪽으로 약한 복귀 성분을 준다.
      // 적을 추적하는 전투 이동은 유지하면서도 한 점에 뭉치지 않게 한다.
      const faX=formationAnchor.x-ally.x,faY=formationAnchor.y-ally.y;
      const faL=Math.hypot(faX,faY)||1;
      const formationPull=playerDistance>ALLY_EDGE_START?.38:.16;
      desiredX+=faX/faL*formationPull;
      desiredY+=faY/faL*formationPull;
      desiredX+=separation.x*.82;
      desiredY+=separation.y*.82;

      // 작전반경 가장자리에서는 부드럽게 안쪽 성분을 더한다.
      if(playerDistance>ALLY_EDGE_START){
        const inwardX=player.x-ally.x,inwardY=player.y-ally.y;
        const il=Math.hypot(inwardX,inwardY)||1;
        const edgeStrength=clamp((playerDistance-ALLY_EDGE_START)/(ALLY_OPERATION_RADIUS-ALLY_EDGE_START),0,1);
        desiredX+=inwardX/il*(.35+.55*edgeStrength);
        desiredY+=inwardY/il*(.35+.55*edgeStrength);
      }

      // 실제 이동 벡터도 바로 갈아끼우지 않고 보간한다.
      const blend=Math.min(1,dt*5.0);
      ally.moveIntentX+=(desiredX-ally.moveIntentX)*blend;
      ally.moveIntentY+=(desiredY-ally.moveIntentY)*blend;
      const ml=Math.hypot(ally.moveIntentX,ally.moveIntentY);
      if(distance>72&&ml>.08){
        moveGuardSmart(ally,ally.moveIntentX/ml,ally.moveIntentY/ml,ally.moveSpeed*.94,dt);
      }

      // v3보다는 한 단계 빠르게 조준하지만 즉시 스냅하지는 않는다.
      ally.angle=normAngle(ally.angle+normAngle(targetAngle-ally.angle)*Math.min(1,dt*8.0));
      ally.aimWobble=ally.aimWobble*.94+(Math.random()-.5)*.011;
      const desiredAim=targetAngle+ally.aimWobble;
      ally.aimAngle=normAngle(ally.aimAngle+normAngle(desiredAim-ally.aimAngle)*Math.min(1,dt*9.4));
      const aimError=Math.abs(normAngle(targetAngle-ally.aimAngle));

      if(ally.reactionTimer>0)continue;
      // 소리 기억/옛 targetRef만 남아 있어도 발사 직전 직접 시야 확인이 끊기면 절대 쏘지 않는다.
      if(!allyConfirmedVision(ally,target,ALLY_CONFIRM_FOV_RADIUS)){
        ally.burstRemaining=0;
        continue;
      }
      if(ally.weaponState.reloading||ally.weaponDrawActive||aimError>.13)continue;

      // 거리별 사격 습관: 장거리는 짧은 점사, 중거리는 조금 긴 점사,
      // 가까워져야 연사 비중이 올라간다. 산탄총은 한 발씩 확실히 끊어 쏜다.
      if(ally.weaponId==='shotgun'){
        if(ally.shotCooldown<=0&&allyFire(ally)){
          ally.shotCooldown=.42+Math.random()*.22;
          if(ally.emergencySmgReloadPending&&!actorAlive(ally.emergencyShotgunTarget)){
            ally.emergencySmgReloadPending=false;
            ally.emergencyShotgunTarget=null;
          }
        }
      }else{
        if(ally.burstRemaining<=0&&ally.burstPause<=0){
          if(distance>520){
            ally.burstRemaining=2+Math.floor(Math.random()*2); // 2~3발
          }else if(distance>300){
            ally.burstRemaining=3+Math.floor(Math.random()*3); // 3~5발
          }else if(distance>170){
            ally.burstRemaining=5+Math.floor(Math.random()*4); // 5~8발
          }else{
            ally.burstRemaining=9+Math.floor(Math.random()*6); // 근거리만 거의 연사
          }
        }
        if(ally.burstRemaining>0&&ally.shotCooldown<=0){
          // 발사 직전에도 약간의 사람 손 오차를 준다.
          ally.aimAngle=normAngle(ally.aimAngle+(Math.random()-.5)*(distance>450?.055:.035));
          if(allyFire(ally)){
            ally.burstRemaining--;
            ally.shotCooldown=WEAPON_BY_ID[ally.weaponId].fireDelay*(distance>500?1.55:(distance>300?1.28:1));
            if(ally.burstRemaining<=0){
              ally.burstPause=distance>520?.55+Math.random()*.45:
                (distance>300?.34+Math.random()*.30:.18+Math.random()*.20);
            }
          }
        }
      }
      continue;
    }

    ally.targetRef=null;ally.burstRemaining=0;

    // 전투가 잠잠하면 소드오프도 빈 약실을 틈틈이 채운다.
    // 장전이 끝나면 다시 SMG를 주무기로 든다.
    if(ally.idleShotgunTopoff){
      const loaded=allyShotgunLoadedRounds(ally);
      if(loaded>=2||((ally.inventoryLoose&&ally.inventoryLoose.buckshot)||0)<=0){
        ally.idleShotgunTopoff=false;
        if(ally.weaponId==='shotgun'&&!ally.weaponState.reloading&&!ally.weaponDrawActive&&allySmgTotalRounds(ally)>0){
          switchGuardWeapon(ally,'smg');
        }
      }else if(updateAllyIdleShotgunTopoff(ally)){
        continue;
      }
    }else if(updateAllyIdleShotgunTopoff(ally)){
      continue;
    }

    // 시야에 적이 없으면 적 총성/음성을 들은 위치를 먼저 조사한다.
    // 들은 좌표는 힌트일 뿐이며 특히 음성에는 위치 오차가 들어간다.
    if(updateAllySoundInvestigation(ally,dt))continue;

    // 비전투 시에도 플레이어 뒤를 졸졸 따라가지는 않되, 예전보다 가까운 작전반경을 쓴다.
    const roamDist=Math.hypot((ally.roamX||ally.x)-ally.x,(ally.roamY||ally.y)-ally.y);
    if(ally.roamTimer<=0||roamDist<28||Math.hypot((ally.roamX||player.x)-player.x,(ally.roamY||player.y)-player.y)>ALLY_OPERATION_RADIUS-25){
      ally.roamTimer=1.8+Math.random()*3.6;
      const a=(ally.formationAngle||0)+(Math.random()-.5)*1.15;
      const localR=45+Math.random()*110;
      ally.roamX=formationAnchor.x+Math.cos(a)*localR;
      ally.roamY=formationAnchor.y+Math.sin(a)*localR;
      // 벽 속을 목적지로 잡았으면 자기 섹터 안에서 다른 후보를 고른다.
      if(collidesWorld(ally.roamX,ally.roamY,ally.r||12)){
        const safeA=(ally.formationAngle||0)+ally.formationBias*.72;
        ally.roamX=formationAnchor.x+Math.cos(safeA)*58;
        ally.roamY=formationAnchor.y+Math.sin(safeA)*58;
      }
    }
    const dx=ally.roamX-ally.x,dy=ally.roamY-ally.y,d=Math.hypot(dx,dy);
    if(d>30){
      const moveAngle=Math.atan2(dy,dx);
      ally.angle=normAngle(ally.angle+normAngle(moveAngle-ally.angle)*Math.min(1,dt*5.2));
      ally.aimAngle=ally.angle;
      moveGuardSmart(ally,dx+separation.x*125,dy+separation.y*125,ally.moveSpeed*.92,dt);
    }else{
      // 도착하면 잠깐 주변을 훑는다.
      ally.angle=normAngle(ally.angle+ally.strafe*dt*.55);
      ally.aimAngle=ally.angle;
    }
  }
}

const INITIAL_GUARD_SPECS=[];

// 소리를 놓치거나 표적을 잃은 군인이 완전히 멈춰 서지 않도록 하는 예비 순찰선.
const GUARD_PATROL_ROUTES=[
  {
    loop:true,
    points:[
      {x:1200,y:700},{x:3600,y:700},{x:6500,y:900},
      {x:6500,y:3900},{x:3600,y:4300},{x:1200,y:3900}
    ]
  }
];

function assignGuardPatrol(guard){
  let bestRoute=0,bestPoint=0,bestDistance=Infinity;
  for(let r=0;r<GUARD_PATROL_ROUTES.length;r++){
    const route=GUARD_PATROL_ROUTES[r];
    for(let p=0;p<route.points.length;p++){
      const point=route.points[p];
      const distance=Math.hypot(point.x-guard.x,point.y-guard.y);
      if(distance<bestDistance){
        bestDistance=distance;
        bestRoute=r;
        bestPoint=p;
      }
    }
  }
  guard.patrolRouteIndex=bestRoute;
  guard.patrolPointIndex=bestPoint;
  guard.patrolDirection=guard.strafe>=0?1:-1;
}

function guardPatrolTarget(guard){
  if(guard.patrolRouteIndex<0)assignGuardPatrol(guard);
  const route=GUARD_PATROL_ROUTES[guard.patrolRouteIndex];
  if(!route||route.points.length===0)return{x:guard.x,y:guard.y};

  let point=route.points[guard.patrolPointIndex];
  if(Math.hypot(point.x-guard.x,point.y-guard.y)<20){
    if(route.loop){
      guard.patrolPointIndex=(
        guard.patrolPointIndex+1
      )%route.points.length;
    }else{
      let next=guard.patrolPointIndex+guard.patrolDirection;
      if(next<0||next>=route.points.length){
        guard.patrolDirection*=-1;
        next=guard.patrolPointIndex+guard.patrolDirection;
      }
      guard.patrolPointIndex=clamp(next,0,route.points.length-1);
    }
    point=route.points[guard.patrolPointIndex];
  }
  return point;
}

function makeSupplyDrop(type,x,y,height=105){
  const d={
    id:++supplyDropSerial,type,x,y,height,

  };

function dropBuckshotSupply(x,y){

  return makeSupplyDrop('buckshot',x+Math.cos(a)*r,y+Math.sin(a)*r,105);
