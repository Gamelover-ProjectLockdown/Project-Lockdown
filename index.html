function nearestBuckshotSupply(){
  let best=null,bestD=42;
  for(const d of missionSupplyDrops){
    if(!d.active||!d.landed||d.type!=='buckshot')continue;
    const dist=Math.hypot(d.x-player.x,d.y-player.y);
    if(!pointerNearWorld(d.x,d.y,24))continue;
    if(dist<bestD){best=d;bestD=dist}
  }
  return best;
}

function pickupBuckshotSupply(){

  return true;
}


function damageTransmitter(t,damage){
  if(!t||t.dead||damage<=0)return;
  t.hp=Math.max(0,t.hp-damage);

  if(t.hp<=0){
    t.dead=true;
    transmittersDestroyed++;
    emitSoundEvent(t.x,t.y,520,'explosion','player');
    bulletImpacts.push({
      x:t.x,y:t.y,life:.2,maxLife:.2,target:false,
      color:'255,168,92'
    });

      labEntryUnlocked=true;
      reinforcementDeficitTime=0;
      helicopterReinforcements=helicopterReinforcements.filter(h=>h.phase!=='queued');

  }
}

function assignEntryAllies(){
  const alive=squadAllies.filter(a=>a&&a.hp>0&&!a.airborne);
  // 한 번 2명이 확정되면 생존 중인 동안에는 그대로 유지.
  assignedEntryAllies=assignedEntryAllies.filter(a=>a&&a.hp>0&&!a.airborne);
  const originals=alive.filter(a=>originalSquadIds.includes(a.allyId)&&!assignedEntryAllies.includes(a));
  while(assignedEntryAllies.length<2&&originals.length)assignedEntryAllies.push(originals.shift());
  if(assignedEntryAllies.length<2){
    const extras=alive
      .filter(a=>!assignedEntryAllies.includes(a))
      .sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y));
    const needed=2-assignedEntryAllies.length;
    for(let i=0;i<needed&&extras.length;i++)assignedEntryAllies.push(extras.shift());
    if(!replacementDialoguePlayed&&assignedEntryAllies.length>=2){
      replacementDialoguePlayed=true;
      const speaker=assignedEntryAllies[assignedEntryAllies.length-1];
      if(speaker){
        speaker.voiceCooldown=0;
        speaker.speechCaption={text:'I AM TAKING THEIR PLACE. I AM WITH YOU, LEAD.',life:3.3,maxLife:3.3};
        speakCombatLine(speaker,'replacement','combat',1);
      }
    }
  }
  for(const a of squadAllies)if(a)a.labDefense=!assignedEntryAllies.includes(a);
  return assignedEntryAllies;
}

function labDefenseAnchorFor(ally){
  const defenders=squadAllies.filter(a=>a&&a.hp>0&&!assignedEntryAllies.includes(a));
  const idx=Math.max(0,defenders.indexOf(ally));
  const total=Math.max(1,defenders.length);
  const span=Math.min(Math.PI*.9,Math.PI*.35+total*.08);
  const a=-Math.PI/2-span/2+(idx/(Math.max(1,total-1)))*span;
  const r=105+(idx%3)*34;
  return {x:LAB_ENTRANCE.x+Math.cos(a)*r,y:LAB_ENTRANCE.y+Math.sin(a)*r};
}
function updateLabDefenseAllies(dt){
  if(!labEntryUnlocked)return;
  assignEntryAllies();
  for(const ally of squadAllies){
    if(!ally||ally.hp<=0||ally.airborne||assignedEntryAllies.includes(ally))continue;
    const anchor=labDefenseAnchorFor(ally);
    ally.labDefense=true;
    const target=ally.targetRef&&ally.targetRef.hp>0?ally.targetRef:null;
    if(target){
      // 기존 전투 AI가 표적을 처리하게 두되 연구실에서 너무 멀어지면 복귀
      if(Math.hypot(ally.x-LAB_ENTRANCE.x,ally.y-LAB_ENTRANCE.y)>360){
        ally.targetRef=null;
        const dx=anchor.x-ally.x,dy=anchor.y-ally.y;
        moveGuardSmart(ally,dx,dy,ally.moveSpeed*.9,dt);
      }
    }else{
      const dx=anchor.x-ally.x,dy=anchor.y-ally.y,d=Math.hypot(dx,dy);
      if(d>34)moveGuardSmart(ally,dx,dy,ally.moveSpeed*.82,dt);
      else{
        ally.angle=normAngle(ally.angle+normAngle((-Math.PI/2)-ally.angle)*Math.min(1,dt*2.2));
        ally.aimAngle=ally.angle;
      }
    }
  }
}

function entryAlliesReady(){

  return assignedEntryAllies.every(a=>a&&a.hp>0&&Math.hypot(a.x-LAB_ENTRANCE.x,a.y-LAB_ENTRANCE.y)<=115)
    && Math.hypot(player.x-LAB_ENTRANCE.x,player.y-LAB_ENTRANCE.y)<=85;

function updateLabEntryMission(dt){

function updateInsertionMission(dt){
  if(!insertionHelicopter)return;
  const h=insertionHelicopter;
  h.t+=dt;
  h.rotorTick=(h.rotorTick||0)-dt;
  if(h.rotorTick<=0){
    h.rotorTick=.68;
    emitSoundEvent(h.x,h.y,560,'helicopter','player');
  }

  if(h.phase==='approach'){
    const q=smoothStep01(clamp(h.t/3.2,0,1));
    h.x=h.startX+(h.targetX-h.startX)*q;
    h.y=h.startY+(h.targetY-h.startY)*q;
    insertionPlayerAirborneHeight=130;
    for(const ally of squadAllies.slice(0,2)){
      ally.airborne=true;ally.airborneHeight=130;
      ally.x=h.x+(ally.allyId%2?-22:22);
      ally.y=h.y+18;
    }
    // 카메라는 헬기를 직접 추적해서 접근 장면이 반드시 보인다.
    const cx=clamp(h.x-W/2,0,WORLD_W-W);
    const cy=clamp(h.y-H/2,0,WORLD_H-H);
    camera.x+=(cx-camera.x)*Math.min(1,dt*5.2);
    camera.y+=(cy-camera.y)*Math.min(1,dt*5.2);
    if(h.t>=3.2){
      h.phase='hover';h.t=0;
      h.x=h.targetX;h.y=h.targetY;
      dropArmorFromInsertion();
    }
    return;
  }

  if(h.phase==='hover'){
    h.x=h.targetX;h.y=h.targetY;
    const cx=clamp(h.x-W/2,0,WORLD_W-W);
    const cy=clamp(h.y-H/2,0,WORLD_H-H);
    camera.x+=(cx-camera.x)*Math.min(1,dt*6);
    camera.y+=(cy-camera.y)*Math.min(1,dt*6);
    if(h.t>=.65){h.phase='descent';h.t=0}
    return;
  }

  if(h.phase==='descent'){
    const q=clamp(h.t/2.2,0,1);
    const height=(1-smoothStep01(q))*130;
    insertionPlayerAirborneHeight=height;
    player.x=INSERTION_LZ.x;player.y=INSERTION_LZ.y;
    for(let i=0;i<Math.min(2,squadAllies.length);i++){
      const ally=squadAllies[i];
      ally.x=INSERTION_LZ.x+(i===0?-42:42);
      ally.y=INSERTION_LZ.y+(i===0?42:-42);
      ally.airborne=true;ally.airborneHeight=height;
    }
    if(h.t>=2.2){
      insertionPlayerAirborneHeight=0;
      player.x=INSERTION_LZ.x;player.y=INSERTION_LZ.y;
      player.vx=0;player.vy=0;
      for(let i=0;i<Math.min(2,squadAllies.length);i++){
        const ally=squadAllies[i];
        ally.x=INSERTION_LZ.x+(i===0?-42:42);
        ally.y=INSERTION_LZ.y+(i===0?42:-42);
        ally.airborne=false;ally.airborneHeight=0;
        ally.initialExit=false;ally.holdOutsideUntilPlayerExits=false;
        ally.state='follow';
      }
      // 정상 플레이 시작은 '착지 순간' 딱 한 번만.
      gameStarted=true;
      introPlaying=false;
      arenaActivated=true;
      arenaElapsed=0;
      guardRespawnTimer=.55;

      h.phase='gunrun';h.t=0;h.gunTick=.05;h.gunShots=0;h.gunTarget=null;
    }
    return;
  }

  if(h.phase==='gunrun'){
    h.gunTick-=dt;
    if(h.gunTick<=0){h.gunTick=.075+Math.random()*.045;fireHelicopterGun(h)}
    if(h.t>=1.35||h.gunShots>=18){h.phase='depart';h.t=0;h.gunTarget=null}
    return;
  }

  if(h.phase==='depart'){
    const q=smoothStep01(clamp(h.t/2.8,0,1));
    h.x=h.targetX+(h.departX-h.targetX)*q;
    h.y=h.targetY+(h.departY-h.targetY)*q;
    if(h.t>=2.8)insertionHelicopter=null;
  }
}

function pointInRect(x,y,rect){
  return x>=rect.x&&x<=rect.x+rect.w&&y>=rect.y&&y<=rect.y+rect.h;
}

function isInDarkZone(x,y){
  return DARK_ZONES.some(zone=>pointInRect(x,y,zone));
}

function areaNameAt(x,y){
  if(missionObjectiveComplete)return '연구실 입구 · 진입 완료';
  if(labEntryUnlocked)return '침투 구역 · 연구실 진입';
  if(arenaActivated)return '침투 구역 · 송신기 파괴';
  return '침투 구역 · 강하 중';
}

function flickerLevel(fixture){
  const tick=Math.floor(lightingTime*24);
  const noise=(Math.sin((tick+fixture.seed)*91.345)*47453.5453)%1;
  const random=Math.abs(noise);
  const unstable=.5+.5*Math.sin(lightingTime*.77+fixture.seed*2.3);
  if(unstable>.9&&random>.35)return .3+random*.65;
  if(random>.945)return .2+random*.55;
  return 0;
}

function fixtureLightsPoint(fixture,x,y){
  const level=flickerLevel(fixture);
  if(level<=.08)return false;
  return Math.hypot(x-fixture.x,y-fixture.y)<fixture.r*(.35+level*.65);
}


function activeTransmitterCollisionAt(x,y,r){
  for(const t of TRANSMITTERS){
    if(!t||t.dead)continue;
    const rr=(t.r||22)+r;
    const dx=x-t.x,dy=y-t.y;
    if(dx*dx+dy*dy<rr*rr)return t;
  }
  return null;
}
function transmitterRayDistance(x,y,ux,uy,maxDistance){
  let best=maxDistance;
  let target=null;
  for(const t of TRANSMITTERS){
    if(!t||t.dead)continue;
    const d=rayCircleDistance(x,y,ux,uy,t.x,t.y,t.r||22,best);
    if(d<best){best=d;target=t}
  }
  return {distance:best,target};
}

function circleRectOverlap(cx,cy,r,rect){
  const nx=clamp(cx,rect.x,rect.x+rect.w);
  const ny=clamp(cy,rect.y,rect.y+rect.h);
  const dx=cx-nx;
  const dy=cy-ny;
  return dx*dx+dy*dy<r*r;
}

function collidesWorld(x,y,r){
  if(x-r<0||y-r<0||x+r>WORLD_W||y+r>WORLD_H)return true;
  for(const wall of walls)if(circleRectOverlap(x,y,r,wall))return true;
  if(activeTransmitterCollisionAt(x,y,r))return true;
  return false;
}

// ===== 살아있는 캐릭터끼리의 충돌 =====
// 플레이어·조력자·적군 모두 같은 원형 충돌판정을 쓴다.
// 죽은 개체는 시체이므로 이동을 막지 않는다.
function livingSolidActors(){
  const actors=[];
  if(player&&player.hp>0)actors.push(player);
  for(const ally of squadAllies)if(ally&&ally.hp>0&&!ally.airborne)actors.push(ally);
  for(const guard of testSubjects)if(guard&&guard.hp>0)actors.push(guard);
  return actors;
}

function collidesActorAt(body,x,y,r){
  const radius=r||12;
  for(const other of livingSolidActors()){
    if(other===body)continue;
    const otherRadius=other.r||12;
    const minDistance=radius+otherRadius-.45;
    const dx=x-other.x,dy=y-other.y;
    if(dx*dx+dy*dy<minDistance*minDistance)return true;
  }
  return false;
}

function positionBlocked(body,x,y,r){
  return collidesWorld(x,y,r)||collidesActorAt(body,x,y,r);
}

function moveCircle(body,dx,dy){
  const r=body.r||12;
  const nextX=body.x+dx;
  if(!positionBlocked(body,nextX,body.y,r))body.x=nextX;
  const nextY=body.y+dy;
  if(!positionBlocked(body,body.x,nextY,r))body.y=nextY;
}

// ===== 명암 / 시야: 기존 시스템 이식부 =====
function rayRectDistance(ox,oy,dx,dy,rect,maxDistance){
  let tMin=0;
  let tMax=maxDistance;

  if(Math.abs(dx)<1e-9){
    if(ox<rect.x||ox>rect.x+rect.w)return maxDistance;
  }else{
    const a=(rect.x-ox)/dx;
    const b=(rect.x+rect.w-ox)/dx;
    tMin=Math.max(tMin,Math.min(a,b));
    tMax=Math.min(tMax,Math.max(a,b));
    if(tMin>tMax)return maxDistance;
  }

  if(Math.abs(dy)<1e-9){
    if(oy<rect.y||oy>rect.y+rect.h)return maxDistance;
  }else{
    const a=(rect.y-oy)/dy;
    const b=(rect.y+rect.h-oy)/dy;
    tMin=Math.max(tMin,Math.min(a,b));
    tMax=Math.min(tMax,Math.max(a,b));
    if(tMin>tMax)return maxDistance;
  }

  return tMin>=0&&tMin<=maxDistance?tMin:maxDistance;
}

function castObstacleRay(ox,oy,angle,maxDistance){
  const dx=Math.cos(angle);
  const dy=Math.sin(angle);
  let distance=maxDistance;
  for(const wall of walls){
    distance=Math.min(distance,rayRectDistance(ox,oy,dx,dy,wall,distance));
  }
  return distance;
}

function castVisionObstacleRay(ox,oy,angle,maxDistance){
  const dx=Math.cos(angle);
  const dy=Math.sin(angle);
  let distance=maxDistance;
  for(const wall of walls){
    if(wall.visionTransparent)continue;
    distance=Math.min(distance,rayRectDistance(ox,oy,dx,dy,wall,distance));
  }
  return distance;
}

function rayCircleDistance(ox,oy,dx,dy,cx,cy,r,maxDistance){
  const toX=cx-ox;
  const toY=cy-oy;
  // 긴 총구가 대상의 충돌원 안까지 들어간 초근접 사격도 빗나가지 않는다.
  if(toX*toX+toY*toY<=r*r)return 0;
  const along=toX*dx+toY*dy;
  if(along<0)return maxDistance;
  const perpendicularSq=toX*toX+toY*toY-along*along;
  const radiusSq=r*r;
  if(perpendicularSq>radiusSq)return maxDistance;
  const halfChord=Math.sqrt(radiusSq-perpendicularSq);
  const near=along-halfChord;
  const far=along+halfChord;
  const hit=near>=0?near:far;
  return hit>=0&&hit<=maxDistance?hit:maxDistance;
}

function castVisibilityRay(ox,oy,angle,maxDistance){
  const dx=Math.cos(angle);
  const dy=Math.sin(angle);
  let distance=castVisionObstacleRay(ox,oy,angle,maxDistance);
  for(const subject of testSubjects){
    if(subject.hp<=0)continue;
    distance=Math.min(distance,rayCircleDistance(
      ox,oy,dx,dy,subject.x,subject.y,SUBJECT_OCCLUDER_RADIUS,distance
    ));
  }
  return distance;
}

function lineBlocked(x1,y1,x2,y2){
  const dx=x2-x1;
  const dy=y2-y1;
  const distance=Math.hypot(dx,dy);
  if(distance<.001)return false;
  const ux=dx/distance;
  const uy=dy/distance;
  for(const wall of walls){
    if(wall.visionTransparent)continue;
    if(rayRectDistance(x1,y1,ux,uy,wall,distance)<distance-2)return true;
  }
  return false;
}

function hasLineOfSight(x,y,ignoredSubject=null){
  const dx=x-player.x;
  const dy=y-player.y;
  const distance=Math.hypot(dx,dy);
  if(distance>FOV_RADIUS)return false;
  const angle=Math.atan2(dy,dx);
  if(Math.abs(normAngle(angle-player.angle))>FOV_ANGLE/2)return false;
  if(lineBlocked(player.x,player.y,x,y))return false;

  const ux=dx/distance;
  const uy=dy/distance;
  for(const subject of testSubjects){
    if(subject===ignoredSubject)continue;
    if(subject.hp<=0)continue;
    if(rayCircleDistance(
      player.x,player.y,ux,uy,
      subject.x,subject.y,SUBJECT_OCCLUDER_RADIUS,distance
    )<distance-2)return false;
  }
  return true;
}

function buildVisibilityPolygon(){
  const points=[{x:player.x,y:player.y}];
  const start=player.angle-FOV_ANGLE/2;
  for(let i=0;i<=FOV_RAYS;i++){
    const angle=start+FOV_ANGLE*i/FOV_RAYS;
    const distance=castVisibilityRay(player.x,player.y,angle,FOV_RADIUS);
    points.push({
      x:player.x+Math.cos(angle)*distance,
      y:player.y+Math.sin(angle)*distance
    });
  }
  return points;
}

function buildOcclusionPolygon(){
  const points=[{x:player.x,y:player.y}];
  const rays=720;
  for(let i=0;i<=rays;i++){
    const angle=-Math.PI+Math.PI*2*i/rays;
    const distance=castVisionObstacleRay(player.x,player.y,angle,FOV_RADIUS);
    points.push({x:player.x+Math.cos(angle)*distance,y:player.y+Math.sin(angle)*distance});
  }
  return points;
}

function cutPolygon(context,polygon){
  context.beginPath();
  polygon.forEach((vertex,index)=>{
    const point=worldToScreen(vertex.x,vertex.y);
    if(index)context.lineTo(point.x,point.y);else context.moveTo(point.x,point.y);
  });
  context.closePath();context.fillStyle='#000';context.fill();
}

function drawVisibilityOcclusion(polygon){
  const layer=drawVisibilityOcclusion.layer||(drawVisibilityOcclusion.layer=document.createElement('canvas'));
  if(layer.width!==W||layer.height!==H){layer.width=W;layer.height=H}
  const mask=layer.getContext('2d');mask.clearRect(0,0,W,H);
  mask.fillStyle='rgba(2,3,5,.97)';
  if(pointInRect(player.x,player.y,BUILDING_INTERIOR))mask.fillRect(0,0,W,H);
  else{
    const point=worldToScreen(BUILDING_INTERIOR.x,BUILDING_INTERIOR.y);
    mask.fillRect(point.x,point.y,BUILDING_INTERIOR.w,BUILDING_INTERIOR.h);
  }
  mask.globalCompositeOperation='destination-out';cutPolygon(mask,polygon);
  mask.globalCompositeOperation='source-over';ctx.drawImage(layer,0,0);
}


function muzzleFlashLightRadius(def){
  // 총구 화염은 아주 짧지만 순간 광량은 강하다.
  // 어두운 실내에서는 주변 공간이 한 번에 드러나는 수준으로 잡는다.
  if(!def)return 210;
  if(def.id==='shotgun')return 350;
  if(def.id==='pumpShotgun')return 380;
  if(def.id==='smg')return 265;
  return 210;
}

function collectActorMuzzleFlashLights(actor,collector,isGuard=false){
  const readFlash=()=>{
    const def=currentWeaponDef();
    const rawFlash=(pistol.muzzleFlash||0)/.050;
    if(rawFlash<=.01)return;

    const flash=clamp(rawFlash,0,1);
    const pose=pistolPoseAt(0);
    const barrelAngle=normAngle(player.bodyAngle+pose.turn);

    const flashBarrels=def.id==='shotgun'
      ?[0,1].filter(barrel=>pistol.shotgunFlashMask&(1<<barrel))
      :[0];

    const bodyCos=Math.cos(player.bodyAngle);
    const bodySin=Math.sin(player.bodyAngle);

    for(const barrel of flashBarrels){
      const localY=def.id==='shotgun'?(barrel===0?-2.5:2.5):0;
      const muzzleLocal=gunPoint(pose,def.muzzleX,localY);

      // 총구 로컬 좌표를 실제 월드 좌표로 회전시킨다.
      const muzzleX=
        player.x+
        muzzleLocal.x*bodyCos-
        muzzleLocal.y*bodySin;
      const muzzleY=
        player.y+
        muzzleLocal.x*bodySin+
        muzzleLocal.y*bodyCos;

      collector.push({
        x:muzzleX,
        y:muzzleY,
        angle:barrelAngle,
        intensity:flash,
        radius:muzzleFlashLightRadius(def),
        weaponId:def.id
      });
    }
  };

  if(isGuard)withGuardWeaponContext(actor,readFlash);
  else readFlash();
}

function collectMuzzleFlashLights(){
  const flashes=[];
  collectActorMuzzleFlashLights(player,flashes,false);

  for(const subject of testSubjects){
    if(
      subject.hp<=0||
      !subject.weaponState||
      subject.combatMode!=='pistol'
    )continue;
    collectActorMuzzleFlashLights(subject,flashes,true);
  }
  for(const ally of squadAllies){
    if(ally.hp<=0||!ally.weaponState)continue;
    collectActorMuzzleFlashLights(ally,flashes,true);
  }
  return flashes;
}

function muzzleFlashPolygon(flash,scale=1,rays=84){
  const points=[{x:flash.x,y:flash.y}];

  for(let i=0;i<=rays;i++){
    const angle=-Math.PI+Math.PI*2*i/rays;
    const relative=normAngle(angle-flash.angle);

    // 뒤쪽도 꽤 밝지만 전방으로 조금 더 멀리 뻗는다.
    const forward=Math.max(0,Math.cos(relative));
    const side=Math.abs(Math.sin(relative));
    const shape=.72+forward*.48+side*.08;
    const wanted=flash.radius*scale*shape;

    // 벽을 통과하지 않는다.
    const distance=castVisionObstacleRay(
      flash.x,flash.y,angle,wanted
    );

    points.push({
      x:flash.x+Math.cos(angle)*distance,
      y:flash.y+Math.sin(angle)*distance
    });
  }

  return points;
}

function cutMuzzleFlashLight(light,flash){
  const intensity=flash.intensity;

  // 큰 방 전체가 순간적으로 드러나는 느낌을 3단계 광량으로 만든다.
  const outer=muzzleFlashPolygon(flash,1,92);
  const middle=muzzleFlashPolygon(flash,.68,76);
  const inner=muzzleFlashPolygon(flash,.34,60);

  light.globalAlpha=.46*intensity;
  cutPolygon(light,outer);

  light.globalAlpha=.72*intensity;
  cutPolygon(light,middle);

  light.globalAlpha=.96*intensity;
  cutPolygon(light,inner);
}

function cutPlasmaLanceLight(light,lance){
  // 플라즈마 줄기 자체가 아주 짧은 고휘도 광원이다. 잔상 전체를 광원으로
  // 취급하지 않고 백열 줄기가 보이는 첫 순간에만 주변 암막을 넓게 걷어낸다.
  const power=clamp(lance.power||0,0,1);
  const hotLife=.095+.035*power;
  const fade=Math.pow(clamp(1-lance.age/hotLife,0,1),1.35);
  if(fade<=0)return;
  const extension=smoothStep01(clamp(lance.age/.030,0,1));
  const visibleLength=lance.length*extension;
  if(visibleLength<=.5)return;
  const start=worldToScreen(lance.x,lance.y);
  const end=worldToScreen(
    lance.x+Math.cos(lance.angle)*visibleLength,
    lance.y+Math.sin(lance.angle)*visibleLength
  );
  light.save();
  const dx=end.x-start.x,dy=end.y-start.y;
  const length=Math.max(1,Math.hypot(dx,dy)),nx=-dy/length,ny=dx/length;
  light.fillStyle='#000';
  // Match the projectile's curved, pointed envelope. Every layer narrows to
  // the same muzzle and tip, instead of leaving a capsule-shaped light.
  for(let i=7;i>=0;i--){
    const width=(5+i*3.4)*(1+power*.48)*Math.sqrt(extension);
    const p=(q,w)=>({x:start.x+dx*q+nx*w,y:start.y+dy*q+ny*w});
    const a=p(.22,width*.42),b=p(.58,width),c=p(.68,width);
    const d=p(.84,width),e=p(.94,width*.16);
    const ar=p(.22,-width*.42),br=p(.58,-width),cr=p(.68,-width);
    const dr=p(.84,-width),er=p(.94,-width*.16);
    light.globalAlpha=fade*(i===0?.88:.15);
    light.beginPath();light.moveTo(start.x,start.y);
    light.bezierCurveTo(a.x,a.y,b.x,b.y,c.x,c.y);
    light.bezierCurveTo(d.x,d.y,e.x,e.y,end.x,end.y);
    light.bezierCurveTo(er.x,er.y,dr.x,dr.y,cr.x,cr.y);
    light.bezierCurveTo(br.x,br.y,ar.x,ar.y,start.x,start.y);
    light.closePath();light.fill();
  }
  light.restore();
}

function pointLitByMuzzleFlash(x,y,flashes){
  for(const flash of flashes){
    const dx=x-flash.x;
    const dy=y-flash.y;
    const distance=Math.hypot(dx,dy);
    if(distance>flash.radius*1.22)continue;
    if(lineBlocked(flash.x,flash.y,x,y))continue;

    const angle=Math.atan2(dy,dx);
    const relative=normAngle(angle-flash.angle);
    const forward=Math.max(0,Math.cos(relative));
    const side=Math.abs(Math.sin(relative));
    const shape=.72+forward*.48+side*.08;

    if(distance<=flash.radius*shape)return true;
  }
  return false;
}

function drawDarkness(polygon){
  const layer=drawDarkness.layer||(drawDarkness.layer=document.createElement('canvas'));
  if(layer.width!==W||layer.height!==H){
    layer.width=W;
    layer.height=H;
  }
  const light=layer.getContext('2d');
  light.imageSmoothingEnabled=false;
  light.clearRect(0,0,W,H);
  light.fillStyle=`rgba(2,3,5,${DARK_ALPHA})`;
  for(const zone of DARK_ZONES){
    const point=worldToScreen(zone.x,zone.y);
    light.fillRect(point.x,point.y,zone.w,zone.h);
  }

  light.globalCompositeOperation='destination-out';
  cutPolygon(light,polygon);

  const center=worldToScreen(player.x,player.y);
  light.beginPath();
  light.arc(center.x,center.y,NEAR_LIGHT_RADIUS,0,Math.PI*2);
  light.fill();

  // 고장 난 천장등은 대부분 꺼져 있다가 불규칙한 짧은 광량만 낸다.
  for(const fixture of brokenFixtures){
    const level=flickerLevel(fixture);
    if(level<=.02)continue;
    const point=worldToScreen(fixture.x,fixture.y);
    light.globalAlpha=level*.72;
    light.beginPath();
    light.arc(point.x,point.y,fixture.r,0,Math.PI*2);
    light.fill();
    light.globalAlpha=level*.55;
    light.beginPath();
    light.arc(point.x,point.y,fixture.r*.48,0,Math.PI*2);
    light.fill();
  }

  // 예광탄은 어두운 구역을 통과하는 동안 작은 이동 광원이 되며,
  // 지나간 궤적도 수명이 남아 있는 동안 약한 잔광을 낸다.
  for(const projectile of projectiles){
    if(projectile.ammoId!=='tracer')continue;
    const point=worldToScreen(projectile.x,projectile.y);
    light.globalAlpha=.72;
    light.beginPath();light.arc(point.x,point.y,34,0,Math.PI*2);light.fill();
  }
  for(const trace of shotTraces){
    if(!trace.tracerLight)continue;
    const a=trace.life/trace.maxLife;
    const from=worldToScreen(trace.x1,trace.y1),to=worldToScreen(trace.x2,trace.y2);
    light.globalAlpha=a*.26;
    light.strokeStyle='#000';light.lineWidth=18;
    light.beginPath();light.moveTo(from.x,from.y);light.lineTo(to.x,to.y);light.stroke();
  }

  // 총구 화염은 어둠을 짧게 걷어낸다.
  // 손전등처럼 오래 남지 않고 발사 순간에만 근처와 전방이 번쩍 드러난다.
  for(const flash of frameMuzzleFlashLights){
    cutMuzzleFlashLight(light,flash);
  }
  for(const lance of plasmaLances)cutPlasmaLanceLight(light,lance);

  light.globalAlpha=1;
  light.globalCompositeOperation='source-over';
  ctx.drawImage(layer,0,0);
}

// ===== 첫 무기: 20발 .22 LR 반자동권총 =====
function smoothStep01(value){
  const t=clamp(value,0,1);
  return t*t*(3-2*t);
}

function lerpPoint(from,to,amount){
  const t=smoothStep01(amount);
  return{
    x:from.x+(to.x-from.x)*t,
    y:from.y+(to.y-from.y)*t
  };
}

function shotSlideOffset(){
  const travel=currentWeaponDef().slideTravel;
  let offset=pistol.slideLocked?-travel:0;
  for(const cycle of pistol.shotCycles){
    const age=cycle.age;
    let cycleOffset=0;
    if(age<.018){
      cycleOffset=-travel*smoothStep01(age/.018);
    }else if(cycle.lastRound){
      cycleOffset=-travel;
    }else if(age<.052){
      cycleOffset=-travel;
    }else if(age<.088){
      cycleOffset=-travel*(1-smoothStep01((age-.052)/.036));
    }
    if(cycleOffset<offset)offset=cycleOffset;
  }
  return offset;
}

function dryFireKick(){
  if(pistol.dryFireElapsed>=.12)return 0;
  return Math.sin(clamp(pistol.dryFireElapsed/.12,0,1)*Math.PI);
}

function sprintAimRaise(){
  if(!['pistol','revolver','plasmaPistol'].includes(currentWeaponDef().id))return 0;
  return player.aimBlend;
}

function sharedGunSway(def,moveBlend,sprintBlend,ads,brace,bloom,movePhase,time,cyclePhase=0){
  const walk=moveBlend*def.moveSpread*(1-brace*.42);
  const sprint=sprintBlend*def.sprintSpread*(1-brace*.58);
  const adsStability=1-ads*.91;
  const base=def.accuracyBase*(1-ads*.90);
  const gait=Math.sin(movePhase*2.05+.35)*(walk+sprint)*adsStability;
  const lateral=Math.sin(movePhase*.93-1.1)*(walk*.42+sprint*.28)*adsStability;
  const breathing=Math.sin(time*2.15)*base;
  const recovery=Math.sin(time*17.5+cyclePhase)*bloom*(1-ads*.68);
  return gait+lateral+breathing+recovery;
}

function visibleGunSway(){
  const def=currentWeaponDef();
  if(pistol.reloading||magazinePickup.active)return 0;
  const brace=['pistol','revolver','plasmaPistol'].includes(def.id)?0:player.longGunBraceBlend;
  return sharedGunSway(
    def,player.moveBlend,player.sprintBlend,player.aimBlend,brace,
    pistol.accuracyBloom,player.movePhase,lightingTime,pistol.shotCycles.length*.8
  )*(1-player.aimBlend*.65);
}

function aimedMovementSpeed(sprinting=false){
  // 정조준 보행은 확실히 느려지고, 정조준 조깅도 평시 걷기보다 아주 조금만 빠르다.
  return PLAYER_SPEED*(sprinting?1.02:.68);
}

const adsCameraLeadByWeapon=Object.create(null);
try{
  const saved=JSON.parse(readPreference('lockdownAdsCameraByWeapon','{}'));
  for(const def of WEAPON_DEFS)if(Number.isFinite(saved?.[def.id]))adsCameraLeadByWeapon[def.id]=clamp(saved[def.id],0,220);
}catch{}
function currentAdsCameraLeadDistance(){return adsCameraLeadByWeapon[currentWeaponDef().id]??156;}
const WEAPON_ADS_CAMERA_MAX={pistol:110,revolver:110,plasmaPistol:110,
  smg:145,assaultRifle:180,lmg:180,battleRifle:220};
let adsCameraLeadNoticeUntil=0;
function adjustAdsCameraLead(delta){
  adsCameraLeadByWeapon[currentWeaponDef().id]=clamp(currentAdsCameraLeadDistance()+delta,0,220);
  savePreference('lockdownAdsCameraByWeapon',JSON.stringify(adsCameraLeadByWeapon));
  adsCameraLeadNoticeUntil=lightingTime+1.4;
}
function cameraAimLead(){
  // 완전 정조준 시 세로 화면을 기준으로 캐릭터가 반대편 가장자리 바로 안쪽에 남을 만큼
  // 시점을 크게 전진시킨다. 비조준 중앙감은 그대로 유지한다.
  // The wheel remains a shared 0–100% preference; each weapon has its own ceiling.
  const maximum=WEAPON_ADS_CAMERA_MAX[currentWeaponDef().id]??220;
  return 14+(currentAdsCameraLeadDistance()/220)*maximum*smoothStep01(player.aimBlend);
}

function playerCameraAimAngle(){
  // Follow the actor's stable aiming axis, excluding mouse jumps and recoil sway.
  return meleeState.active?player.bodyAngle:player.weaponAngle;
}
function aimedCameraTarget(){
  const angle=playerCameraAimAngle(),lead=cameraAimLead();
  return{
    x:clamp(player.x-W/2+Math.cos(angle)*lead,0,WORLD_W-W),
    y:clamp(player.y-H/2+Math.sin(angle)*lead,0,WORLD_H-H)
  };
}
function updatePlayerAimCamera(dt){
  const target=aimedCameraTarget(),follow=1-Math.exp(-dt*6.5);
  camera.x=clamp(camera.x+(target.x-camera.x)*follow,0,WORLD_W-W);
  camera.y=clamp(camera.y+(target.y-camera.y)*follow,0,WORLD_H-H);
}

function forwardStraightSightReach(angle=player.angle){
  const zoom=currentSandboxCameraZoom();
  const cx=Math.abs(Math.cos(angle)),sy=Math.abs(Math.sin(angle));
  const horizontal=cx>.0001?W*.5/(zoom*cx):Infinity;
  const vertical=sy>.0001?H*.5/(zoom*sy):Infinity;
  return cameraAimLead()+Math.min(horizontal,vertical);
}

function weaponWallFoldAngle(def){
  return ['pistol','revolver','plasmaPistol'].includes(def.id)?.82:1.22;
}

function weaponWallFoldSide(def){
  return ['pistol','revolver','plasmaPistol'].includes(def.id)?4.5:8.5;
}

function pistolPoseAt(progress){
  const def=currentWeaponDef();
  const handling=pistol.reloading||magazinePickup.active;
  const sidearm=['pistol','revolver','plasmaPistol'].includes(def.id);
  const longGunBrace=sidearm?0:player.longGunBraceBlend;
  const sprint=handling?0:player.sprintBlend*(1-longGunBrace);
  const movement=handling?0:player.moveBlend*(1-longGunBrace*.90);
  const step=Math.sin(player.movePhase)*movement;
  const stride=Math.cos(player.movePhase)*movement;
  const idle=Math.sin(lightingTime*1.45)*(1-movement);
  const dry=dryFireKick();
  const pistolSprint=sidearm?sprint:0;
  const ads=handling?0:player.aimBlend;
  // 모든 장총은 비조준 질주 중 총구가 왼쪽을 향하도록 대각선으로 눕혀 양손으로 붙든다.
  // RMB로 견착 가능한 무기는 조준이 올라오면 이 자세가 즉시 풀린다.
  const longGunSprint=!sidearm?sprint*(1-ads):0;
  const longGunBaseY=sidearm?0:
    (def.id==='smg'?5.0:(def.id==='battleRifle'?5.1:(def.id==='lmg'?5.4:(def.id==='shotgun'?3.0:4.0))));
  // 총열이 긴 만큼 회전축을 오른쪽으로 보정해 총 전체가 몸 중앙에 놓이게 한다.
  const longGunCarryY=def.id==='lmg'?11.2:(def.id==='battleRifle'?10.5:
    (def.id==='pumpShotgun'?10:(def.id==='shotgun'?6.5:4.2)));
  // 비조준 운반 자세는 달리기 흔들림을 그대로 둔다. 달리면서 정조준할 때만
  // 양손 견착이 회전·상하·앞뒤 흔들림을 흡수한다.
  const aimedSprint=player.sprintBlend*ads;
  const sprintMotionScale=1-aimedSprint*.78;
  const aimSteady=1-ads*.88;
  const sprintShot=pistolSprint*sprintAimRaise();
  const pistolLow=pistolSprint*(1-sprintAimRaise());
  const switchProgress=weaponSwitch.active
    ?clamp(weaponSwitch.elapsed/weaponSwitch.duration,0,1):1;
  const switchCommit=weaponSwitch.commitRatio||.46;
  const drawBlend=weaponSwitch.active
    ?(weaponSwitch.committed
      ?smoothStep01(clamp((switchProgress-switchCommit)/(1-switchCommit),0,1))
      :1-smoothStep01(clamp(switchProgress/switchCommit,0,1)))
    :1;
  // 총구가 마우스에 용접된 느낌을 없애되 실제 탄도에는 영향을 주지 않는
  // 작은 보행·호흡·반동 오프셋만 여기서 합성한다.
  return{
    progress,
    longGunSprint,
    turn:normAngle(player.weaponAngle-player.bodyAngle)+
      pistol.recoilYaw*(1-ads*.38)+visibleGunSway()*sprintMotionScale+dry*.006+
      pistolLow*.64-longGunSprint*1.22+(1-drawBlend)*.48-
      (player.weaponContactTurn||0)*weaponWallFoldAngle(def),
    gunX:def.gunX-pistolLow*11.5+(6-def.gunX)*longGunSprint+
      sprintShot*5.3+ads*1.1-pistol.recoil*1.45-
      Math.abs(step)*(.34+sprint*.72)*aimSteady*sprintMotionScale-
      dry*.18-(1-drawBlend)*14-(player.weaponContact||0),
    // 장총은 몸 중앙이 아니라 오른쪽 어깨선에서 견착한다.
    gunY:longGunBaseY+(longGunCarryY-longGunBaseY)*longGunSprint+
      idle*.18*(1-sprint)*aimSteady+
      (step*(.38+sprint*.72)+stride*sprint*.26)*aimSteady*sprintMotionScale+
      pistolLow*15+sprintShot*2.2+(1-drawBlend)*7+
      (player.weaponContactTurn||0)*weaponWallFoldSide(def)
  };
}

function snapshotCurrentWeaponPose(){
  const def=currentWeaponDef();
  const pose=pistolPoseAt(
    pistol.reloading?currentReloadProgress(def):0
  );
  let primaryHand=gunPoint(pose,def.primaryGrip.x,def.primaryGrip.y);
  let supportHand=gunPoint(
    pose,def.id==='battleRifle'?16.3:def.supportGrip.x,def.supportGrip.y
  );
  if(pose.longGunSprint>0){
    const supportX=def.id==='battleRifle'?16.3:
      (def.id==='smg'?5.5:(def.id==='shotgun'?6.5:10));
    primaryHand=lerpPoint(primaryHand,gunPoint(pose,-3.5,1.5),pose.longGunSprint);
    supportHand=lerpPoint(supportHand,gunPoint(pose,supportX,-1.5),pose.longGunSprint);
  }else if(['pistol','revolver','plasmaPistol'].includes(def.id)&&player.sprintBlend>0){
    const pump=Math.sin(player.movePhase+Math.PI);
    const sprintHand={x:-5+pump*4,y:-9.5};
    supportHand=lerpPoint(supportHand,sprintHand,smoothStep01(player.sprintBlend));
  }
  return{
    gunX:pose.gunX,gunY:pose.gunY,turn:pose.turn,
    primaryHand,supportHand
  };
}

function gunPoint(pose,x,y){
  const cos=Math.cos(pose.turn);
  const sin=Math.sin(pose.turn);
  return{
    x:pose.gunX+x*cos-y*sin,
    y:pose.gunY+x*sin+y*cos
  };
}

function magazineRoundCount(magazine){
  return magazine?magazine.rounds.length:0;
}

function currentWeaponDef(){
  return WEAPON_BY_ID[pistol.weaponId];
}

function toggleCurrentFireMode(){
  const def=currentWeaponDef();
  if(
    !def.fireModes||def.fireModes.length<2||
    pistol.reloading||weaponSwitch.active||magazinePickup.active
  )return false;
  const current=Math.max(0,def.fireModes.indexOf(pistol.fireMode));
  pistol.fireMode=def.fireModes[(current+1)%def.fireModes.length];
  pistol.burstHeldShots=0;
  // 누른 채 전환했을 때 새 모드가 곧바로 발사되는 것을 막는다.
  mouse.down=false;
  return true;
}

function currentModeAllowsHeldFire(){
  if(!mouse.down)return false;
  if(pistol.fireMode==='AUTO')return true;
  if(pistol.fireMode==='BURST')return (pistol.burstHeldShots||0)<3;
  return false;
}

function workbenchWeaponDef(){
  return WEAPON_DEFS[inventory.selectedWeapon]||WEAPON_DEFS[0];
}

function workbenchWeaponState(){
  // 작업대/인벤토리도 원형 정의가 아니라 실제 소유 중인 인스턴스를 읽는다.
  // 특히 보조무기 플라즈마 권총의 H2는 발사 때 이 인스턴스에서 빠진다.
  return ownedWeaponState(workbenchWeaponDef().id);
}

function compatibleInventoryMagazines(def=workbenchWeaponDef()){
  if(!availableWeaponIds.has(def.id))return[];
  if(def.detachableMagazine===false&&!['revolver','pumpShotgun'].includes(def.id))return[];
  // 같은 규격 안에서는 실탄이 든 탄창을 먼저, 완전히 빈 탄창을 항상 맨 아래에 둔다.
  return inventory.magazines
    .filter(magazine=>magazine.magazineType===def.magazineType)
    .sort((a,b)=>Number(a.rounds.length===0)-Number(b.rounds.length===0));
}

function compatibleWorkbenchAmmo(def=workbenchWeaponDef()){
  if(['pistol','revolver','smg'].includes(def.id)){
    return AMMO_TYPES.filter(ammo=>['standard','tracer','shot'].includes(ammo.id));
  }
  if(['shotgun','pumpShotgun'].includes(def.id))return[AMMO_BY_ID.buckshot];
  if(def.id==='battleRifle')return[AMMO_BY_ID.rifle762];
  if(def.id==='assaultRifle'||def.id==='lmg')return[AMMO_BY_ID.rifle556];
  return[];
}

function ensureWorkbenchAmmoSelection(def=workbenchWeaponDef()){
  const compatible=compatibleWorkbenchAmmo(def);
  if(!compatible.length)return null;
  const selected=AMMO_TYPES[inventory.selectedAmmo];
  if(!compatible.includes(selected)){
    inventory.selectedAmmo=AMMO_TYPES.indexOf(compatible[0]);
  }
  return AMMO_TYPES[inventory.selectedAmmo];
}

function currentRoundCount(){
  if(currentWeaponDef().plasma)return pistol.hydrogen||0;
  return magazineRoundCount(pistol.magazine)+(pistol.chamberRound?1:0);
}

function currentReloadDuration(def=currentWeaponDef()){
  if(def.plasma)return def.reloadTime;
  if(def.id==='pumpShotgun')return pistol.pumpReloadUseSpeedloader?.96:.78;
  // 기관단총의 빈 총 장전은 탄창 삽입 뒤 노리쇠 조작과 재파지 시간이 더 든다.
  return def.reloadTime+(
    pistol.reloadWasEmpty&&def.id==='smg'?.52:0
  );
}

function currentReloadProgress(def=currentWeaponDef()){
  if(!pistol.reloading)return 0;
  if(def.plasma)return clamp(pistol.reloadElapsed/.28,0,.82);
  if(def.id==='pumpShotgun')return clamp(pistol.reloadElapsed/currentReloadDuration(def),0,1);
  const base=def.reloadTime;
  if(!(pistol.reloadWasEmpty&&def.id==='smg')){
    return clamp(pistol.reloadElapsed/base,0,1);
  }
  // 탄창 삽입(68%)까지의 실제 시간은 유지하고, 그 뒤 노리쇠 구간만 늘린다.
  const insertTime=base*.68;
  if(pistol.reloadElapsed<=insertTime){
    return clamp(pistol.reloadElapsed/insertTime*.68,0,.68);
  }
  const duration=currentReloadDuration(def);
  return clamp(
    .68+(pistol.reloadElapsed-insertTime)/(duration-insertTime)*.32,
    .68,1
  );
}

function feedChamberFromMagazine(){
  if(pistol.chamberRound||!pistol.magazine||pistol.magazine.rounds.length===0){
    return false;
  }
  pistol.chamberRound=pistol.magazine.rounds.pop();
  pistol.slideLocked=false;
  return true;
}

function selectedInventoryMagazine(def=workbenchWeaponDef()){
  const magazines=compatibleInventoryMagazines(def);
  if(magazines.length===0)return null;
  const key=def.magazineType;
  inventory.selectedMagazineByType[key]=clamp(
    inventory.selectedMagazineByType[key]||0,0,magazines.length-1
  );
  return magazines[inventory.selectedMagazineByType[key]]||null;
}

function startReload(useSpeedloader=false){
  if(pistolMelee.attack||smgMelee.attack||rifleMelee.attack||
    shotgunMelee.attack||shotgunMelee.recovery>0)return false;
  const def=currentWeaponDef();
  if(def.plasma){
    if(inventory.open||magazinePickup.active||weaponSwitch.active||pistol.reloading||
      pistol.thermalLock>0||pistol.hydrogen>=pistol.hydrogenCapacity||pistol.hydrogenReserve<=0
    )return false;
    pistol.reloadEntryPose=snapshotCurrentWeaponPose();
    pistol.reloadExitPose=null;pistol.reloadExitElapsed=0;
    pistol.reloading=true;pistol.hydrogenFilling=true;
    pistol.hydrogenFillAccumulator=0;
    pistol.hydrogenTankSwap=0;
    pistol.reloadElapsed=0;pistol.reloadCommitted=false;
    pistol.reloadWasEmpty=pistol.hydrogen===0;
    mouse.down=false;mouse.aim=false;player.aimBlend=0;
    return true;
  }
  if(def.id==='revolver'){
    // 문클립은 탄창처럼 순서대로 보관한다. 첫 번째 실탄 클립을 통째로 교체한다.
    const replacement=compatibleInventoryMagazines(def).find(clip=>clip.rounds.length>0);
    if(
      inventory.open||magazinePickup.active||weaponSwitch.active||pistol.reloading||
      currentRoundCount()>=10||!replacement
    )return false;
    pistol.reloadEntryPose=snapshotCurrentWeaponPose();
    pistol.reloadExitPose=null;
    pistol.reloadExitElapsed=0;
    pistol.reloading=true;
    pistol.reloadElapsed=0;
    pistol.reloadCommitted=false;
    pistol.reloadDiscarded=false;
    pistol.reloadWasEmpty=currentRoundCount()===0;
    pistol.reloadMagazine=replacement;
    pistol.reloadRetainedMagazine=pistol.magazine;
    pistol.reloadShellsTarget=replacement.rounds.length;
    pistol.reloadShellsLoaded=0;
    pistol.reloadShellsEjected=false;
    mouse.down=false;mouse.aim=false;player.aimBlend=0;
    return true;
  }
  if(def.id==='pumpShotgun'){
    if(
      inventory.open||magazinePickup.active||weaponSwitch.active||
      pistol.reloading||pistol.pumpActive
    )return false;
    // 약실이 비고 튜브에 탄이 있으면 새 탄을 넣지 않고 먼저 펌프질해 급탄한다.
    if(!pistol.chamberRound&&pistol.magazine&&pistol.magazine.rounds.length>0){
      pistol.pumpActive=true;
      pistol.pumpElapsed=0;
      pistol.pumpEjected=false;
      mouse.down=false;mouse.aim=false;player.aimBlend=0;player.longGunBraceBlend=0;
      return true;
    }
    const speedloader=useSpeedloader
      ?compatibleInventoryMagazines(def).find(loader=>loader.rounds.length>0)
      :null;
    if(useSpeedloader&&!speedloader)return false;
    // 일반 R은 한 발, Shift+R은 5발 튜브 스피드로더를 사용한다.
    // 완전히 빈 총도 먼저 튜브에 넣은 뒤 아래에서 한 차례 펌프질해 약실로 올린다.
    const tubeFull=pistol.magazine&&pistol.magazine.rounds.length>=5;
    if((!speedloader&&inventory.loose.buckshot<=0)||tubeFull)return false;
    pistol.reloadEntryPose=snapshotCurrentWeaponPose();
    pistol.reloadExitPose=null;
    pistol.reloadExitElapsed=0;
    pistol.reloading=true;
    pistol.reloadElapsed=0;
    pistol.reloadCommitted=false;
    pistol.reloadDiscarded=false;
    pistol.reloadWasEmpty=currentRoundCount()===0;
    pistol.reloadKeepMagazine=false;
    pistol.reloadRetainedMagazine=null;
    pistol.reloadMagazine=null;
    pistol.pumpReloadUseSpeedloader=!!speedloader;
    pistol.pumpReloadSpeedloader=speedloader;
    pistol.pumpAfterReload=!pistol.chamberRound;
    pistol.reloadShellsTarget=speedloader
      ?Math.min(5-pistol.magazine.rounds.length,speedloader.rounds.length)
      :1;
    pistol.reloadShellsLoaded=0;
    mouse.down=false;mouse.aim=false;player.aimBlend=0;player.longGunBraceBlend=0;
    return true;
  }
  if(def.id==='shotgun'){
    if(
      inventory.open||magazinePickup.active||weaponSwitch.active||
      pistol.reloading||currentRoundCount()>=2||inventory.loose.buckshot<=0
    )return false;
    pistol.reloadEntryPose=snapshotCurrentWeaponPose();
    pistol.reloadExitPose=null;
    pistol.reloadExitElapsed=0;
    pistol.reloading=true;
    pistol.reloadElapsed=0;
    pistol.reloadCommitted=false;
    pistol.reloadDiscarded=false;
    pistol.reloadWasEmpty=currentRoundCount()===0;
    pistol.reloadKeepMagazine=false;
    pistol.reloadRetainedMagazine=null;
    pistol.reloadMagazine=null;
    pistol.reloadShellsTarget=Math.min(
      2-currentRoundCount(),inventory.loose.buckshot
    );
    pistol.reloadShellsLoaded=0;
    pistol.reloadShellsEjected=false;
    mouse.down=false;
    mouse.aim=false;
    player.aimBlend=0;
    player.longGunBraceBlend=0;
    return true;
  }
  // 전투 재장전은 선택 커서가 빈 탄창에 있어도 다음 실탄 탄창을 자동으로 찾는다.
  const replacement=compatibleInventoryMagazines(def)
    .find(magazine=>magazine.rounds.length>0)||null;
  if(
    inventory.open||magazinePickup.active||weaponSwitch.active||pistol.reloading||
    !replacement||replacement.rounds.length===0
  )return false;
  pistol.reloadEntryPose=snapshotCurrentWeaponPose();
  pistol.reloadExitPose=null;
  pistol.reloadExitElapsed=0;
  pistol.reloading=true;
  pistol.reloadElapsed=0;
  pistol.reloadCommitted=false;
  pistol.reloadDiscarded=false;
  pistol.reloadWasEmpty=!pistol.chamberRound;
  pistol.reloadKeepMagazine=false;
  pistol.reloadRetainedMagazine=null;
  pistol.reloadMagazine=replacement;
  // 재장전은 사격·정조준 견착을 끊고 모든 무기에 같은 이동 페널티를 준다.
  mouse.down=false;
  mouse.aim=false;
  player.aimBlend=0;
  player.longGunBraceBlend=0;
  return true;
}

function ejectShotgunShells(){
  if(pistol.reloadShellsEjected)return;
  const def=currentWeaponDef();
  const pose=pistolPoseAt(currentReloadProgress(def));
  const barrelAngle=player.bodyAngle+pose.turn;
  const ux=Math.cos(barrelAngle);
  const uy=Math.sin(barrelAngle);
  const spentBarrels=[0,1].filter(i=>pistol.shotgunFiredMask&(1<<i));
  for(const i of spentBarrels){
    const lastShot=pistol.barrelLastShotAt?.[i];
    if(Number.isFinite(lastShot)&&lightingTime-lastShot<4){
      startDoubleBarrelSmoke(player,pistol,i,true,Math.max(.15,1-(lightingTime-lastShot)/4));
    }
    // 두 탄피는 열린 쌍약실의 실제 입구에서 시작해 총열 축의 뒤쪽으로 튀어나온다.
    // 옆면 한 점에서 생성해 측면으로 미끄러지던 기존 표현을 쓰지 않는다.
    const chamberLocal=gunPoint(pose,8,(i===0?-3.8:1.3)+SHOTGUN_BARREL_THICKNESS/2);
    const bodyCos=Math.cos(player.bodyAngle),bodySin=Math.sin(player.bodyAngle);
    const chamberX=player.x+chamberLocal.x*bodyCos-chamberLocal.y*bodySin;
    const chamberY=player.y+chamberLocal.x*bodySin+chamberLocal.y*bodyCos;
    const ejectSpeed=96+Math.random()*24;
    const spread=(i===0?-1:1)*(2+Math.random()*2);
    const sideX=-uy,sideY=ux;
    ejectedCasings.push({
      x:chamberX,
      y:chamberY,
      vx:-ux*ejectSpeed+sideX*spread,
      vy:-uy*ejectSpeed+sideY*spread,
      angle:barrelAngle+(i===0?-.04:.04),
      spin:(i?1:-1)*(12+Math.random()*8),
      shell:true,color:'#a83d31',settled:false,aboveWeapon:true
    });
  }
  pistol.shotgunSpent=0;
  pistol.reloadShellsEjected=true;
}

function loadShotgunShell(){
  if(
    pistol.reloadShellsLoaded>=pistol.reloadShellsTarget||
    inventory.loose.buckshot<=0
  )return false;
  inventory.loose.buckshot--;
  if(!pistol.chamberRound)pistol.chamberRound='buckshot';
  else pistol.magazine.rounds.push('buckshot');
  pistol.reloadShellsLoaded++;
  return true;
}

function ejectRevolverCases(){
  if(pistol.reloadShellsEjected)return;
  const retained=pistol.reloadRetainedMagazine||pistol.magazine;
  if(pistol.chamberRound&&retained&&retained.rounds.length<retained.capacity){
    retained.rounds.push(pistol.chamberRound);
  }
  // 교환한 문클립은 실탄까지 모두 빼서 느슨한 탄으로 회수하고 빈 클립만 보관한다.
  if(retained){
    for(const ammoId of retained.rounds){
      inventory.loose[ammoId]=(inventory.loose[ammoId]||0)+1;
    }
    retained.rounds.length=0;
  }
  const spentCount=10;
  pistol.chamberRound=null;
  pistol.magazine=null;
  const pose=pistolPoseAt(currentReloadProgress());
  const angle=player.bodyAngle+pose.turn;
  // 열 개 약실의 실탄과 탄피가 추출봉에 밀려 한 덩어리로 쏟아진다.
  for(let i=0;i<spentCount;i++){
    const fan=(i-4.5)*.18;
    ejectedCasings.push({
      x:player.x+Math.cos(angle)*7-Math.sin(angle)*4,
      y:player.y+Math.sin(angle)*7+Math.cos(angle)*4,
      vx:Math.cos(angle+Math.PI+fan)*(42+Math.random()*24),
      vy:Math.sin(angle+Math.PI+fan)*(42+Math.random()*24),
      angle:angle+fan,spin:(i%2?1:-1)*(8+Math.random()*7),
      shell:false,settled:false
    });
  }
  pistol.reloadShellsEjected=true;
}

function commitRevolverMoonClip(){
  if(pistol.reloadCommitted)return;
  const incoming=pistol.reloadMagazine;
  if(!incoming){
    pistol.reloadCommitted=true;
    return;
  }
  const index=inventory.magazines.indexOf(incoming);
  if(index>=0){
    inventory.magazines.splice(index,1);
    if(pistol.reloadRetainedMagazine){
      // 사용한 문클립은 바닥에 버리지 않고 들어온 클립의 자리에 그대로 보관한다.
      inventory.magazines.splice(index,0,pistol.reloadRetainedMagazine);
    }
  }
  pistol.magazine=incoming;
  pistol.chamberRound=incoming.rounds.length?incoming.rounds.pop():null;
  pistol.reloadShellsLoaded=currentRoundCount();
  pistol.reloadCommitted=true;
  pistol.slideLocked=false;
}

function discardMagazine(){
  if(pistol.reloadDiscarded)return;
  if(pistol.reloadKeepMagazine){
    // 인벤토리 교환은 탄창 멈치를 누른 뒤 왼손으로 받아 보관한다.
    pistol.reloadRetainedMagazine=pistol.magazine;
    pistol.magazine=null;
    pistol.reloadDiscarded=true;
    return;
  }
  const def=currentWeaponDef();
  const ux=Math.cos(player.bodyAngle);
  const uy=Math.sin(player.bodyAngle);
  const progress=currentReloadProgress(def);
  const pose=pistolPoseAt(progress);
  const local=gunPoint(pose,def.magazineWell.x,def.magazineWell.y);
  const worldX=player.x+local.x*ux-local.y*uy;
  const worldY=player.y+local.x*uy+local.y*ux;
  const ejectAngle=player.bodyAngle+pose.turn+Math.PI/2;
  const ejectX=Math.cos(ejectAngle);
  const ejectY=Math.sin(ejectAngle);
  if(pistol.magazine){
    droppedMagazines.push({
      x:worldX,
      y:worldY,
      vx:-ux*10+ejectX*42,
      vy:-uy*10+ejectY*42,
      angle:player.bodyAngle+pose.turn+.35,
      spin:5.5,
      magazine:pistol.magazine,
      settled:false
    });
    // Recoverable magazines retain their remaining rounds until picked up or reset.
  }
  pistol.magazine=null;
  pistol.reloadDiscarded=true;
}

function commitReload(){
  if(pistol.reloadCommitted)return;
  const magazine=pistol.reloadMagazine;
  const index=inventory.magazines.indexOf(magazine);
  if(index>=0){
    const def=currentWeaponDef();
    inventory.magazines.splice(index,1);
    if(pistol.reloadKeepMagazine&&pistol.reloadRetainedMagazine){
      // 들어온 탄창이 있던 자리에 기존 탄창을 넣어 순서까지 보존한다.
      inventory.magazines.splice(index,0,pistol.reloadRetainedMagazine);
    }
    pistol.magazine=magazine;
    const compatible=compatibleInventoryMagazines(def);
    const retainedIndex=compatible.indexOf(pistol.reloadRetainedMagazine);
    inventory.selectedMagazineByType[def.magazineType]=retainedIndex>=0
      ?retainedIndex
      :clamp(
        inventory.selectedMagazineByType[def.magazineType]||0,0,
        Math.max(0,compatible.length-1)
      );
  }
  pistol.reloadCommitted=true;
}

function ejectCasing(cycle){
  const ux=Math.cos(cycle.visualAngle);
  const uy=Math.sin(cycle.visualAngle);
  const sideX=-uy;
  const sideY=ux;
  const sideSpeed=92+Math.random()*42;
  const forwardSpeed=18+Math.random()*26;
  ejectedCasings.push({
    x:cycle.x+ux*20+sideX*2,
    y:cycle.y+uy*20+sideY*2,
    vx:ux*forwardSpeed+sideX*sideSpeed,
    vy:uy*forwardSpeed+sideY*sideSpeed,
    angle:cycle.visualAngle+(Math.random()-.5),
    spin:(Math.random()>.5?1:-1)*(14+Math.random()*12),
    // .22 LR 산탄도 케이스 규격은 .22 LR이다. 12게이지 벅샷만 큰 셸로 배출한다.
    shell:cycle.ammoId==='buckshot',
    rifle:cycle.ammoId==='rifle762'||cycle.ammoId==='rifle556',
    ammoId:cycle.ammoId,
    color:cycle.ammoId==='buckshot'?'#a83d31':undefined,
    settled:false
  });
  if(ejectedCasings.length>240)ejectedCasings.shift();
}

let impactShotSerial=0;
// Opaque rows of the supplied PNG, transformed by the same circle pivot and 1/3 scale as drawing.
const HEAD_ALPHA_ROWS=[[45,45],[44,46],[43,47],[42,48],[39,51],[36,54],[35,55],[34,56],[33,57],
  [32,58],[32,58],[31,59],[31,59],[31,59],...Array.from({length:10},()=>[30,60]),
  [31,59],[31,59],[31,59],[32,58],[33,57],[34,56],[35,55],[36,54],[37,53],[39,51],[42,48]];
const HEAD_IMPACT_RECTS=HEAD_ALPHA_ROWS.map(([left,right],i)=>({
  x:(65.5-(46+i+1))/3,y:(left-45.5)/3,w:1/3,h:(right-left+1)/3
}));
function renderedHeadCenter(actor){
  const lean=actor.simulationEnemy?(buildActorMagazinePickupPose(actor,actor.magazinePickup)?.bodyLean||0):0;
  const ca=Math.cos(actor.bodyAngle||0),sa=Math.sin(actor.bodyAngle||0);
  const point=worldToScreen(actor.x+ca*lean,actor.y+sa*lean);
  const flinch=meleeDummies.includes(actor)?stoppingFlinchOffset(actor):0;
  return{x:Math.round(point.x)+camera.x+ca*flinch,y:Math.round(point.y)+camera.y+sa*flinch};
}
function aimedHeadRayDistance(x,y,ux,uy,actor){
  const center=renderedHeadCenter(actor),dx=x-center.x,dy=y-center.y;
  const ca=Math.cos(actor.headAngle||0),sa=Math.sin(actor.headAngle||0);
  let result=Infinity;
  for(const rect of HEAD_IMPACT_RECTS)result=Math.min(result,
    rayRectDistance(dx*ca+dy*sa,-dx*sa+dy*ca,ux*ca+uy*sa,-ux*sa+uy*ca,rect,Infinity));
  return result;
}
function firearmImpactIntent(owner,def,pellets=1){
  const intent={id:++impactShotSerial,target:null,bonus:(def?.stoppingPowerBonus||0)/pellets};
  if(owner!=='player')return intent;
  const point=screenToWorld(mouse.x,mouse.y);
  let nearest=Infinity;
  for(const actor of meleeDummies){
    if(actor.hp<=0||aimedHeadRayDistance(point.x,point.y,1,0,actor)!==0)continue;
    const d=Math.hypot(point.x-actor.x,point.y-actor.y);
    if(d<nearest){nearest=d;intent.target=actor;}
  }
  return intent;
}
function enemyToughness(actor,head=false){
  const body=actor.toughness||actor.enemyType?.toughness||100;
  return head?body/4:body;
}
function applyStoppingImpact(actor,projectile){
  if(actor.hp<=0)return;
  const groups=actor.stoppingGroups||(actor.stoppingGroups=new Map());
  for(const [key,g] of groups)if(lightingTime-g.start>STOPPING_POWER_BALANCE.pelletGroupWindow)groups.delete(key);
  const head=!!projectile.headshot,key=projectile.shotId+':'+(head?'head':'body');
  let group=groups.get(key);
  if(!group){group={start:lightingTime,power:0};groups.set(key,group);}
  group.power+=projectile.stoppingPower||0;
  const duration=projectile.plasma?STOPPING_POWER_BALANCE.plasmaSeconds:
    stoppingDisableDuration(group.power,enemyToughness(actor,head));
  if((duration>0||(actor.disabledUntil||0)>lightingTime)&&Number.isFinite(projectile.angle)){
    // One capped impulse budget per shot, so pellets do not launch an actor away.
    const impulse=Math.min(60,group.power*.12);
    const added=Math.max(0,impulse-(group.staggerImpulse||0));
    group.staggerImpulse=impulse;
    actor.pushVelocityX=(actor.pushVelocityX||0)+Math.cos(projectile.angle)*added;
    actor.pushVelocityY=(actor.pushVelocityY||0)+Math.sin(projectile.angle)*added;
    const speed=Math.hypot(actor.pushVelocityX,actor.pushVelocityY);
    if(speed>80){actor.pushVelocityX*=80/speed;actor.pushVelocityY*=80/speed;}
    actor.staggerAngle=projectile.angle;
    actor.disabledHitAt=lightingTime;
  }
  if(!duration)return;
  actor.disabledUntil=Math.max(actor.disabledUntil||0,lightingTime+duration);
  actor.disabledHitAt=lightingTime;
  actor.meleeAttack=null;actor.pistolMeleeAttack=null;actor.meleeComboQueued=null;actor.meleeComboPlan=[];
  if(actor.magazinePickup?.active)cancelSimulationEnemyMagazinePickup(actor);
}
function fireProjectile(muzzleX,muzzleY,angle,ammo,range,owner='player',sourceRef=null,intent=null){
  // 발사 순간 판정을 끝내지 않고 실제 월드 좌표를 가진 탄환을 생성한다.
  const projectile=projectilePool.pop()||{};
  Object.assign(projectile,{
    x:muzzleX,y:muzzleY,angle,owner,sourceRef:sourceRef||(owner==='player'?player:null),ammoId:ammo.id,
    speed:ammo.projectileSpeed,remaining:range,
    size:ammo.projectileSize,tail:ammo.projectileTail,
    shotId:intent?.id||++impactShotSerial,headTarget:intent?.target||null,headshot:false,
    stoppingPower:(ammo.stoppingPower||0)+(intent?.bonus||0)
  });
  projectiles.push(projectile);
  if(projectiles.length>320)recycleProjectile(projectiles.shift());
}

function recycleProjectile(projectile){
  if(!projectile)return;
  projectile.sourceRef=null;
  projectile.headTarget=null;projectile.headshot=false;
  if(projectilePool.length<360)projectilePool.push(projectile);
}

function damageGuardFromProjectile(subject,projectile,x,y){
  const ammo=AMMO_BY_ID[projectile.ammoId]||AMMO_BY_ID.standard;
  const damage=ammo.damage*(projectile.headshot?2:1);
  if(meleeDummies.includes(subject)){
    // 총탄도 맞은 진행 방향으로 아주 약한 충격량을 남긴다.
    // 산탄은 여러 펠릿이 합산되므로 개별 펠릿의 힘은 훨씬 작게 둔다.
    const bulletKnockback=ammo.id==='buckshot'?3.5:ammo.id==='shot'?4:18;
    subject.pushVelocityX+=Math.cos(projectile.angle)*bulletKnockback;
    subject.pushVelocityY+=Math.sin(projectile.angle)*bulletKnockback;
    const baseBlood=ammo.id==='buckshot'?2:
      (ammo.id==='shot'?3:(ammo.id==='rifle762'?9:(ammo.id==='rifle556'?7:6)));
    const bloodCount=subject.hp<=damage?Math.ceil(baseBlood*2.2):baseBlood;
    damageMeleeDummy(damage,projectile.angle,x,y,bloodCount,'firearm',subject,null,projectile.headshot);
    applyStoppingImpact(subject,projectile);
    return;
  }
  const wasAlive=subject.hp>0;
  subject.hp=Math.max(0,subject.hp-ammo.damage);
  subject.hitFlash=.16;

  const attacker=projectile.sourceRef||
    (projectile.owner==='player'?player:null);

  // 플레이어나 조력자에게 맞으면 실제 발사자를 보복 대상으로 잠근다.
  // 이미 살아 있는 보복 대상이 있으면 다른 공격자에게 맞아도 락은 유지한다.
  if(wasAlive&&attacker&&(attacker===player||attacker.isAlly)){
    const priorRevenge=subject.revengeTargetRef;
    tryLockRetaliation(subject,attacker);
    if(!actorAlive(priorRevenge)&&subject.revengeTargetRef===attacker){
      speakCombatLine(subject,'retaliation','yell',.62);
    }else{
      speakCombatLine(subject,'hurt','yell',.16);
    }
    subject.targetRef=subject.revengeTargetRef||attacker;
    const focus=subject.targetRef;
    subject.hasSeen=true;
    subject.lastSeenX=focus.x;
    subject.lastSeenY=focus.y;
    subject.lostSight=0;
    subject.alertedByHit=true;

    subject.heardX=null;
    subject.heardY=null;
    subject.heardTimer=0;
    subject.heardKind=null;

    const attackerAngle=Math.atan2(
      focus.y-subject.y,
      focus.x-subject.x
    );
    subject.angle=normAngle(
      subject.angle+
      normAngle(attackerAngle-subject.angle)*.82
    );
    subject.aimAngle=attackerAngle;
  }

  subject.stagger=.42;
  subject.state='stagger';
  subject.stateTime=0;
  subject.aimTime=0;
  subject.aimStableTime=0;
  subject.lockedShot=null;
  const baseBlood=ammo.id==='buckshot'?2:
    (ammo.id==='shot'?3:(ammo.id==='rifle762'?9:(ammo.id==='rifle556'?7:6)));
  spawnBlood(subject,x,y,projectile.angle,subject.hp<=0?Math.ceil(baseBlood*2.2):baseBlood,'firearm');
  if(wasAlive&&subject.hp<=0)killGuard(subject,projectile.angle);
}

function activeLongswordBulletSweep(){
  if(!meleeState.active||meleeState.weapon!=='longsword')return null;
  const parrying=longswordState.parry&&longswordState.parryWindow>0;
  const swingProgress=longswordState.duration>0?longswordAttackPhase():0;
  const swinging=longswordState.attack&&swingProgress>=.045&&swingProgress<=.48;
  if(!parrying&&!swinging)return null;
  const current=longswordWorldBlade(longswordIdlePose());
  const previous=(parrying?longswordState.parryPreviousBlade:longswordState.previousBlade)||current;
  return{current,previous,parrying,swinging};
}

function raySweptLongswordDistance(x,y,ux,uy,maxDistance,sweep){
  if(!sweep)return Infinity;
  const travel=Math.max(
    Math.hypot(sweep.current.base.x-sweep.previous.base.x,sweep.current.base.y-sweep.previous.base.y),
    Math.hypot(sweep.current.tip.x-sweep.previous.tip.x,sweep.current.tip.y-sweep.previous.tip.y)
  );
  const motionSteps=Math.max(1,Math.ceil(travel/2.2));
  const bladeLength=Math.hypot(
    sweep.current.tip.x-sweep.current.base.x,sweep.current.tip.y-sweep.current.base.y
  );
  const bladeSteps=Math.max(3,Math.ceil(bladeLength/2));
  let nearest=Infinity;
  for(let m=0;m<=motionSteps;m++){
    const mt=m/motionSteps;
    const base=lerpPoint(sweep.previous.base,sweep.current.base,mt);
    const tip=lerpPoint(sweep.previous.tip,sweep.current.tip,mt);
    for(let s=1;s<=bladeSteps;s++){
      const point=lerpPoint(base,tip,s/bladeSteps);
      const hit=rayCircleDistance(x,y,ux,uy,point.x,point.y,2.45,maxDistance);
      if(hit<nearest)nearest=hit;
    }
  }
  return nearest;
}

function spawnSwordRicochet(projectile,x,y,blade){
  const bladeAngle=Math.atan2(blade.tip.y-blade.base.y,blade.tip.x-blade.base.x);
  const nx=-Math.sin(bladeAngle),ny=Math.cos(bladeAngle);
  const ix=Math.cos(projectile.angle),iy=Math.sin(projectile.angle);
  const dot=ix*nx+iy*ny;
  let rx=ix-2*dot*nx,ry=iy-2*dot*ny;
  const scatter=(Math.random()-.5)*.48;
  const ca=Math.cos(scatter),sa=Math.sin(scatter);
  const tx=rx*ca-ry*sa;ry=rx*sa+ry*ca;rx=tx;
  const speed=150+Math.random()*155;
  deflectedBullets.push({x,y,vx:rx*speed,vy:ry*speed,
    angle:Math.atan2(ry,rx),spin:(Math.random()>.5?1:-1)*(18+Math.random()*22),
    age:0,life:.28+Math.random()*.16,ammoId:projectile.ammoId});
  if(deflectedBullets.length>100)deflectedBullets.shift();
  bulletImpacts.push({x,y,life:.11,maxLife:.11,target:false,color:'238,221,158'});
  if(bulletImpacts.length>180)bulletImpacts.shift();
}

const COMBAT_SPATIAL_CELL=128;
const combatSubjectGrid=new Map();
function rebuildCombatSpatialHash(){
  combatSubjectGrid.clear();
  for(const subject of testSubjects){
    if(!actorCanReceiveHit(subject))continue;
    const key=`${Math.floor(subject.x/COMBAT_SPATIAL_CELL)},${Math.floor(subject.y/COMBAT_SPATIAL_CELL)}`;
    let bucket=combatSubjectGrid.get(key);
    if(!bucket){bucket=[];combatSubjectGrid.set(key,bucket);}
    bucket.push(subject);
  }
}
function combatSubjectsAlongSegment(x1,y1,x2,y2,padding=24){
  const minX=Math.floor((Math.min(x1,x2)-padding)/COMBAT_SPATIAL_CELL);
  const maxX=Math.floor((Math.max(x1,x2)+padding)/COMBAT_SPATIAL_CELL);
  const minY=Math.floor((Math.min(y1,y2)-padding)/COMBAT_SPATIAL_CELL);
  const maxY=Math.floor((Math.max(y1,y2)+padding)/COMBAT_SPATIAL_CELL);
  const result=[],seen=new Set();
  for(let cy=minY;cy<=maxY;cy++)for(let cx=minX;cx<=maxX;cx++){
    const bucket=combatSubjectGrid.get(`${cx},${cy}`);
    if(!bucket)continue;
    for(const subject of bucket)if(!seen.has(subject)){seen.add(subject);result.push(subject);}
  }
  return result;
}

function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const projectile=projectiles[i];
    const ammo=AMMO_BY_ID[projectile.ammoId]||AMMO_BY_ID.standard;
    const step=Math.min(projectile.remaining,projectile.speed*dt);
    const ux=Math.cos(projectile.angle);
    const uy=Math.sin(projectile.angle);

    // A ray ending exactly on a wall used to look identical to an unobstructed ray.
    const obstacleDistance=castObstacleRay(projectile.x,projectile.y,projectile.angle,step+.01);
    const wallHit=obstacleDistance<=step+.00001;
    let distance=wallHit?Math.min(step,obstacleDistance):step;
    let target=null;
    let transmitterTarget=null;
    let swordDeflection=false;
    let swordSweep=null;

    if(projectile.owner!=='player'&&projectile.owner!=='ally'){
      swordSweep=activeLongswordBulletSweep();
      const swordHit=raySweptLongswordDistance(
        projectile.x,projectile.y,ux,uy,distance,swordSweep
      );
      if(swordHit<distance){distance=swordHit;swordDeflection=true;}
    }

    // 송신기도 벽/캐릭터와 동일하게 '가장 먼저 맞는 것'만 피격한다.
    const txHit=transmitterRayDistance(
      projectile.x,projectile.y,ux,uy,distance
    );
    if(txHit.target&&txHit.distance<distance){
      distance=txHit.distance;
      transmitterTarget=txHit.target;
      swordDeflection=false;
    }

    if(projectile.owner==='player'||projectile.owner==='ally'){
      const endX=projectile.x+ux*distance,endY=projectile.y+uy*distance;
      for(const subject of combatSubjectsAlongSegment(projectile.x,projectile.y,endX,endY)){
        if(!actorCanReceiveHit(subject))continue;
        let hitDistance=rayActorSpriteDistance(
          projectile.x,projectile.y,ux,uy,
          subject,SUBJECT_OCCLUDER_RADIUS,distance
        );
        let headHit=false;
        if(projectile.headTarget===subject){
          const headDistance=aimedHeadRayDistance(projectile.x,projectile.y,ux,uy,subject);
          if(headDistance<=projectile.remaining){hitDistance=headDistance;headHit=true;}
        }
        if(hitDistance<distance){
          distance=hitDistance;
          target=subject;
          projectile.headshot=headHit;
          transmitterTarget=null;
          swordDeflection=false;
        }
      }
    }else{
      if(player.hp>0){
        const hitDistance=rayActorSpriteDistance(
          projectile.x,projectile.y,ux,uy,
          player,PLAYER_RADIUS,distance
        );
        if(hitDistance<distance){
          distance=hitDistance;
          target=player;
          transmitterTarget=null;
          swordDeflection=false;
        }
      }
      for(const ally of squadAllies){
        if(ally.hp<=0)continue;
        const hitDistance=rayCircleDistance(
          projectile.x,projectile.y,ux,uy,
          ally.x,ally.y,ally.r,distance
        );
        if(hitDistance<distance){
          distance=hitDistance;
          target=ally;
          transmitterTarget=null;
          swordDeflection=false;
        }
      }
    }

    const hitSomething=swordDeflection||!!target||!!transmitterTarget||wallHit;
    const previousX=projectile.x,previousY=projectile.y;
    projectile.x+=ux*distance;
    projectile.y+=uy*distance;
    projectile.remaining-=distance;

    if(ammo.id==='tracer'){
      shotTraces.push({
        x1:previousX,y1:previousY,x2:projectile.x,y2:projectile.y,
        life:.24,maxLife:.24,color:'255,126,72',width:1,tracerLight:true
      });
      if(shotTraces.length>180)shotTraces.shift();
    }

    if(hitSomething||projectile.remaining<=.001){
      if(swordDeflection&&swordSweep){
        spawnSwordRicochet(projectile,projectile.x,projectile.y,swordSweep.current);
      }else if(target){
        spawnAirborneBloodSpray(projectile.x,projectile.y,projectile.angle,ammo);
      }else if(hitSomething){
        spawnBulletWallImpact(projectile.x,projectile.y,projectile.angle,ammo.damage,ammo.id);
      }

      if(swordDeflection){
        longswordState.guardFlash=.16;
      }else if(transmitterTarget){
        // 적군 탄환은 송신기를 파괴하지 않게 하고, 플레이어/조력자 사격만 임무 오브젝트에 피해.
        if(projectile.owner==='player'||projectile.owner==='ally'){
          damageTransmitter(transmitterTarget,ammo.damage);
        }
      }else if(target===player){
        damagePlayer(ammo.damage,projectile.angle,projectile.x,projectile.y,'projectile',projectile.sourceRef);
      }else if(target&&target.isAlly){
        damageAlly(target,ammo.damage,projectile.angle,projectile.sourceRef);
      }else if(target){
        damageGuardFromProjectile(
          target,projectile,projectile.x,projectile.y
        );
      }
      const removed=projectiles[i];
      projectiles.splice(i,1);
      recycleProjectile(removed);
    }
  }
}

function spawnAirborneBloodSpray(x,y,shotAngle,ammo){
  const count=ammo.id==='rifle762'?8:ammo.id==='rifle556'?6:
    (ammo.id==='buckshot'||ammo.id==='shot'?2:5);
  const center=shotAngle+Math.PI;
  for(let i=0;i<count;i++){
    const angle=center+(Math.random()-.5)*(ammo.id==='buckshot'?1.15:.82);
    const speed=70+Math.random()*(ammo.id==='rifle762'?150:105);
    const spray=airborneBloodSprayPool.pop()||{};
    Object.assign(spray,{
      x:x+(Math.random()-.5)*2,y:y+(Math.random()-.5)*2,
      vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
      age:0,life:.10+Math.random()*.16,
      size:.7+Math.random()*1.15,
      streak:1.5+Math.random()*(ammo.id==='rifle762'?5.5:3.5),
      color:Math.random()<.28?'118,13,18':'78,7,12'
    });
    airborneBloodSprays.push(spray);
  }
  if(airborneBloodSprays.length>420){
    while(airborneBloodSprays.length>420)recycleAirborneBloodSpray(airborneBloodSprays.shift());
  }
}

function spawnBlood(subject,x,y,shotAngle,count,style='impact'){
  const firearm=style==='firearm'||style==='impact';
  const blade=style.startsWith('blade');
  const bladeStab=style==='bladeStab';
  const bladeHeavy=style==='bladeHeavy';
  const blunt=style==='blunt'||style==='shove';
  const drip=style==='bleedDrip';
  if(subject&&!drip){
    const woundSize=style==='shove'?.65:(bladeHeavy?2.35:(blade?1.9:(firearm?1.55:1.15)));
    markBloodAtHit(subject,x,y,woundSize,shotAngle,blade?'#711116':'#621015');
  }
  const lethal=!!subject&&subject.hp<=0;
  // 아직 관통/출구상 판정이 없으므로 모든 피는 피격면 쪽, 즉 공격이 온 방향으로 되튄다.
  // 각 패턴의 최대 확산각도 180도 미만이라 반대편으로 관통해 나가는 방울은 생기지 않는다.
  const incomingCenter=normAngle(shotAngle+Math.PI);
  const impactOffset=subject?Math.hypot(x-subject.x,y-subject.y):0;
  const surfaceNormal=subject?Math.atan2(y-subject.y,x-subject.x):incomingCenter;
  // 옆구리나 팔 가장자리에 맞으면 실제 접촉면의 바깥 방향을 우선한다.
  const emissionCenter=impactOffset>1.5
    ?normAngle(incomingCenter+normAngle(surfaceNormal-incomingCenter)*.82)
    :incomingCenter;
  for(let i=0;i<count;i++){
    // 총량은 늘리지 않고 일부 방울을 저속·저고도로 떼어 피격점 가까이에 촘촘히 남긴다.
    const closeDrop=drip||Math.random()<(firearm?.42:(blade?.36:.68));
    const jet=!drip&&i<count*(firearm?.68:(blade?.55:.14));
    const chunk=!drip&&lethal&&Math.random()<(blade?.12:.07);
    const spread=jet
      ?(firearm?(count>=9?.52:.34):(blade?(bladeStab?.56:(bladeHeavy?1.48:1.15)):(count>=10?2.35:1.82)))
      :(firearm?(count>=9?1.08:.82):(blade?(bladeStab?.92:(bladeHeavy?1.82:1.55)):(count>=10?2.72:2.20)));
    const angle=drip?Math.random()*Math.PI*2:emissionCenter+(Math.random()-.5)*spread;
    const speed=drip
      ?2+Math.random()*11
      :(closeDrop
        ?12+Math.random()*(blunt?28:42)
        :(chunk
          ?48+Math.random()*78
          :(jet
            ?(firearm?90+Math.random()*95:(blade?105+Math.random()*115:38+Math.random()*52))
            :(firearm?28+Math.random()*72:(blade?38+Math.random()*92:22+Math.random()*48)))))*1.42;
    const size=chunk
      ?3+Math.floor(Math.random()*2)
      :(blunt?2+Math.floor(Math.random()*3):1+Math.floor(Math.random()*(blade?3:2)));
    const drop=bloodParticlePool.pop()||{};
    Object.assign(drop,{
      x,y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      z:drip?.25+Math.random()*1.1:(closeDrop?.8+Math.random()*2.4:2+Math.random()*(chunk?5:7)),
      vz:drip
        ?Math.random()*7
        :(closeDrop
          ?8+Math.random()*(blunt?20:31)
          :(chunk?34:28)+Math.random()*(blade?78:(firearm?62:38))),
      gravity:735+Math.random()*145,
      drag:chunk?1.65:1.15+Math.random()*.65,
      age:0,
      life:1.2+Math.random()*1.5,
      size:drip?1+Math.floor(Math.random()*2):size,
      bounces:drip?0:(chunk?2:(Math.random()<.30?1:0)),
      chunk,
      blade,
      color:drip?(Math.random()<.5?'#5d1014':'#721216'):
        (chunk?(Math.random()<.5?'#471014':'#581115'):
          (blade?(Math.random()<.35?'#92171a':'#731216'):(Math.random()<.35?'#861619':'#681014')))
    });
    bloodParticles.push(drop);
  }
  if(bloodParticles.length>1400){
    while(bloodParticles.length>1400)recycleBloodParticle(bloodParticles.shift());
  }
}

function recycleAirborneBloodSpray(spray){
  if(spray&&airborneBloodSprayPool.length<440)airborneBloodSprayPool.push(spray);
}
function recycleBloodParticle(drop){
  if(drop&&bloodParticlePool.length<1450)bloodParticlePool.push(drop);
}

function landBloodDrop(drop,scale=1){
  const speed=Math.hypot(drop.vx,drop.vy);
  // 바닥에 닿은 순간 더 움직일 이유가 없으므로 동적 웅덩이를 만들지 않고 즉시 청크에 굽는다.
  bakeGroundBloodPool({
    x:drop.x,y:drop.y,
    rx:Math.max(.7,drop.size*(.58+Math.random()*.48)*scale+Math.min(3.5,speed*.009)),
    ry:Math.max(.55,drop.size*(.34+Math.random()*.34)*scale),
    angle:Math.atan2(drop.vy,drop.vx),grow:1,age:0,
    alpha:.56+Math.random()*.30,
    color:drop.chunk?'72,8,11':'105,10,14'
  });
}

function killGuard(guard,shotAngle){
  guard.dead=true;
  guard.deathAngle=normAngle(shotAngle+(Math.random()-.5)*.45);
  guard.corpseTurn=(Math.random()>.5?1:-1)*(.45+Math.random()*.38);
  guard.armPose=Math.random();
  bakeGroundBloodPool({
    x:guard.x-Math.cos(shotAngle)*4,
    y:guard.y-Math.sin(shotAngle)*4,
    r:7+Math.random()*4,grow:1,age:0
  });
  guardDrops.push({x:guard.x+Math.cos(guard.angle)*12,y:guard.y+Math.sin(guard.angle)*12,
    angle:guard.angle+(Math.random()-.5)*1.1,
    type:guard.combatMode==='baton'?'baton':guard.weaponId});
  // 플레이어형 무기 상태에 실제로 남아 있는 모든 탄창을 그대로 루팅한다.
  const lootMagazines=[];
  const seenMagazines=new Set();
  const pushMagazine=mag=>{
    if(!mag||seenMagazines.has(mag))return;
    seenMagazines.add(mag);
    lootMagazines.push(mag);
  };
  for(const state of Object.values(guard.weaponStates||{})){
    pushMagazine(state.magazine);
    pushMagazine(state.reloadMagazine);
    pushMagazine(state.reloadRetainedMagazine);
  }
  for(const mag of guard.inventoryMagazines||[])pushMagazine(mag);

  lootMagazines.forEach((magazine,index)=>{
    dropGuardMagazine(guard,magazine,(index-1)*5);
  });

  guard.inventoryMagazines=[];
  for(const state of Object.values(guard.weaponStates||{})){
    state.magazine=null;
    state.reloadMagazine=null;
    state.reloadRetainedMagazine=null;
    state.chamberRound=null;
  }
  syncGuardWeaponAliases(guard);
  while(droppedMagazines.length>48)droppedMagazines.shift();
}

function updateBlood(dt){
  for(let i=airborneBloodSprays.length-1;i>=0;i--){
    const spray=airborneBloodSprays[i];
    const oldX=spray.x,oldY=spray.y;
    spray.age+=dt;
    spray.x+=spray.vx*dt;
    spray.y+=spray.vy*dt;
    const drag=Math.exp(-7.5*dt);
    spray.vx*=drag;
    spray.vy*=drag;
    if(stainBloodContact(spray,oldX,oldY)||spray.age>=spray.life){
      airborneBloodSprays.splice(i,1);recycleAirborneBloodSpray(spray);
    }
  }
  for(let i=bloodParticles.length-1;i>=0;i--){
    const drop=bloodParticles[i];
    const oldX=drop.x,oldY=drop.y;
    drop.age+=dt;
    drop.x+=drop.vx*dt;
    drop.y+=drop.vy*dt;
    drop.z+=drop.vz*dt;
    drop.vz-=drop.gravity*dt;
    const drag=Math.exp(-drop.drag*dt);
    drop.vx*=drag;drop.vy*=drag;
    if(drop.z>0&&stainBloodContact(drop,oldX,oldY)){
      bloodParticles.splice(i,1);recycleBloodParticle(drop);continue;
    }

    if(drop.x<2||drop.x>WORLD_W-2){
      drop.x=clamp(drop.x,2,WORLD_W-2);drop.vx*=-.28;
    }
    if(drop.y<2||drop.y>WORLD_H-2){
      drop.y=clamp(drop.y,2,WORLD_H-2);drop.vy*=-.28;
    }
    if(drop.z<=0&&drop.vz<0){
      drop.z=0;
      if(drop.bounces>0&&Math.abs(drop.vz)>48){
        landBloodDrop(drop,.38);
        drop.vz=-drop.vz*(drop.chunk?.34:.23);
        drop.vx*=drop.chunk?.68:.52;
        drop.vy*=drop.chunk?.68:.52;
        drop.bounces--;
      }else{
        landBloodDrop(drop,1);
        bloodParticles.splice(i,1);recycleBloodParticle(drop);
        continue;
      }
    }
    if(drop.age>=drop.life){
      landBloodDrop(drop,.75);
      bloodParticles.splice(i,1);recycleBloodParticle(drop);
    }
  }
  // 이전 상태에서 남아 있거나 외부 시스템이 만든 정지 웅덩이도 대기시키지 않고 즉시 굽는다.
  for(let i=bloodPools.length-1;i>=0;i--){
    const pool=bloodPools[i];
    pool.grow=1;
    bakeGroundBloodPool(pool);
    bloodPools.splice(i,1);
  }
}

function updateSurfaceBlood(dt){
  if(!surfaceBloodOwners.size){surfaceBloodDecayAccumulator=0;return;}
  surfaceBloodDecayAccumulator+=dt;
  // 마모/건조는 낮은 주기로 갱신한다. 화면에는 캐시 이미지가 계속 남아 있어 움직임은 끊기지 않는다.
  if(surfaceBloodDecayAccumulator<.12)return;
  const step=surfaceBloodDecayAccumulator;
  surfaceBloodDecayAccumulator=0;
  for(const owner of [...surfaceBloodOwners]){
    const data=surfaceBlood.get(owner);
    if(!data){surfaceBloodOwners.delete(owner);surfaceBloodLayers.delete(owner);continue;}
    const motions=surfaceBloodMotion.get(owner)||{};
    let remaining=0;
    for(const key of Object.keys(data)){
      const marks=data[key];
      const motion=motions[key];
      let changed=false;
      for(let i=marks.length-1;i>=0;i--){
        const mark=marks[i];
        const oldStrength=mark.strength??1,oldSize=mark.size;
        mark.age=(mark.age||0)+step;
        if(mark.age>mark.fadeStart){
          mark.strength=Math.max(0,(mark.strength??1)-step/mark.fadeDuration);
          mark.size=Math.max(.25,mark.size-step*.006);
        }
        if(motion){
          const linearSpeed=Math.hypot(motion.vx,motion.vy);
          const radius=Math.max(3,Math.hypot(mark.x,mark.y));
          const surfaceSpeed=linearSpeed+motion.angularSpeed*radius;
          let shedRate=Math.min(.18,Math.max(0,surfaceSpeed-6)*.00055);
          const bladeAttack=(owner===longswordState&&longswordState.attack)||(owner===knifeState&&knifeState.attack);
          const fistAttack=owner===player&&meleeState.active&&!!meleeState.attack&&
            (key.startsWith('arm')||key.startsWith('hand'));
          if(bladeAttack&&key==='blade')shedRate+=Math.min(.82,surfaceSpeed*.00165);
          if(fistAttack)shedRate+=Math.min(.42,surfaceSpeed*.00125);
          const loss=Math.min(mark.strength??1,step*shedRate);
          mark.strength=Math.max(0,(mark.strength??1)-loss);
        }
        if(mark.strength<=.035){marks.splice(i,1);changed=true;}
        else if(Math.abs((mark.strength??1)-oldStrength)>.0001||Math.abs(mark.size-oldSize)>.0001)changed=true;
      }
      if(changed)dirtySurfaceBloodLayer(owner,key);
      if(marks.length)remaining+=marks.length;
      else{
        delete data[key];
        const layers=surfaceBloodLayers.get(owner);
        if(layers)delete layers[key];
      }
    }
    if(!remaining){surfaceBlood.delete(owner);surfaceBloodOwners.delete(owner);surfaceBloodLayers.delete(owner);}
  }
}

function syncGuardWeaponAliases(guard){
  const state=guard.weaponState;
  if(!state){
    guard.weaponId=null;
    guard.magazine=null;
    guard.reloading=false;
    guard.reloadElapsed=0;
    guard.reloadMagazine=null;
    guard.muzzleFlash=0;
    return;
  }
  guard.weaponId=state.weaponId;
  guard.magazine=state.magazine;
  guard.reloading=state.reloading;
  guard.reloadElapsed=state.reloadElapsed;
  guard.reloadMagazine=state.reloadMagazine;
  guard.muzzleFlash=state.muzzleFlash;
}

function guardCompatibleMagazines(guard,weaponId=guard.weaponId){
  const def=WEAPON_BY_ID[weaponId];
  if(!def)return[];
  return (guard.inventoryMagazines||[]).filter(
    mag=>mag&&mag.magazineType===def.magazineType&&mag.rounds.length>0
  );
}

function switchGuardWeapon(guard,weaponId){
  const next=guard.weaponStates&&guard.weaponStates[weaponId];
  if(!next)return false;
  guard.weaponState=next;
  guard.stateTime=0;
  guard.aimTime=0;
  guard.aimStableTime=0;
  guard.lockedShot=null;
  guard.shotCooldown=0;
  guard.volleyTimer=0;

  // 플레이어 무기 교체와 같은 드로우 보간을 AI에도 태운다.
  guard.weaponDrawActive=true;
  guard.weaponDrawElapsed=0;
  guard.weaponDrawDuration=weaponSwitch.duration;

  syncGuardWeaponAliases(guard);
  return true;
}

// 기존 플레이어 총기 코드는 player/pistol/inventory 전역을 바라보므로,
// 호출 순간에만 AI 배우를 같은 컨텍스트에 얹었다가 즉시 원복한다.
// 결과적으로 발사·장전·약실·반동·슬라이드·총기 스프라이트는 한 코드 경로다.
function withGuardWeaponContext(guard,callback){
  if(!guard||!guard.weaponState)return false;

  const savedPistol=pistol;
  const savedPlayer={...player};
  const savedInventoryMagazines=inventory.magazines;
  const savedInventoryLoose=inventory.loose;
  const savedSelectedMagazineByType=inventory.selectedMagazineByType;
  const savedInventoryOpen=inventory.open;
  const savedMouse={down:mouse.down,aim:mouse.aim,x:mouse.x,y:mouse.y};
  const savedMagazinePickup={
    active:magazinePickup.active,
    elapsed:magazinePickup.elapsed,
    magazine:magazinePickup.magazine,
    rounds:magazinePickup.rounds,
    collected:magazinePickup.collected
  };
  const savedWeaponSwitch={...weaponSwitch};

  pistol=guard.weaponState;
  inventory.magazines=guard.inventoryMagazines;
  if(guard.inventoryLoose)inventory.loose=guard.inventoryLoose;
  inventory.selectedMagazineByType=guard.selectedMagazineByType;
  inventory.open=false;

  Object.assign(player,{
    x:guard.x,y:guard.y,r:guard.r,
    hp:guard.hp,maxHp:guard.maxHp,
    angle:guard.aimAngle,
    weaponAngle:guard.aimAngle,
    weaponAngularVelocity:0,
    bodyAngle:guard.angle,
    headAngle:guard.aimAngle,
    moving:guard.state!=='idle'&&guard.state!=='reload',
    moveBlend:(guard.magazinePickup&&guard.magazinePickup.active)?0:(guard.state!=='idle'&&guard.state!=='reload'?.55:0),
    sprinting:false,sprintBlend:0,
    aimBlend:1,
    longGunBraceBlend:guard.weaponState.weaponId==='pistol'?0:1,
    movePhase:guard.movePhase||0,
    armorEquipped:guard.isAlly?true:player.armorEquipped
  });

  // AI는 RMB를 누른 플레이어처럼 조준 상태다.
  // 무기 교체 중에는 플레이어의 weaponSwitch 보간을 그대로 재사용한다.
  mouse.down=false;
  mouse.aim=true;
  if(guard.magazinePickup)Object.assign(magazinePickup,guard.magazinePickup);
  else magazinePickup.active=false;
  weaponSwitch.active=!!guard.weaponDrawActive;
  weaponSwitch.elapsed=guard.weaponDrawElapsed||0;
  weaponSwitch.duration=guard.weaponDrawDuration||.34;
  weaponSwitch.commitRatio=0;
  weaponSwitch.committed=true;
  weaponSwitch.pendingWeaponId=null;
  weaponSwitch.pickupSwap=null;

  let result=false;
  try{
    result=callback();
    guard.inventoryMagazines=inventory.magazines;
    if(guard.inventoryLoose)guard.inventoryLoose=inventory.loose;
    guard.selectedMagazineByType=inventory.selectedMagazineByType;
    if(guard.magazinePickup){
      guard.magazinePickup={
        active:magazinePickup.active,elapsed:magazinePickup.elapsed,
        magazine:magazinePickup.magazine,rounds:magazinePickup.rounds,
        collected:magazinePickup.collected
      };
    }
    // 함수 내부에서 총기 상태가 바뀐 결과를 alias에도 반영.
    syncGuardWeaponAliases(guard);
  }finally{
    pistol=savedPistol;
    Object.assign(player,savedPlayer);
    inventory.magazines=savedInventoryMagazines;
    inventory.loose=savedInventoryLoose;
    inventory.selectedMagazineByType=savedSelectedMagazineByType;
    inventory.open=savedInventoryOpen;
    Object.assign(mouse,savedMouse);
    Object.assign(magazinePickup,savedMagazinePickup);
    Object.assign(weaponSwitch,savedWeaponSwitch);
  }
  return result;
}

function updateGuardWeaponState(guard,dt){
  if(!guard.weaponState)return;
  const wasReloading=guard.weaponState.reloading;
  withGuardWeaponContext(guard,()=>updateWeaponStateCore(dt));
  const isReloading=guard.weaponState&&guard.weaponState.reloading;
  if(wasReloading&&!isReloading){
    guard.state='move';
    guard.stateTime=0;
    guard.aimStableTime=0;
    guard.shotCooldown=.10;
  }
}

function playerDeathCauseKey(sourceKind,sourceRef){
  if(sourceKind==='projectile'){
    if(sourceRef?.simulationEnemy)return'22gunshot';
    if(sourceRef?.weaponId==='plasmaPistol')return'plasma';
    return'gunshot';
  }
  if(sourceKind==='melee')return'blunt';
  if(sourceKind==='bleeding')return'bleeding';
  return'trauma';
}

function beginPlayerDeath(sourceKind='generic',sourceRef=null,damage=0,attackAngle=null){

  playerDeath.active=true;playerDeath.elapsed=0;
  playerDeath.sourceKind=sourceKind;playerDeath.sourceRef=sourceRef||null;
  playerDeath.damage=Math.max(0,damage);playerDeath.causeKey=playerDeathCauseKey(sourceKind,sourceRef);
  player.deathAngle=attackAngle===null?player.bodyAngle:normAngle(attackAngle+(Math.random()-.5)*.18);
  player.moving=false;player.sprinting=false;mouse.down=false;mouse.aim=false;keys.clear();
  simulationControl.open=false;simulationControl.pressed=null;
  if(inventory.open)inventory.open=false;
}

function updatePlayerDeath(dt){
  player.respawnProtection=Math.max(0,(player.respawnProtection||0)-dt);
  if(!playerDeath.active)return;
  playerDeath.elapsed+=dt;
  player.moveBlend+=(0-player.moveBlend)*Math.min(1,dt*7);
  player.sprintBlend+=(0-player.sprintBlend)*Math.min(1,dt*8);
}

function settleWeaponStateForRespawn(state){
  if(!state)return;
  if(!state.magazine&&state.reloadMagazine){
    const index=inventory.magazines.indexOf(state.reloadMagazine);
    if(index>=0)inventory.magazines.splice(index,1);
    state.magazine=state.reloadMagazine;
  }
  if(!state.chamberRound&&state.magazine?.rounds.length)state.chamberRound=state.magazine.rounds.pop();
  state.reloadMagazine=null;state.reloadRetainedMagazine=null;
  state.reloading=false;state.reloadElapsed=0;state.reloadCommitted=false;state.reloadDiscarded=false;
  state.pumpActive=false;state.pumpElapsed=0;state.cooldown=0;
  state.recoil=0;state.recoilVelocity=0;state.recoilYaw=0;state.recoilYawVelocity=0;
  state.shotCycles.length=0;
}

  const bloodOwners=new Set([
    player,knifeState,longswordState,pistol,sidearmWeaponState,
    ...Object.values(weaponStates),...Object.values(quickWeaponStates||{})
  ]);
