function drawPlayerHead(point,bodyLean){
  const death=bloodSurfaceActor?.hp<=0?bloodSurfaceActor.deathMotion:null;
  if(death&&(death.kind==='headBurst'||death.kind==='decapitate'))return;
  // 몸의 전방으로 공전시키지 않고, 현재 상체 중심에 머리 회전축을 고정한다.
  const x=Math.round(point.x+Math.cos(player.bodyAngle)*bodyLean);
  const y=Math.round(point.y+Math.sin(player.bodyAngle)*bodyLean);
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(player.headAngle);

  drawSharedHeadLocal();
  drawBloodSurface(bloodSurfaceActor||player,'head',-3,-4,7,8);
  ctx.restore();
}

function drawPlayer(screenPoint=null){
  if(consumption.active&&!screenPoint){drawConsumptionActor();return;}
  const point=screenPoint||worldToScreen(player.x,player.y);
  const rig=buildPistolRig();
  const weaponId=currentWeaponDef().id;
  const shotgunOverhand=weaponId==='shotgun';
  const longGunStance=!['pistol','revolver','plasmaPistol'].includes(weaponId);
  ctx.save();
  ctx.translate(Math.round(point.x),Math.round(point.y));
  ctx.rotate(player.bodyAngle+(rig.rifleBodyTurn||0));
  ctx.translate(rig.bodyLean,0);
  // 일반 무기는 두 팔을 총 아래에 둔다. 소드오프는 핸드가드를 감싸는
  // 왼손만 총 아래에 먼저 그리고, 방아쇠를 쥔 오른손은 위 레이어에 둔다.
  if(shotgunOverhand)drawSupportArm(rig);
  else drawPistolArms(rig);
  drawPlayerTorso(longGunStance);
  ctx.restore();

  // 총과 손에 든 탄창·셸을 먼저 그려 머리와 겹치는 부분은 자연스럽게 뒤로 가려지게 한다.
  ctx.save();
  ctx.translate(Math.round(point.x),Math.round(point.y));
  ctx.rotate(player.bodyAngle+(rig.rifleBodyTurn||0));
  ctx.translate(rig.bodyLean,0);
  drawPistolWeapon(rig);
  ctx.restore();

  if(shotgunOverhand){
    ctx.save();
    ctx.translate(Math.round(point.x),Math.round(point.y));
    ctx.rotate(player.bodyAngle+(rig.rifleBodyTurn||0));
    ctx.translate(rig.bodyLean,0);
    drawPrimaryArm(rig);
    ctx.restore();
  }

  // 머리는 상체 변환과 분리된 회전축을 유지하되 가장 위 레이어에 놓는다.
  drawPlayerHead(point,rig.bodyLean);
}

let crosshairDisplaySpread=0;
let crosshairDisplayLastTime=performance.now();

function drawMuzzleDirectionGuide(){
  if((!diagnosticSettings.muzzleDirection&&!diagnosticSettings.spread)||meleeState.active||inventory.open)return;
  const def=currentWeaponDef();
  const pose=pistolPoseAt(pistol.reloading?currentReloadProgress(def):0);
  const angle=normAngle(player.bodyAngle+pose.turn);
  const muzzleLocal=gunPoint(pose,def.muzzleX,0);
  const ca=Math.cos(player.bodyAngle),sa=Math.sin(player.bodyAngle);
  const muzzle={
    x:player.x+muzzleLocal.x*ca-muzzleLocal.y*sa,
    y:player.y+muzzleLocal.x*sa+muzzleLocal.y*ca
  };
  const start=worldToScreen(muzzle.x,muzzle.y);
  // 디버깅용이므로 화면 대부분을 가로지르는 실제 총열 축을 표시한다.
  const length=520;
  const endX=start.x+Math.cos(angle)*length,endY=start.y+Math.sin(angle)*length;
  ctx.save();
  if(diagnosticSettings.spread){
    const spread=currentAccuracySpread(true);
    const halfWidth=Math.tan(spread)*length;
    const nx=-Math.sin(angle),ny=Math.cos(angle);
    ctx.fillStyle='rgba(177,145,71,.075)';
    ctx.beginPath();ctx.moveTo(start.x,start.y);
    ctx.lineTo(endX+nx*halfWidth,endY+ny*halfWidth);
    ctx.lineTo(endX-nx*halfWidth,endY-ny*halfWidth);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(213,177,89,.32)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.lineTo(endX+nx*halfWidth,endY+ny*halfWidth);
    ctx.moveTo(start.x,start.y);ctx.lineTo(endX-nx*halfWidth,endY-ny*halfWidth);ctx.stroke();
    ctx.fillStyle='rgba(213,177,89,.70)';ctx.font='8px monospace';
    ctx.fillText(`SPREAD ±${(spread*180/Math.PI).toFixed(1)}°`,start.x+8,start.y-8);
  }
  if(diagnosticSettings.muzzleDirection){
    ctx.strokeStyle='rgba(222,205,128,.66)';ctx.lineWidth=1;
    ctx.setLineDash([7,5]);
    ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.lineTo(endX,endY);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(235,217,137,.85)';
    ctx.beginPath();ctx.arc(endX,endY,2,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function gameplayCrosshairVisible(){
  return gameStarted&&player.hp>0&&!gamePaused&&!inventory.open&&!simulationControl.open;
}
let lastAimPointer=null;
let gameplayPointerLocked=false;
let gameplayPointerRequest=false;
function requestGameplayPointerLock(){
  if(!document.fullscreenElement||!gameplayCrosshairVisible()||
    document.pointerLockElement===canvas||gameplayPointerRequest||!canvas.requestPointerLock)return;
  gameplayPointerRequest=true;
  try{
    const request=canvas.requestPointerLock();
    if(request&&request.catch)request.catch(()=>{gameplayPointerRequest=false;});
  }catch(_error){gameplayPointerRequest=false;}
}
canvas.addEventListener('mousedown',requestGameplayPointerLock,true);
document.addEventListener('pointerlockerror',()=>{gameplayPointerRequest=false;});
document.addEventListener('pointerlockchange',()=>{
  const wasLocked=gameplayPointerLocked;
  gameplayPointerLocked=document.pointerLockElement===canvas;
  gameplayPointerRequest=false;lastAimPointer=null;
  // Escape releases the mouse and pauses, so menus stay accessible.
  if(wasLocked&&!gameplayPointerLocked&&gameplayCrosshairVisible())setGamePaused(true);
});
function syncGameplayCursor(){
  if(document.pointerLockElement===canvas&&(!document.fullscreenElement||!gameplayCrosshairVisible())){
    gameplayPointerLocked=false;
    if(document.exitPointerLock)document.exitPointerLock();
    lastAimPointer=null;
  }
  const cursor=document.fullscreenElement&&gameplayCrosshairVisible()?'none':'default';
  if(canvas.style.cursor!==cursor)canvas.style.cursor=cursor;
}
function drawCrosshair(){
  if(!gameplayCrosshairVisible())return;
  if(lightingTime<adsCameraLeadNoticeUntil){
    ctx.save();ctx.textAlign='center';ctx.font='bold 12px monospace';
    ctx.fillStyle='rgba(5,8,10,.85)';ctx.fillRect(W/2-135,H-119,270,27);
    ctx.fillStyle='#ece5ce';
    ctx.fillText(`${uiLanguage==='ko'?'정조준 카메라 거리':'ADS CAMERA DISTANCE'} ${Math.round(currentAdsCameraLeadDistance()/220*100)}%`,W/2,H-101);
    ctx.restore();
  }
  const playerPoint=worldToViewportScreen(player.x,player.y);
  const aimDistance=clamp(
    Math.hypot(mouse.x-playerPoint.x,mouse.y-playerPoint.y),30,640
  );
  const actualSpread=currentAccuracySpread(true);
  // 실제 명중률/총열 오차는 그대로 유지한다. 조준점 UI만 저역통과시켜
  // 매 프레임 벌어졌다 좁아지는 정신없는 움직임을 억제한다.
  const now=performance.now();
  const crosshairDt=clamp((now-crosshairDisplayLastTime)/1000,0,0.05);
  crosshairDisplayLastTime=now;
  // 정조준 중에는 보폭의 사인파를 그대로 따라 크기가 맥박치지 않는다.
  // 실제 오차가 커질 때는 따라가되, 줄어드는 쪽은 안정된 탄착군처럼 천천히 수렴한다.
  const aimed=player.aimBlend>.35;
  const followSpeed=aimed
    ?(actualSpread>crosshairDisplaySpread?7:2.2)
    :(actualSpread>crosshairDisplaySpread?18:8);
  const follow=1-Math.exp(-followSpeed*crosshairDt);
  crosshairDisplaySpread+=(actualSpread-crosshairDisplaySpread)*follow;
  if(Math.abs(actualSpread-crosshairDisplaySpread)<(aimed?.0008:.0003)){
    crosshairDisplaySpread=actualSpread;
  }
  const spread=crosshairDisplaySpread;
  const gap=clamp(3+Math.tan(spread)*aimDistance,4,34);
  const length=5;
  const unstable=player.sprintBlend>.55||spread>.065;
  // Screen-space aiming marker stays legible over both flash and darkness.
  // Spread remains the separate diagnostic cone, not the size of this marker.
  const cx=Math.round(mouse.x),cy=Math.round(mouse.y);
  ctx.save();
  const marks=[[-10,-1,6,2],[4,-1,6,2],[-1,-10,2,6],[-1,4,2,6],[-1,-1,2,2]];
  ctx.fillStyle='rgba(5,8,10,.92)';
  for(const [x,y,w,h] of marks)ctx.fillRect(cx+x-1,cy+y-1,w+2,h+2);
  ctx.fillStyle='#f2eee0';
  for(const [x,y,w,h] of marks)ctx.fillRect(cx+x,cy+y,w,h);
  ctx.restore();

  if(pistol.aimDeniedElapsed<.72){
    const alpha=1-pistol.aimDeniedElapsed/.72;
    const text='[RMB] AIM TO FIRE';
    ctx.font='bold 9px monospace';
    const width=Math.ceil(ctx.measureText(text).width)+8;
    const x=Math.round(mouse.x-width/2);
    const y=Math.round(mouse.y+gap+12);
    ctx.fillStyle=`rgba(5,6,7,${.72*alpha})`;
    ctx.fillRect(x,y,width,14);
    ctx.strokeStyle=`rgba(181,105,75,${.9*alpha})`;
    ctx.strokeRect(x+.5,y+.5,width-1,13);
    ctx.fillStyle=`rgba(224,165,126,${alpha})`;
    ctx.fillText(text,x+4,y+10);
  }
}

function drawWorkbenchCartridge(x,y,w,h,ammo,alpha=1,angle=0){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.translate(x,y);
  ctx.rotate(angle);
  const rifle=ammo.id==='rifle762';
  if(ammo.id==='buckshot'){
    // 12게이지는 둥근 탄두가 아니라 평평하게 크림프된 굵은 플라스틱 셸이다.
    const length=Math.min(w*.98,h*5.35);
    const diameter=Math.min(h*1.62,length*.34);
    const left=-length*.5,right=length*.5;
    const brassEnd=left+length*.23;
    ctx.strokeStyle='rgba(4,6,6,.48)';ctx.lineWidth=.8;
    ctx.fillStyle='#806431';ctx.fillRect(left-1.5,-diameter*.56,2.5,diameter*1.12);
    ctx.strokeRect(left-1.5,-diameter*.56,2.5,diameter*1.12);
    ctx.fillStyle='#c3a052';ctx.fillRect(left+.5,-diameter*.49,brassEnd-left,diameter*.98);
    ctx.strokeRect(left+.5,-diameter*.49,brassEnd-left,diameter*.98);
    ctx.fillStyle=ammo.color;ctx.fillRect(brassEnd,-diameter*.47,right-brassEnd,diameter*.94);
    ctx.strokeRect(brassEnd,-diameter*.47,right-brassEnd,diameter*.94);
    // 평평한 스타 크림프 끝과 접힌 선.
    ctx.fillStyle='#8f302b';ctx.fillRect(right-2.4,-diameter*.47,2.4,diameter*.94);
    ctx.strokeStyle='rgba(245,170,145,.48)';ctx.lineWidth=.65;
    ctx.beginPath();
    ctx.moveTo(right-.6,-diameter*.38);ctx.lineTo(right-2.3,0);ctx.lineTo(right-.6,diameter*.38);
    ctx.moveTo(right-2.3,-diameter*.38);ctx.lineTo(right-.6,0);ctx.lineTo(right-2.3,diameter*.38);
    ctx.stroke();
    ctx.restore();return;
  }
  if(ammo.id==='rifle556'){
    // 5.56x45: 7.62보다 가늘고 짧지만, 긴 병목 탄피와 뾰족한 탄두는 분명히 보인다.
    const length=Math.min(w*.91,h*8.0);
    const bodyDiameter=length/7.1;
    const left=-length*.5,right=length*.5;
    const shoulder=left+length*.58,neck=left+length*.65,bullet=left+length*.73;
    ctx.strokeStyle='rgba(4,6,6,.42)';ctx.lineWidth=.7;
    ctx.fillStyle='#786238';ctx.fillRect(left-1.4,-bodyDiameter*.55,2.2,bodyDiameter*1.1);
    ctx.fillStyle='#ad8e49';ctx.beginPath();
    ctx.moveTo(left+.3,-bodyDiameter*.47);ctx.lineTo(shoulder,-bodyDiameter*.47);
    ctx.lineTo(neck,-bodyDiameter*.32);ctx.lineTo(bullet,-bodyDiameter*.32);
    ctx.lineTo(bullet,bodyDiameter*.32);ctx.lineTo(neck,bodyDiameter*.32);
    ctx.lineTo(shoulder,bodyDiameter*.47);ctx.lineTo(left+.3,bodyDiameter*.47);
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle=ammo.color;ctx.beginPath();
    ctx.moveTo(bullet,-bodyDiameter*.31);ctx.lineTo(right-length*.10,-bodyDiameter*.25);
    ctx.lineTo(right,0);ctx.lineTo(right-length*.10,bodyDiameter*.25);
    ctx.lineTo(bullet,bodyDiameter*.31);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.restore();return;
  }
  if(rifle){
    // 풀사이즈 7.62mm: 긴 대구경 탄피, 뚜렷한 숄더와 좁은 넥, 긴 첨두탄.
    const length=Math.min(w*1.02,h*9.0);
    // 7.62x51 NATO의 전체 길이/몸통 지름 비율(약 71/12)에 맞춘다.
    const bodyDiameter=length/5.92;
    const neckDiameter=bodyDiameter*.65;
    const left=-length*.5;
    const right=length*.5;
    const shoulderStart=left+length*.56;
    const neckStart=left+length*.62;
    const bulletBase=left+length*.72;
    ctx.strokeStyle='rgba(4,6,6,.42)';
    ctx.lineWidth=.8;

    ctx.fillStyle='#755f31';
    ctx.fillRect(left-1.8,-bodyDiameter*.56,2.8,bodyDiameter*1.12);
    ctx.strokeRect(left-1.8,-bodyDiameter*.56,2.8,bodyDiameter*1.12);
    ctx.fillStyle='#a88943';
    ctx.beginPath();
    ctx.moveTo(left+.4,-bodyDiameter*.48);
    ctx.lineTo(shoulderStart,-bodyDiameter*.48);
    ctx.lineTo(neckStart,-neckDiameter*.50);
    ctx.lineTo(bulletBase,-neckDiameter*.50);
    ctx.lineTo(bulletBase,neckDiameter*.50);
    ctx.lineTo(neckStart,neckDiameter*.50);
    ctx.lineTo(shoulderStart,bodyDiameter*.48);
    ctx.lineTo(left+.4,bodyDiameter*.48);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle='#d0ae5d';
    ctx.beginPath();
    ctx.moveTo(left+2,-bodyDiameter*.31);
    ctx.lineTo(shoulderStart-1,-bodyDiameter*.31);
    ctx.lineTo(neckStart-1,-neckDiameter*.30);
    ctx.lineTo(neckStart+1,-neckDiameter*.30);
    ctx.lineTo(shoulderStart-2,-bodyDiameter*.16);
    ctx.lineTo(left+2,-bodyDiameter*.16);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle=ammo.color;
    ctx.beginPath();
    ctx.moveTo(bulletBase,-neckDiameter*.48);
    ctx.lineTo(right-length*.105,-neckDiameter*.42);
    ctx.lineTo(right,0);
    ctx.lineTo(right-length*.105,neckDiameter*.42);
    ctx.lineTo(bulletBase,neckDiameter*.48);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
    return;
  }
  // .22 LR은 9 mm처럼 길쭉하지 않다. 표시 슬롯보다 훨씬 짧은 실제 탄 길이를 쓴다.
  // 실제 규격은 작아도 탄창 절개창 안에서는 지나치게 축소하지 않는다.
  // 짧고 뭉툭한 비율은 유지하되 탄창 폭을 자연스럽게 채울 크기로 그린다.
  const length=Math.min(w*.80,h*5.9);
  const diameter=h*1.34;
  const left=-length*.5;
  const right=length*.5;
  const caseEnd=left+length*.61;
  ctx.strokeStyle='rgba(4,6,6,.38)';
  ctx.lineWidth=.7;

  // 돌출된 림과 짧고 곧은 황동 탄피.
  ctx.fillStyle='#786633';
  ctx.fillRect(left-1.4,-diameter*.57,2.2,diameter*1.14);
  ctx.strokeRect(left-1.4,-diameter*.57,2.2,diameter*1.14);
  ctx.fillStyle='#9b8242';
  ctx.fillRect(left+.4,-diameter*.46,caseEnd-left,diameter*.92);
  ctx.strokeRect(left+.4,-diameter*.46,caseEnd-left,diameter*.92);
  ctx.fillStyle='#c4a75b';
  ctx.fillRect(left+2,-diameter*.31,caseEnd-left-2,diameter*.23);
  ctx.fillStyle='#5a4c2b';
  ctx.fillRect(caseEnd-1.2,-diameter*.46,1.4,diameter*.92);

  ctx.fillStyle=ammo.color;
  if(ammo.id==='shot'){
    // .22 LR 산탄: 축소 산탄 셸처럼 짧은 캡과 완전히 평평한 앞면.
    ctx.fillRect(caseEnd,-diameter*.43,right-caseEnd,diameter*.86);
    ctx.strokeRect(caseEnd,-diameter*.43,right-caseEnd,diameter*.86);
    ctx.fillStyle='#aeb6b5';
    ctx.fillRect(right-1.8,-diameter*.43,1.8,diameter*.86);
    ctx.fillStyle='#707877';
    ctx.fillRect(caseEnd+1,-diameter*.25,right-caseEnd-3,diameter*.18);
  }else{
    // 일반탄/예광탄: 짧게 노출된 뭉툭한 납 탄두와 둥근 코.
    ctx.beginPath();
    ctx.moveTo(caseEnd,-diameter*.43);
    ctx.lineTo(right-2.4,-diameter*.39);
    ctx.quadraticCurveTo(right,-diameter*.28,right,0);
    ctx.quadraticCurveTo(right,diameter*.28,right-2.4,diameter*.39);
    ctx.lineTo(caseEnd,diameter*.43);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();
}

function drawWorkbenchMagazine(magazine,def,x,top){
  if(!magazine)return;
  if(def.id==='pumpShotgun'){
    // 12게이지 다섯 발을 일렬로 붙드는 슬림한 튜브 스피드로더.
    const bottom=top+145;
    ctx.fillStyle='rgba(0,0,0,.42)';
    ctx.beginPath();ctx.ellipse(x,bottom+4,27,6,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#202628';ctx.fillRect(x-5,top+12,10,128);
    ctx.fillStyle='#60686a';ctx.fillRect(x-3,top+14,2,124);
    ctx.fillStyle='#121617';ctx.fillRect(x-18,top+9,36,7);
    ctx.fillStyle='#15191a';ctx.fillRect(x-18,top+136,36,7);
    for(let i=0;i<magazine.rounds.length;i++){
      const ammo=AMMO_BY_ID[magazine.rounds[i]]||AMMO_BY_ID.buckshot;
      drawWorkbenchCartridge(x,top+27+i*23,38,7.5,ammo,1,0);
    }
    return;
  }
  if(def.id==='revolver'){
    const rounds=magazine.rounds;
    const cx=x,cy=top+70;
    ctx.fillStyle='rgba(0,0,0,.42)';
    ctx.beginPath();ctx.ellipse(cx,cy+47,44,7,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#202527';ctx.beginPath();ctx.arc(cx,cy,42,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#687071';ctx.lineWidth=1.7;ctx.stroke();
    ctx.fillStyle='#101314';ctx.beginPath();ctx.arc(cx,cy,10.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#50585a';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(cx,cy,25.5,0,Math.PI*2);ctx.stroke();
    for(let i=0;i<10;i++){
      const a=-Math.PI/2+i*Math.PI*2/10;
      const px=cx+Math.cos(a)*27,py=cy+Math.sin(a)*27;
      ctx.fillStyle='#0c0f10';ctx.beginPath();ctx.arc(px,py,7.2,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#596163';ctx.lineWidth=1;ctx.stroke();
      if(i<rounds.length){
        const ammo=AMMO_BY_ID[rounds[i]]||AMMO_BY_ID.standard;
        ctx.fillStyle='#a98a44';ctx.beginPath();ctx.arc(px,py,6.1,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=ammo.color;ctx.beginPath();ctx.arc(px,py,2.7,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='rgba(5,6,6,.5)';ctx.stroke();
      }
    }
    const motion=inventory.loadMotion;
    if(motion.active&&motion.kind==='moonclip'){
      const t=smoothStep01(clamp(motion.elapsed/motion.duration,0,1));
      ctx.save();ctx.globalAlpha=1-t*.7;ctx.translate(0,-70*(1-t));
      ctx.strokeStyle='#b4bdbe';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(cx,cy,30,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
    const sequence=inventory.unloadSequence;
    if(sequence.active&&sequence.magazine===magazine){
      for(const round of sequence.ejected){
        const t=clamp(round.age/round.life,0,1);
        const ammo=AMMO_BY_ID[round.ammoId]||AMMO_BY_ID.standard;
        const a=-Math.PI/2+(round.slot%10)*Math.PI*2/10;
        const startX=cx+Math.cos(a)*27;
        const startY=cy+Math.sin(a)*27;
        const px=startX+round.side*38*t;
        const py=startY-Math.sin(t*Math.PI)*27+28*t;
        drawWorkbenchCartridge(px,py,17,6.2,ammo,1-t*.72,round.spin*t);
      }
    }
    return;
  }
  const smg=def.id==='smg';
  const rifle=def.id==='battleRifle';
  const assault=def.id==='assaultRifle';
  const lmg=def.id==='lmg';
  // .22 탄창은 작게, 7.62 전투소총 탄창은 폭과 몸체를 확실히 크게 표시한다.
  const width=lmg?92:(rifle?70:(assault?58:(smg?52:50)));
  const height=lmg?126:(rifle?144:(assault?154:(smg?158:130)));
  const bottom=top+height;
  const capacity=magazine.capacity;
  const loaded=magazine.rounds.length;
  const pitch=(height-45)/Math.max(1,capacity-1);
  const roundW=lmg?68:(rifle?58:(assault?46:(smg?38:36)));
  const roundH=rifle?6.4:((assault||lmg)?5.5:5);
  const topRoundY=top+22;
  const curveAt=()=>0;
  const stackY=index=>topRoundY+(loaded-1-index)*pitch;
  const motion=inventory.loadMotion;
  const motionT=motion.active?clamp(
    motion.elapsed/motion.duration,0,1
  ):1;
  const hideNewest=motion.active&&motion.kind==='load'&&loaded>0;

  // Bench shadow: the magazine is standing on its base plate.
  ctx.fillStyle='rgba(0,0,0,.42)';
  ctx.beginPath();
  ctx.ellipse(x,bottom+5,width*.64,7,0,0,Math.PI*2);
  ctx.fill();

  // 곧은 탄창 몸체와 곧은 절개창.
  ctx.fillStyle='#24292a';
  ctx.fillRect(x-width/2,top+11,width,height-11);

  ctx.fillStyle='#0d1011';
  ctx.fillRect(x-width/2+7,top+24,width-14,height-48);
  if(rifle||assault||lmg){
    // 두꺼운 측면 보강대와 넓은 바닥판으로 20발 풀사이즈 박스 탄창의 질량을 강조한다.
    ctx.fillStyle='#3b4243';
    ctx.fillRect(x-width/2+2,top+18,5,height-35);
    ctx.fillRect(x+width/2-7,top+18,5,height-35);
    ctx.fillStyle='#596160';
    ctx.fillRect(x-width/2+3,top+20,1,height-40);
    ctx.fillRect(x+width/2-4,top+20,1,height-40);
  }

  // Empty witness marks show total capacity without replacing the physical stack.
  ctx.strokeStyle='rgba(116,126,122,.17)';
  ctx.lineWidth=1;
  for(let i=0;i<capacity;i++){
    const y=topRoundY+i*pitch;
    const cx=x+curveAt(y);
    ctx.beginPath();
    ctx.moveTo(cx-roundW*.44,y);
    ctx.lineTo(cx+roundW*.44,y);
    ctx.stroke();
  }

  // Loaded rounds: first loaded sits lowest, last loaded remains at the feed lips.
  const visibleLoaded=hideNewest?loaded-1:loaded;
  for(let i=0;i<visibleLoaded;i++){
    const ammo=AMMO_BY_ID[magazine.rounds[i]]||AMMO_BY_ID.standard;
    const y=stackY(i);
    const cx=x+curveAt(y);
    drawWorkbenchCartridge(cx,y,roundW,roundH,ammo,1,0);
  }

  // Follower and compressed spring remain visible beneath the cartridge stack.
  const followerY=Math.min(
    bottom-23,loaded?topRoundY+loaded*pitch:topRoundY+4
  );
  const followerX=x+curveAt(followerY);
  ctx.strokeStyle='#9b8a51';
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(followerX-roundW*.38,followerY);
  ctx.lineTo(followerX+roundW*.38,followerY);
  ctx.stroke();
  ctx.strokeStyle='#59615e';
  ctx.lineWidth=1.5;
  ctx.beginPath();
  let springY=followerY+5;
  ctx.moveTo(followerX,springY);
  let side=1;
  while(springY<bottom-17){
    springY=Math.min(bottom-17,springY+8);
    ctx.lineTo(x+curveAt(springY)+side*15,springY);
    side*=-1;
  }
  ctx.stroke();

  // Feed lips sit over the top round rather than looking like a flat progress bar.
  ctx.fillStyle='#343a3a';
  ctx.fillRect(x-width/2-3,top+7,width*.34,8);
  ctx.fillRect(x+width*.16,top+7,width*.37,8);
  ctx.strokeStyle='#69716e';
  ctx.lineWidth=1;
  ctx.strokeRect(x-width/2-3+.5,top+7.5,width*.34,7);
  ctx.strokeRect(x+width*.16+.5,top+7.5,width*.37,7);
  ctx.fillStyle='#181b1c';
  ctx.fillRect(x-width/2-4,bottom-5,width+8,8);
  ctx.strokeStyle='#59605e';
  ctx.strokeRect(x-width/2-3.5,bottom-4.5,width+7,7);

  // A newly selected round visibly drops into the feed lips.
  if(motion.active&&motion.kind==='load'){
    const ammo=AMMO_BY_ID[motion.ammoId]||AMMO_BY_ID.standard;
    const eased=1-Math.pow(1-motionT,3);
    const y=top-27+eased*49;
    drawWorkbenchCartridge(x,y,roundW,roundH,ammo,1,0);
  }

  // Backspace strips the magazine from the feed lips, one spring-driven pop at a time.
  const sequence=inventory.unloadSequence;
  if(sequence.active&&sequence.magazine===magazine){
    for(const round of sequence.ejected){
      const t=clamp(round.age/round.life,0,1);
      const ammo=AMMO_BY_ID[round.ammoId]||AMMO_BY_ID.standard;
      const px=x+round.side*(8+54*t);
      const py=topRoundY-Math.sin(t*Math.PI)*35+18*t;
      drawWorkbenchCartridge(
        px,py,roundW,roundH,ammo,1-t*.72,round.spin*t
      );
    }
  }

  if(loaded>0){
    const topAmmo=AMMO_BY_ID[magazine.rounds[loaded-1]]||AMMO_BY_ID.standard;
    ctx.strokeStyle=topAmmo.color;
    ctx.beginPath();
    ctx.moveTo(x+width/2+7,topRoundY);
    ctx.lineTo(x+width/2+15,topRoundY);
    ctx.stroke();
    ctx.fillStyle=topAmmo.color;
    ctx.font='bold 8px monospace';
    ctx.fillText('NEXT ROUND',x+width/2+18,topRoundY+3);
  }
}

// UI labels fit their allocated row rather than spilling into adjoining cards.
function drawFittedText(text,x,y,maxWidth){
  ctx.fillText(text,x,y,Math.max(1,maxWidth));
}

    'Q / E SELECT WEAPON · ENTER EQUIP',panel.x+518,panel.y+23

    ctx.fillStyle='#65a7ad';
    ctx.fillRect(gx+25,gy+58,424*(state.hydrogen/state.hydrogenCapacity),28);

    ctx.fillStyle='#e3e4dc';ctx.font='bold 22px monospace';

function drawHelicopterReinforcement(){
  const drawHelos=[...(insertionHelicopter?[insertionHelicopter]:[]),...helicopterReinforcements];

  for(const h of drawHelos){
  if(!h||h.phase==='queued')continue;
  const p=worldToScreen(h.x,h.y);
  if(p.x<-280||p.x>W+280||p.y<-280||p.y>H+280)continue;

  ctx.strokeStyle='rgba(65,73,74,.35)';ctx.lineWidth=3;

  ctx.beginPath();ctx.moveTo(42,-10);ctx.lineTo(132,-6);ctx.lineTo(132,6);ctx.lineTo(42,10);ctx.closePath();ctx.fill();
  ctx.fillStyle='#354043';ctx.fillRect(93,-19,30,38);
  ctx.fillStyle='#1b2223';ctx.fillRect(127,-27,8,54);
  // 테일로터.

  ctx.beginPath();ctx.moveTo(-21,0);ctx.lineTo(21,0);ctx.moveTo(0,-21);ctx.lineTo(0,21);ctx.stroke();ctx.restore();

  // 주 동체: 각진 군용 수송헬기 느낌의 탑뷰 실루엣.
  ctx.fillStyle='#202829';
  ctx.beginPath();ctx.moveTo(-68,-24);ctx.lineTo(-48,-39);ctx.lineTo(28,-38);ctx.lineTo(57,-21);ctx.lineTo(63,0);ctx.lineTo(57,21);ctx.lineTo(28,38);ctx.lineTo(-48,39);ctx.lineTo(-68,24);ctx.lineTo(-78,0);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#586365';ctx.lineWidth=2;ctx.stroke();
  // 상부 패널/엔진 카울.
  ctx.fillStyle='#343f41';ctx.fillRect(-27,-30,59,60);
  ctx.fillStyle='#465255';ctx.fillRect(-17,-25,38,50);
  ctx.fillStyle='#171c1d';ctx.fillRect(23,-27,22,54);
  // 콕핏 유리.
  ctx.fillStyle='#688087';
  ctx.beginPath();ctx.moveTo(-71,-18);ctx.lineTo(-48,-30);ctx.lineTo(-37,-19);ctx.lineTo(-43,-3);ctx.lineTo(-69,-4);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-71,18);ctx.lineTo(-48,30);ctx.lineTo(-37,19);ctx.lineTo(-43,3);ctx.lineTo(-69,4);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(190,218,224,.18)';ctx.fillRect(-61,-19,10,11);ctx.fillRect(-61,8,10,11);
  // 양쪽 슬라이딩 도어/패널 라인.
  ctx.strokeStyle='#707b7c';ctx.lineWidth=1.4;ctx.strokeRect(-24,-38,38,13);ctx.strokeRect(-24,25,38,13);
  ctx.fillStyle='#121718';ctx.fillRect(-16,-40,29,5);ctx.fillRect(-16,35,29,5);
  // 스텁윙은 남기되 고정 기총은 없다.
  ctx.fillStyle='#2b3436';ctx.fillRect(-2,-58,28,23);ctx.fillRect(-2,35,28,23);
  // 열린 좌측 도어에서 탑승 조력자가 SMG를 내밀어 사격한다.
  if(h.phase==='gunrun'){
    ctx.fillStyle='#335765';ctx.beginPath();ctx.arc(2,-43,7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1c272b';ctx.fillRect(-1,-52,6,17);
    ctx.fillStyle='#171d1f';ctx.fillRect(2,-65,4,17);

  // 랜딩기어/스키드.
  ctx.strokeStyle='#111617';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-49,-46);ctx.lineTo(42,-46);ctx.moveTo(-49,46);ctx.lineTo(42,46);ctx.stroke();
  ctx.strokeStyle='#394345';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-36,-38);ctx.lineTo(-36,-46);ctx.moveTo(26,-38);ctx.lineTo(26,-46);ctx.moveTo(-36,38);ctx.lineTo(-36,46);ctx.moveTo(26,38);ctx.lineTo(26,46);ctx.stroke();

  }
}

function drawActorSpeechCaption(actor,isAlly=false){
  if(!actor||actor.hp<=0||!actor.voiceText||performance.now()>(actor.voiceTextUntil||0))return;
  const visible=isAlly?allyIsVisibleToPlayer(actor):subjectIsVisible(actor);
  if(!visible)return;
  const point=worldToScreen(actor.x,actor.y);
  if(point.x<-120||point.x>W+120||point.y<-60||point.y>H+60)return;
  ctx.save();
  ctx.font='bold 9px monospace';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  const text=actor.voiceText;
  const width=Math.min(230,Math.max(38,ctx.measureText(text).width+12));
  const x=Math.round(point.x),y=Math.round(point.y-31);
  ctx.fillStyle='rgba(5,7,8,.76)';
  ctx.fillRect(x-width/2,y-8,width,16);
  ctx.strokeStyle=isAlly?'rgba(92,155,176,.88)':'rgba(142,145,140,.82)';
  ctx.strokeRect(x-width/2+.5,y-7.5,width-1,15);
  ctx.fillStyle=isAlly?'#c7e7ef':'#ece9df';
  ctx.fillText(text,x,y+.5);
  ctx.restore();
}

function drawMissionSupplyDrops(){
  for(const d of missionSupplyDrops){
    if(!d.active)continue;
    const p=worldToScreen(d.x,d.y);

    if(p.x<-80||p.x>W+80||sy<-100||sy>H+80)continue;
    if(!d.landed){
      ctx.strokeStyle='rgba(214,218,205,.48)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(p.x-14,sy-18);ctx.lineTo(p.x,sy-4);ctx.lineTo(p.x+14,sy-18);ctx.stroke();

    ctx.save();ctx.translate(Math.round(p.x),Math.round(sy));ctx.rotate(d.spin||0);
    ctx.fillStyle=d.type==='armor'?'#4c5d4d':'#594b34';
    ctx.fillRect(-11,-8,22,16);
    ctx.strokeStyle=d.type==='armor'?'#8ca18b':'#ae8d57';ctx.strokeRect(-10.5,-7.5,21,15);

  }

function render(){
  drawFloor();
  drawWeaponDebris();
  drawWalls();
  drawEmbeddedBullets();
  drawArmorPickup();
  drawCellDoor();
  drawFixtures();

  // 플레이어와 적의 총구 섬광을 이번 프레임의 순간광원으로 계산한다.
  frameMuzzleFlashLights=collectMuzzleFlashLights();

  drawVisibilityOcclusion(buildOcclusionPolygon());
  drawDarkness(buildVisibilityPolygon());

  if(gameStarted||introPlaying){
    drawTestSubjects();
    drawSquadAllies();
  }
  drawMissionObjectivesWorld();
  drawMissionSupplyDrops();
  drawHelicopterReinforcement();
  drawCombatSpeechCaptions();
  if(!inventory.open&&!levelComplete){
    if(introPlaying&&insertionPlayerAirborneHeight>0){
      drawInsertionPlayer();
    }else if(gameStarted){
      drawPlayer();
      drawMuzzleDirectionGuide();
      drawCrosshair();
    }
  }
  drawAirborneBloodSprays();
  drawAreaStatus();
  drawHealthHud();
  drawCasingCountHud();
  if(diagnosticSettings.weapon)drawWeaponHud();
  if(inventory.open)drawInventory();
  else if(!drawArmorPickupPrompt()&&!drawBuckshotSupplyPrompt())drawMagazinePickupPrompt();
  drawArmorPickupStatus();
  drawMissionObjectiveHud();
  drawDeathScreen();
  drawLevelComplete();
}

  const state=enemy.pistolState;
  const magazines=new Set(enemy.pistolMagazines||[]);
  if(state?.reloadMagazine)magazines.add(state.reloadMagazine);
  // Retained reload references may already belong to the floor or the gun.
  if(state?.reloadRetainedMagazine)magazines.add(state.reloadRetainedMagazine);
  if(state?.magazine)magazines.delete(state.magazine);
  for(const drop of droppedMagazines)magazines.delete(drop.magazine);
  let index=0;

  }
  enemy.pistolMagazines=[];

    state.reloading=false;state.reloadElapsed=0;state.reloadMagazine=null;state.reloadRetainedMagazine=null;
    state.reloadCommitted=false;state.reloadDiscarded=false;state.shotCycles=[];

function firstTouchedMeleeDummy(x,y,radius){
  return meleeDummies.find(dummy=>circleTouchesMeleeActorSprite(x,y,radius,dummy))||null;

function firstTouchedMeleeDummyAlongSegment(ax,ay,bx,by,radius){
  const length=Math.hypot(bx-ax,by-ay);
  const steps=Math.max(1,Math.ceil(length/2.5));
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const target=firstTouchedMeleeDummy(
      ax+(bx-ax)*t,ay+(by-ay)*t,radius
    );
    if(target)return target;
  }
  return null;
}

function tryPickupLongsword(){
  const pickup=armoryMeleePickups.find(item=>pickupFocused(item,52,25));
  if(!pickup)return false;
  if(
    !meleeState.active||!['knife','longsword'].includes(meleeState.weapon)||
    player.hp<=0||inventory.open||pistol.reloading||magazinePickup.active||weaponSwitch.active||
    meleeState.attack||knifeState.attack||pistolMelee.attack||smgMelee.attack||
    rifleMelee.attack||shotgunMelee.attack||longswordState.attack||longswordState.charging||longswordState.parry
  )return false;
  const pickedId=pickup.weaponId;
  const droppedId=meleeWeaponId;
  if(pickedId===droppedId)return false;
  pickup.weaponId=droppedId;
  meleeWeaponId=pickedId;
  // 같은 진열대에 기존 무기를 내려놓는다. 아밍소드와 장검은 동일한 양손 시스템을 공유한다.
  const pickedRig=meleeRigForWeapon(pickedId);
  if(meleeState.weapon==='knife'&&pickedRig==='longsword')requestKnifeExit('longsword');
  else if(meleeState.weapon==='longsword'&&pickedRig==='knife')requestLongswordExit('knife');
  else if(pickedRig==='longsword'){
    longswordState.drawBlend=.22;longswordState.drawTarget=1;
  }else{
    knifeState.drawBlend=.22;knifeState.drawTarget=1;knifeState.poseReady=false;
  }
  return true;
}

function meleeBleedProfile(style,amount){
  if(style==='shove')return{duration:.34,interval:.26,damage:0,drops:1};
  if(style==='bladeHeavy')return{duration:7.2,interval:.11,damage:1.05,drops:2};
  if(style==='bladeSlash')return{duration:5.8,interval:.13,damage:.72,drops:2};
  if(style==='bladeStab')return{duration:4.2,interval:.15,damage:.82,drops:1};
  if(style==='firearm'||style==='plasma')return{
    duration:clamp(1.0+amount*.060,1.35,4.8),
    interval:amount>=45?.13:.18,
    damage:.32+Math.min(.72,amount*.012),
    drops:amount>=45?2:1
  };
  // 둔상은 상처가 크게 벌어지지 않으므로 강한 타격에서만 비교적 오래 샌다.
  return{
    duration:clamp(.35+amount*.011,.45,2.7),
    interval:.24,
    damage:amount>=70?.42:.20,
    drops:amount>=120?2:1
  };
}

function startMeleeDummyBleeding(target,amount,attackAngle,style,hitX,hitY){
  if(!target||target.hp<=0)return;
  const profile=meleeBleedProfile(style,amount);
  const active=target.bleedTimer>0;
  const currentPower=((target.bleedDamage||0)+(target.bleedDrops||1)*.12)/(target.bleedInterval||1);
  const nextPower=(profile.damage+profile.drops*.12)/profile.interval;
  target.bleedTimer=Math.max(target.bleedTimer||0,profile.duration);
  target.bleedAccumulator=Math.min(target.bleedAccumulator||0,profile.interval*.5);
  // 약한 밀치기가 이미 진행 중인 칼상/총상을 덮어써 출혈을 약화시키지 않게 한다.
  if(!active||nextPower>=currentPower){
    target.bleedInterval=profile.interval;
    target.bleedDamage=profile.damage;
    target.bleedDrops=profile.drops;
    target.bleedStyle=style;
    target.bleedAttackAngle=attackAngle;
    const offset=Math.hypot(hitX-target.x,hitY-target.y);
    target.bleedSurfaceAngle=offset>1.5
      ?Math.atan2(hitY-target.y,hitX-target.x)
      :normAngle(attackAngle+Math.PI);
  }
}

const severedWoundEmitters=[];
function actorCanReceiveHit(actor){
  if(!actor)return false;
  if(actor.hp>0)return true;
  const d=actor.deathMotion;
  return !!d&&['body','bleed'].includes(d.kind)&&!d.forcedDown&&lightingTime-d.started<d.duration;
}
function collapseDyingActor(target,angle=target.deathAngle,amount=20,x=target.x,y=target.y,style='blunt'){
  if(!actorCanReceiveHit(target)||target.hp>0)return false;
  const d=target.deathMotion;
  const from={...deathMotionPose(target)};
  d.forcedFall={from,started:lightingTime,duration:.34,
    startProgress:clamp((lightingTime-d.started)/d.duration,0,1),
    angle,distance:clamp(2+Math.sqrt(Math.max(0,amount))*.55,3,8)};
  d.forcedDown=true;d.settled=null;
  if(style==='plasma')spawnPlasmaHitVapor(x,y,angle,amount,target);
  else{
    markBloodAtHit(target,x,y,2.2,angle,'#651016');
    spawnBlood(target,x,y,angle,Math.min(12,4+Math.round(amount/25)),style==='firearm'?'firearm':style);
  }
  return true;
}
function poolSeveredBlood(x,y,age,angle,neck=false){
  // Low-frequency additions directly to static ground chunks: no new moving droplets.
  const growth=smoothStep01(clamp((age-.65)/6.35,0,1));
  const radius=(neck?2:2.8)+(neck?5.5:7.5)*growth;
  bakeGroundBloodPool({x,y,rx:radius*1.25,ry:radius*.75,angle,color:'65,8,12',alpha:.42});
  bakeGroundBloodPool({x:x+Math.cos(angle+.7)*radius*.65,
    y:y+Math.sin(angle+.7)*radius*.65,rx:radius*.55,ry:radius*.42,
    angle:angle-.4,color:'72,10,14',alpha:.3});
}
function updateSeveredWounds(dt){
  for(let i=severedWoundEmitters.length-1;i>=0;i--){
    const e=severedWoundEmitters[i],d=e.target.deathMotion;
    if(e.target.hp>0||d!==e.death||e.age>=7){severedWoundEmitters.splice(i,1);continue;}
    e.age+=dt;e.next-=dt;
    if(e.next>0)continue;
    e.next=e.age<1.05?.16+e.age*.12:.4;
    const target=e.target,pose=deathMotionPose(target);
    const cx=target.x+pose.x,cy=target.y+pose.y;
    if(d.kind==='split'){
      const angle=target.swordSplit?.angle??target.deathAngle;
      const tx=Math.cos(angle),ty=Math.sin(angle),nx=-ty,ny=tx;
      const separation=2+10*smoothStep01(clamp((lightingTime-d.started)/.65,0,1));
      for(const side of [-1,1]){
        const along=(Math.random()-.5)*12;
        const wx=cx+nx*side*separation,wy=cy+ny*side*separation*pose.scale;
        if(e.age<1.05)spawnBlood(target,wx+tx*along,wy+ty*along*pose.scale,angle+side*Math.PI/2,2,'bleedDrip');
        else poolSeveredBlood(wx,wy,e.age,angle);
      }
    }else if(d.kind==='body'){
      poolSeveredBlood(cx+(d.woundX||0),cy+(d.woundY||0)*pose.scale,e.age,target.deathAngle,true);
    }else{
      if(e.age<1.05)spawnBlood(target,cx,cy,target.deathAngle,3,'bleedDrip');
      else poolSeveredBlood(cx,cy,e.age,target.deathAngle,true);
      const travel=1-Math.pow(1-clamp((lightingTime-d.started)/.85,0,1),3);
      const hx=target.x+Math.cos(target.deathAngle)*24*travel,hy=target.y+Math.sin(target.deathAngle)*24*travel;
      if(e.age<1.05)spawnBlood(target,hx,hy,target.deathAngle,1,'bleedDrip');
      else poolSeveredBlood(hx,hy,e.age,target.deathAngle,true);
    }
  }
}
function finishMeleeDummyDeath(target,angle,kind='body'){
  if(target.dead)return;
  target.swordSplit=null;
  target.deathMotion={kind,started:lightingTime,body:target.bodyAngle,head:target.headAngle,
    duration:kind==='bleed'?1.9:kind==='body'?1.5:.65};
  target.dead=true;
  dropSimulationEnemyInventory(target);
  target.respawnTimer=Math.max(1,target.deathMotion.duration+.3);
  target.deathAngle=normAngle(angle+(Math.random()-.5)*.35);
  target.corpseTurn=(Math.random()>.5?1:-1)*(.45+Math.random()*.25);
  target.voiceCooldown=0;
  target.bleedTimer=0;
  target.bleedAccumulator=0;
  if(kind==='headBurst'||kind==='decapitate')spawnBlood(target,target.x,target.y,angle,kind==='headBurst'?22:14,'bladeHeavy');
  if(kind==='bleed')spawnBlood(target,target.x,target.y,angle,18,'bleedDrip');
  if(kind==='split')target.swordSplit={angle,stains:[]};
  if(kind==='split'||kind==='decapitate'||(kind==='body'&&target.lastDeathBloodStyle==='firearm')){
    severedWoundEmitters.push({target,death:target.deathMotion,age:0,next:0});
    if(severedWoundEmitters.length>64)severedWoundEmitters.shift();
  }
  if(target===meleeDummy)speakMeleeDummy('ONE SECOND OF PEACE. FINALLY.',1);
}

function updateMeleeDummyBleeding(target,dt){
  if(!target||target.hp<=0||!(target.bleedTimer>0))return;
  target.bleedTimer=Math.max(0,target.bleedTimer-dt);
  target.bleedAccumulator=(target.bleedAccumulator||0)+dt;
  const interval=target.bleedInterval||.2;
  while(target.bleedAccumulator>=interval&&target.bleedTimer>0&&target.hp>0){
    target.bleedAccumulator-=interval;
    const surface=target.bleedSurfaceAngle||0;
    const hitX=target.x+Math.cos(surface)*7;
    const hitY=target.y+Math.sin(surface)*7;
    spawnBlood(
      target,hitX,hitY,target.bleedAttackAngle||0,
      target.bleedDrops||1,'bleedDrip'
    );
    const bleedDamage=target.bleedDamage||0;
    if(bleedDamage>0){
      target.hp=Math.max(0,target.hp-bleedDamage);
      target.hitFlash=Math.max(target.hitFlash||0,.035);
      if(target.hp<=0)finishMeleeDummyDeath(target,target.bleedAttackAngle||0,'bleed');
    }
  }
}

function spawnPlasmaHitVapor(x,y,angle,amount,anchor=null,exitWound=false){
  const heat=clamp(amount/270,0,1);
  const count=6+Math.round(heat*6);
  for(let i=0;i<count;i++){
    const direction=angle+(exitWound?0:Math.PI)+(Math.random()-.5)*2.2;
    const speed=18+Math.random()*(48+heat*28);
    const px=x+(Math.random()-.5)*3,py=y+(Math.random()-.5)*3;
    plasmaSteam.push({x:px,y:py,
      vx:Math.cos(direction)*speed,vy:Math.sin(direction)*speed,
      offsetX:anchor?px-anchor.x:0,offsetY:anchor?py-anchor.y:0,anchor,
      age:0,life:.24+Math.random()*.28,size:2+Math.random()*3,impact:true});
  }
  // 순간 비산과 별도로 상처에 붙어 천천히 솟는 잔열 증기. 바닥 피와는 무관하다.
  const woundCount=4+Math.round(heat*5);
  for(let i=0;i<woundCount;i++){
    const px=x+(Math.random()-.5)*2.5,py=y+(Math.random()-.5)*2.5;
    plasmaSteam.push({x:px,y:py,
      vx:(Math.random()-.5)*10,vy:-7-Math.random()*14,
      offsetX:anchor?px-anchor.x:0,offsetY:anchor?py-anchor.y:0,anchor,
      age:0,life:.56+Math.random()*.38,size:1.8+Math.random()*2.7,
      impact:true,woundSteam:true,exitWound});
  }
  if(plasmaSteam.length>450)plasmaSteam.splice(0,plasmaSteam.length-450);
}

const damageNumberPopups=[];
function spawnDamageNumber(target,amount,x,y,style='blunt'){
  if(!diagnosticSettings.damageNumbers||amount<=0)return;
  // 한 발의 산탄처럼 같은 순간 같은 적에게 들어간 피해는 하나의 합계로 읽힌다.
  const recent=diagnosticSettings.combineDamageNumbers?damageNumberPopups.find(popup=>
    popup.target===target&&popup.age<.10&&Math.hypot(popup.originX-x,popup.originY-y)<24
  ):null;
  if(recent){
    recent.amount+=amount;
    recent.x=(recent.x+x)*.5;
    recent.y=(recent.y+y)*.5;
    recent.originX=x;
    recent.originY=y;
    recent.age=0;
    return;
  }
  // 개별 표시에서는 같은 위치의 숫자가 포개지지 않도록 작은 부채꼴로 분산한다.
  const separateIndex=diagnosticSettings.combineDamageNumbers?0:
    damageNumberPopups.filter(popup=>popup.target===target&&popup.age<.24).length;
  const spreadOffset=separateIndex?((separateIndex%5)-2)*4:0;
  const tierOffset=separateIndex?Math.floor(separateIndex/5)*4:0;
  damageNumberPopups.push({target,amount,x:x+spreadOffset,y:y-tierOffset,
    originX:x,originY:y,age:0,life:.82,style});
  if(damageNumberPopups.length>48)damageNumberPopups.splice(0,damageNumberPopups.length-48);
}
function updateDamageNumbers(dt){
  for(let i=damageNumberPopups.length-1;i>=0;i--){
    const popup=damageNumberPopups[i];
    popup.age+=dt;
    popup.y-=dt*(12+Math.min(10,popup.amount*.04));
    if(popup.age>=popup.life)damageNumberPopups.splice(i,1);
  }
}
function drawDamageNumbers(){
  if(!diagnosticSettings.damageNumbers)return;
  ctx.save();
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.font='bold 11px monospace';
  ctx.lineJoin='round';
  ctx.lineWidth=3;
  for(const popup of damageNumberPopups){
    const p=worldToViewportScreen(popup.x,popup.y);
    const t=clamp(popup.age/popup.life,0,1);
    const alpha=1-smoothStep01(clamp((t-.55)/.45,0,1));
    const text=`-${Math.max(1,Math.round(popup.amount))}`;
    ctx.globalAlpha=alpha;
    ctx.strokeStyle='rgba(5,7,7,.92)';
    ctx.strokeText(text,Math.round(p.x),Math.round(p.y));
    ctx.fillStyle=popup.style==='plasma'?'#ffd1a0':
      (popup.style.startsWith('blade')?'#efaaa4':'#f0e6c7');
    ctx.fillText(text,Math.round(p.x),Math.round(p.y));
  }
  ctx.restore();
}

function damageMeleeDummy(amount,angle,x=null,y=null,bloodCount=null,bloodStyle='blunt',target=meleeDummy,impactKind=null,headshot=false){
  if(!target)return false;
  if(target.hp<=0)return amount>0?collapseDyingActor(target,angle,amount,x??target.x,y??target.y,bloodStyle):false;
  if(amount>0&&target.defense>0)amount=Math.max(1,amount-target.defense);
  if(x===null)x=target.x;
  if(y===null)y=target.y;
  const hpBefore=target.hp;
  if(amount>0&&(bloodStyle==='blunt'||bloodStyle==='shove'||bloodStyle.startsWith('blade'))){
    const kind=impactKind||(bloodStyle.startsWith('blade')?'blade':bloodStyle);
    const weaponId=kind==='fist'||kind==='shove'?'':kind==='blade'
      ?(meleeState.weapon==='longsword'?meleeWeaponId:'knife'):currentWeaponDef().id;
    playMeleeImpactSound(kind,amount,x,y,weaponId);
  }
  target.hp=Math.max(0,target.hp-amount);
  spawnDamageNumber(target,hpBefore-target.hp,x,y,bloodStyle);
  target.hitFlash=.16;
  let resolvedBloodCount=bloodCount;
  if(resolvedBloodCount===null){
    // 둔기는 타격 위력에 따라 가까운 비산량만 증가한다. 날붙이/총기는 호출부의 전용 값을 쓴다.
    resolvedBloodCount=bloodStyle==='blunt'
      ?clamp(Math.round(3+amount*.048),4,14)
      :9;
    if(target.hp<=0)resolvedBloodCount=Math.ceil(resolvedBloodCount*1.7);
  }
  if(bloodStyle==='plasma')spawnPlasmaHitVapor(x,y,angle,amount,target,false);
  else spawnBlood(target,x,y,angle,resolvedBloodCount,bloodStyle);
  if(target.hp>0)startMeleeDummyBleeding(target,amount,angle,bloodStyle,x,y);
  if(target.hp<=0){
    target.lastDeathBloodStyle=bloodStyle;
    const sword=bloodStyle.startsWith('blade')&&meleeState.weapon==='longsword';
    const kind=sword?(headshot?'decapitate':'split'):
      bloodStyle.startsWith('blade')?'bleed':headshot&&bloodStyle!=='plasma'?'headBurst':'body';
    finishMeleeDummyDeath(target,angle,kind);
    target.deathMotion.woundX=clamp(x-target.x,-8,8);
    target.deathMotion.woundY=clamp(y-target.y,-8,8);
  }
  return true;
}

function updateLongswordState(dt,targetAngle){
  const aimBase=updateMeleeAimMotion(
    targetAngle,dt,meleeWeaponId==='armingSword'?'armingSword':'longsword',
    !!(longswordState.attack||longswordState.parry||longswordState.charging)
  );
  player.bodyAngle=normAngle(
    player.bodyAngle+normAngle(aimBase-player.bodyAngle)*Math.min(1,dt*16)
  );
  longswordState.drawBlend+=(longswordState.drawTarget-longswordState.drawBlend)*
    Math.min(1,dt*(longswordState.drawTarget?8:11));
  longswordState.guardBlend+=((((longswordState.guardHeld||longswordState.parry)&&!longswordState.attack&&!longswordState.charging)?1:0)-longswordState.guardBlend)*
    Math.min(1,dt*(longswordState.guardHeld?13:10));
  longswordState.guardFlash=Math.max(0,longswordState.guardFlash-dt);
  if(longswordState.parry){
    longswordState.parryElapsed+=dt;
    const p=clamp(longswordState.parryElapsed/longswordState.parryDuration,0,1);
    longswordState.parryWindow=p>=.08&&p<=.34?1:0;
    tryLongswordParryHit();
    if(p>=1){
      longswordState.parry=false;
      longswordState.parryElapsed=0;
      longswordState.parryWindow=0;
      longswordState.parryPreviousBlade=null;
    }
  }
  if(longswordState.charging){
    longswordState.charge=Math.min(1,longswordState.charge+dt/.52);
  }
  if(longswordState.attack){
    longswordState.elapsed+=dt;
    tryLongswordHit();
    if(longswordState.elapsed>=longswordState.duration){
      longswordState.attack=false;
      longswordState.elapsed=0;
      longswordState.hitDone=false;
      longswordState.previousTip=null;
      longswordState.charge=0;
    }
  }
  if(!longswordState.sheathing||longswordState.drawBlend>=.08)return;
  const target=longswordState.exitTarget;
  const weaponId=longswordState.exitWeaponId;
  longswordState.drawBlend=0;
  longswordState.sheathing=false;
  longswordState.exitTarget=null;
  longswordState.exitWeaponId=null;
  meleeState.active=false;
  meleeState.weapon='fists';
  if(target==='knife'){
    meleeState.active=true;
    meleeState.weapon='knife';
    knifeState.attack=null;
    knifeState.drawBlend=0;
    knifeState.drawTarget=1;
    knifeState.sheathing=false;
    knifeState.guardHeld=false;
    knifeState.guardBlend=0;
    knifeState.poseReady=false;
  }else if(target==='fists'){
    meleeState.active=true;
  }else if(target==='weapon'){
    beginWeaponDrawFromMelee(weaponId||pistol.weaponId);
  }
}

function beginLongswordCharge(){
  if(
    !meleeState.active||meleeState.weapon!=='longsword'||longswordState.drawBlend<.88||
    longswordState.sheathing||longswordState.attack||longswordState.charging||longswordState.parry||longswordState.guardHeld||longswordState.guardBlend>.12||
    player.hp<=0||meleeBlockedBySprint()
  )return false;
  longswordState.charging=true;
  longswordState.charge=0;
  return true;
}

function beginLongswordParry(){
  if(
    !meleeState.active||meleeState.weapon!=='longsword'||longswordState.drawBlend<.88||
    longswordState.sheathing||longswordState.attack||longswordState.charging||longswordState.parry||
    !longswordState.guardHeld||longswordState.guardBlend<.55||player.hp<=0||meleeBlockedBySprint()
  )return false;
  longswordState.parry=true;
  longswordState.parryElapsed=0;
  longswordState.parryWindow=0;
  longswordState.parryPreviousBlade=null;
  longswordState.parryHitTargets=new Set();
  return true;
}

function releaseLongswordSlash(){
  if(!longswordState.charging)return false;
  const power=longswordState.charge;
  longswordState.charging=false;
  longswordState.attack=true;
  longswordState.elapsed=0;
  longswordState.swingDuration=(.29+power*.07)*.38;
  longswordState.recoveryDuration=(.36+power*.09)*.62;
  longswordState.duration=longswordState.swingDuration+longswordState.recoveryDuration;
  longswordState.pendingHeadContact=null;
  longswordState.headTarget=firearmImpactIntent('player',null).target;
  longswordState.hitDone=false;
  longswordState.previousTip=null;
  longswordState.previousBlade=null;
  longswordState.hitTargets=new Set();
  longswordState.rebound=null;
  return true;
}

function longswordSwingMoveMultiplier(){
  if(!meleeState.active||meleeState.weapon!=='longsword'||!longswordState.attack||longswordState.duration<=0)return 1;
  const p=longswordAttackPhase();
  const weighted=.56-.10*smoothStep01(longswordState.charge||0);
  if(p<.10)return 1-(1-weighted)*smoothStep01(p/.10);
  if(p<.48)return weighted;
  if(p<.80)return weighted+(1-weighted)*smoothStep01((p-.48)/.32);
  return 1;
}

function knifeAttackProgress(){
  return knifeState.attack?clamp(knifeState.elapsed/knifeState.duration,0,1):0;
}

function knifeAngleLerp(a,b,t){return a+normAngle(b-a)*t;}

function knifeTargetPose(){
  const p=knifeAttackProgress();
  const reverse=smoothStep01(knifeState.gripBlend);
  const forwardIdle={x:13.2,y:3.1};
  // 역수 아이들: 오른팔 팔꿈치는 몸 바깥으로 벌리고 손은 중심선 안쪽으로 접는다.
  // 칼은 주먹에서 곧장 전방으로 빠져 항상 상대를 향한다.
  const reverseIdle={x:9.8,y:-2.8};
  const reverseIdleAngle=-.04;
  let hand=lerpPoint(forwardIdle,reverseIdle,reverse);
  let angle=knifeAngleLerp(-.10,reverseIdleAngle,reverse);
  let bodyTurn=0;
  if(!knifeState.attack){
    // 역수 1타가 끝난 뒤에는 다음 입력 시간 동안 왼쪽 끝자세를 유지한다.
    // 여기서 2타를 누르면 손을 되감지 않고 그대로 전방 찌르기로 이어진다.
    if(knifeState.grip==='reverse'&&knifeState.comboStep===1&&knifeState.comboWindow>0){
      hand={x:15.8,y:-5.6};
      angle=.02;
    }
    const guard=smoothStep01(knifeState.guardBlend);
    // 어느 파지든 왼쪽을 겨누지 않는다. 손을 중심선 왼쪽에 두고 칼날은
    // 오른쪽 전방으로 가로질러, 이어지는 쳐내기의 출발 자세를 만든다.
    const guardHand=lerpPoint({x:10.2,y:-3.6},{x:8.8,y:-4.2},reverse);
    const guardAngle=knifeAngleLerp(.52,.68,reverse);
    hand=lerpPoint(hand,guardHand,guard);
    angle=knifeAngleLerp(angle,guardAngle,guard);
  }
  if(knifeState.attack==='combo'){
    const step=knifeState.comboStep;
    const stab=(knifeState.grip==='forward'&&step===1)||(knifeState.grip==='reverse'&&step===2);
    if(stab){
      const base=knifeState.grip==='reverse'?{x:15.8,y:-5.6}:forwardIdle;
      const thrust=knifeState.grip==='reverse'?{x:24.8,y:-4.5}:{x:24.3,y:1.5};
      let drive;
      if(p<.18)drive=-.12*smoothStep01(p/.18);
      else if(p<.48)drive=-.12+1.12*(1-Math.pow(1-(p-.18)/.30,3));
      else drive=1-smoothStep01((p-.48)/.52);
      hand=lerpPoint(base,thrust,drive);
      angle=knifeState.grip==='reverse'?.02:-.04;
      bodyTurn=(knifeState.grip==='reverse'?.16:-.16)*Math.max(0,drive);
    }else if(knifeState.grip==='reverse'&&step===3){
      // 역수 마무리: 팔꿈치를 몸 가까이 둔 채 짧게 감아 오른쪽으로 강하게 찍어 긋는다.
      // 손 자체를 멀리 보내지 않아 사거리는 짧지만, 손목 스냅과 몸통 회전은 더 크다.
      const ready={x:9.6,y:-4.6};
      const cutStart={x:11.2,y:-6.0};
      const cutEnd={x:14.1,y:5.2};
      const rebound={x:12.4,y:3.5};
      if(p<.22){
        const t=smoothStep01(p/.22);
        hand=lerpPoint(reverseIdle,ready,t);
        angle=knifeAngleLerp(reverseIdleAngle,-1.08,t);
      }else if(p<.52){
        const t=1-Math.pow(1-(p-.22)/.30,4);
        hand=lerpPoint(cutStart,cutEnd,t);
        angle=knifeAngleLerp(-1.08,.98,t);
      }else if(p<.68){
        const t=smoothStep01((p-.52)/.16);
        hand=lerpPoint(cutEnd,rebound,t);
        angle=knifeAngleLerp(.98,.62,t);
      }else{
        const t=smoothStep01((p-.68)/.32);
        hand=lerpPoint(rebound,reverseIdle,t);
        angle=knifeAngleLerp(.62,reverseIdleAngle,t);
      }
      const torque=Math.sin(Math.min(1,p/.72)*Math.PI);
      bodyTurn=-.52*torque+.10*Math.sin(clamp((p-.50)/.20,0,1)*Math.PI);
    }else{
      const leftToRight=(knifeState.grip==='forward'&&step===2)||(knifeState.grip==='reverse'&&step===3);
      const start={x:14.2,y:leftToRight?-8.0:8.0};
      const finish={x:18.3,y:leftToRight?7.4:-7.4};
      const startAngle=leftToRight?-.92:.92;
      const finishAngle=leftToRight?.84:-.84;
      if(p<.20){
        const t=smoothStep01(p/.20);
        hand=lerpPoint(lerpPoint(forwardIdle,reverseIdle,reverse),start,t);
        angle=knifeAngleLerp(knifeAngleLerp(-.10,reverseIdleAngle,reverse),startAngle,t);
      }else if(p<.61){
        const t=1-Math.pow(1-(p-.20)/.41,3);
        hand=lerpPoint(start,finish,t);
        angle=knifeAngleLerp(startAngle,finishAngle,t);
      }else{
        const t=smoothStep01((p-.61)/.39);
        const chainHold=knifeState.grip==='reverse'&&step===1;
        const recoverHand=chainHold?{x:15.8,y:-5.6}:lerpPoint(forwardIdle,reverseIdle,reverse);
        const recoverAngle=chainHold?.02:knifeAngleLerp(-.10,reverseIdleAngle,reverse);
        hand=lerpPoint(finish,recoverHand,t);
        angle=knifeAngleLerp(finishAngle,recoverAngle,t);
      }
      bodyTurn=(leftToRight?-.38:.38)*Math.sin(p*Math.PI);
    }
  }else if(knifeState.attack==='parry'){
    // 가드 자세 자체는 유지하고, 패링 순간에만 정수/역수 공통으로 팔 전체를 쓴다.
    // 칼을 왼쪽 바깥까지 크게 감았다가 오른쪽 바깥까지 한 번에 쓸어낸다.
    const guardHand=lerpPoint({x:10.2,y:-3.6},{x:8.8,y:-4.2},reverse);
    // 전방으로 찌르지 않고 몸 앞의 일정한 거리에서 좌우로 크게 횡단한다.
    // 오른쪽 끝에서도 손을 멀리 뻗지 않아 궤적이 대각선 베기로 보이지 않는다.
    const wind={x:8.2,y:-22.6};
    const swat={x:10.8,y:22.4};
    const followThrough={x:7.8,y:25.0};
    const guardAngle=knifeAngleLerp(.52,.68,reverse);
    if(p<.18){
      const t=smoothStep01(p/.18);
      hand=lerpPoint(guardHand,wind,t);
      angle=knifeAngleLerp(guardAngle,-1.12,t);
    }else if(p<.52){
      const t=1-Math.pow(1-(p-.18)/.34,4);
      hand=lerpPoint(wind,swat,t);
      // 칼날도 팔의 진행 방향을 따라 왼쪽에서 오른쪽으로 크게 회전한다.
      angle=knifeAngleLerp(-1.12,1.08,t);
    }else if(p<.66){
      const t=smoothStep01((p-.52)/.14);
      hand=lerpPoint(swat,followThrough,t);
      angle=knifeAngleLerp(1.08,1.28,t);
    }else{
      const t=smoothStep01((p-.66)/.34);
      hand=lerpPoint(followThrough,guardHand,t);
      angle=knifeAngleLerp(1.28,guardAngle,t);
    }
    // 준비할 때 왼쪽으로 살짝 감고, 칼이 지나가는 방향을 따라 몸통도 오른쪽으로
    // 꺾는다. 팔만 몸에서 분리되어 횡으로 미끄러지는 인상을 없앤다.
    if(p<.18){
      bodyTurn=-.24*smoothStep01(p/.18);
    }else if(p<.52){
      bodyTurn=knifeAngleLerp(-.24,.48,1-Math.pow(1-(p-.18)/.34,3));
    }else if(p<.66){
      bodyTurn=.48;
    }else{
      bodyTurn=.48*(1-smoothStep01((p-.66)/.34));
    }
  }
  const waist={x:-2.5,y:8.5};
  hand=lerpPoint(waist,hand,smoothStep01(knifeState.drawBlend));
  angle=knifeAngleLerp(1.42,angle,smoothStep01(knifeState.drawBlend));
  return{hand,angle,bodyTurn};
}

function knifeMotionPose(){
  if(!knifeState.poseReady)return knifeTargetPose();
  return{
    hand:{x:knifeState.poseHand.x,y:knifeState.poseHand.y},
    angle:knifeState.poseAngle,
    bodyTurn:knifeState.poseBodyTurn
  };
}

function updateKnifePoseMotion(dt){
  const target=knifeTargetPose();
  if(!knifeState.poseReady){
    knifeState.poseHand={x:target.hand.x,y:target.hand.y};
    knifeState.poseAngle=target.angle;
    knifeState.poseBodyTurn=target.bodyTurn;
    knifeState.poseReady=true;
    return;
  }
  // 타격의 날카로움은 살리되 상태가 바뀌는 순간은 짧은 관성으로 연결한다.
  const rate=knifeState.attack==='parry'?42:(knifeState.attack?30:(knifeState.sheathing?13:17));
  const blend=1-Math.exp(-rate*dt);
  knifeState.poseHand=lerpPoint(knifeState.poseHand,target.hand,blend);
  knifeState.poseAngle=knifeAngleLerp(knifeState.poseAngle,target.angle,blend);
  knifeState.poseBodyTurn+=normAngle(target.bodyTurn-knifeState.poseBodyTurn)*blend;
}

function beginMeleeFromGun(type){
  if(plasmaHolsterLocked())return false;
  if(
    meleeState.active||player.hp<=0||inventory.open||pistol.reloading||magazinePickup.active||
    weaponSwitch.active||pistolMelee.attack||smgMelee.attack||rifleMelee.attack||
    shotgunMelee.attack||shotgunMelee.recovery>0
  )return false;
  mouse.down=false;mouse.aim=false;player.aimBlend=0;player.longGunBraceBlend=0;
  weaponSwitch.active=true;
  weaponSwitch.elapsed=0;
  weaponSwitch.duration=.38;
  weaponSwitch.commitRatio=.56;
  weaponSwitch.committed=false;
  weaponSwitch.pendingWeaponId=null;
  weaponSwitch.pickupSwap=null;
  weaponSwitch.pendingMeleeWeapon=type;
  return true;
}

function beginWeaponDrawFromMelee(weaponId){
  const next=ownedWeaponState(weaponId);
  if(!next||!availableWeaponIds.has(weaponId))return false;
  // 비무장/단검 상태에는 먼저 집어넣을 총이 없다. 목표 무기를 즉시 렌더 대상으로
  // 지정하고, 화면에서는 그 무기가 허리에서 올라오는 후반 드로우만 재생한다.
  commitPlayerWeaponState(weaponId,next);
  meleeState.active=false;
  meleeState.weapon='fists';
  mouse.down=false;mouse.aim=false;player.aimBlend=0;player.longGunBraceBlend=0;
  weaponSwitch.active=true;
  weaponSwitch.elapsed=0;
  weaponSwitch.duration=.48;
  weaponSwitch.commitRatio=.34;
  weaponSwitch.committed=true;
  weaponSwitch.pendingWeaponId=null;
  weaponSwitch.pickupSwap=null;
  weaponSwitch.pendingMeleeWeapon=null;
  return true;
}

function requestKnifeExit(target,weaponId=null){
  if(!meleeState.active||meleeState.weapon!=='knife')return false;
  knifeState.exitTarget=target;
  knifeState.exitWeaponId=weaponId;
  // 공격 중 전환 입력도 버리지 않는다. 현재 화면 자세에서 바로 수납 궤적으로 보간한다.
  knifeState.attack=null;
  knifeState.elapsed=0;
  knifeState.hitDone=false;
  knifeState.queuedCombo=false;
  knifeState.comboStep=0;
  knifeState.comboWindow=0;
  knifeState.parryWindow=0;
  knifeState.parryPreviousTip=null;
  knifeState.drawTarget=0;
  knifeState.sheathing=true;
  knifeState.guardHeld=false;
  return true;
}

function equipWeaponFreely(weaponId){
  if(!weaponStates[weaponId]||!availableWeaponIds.has(weaponId))return false;
  if(meleeState.active&&meleeState.weapon==='knife')return requestKnifeExit('weapon',weaponId);
  if(meleeState.active&&meleeState.weapon==='longsword')return requestLongswordExit('weapon',weaponId);
  if(meleeState.active)return beginWeaponDrawFromMelee(weaponId);
  return equipWeaponById(weaponId);
}

function toggleMeleeWeapon(){
  if(meleeState.active&&meleeState.weapon===meleeRigForWeapon(meleeWeaponId)){
    return isSwordWeapon(meleeWeaponId)
      ?requestLongswordExit('weapon',pistol.weaponId)
      :requestKnifeExit('weapon',pistol.weaponId);
  }
  if(!meleeState.active)return beginMeleeFromGun(meleeWeaponId);
  if(meleeState.weapon==='fists'){
    if(isSwordWeapon(meleeWeaponId))beginLongswordDraw();
    else{
      meleeState.weapon='knife';
      knifeState.drawBlend=0;knifeState.drawTarget=1;knifeState.sheathing=false;
      knifeState.guardHeld=false;knifeState.guardBlend=0;knifeState.poseReady=false;
    }
    return true;
  }
  return false;
}

function toggleKnife(){
  if(plasmaHolsterLocked())return false;
  if(
    player.hp<=0||inventory.open||pistol.reloading||magazinePickup.active||weaponSwitch.active||
    meleeState.attack||pistolMelee.attack||smgMelee.attack||
    rifleMelee.attack||shotgunMelee.attack||shotgunMelee.recovery>0
  )return false;
  mouse.down=false;mouse.aim=false;player.aimBlend=0;player.longGunBraceBlend=0;
  if(meleeState.active&&meleeState.weapon==='knife'){
    return requestKnifeExit('weapon',pistol.weaponId);
  }else if(!meleeState.active){
    return beginMeleeFromGun('knife');
  }else{
    meleeState.active=true;
    meleeState.weapon='knife';
    knifeState.drawBlend=0;
    knifeState.drawTarget=1;
    knifeState.sheathing=false;
    knifeState.guardHeld=false;
    knifeState.guardBlend=0;
    knifeState.poseReady=false;
  }
  return true;
}

function knifeReadyForAction(){
  return meleeState.active&&meleeState.weapon==='knife'&&
    knifeState.drawBlend>=.88&&!knifeState.sheathing&&player.hp>0&&!meleeBlockedBySprint();
}

function startKnifeComboStage(step){
  if(!knifeReadyForAction())return false;
  knifeState.attack='combo';
  knifeState.comboStep=step;
  knifeState.elapsed=0;
  const stab=(knifeState.grip==='forward'&&step===1)||(knifeState.grip==='reverse'&&step===2);
  knifeState.duration=knifeState.grip==='reverse'&&step===3?.38:(stab?.35:.40);
  knifeState.hitDone=false;
  knifeState.hitTargets=new Set();
  knifeState.previousBlade=null;
  knifeState.parryWindow=0;
  return true;
}

function beginKnifeCombo(){
  if(knifeState.attack){
    if(knifeState.attack==='combo')knifeState.queuedCombo=true;
    return true;
  }
  const next=knifeState.comboWindow>0&&knifeState.comboStep>0?knifeState.comboStep%3+1:1;
  knifeState.comboWindow=0;
  return startKnifeComboStage(next);
}

function beginKnifeParry(){
  if(knifeState.attack||!knifeReadyForAction()||!knifeState.guardHeld)return false;
  knifeState.attack='parry';
  knifeState.elapsed=0;
  knifeState.duration=.50;
  knifeState.hitDone=false;
  knifeState.hitTargets=new Set();
  knifeState.previousBlade=null;
  knifeState.parryPreviousTip=null;
  knifeState.comboStep=0;
  knifeState.comboWindow=0;
  knifeState.queuedCombo=false;
  knifeState.parryWindow=0;
  return true;
}

function toggleKnifeGrip(){
  if(knifeState.attack||!knifeReadyForAction())return false;
  knifeState.grip=knifeState.grip==='forward'?'reverse':'forward';
  knifeState.comboStep=0;
  knifeState.comboWindow=0;
  knifeState.queuedCombo=false;
  return true;
}

function tryKnifeHit(){
  if(knifeState.hitDone||knifeState.attack!=='combo')return;
  const p=knifeAttackProgress();
  const step=knifeState.comboStep;
  const stab=(knifeState.grip==='forward'&&step===1)||(knifeState.grip==='reverse'&&step===2);
  const reverseFinisher=knifeState.grip==='reverse'&&step===3;
  const start=reverseFinisher?.25:(stab?.25:.29);
  const end=reverseFinisher?.58:(stab?.57:.68);
  const blade=knifeWorldBlade(knifeMotionPose());
  const previous=knifeState.previousBlade;
  knifeState.previousBlade=blade;
  if(p<start)return;
  if(p>end){knifeState.hitDone=true;return;}
  const pose=knifeMotionPose();
  const angle=player.bodyAngle+pose.bodyTurn;
  const contacts=sweptBladeContacts(blade,previous,3.5);
  if(!knifeState.hitTargets)knifeState.hitTargets=new Set();
  for(const {target,point,along} of contacts){
  if(knifeState.hitTargets.has(target))continue;
  knifeState.hitTargets.add(target);
  const comboBonus=step===3?8:0;
  const damage=reverseFinisher
    ?knifeState.reverseFinisherDamage
    :(stab?knifeState.stabDamage:knifeState.slashDamage)+comboBonus;
  const bladeStyle=reverseFinisher?'bladeHeavy':(stab?'bladeStab':'bladeSlash');
  const bladeBlood=target.hp<=damage
    ?(reverseFinisher?42:(stab?28:36))
    :(reverseFinisher?22:(stab?12:18));
  damageMeleeDummy(damage,angle,point.x,point.y,bladeBlood,bladeStyle,target);
  addSurfaceBloodMark(
    knifeState,'blade',clamp(along*13.5,1.8,12.7),(Math.random()-.5)*1.1,
    reverseFinisher?2.2:(stab?1.35:1.7),0,'#641015',reverseFinisher||target.hp<=0
  );
  if(target.hp>0){
    const force=reverseFinisher?30:(stab?28:20);
    target.pushVelocityX+=Math.cos(angle)*force;
    target.pushVelocityY+=Math.sin(angle)*force;
  }
  }
}

// Sweep the actual blade edge only; guards, hands and handles never inherit this hitbox.
function sweptBladeContacts(blade,previous,radius,minAlong=0,maxAlong=1){
  previous=previous||blade;
  const travel=Math.max(Math.hypot(blade.base.x-previous.base.x,blade.base.y-previous.base.y),Math.hypot(blade.tip.x-previous.tip.x,blade.tip.y-previous.tip.y));
  const steps=Math.max(1,Math.ceil(travel/2));
  const segments=Math.max(1,Math.ceil(Math.hypot(blade.tip.x-blade.base.x,blade.tip.y-blade.base.y)/2));
  const contacts=[];
  const seen=new Set();
  for(let t=0;t<=steps;t++){
    const base=lerpPoint(previous.base,blade.base,t/steps);
    const tip=lerpPoint(previous.tip,blade.tip,t/steps);
    const startSegment=Math.ceil(segments*minAlong);
    const endSegment=Math.floor(segments*maxAlong);
    for(let s=startSegment;s<=endSegment;s++){
      const point=lerpPoint(base,tip,s/segments);
      for(const target of meleeDummies){
        if(!actorCanReceiveHit(target)||seen.has(target))continue;
        if(circleTouchesMeleeActorSprite(point.x,point.y,radius,target)){
          seen.add(target);contacts.push({
            target,point,along:s/segments,
            contactBlade:{base:{...base},tip:{...tip}}
          });
        }
      }
    }
  }
  return contacts;
}

function knifeWorldBlade(pose){
  const bodyAngle=player.bodyAngle+pose.bodyTurn;
  const ca=Math.cos(bodyAngle),sa=Math.sin(bodyAngle);
  const localTip={
    x:pose.hand.x+Math.cos(pose.angle)*13.5,
    y:pose.hand.y+Math.sin(pose.angle)*13.5
  };
  return{
    base:{
      x:player.x+pose.hand.x*ca-pose.hand.y*sa,
      y:player.y+pose.hand.x*sa+pose.hand.y*ca
    },
    tip:{
      x:player.x+localTip.x*ca-localTip.y*sa,
      y:player.y+localTip.x*sa+localTip.y*ca
    }
  };
}

function tryKnifeParryHit(){
  if(knifeState.hitDone||knifeState.attack!=='parry')return;
  const p=knifeAttackProgress();
  const blade=knifeWorldBlade(knifeMotionPose());
  const previous=knifeState.parryPreviousTip;
  const previousBlade=knifeState.previousBlade;
  knifeState.previousBlade=blade;
  knifeState.parryPreviousTip={x:blade.tip.x,y:blade.tip.y};
  if(p<.18)return;
  if(p>.64){knifeState.hitDone=true;return;}

  // 손잡이부터 칼끝까지, 그리고 직전 프레임의 칼끝부터 현재 칼끝까지 모두 훑는다.
  // 크게 휘두를 때 칼날이 한 프레임 사이에 적을 건너뛰어도 타격이 빠지지 않는다.
  if(!knifeState.hitTargets)knifeState.hitTargets=new Set();
  for(const {target,point,along} of sweptBladeContacts(blade,previousBlade,4)){
  if(knifeState.hitTargets.has(target))continue;
  knifeState.hitTargets.add(target);
  const angle=previous
    ?Math.atan2(blade.tip.y-previous.y,blade.tip.x-previous.x)
    :player.bodyAngle;
  const damage=knifeState.parryDamage;
  damageMeleeDummy(
    damage,angle,point.x,point.y,target.hp<=damage?28:13,'bladeSlash',target
  );
  stunParriedMeleeSource(target);
  addSurfaceBloodMark(
    knifeState,'blade',clamp(along*13.5,1.8,12.7),(Math.random()-.5)*1.1,
    1.65,0,'#641015',target.hp<=0
  );
  if(target.hp>0){
    target.pushVelocityX+=Math.cos(angle)*15;
    target.pushVelocityY+=Math.sin(angle)*15;
  }
  }
}

function updateKnifeState(dt,targetAngle){
  const aimBase=updateMeleeAimMotion(targetAngle,dt,'knife',!!knifeState.attack);
  player.bodyAngle=normAngle(
    player.bodyAngle+normAngle(aimBase-player.bodyAngle)*Math.min(1,dt*20)
  );
  knifeState.drawBlend+=(knifeState.drawTarget-knifeState.drawBlend)*
    Math.min(1,dt*(knifeState.drawTarget?10:18));
  knifeState.guardBlend+=((knifeState.guardHeld&&!knifeState.sheathing?1:0)-knifeState.guardBlend)*
    Math.min(1,dt*(knifeState.guardHeld?16:12));
  knifeState.gripBlend+=((knifeState.grip==='reverse'?1:0)-knifeState.gripBlend)*Math.min(1,dt*14);
  knifeState.comboWindow=Math.max(0,knifeState.comboWindow-dt);
  if(!knifeState.attack&&knifeState.comboWindow<=0)knifeState.comboStep=0;
  knifeState.parryWindow=Math.max(0,knifeState.parryWindow-dt);
  knifeState.parryFlash=Math.max(0,knifeState.parryFlash-dt);
  if(knifeState.sheathing&&knifeState.drawBlend<.10){
    const exitTarget=knifeState.exitTarget;
    const exitWeaponId=knifeState.exitWeaponId;
    knifeState.drawBlend=0;
    knifeState.sheathing=false;
    knifeState.exitTarget=null;
    knifeState.exitWeaponId=null;
    meleeState.active=false;
    meleeState.weapon='fists';
    if(exitTarget==='fists'){
      meleeState.active=true;
    }else if(exitTarget==='longsword'){
      beginLongswordDraw();
    }else if(exitTarget==='weapon'){
      beginWeaponDrawFromMelee(exitWeaponId||pistol.weaponId);
    }
    return;
  }
  if(knifeState.attack){
    knifeState.elapsed+=dt;
    if(knifeState.attack==='parry'){
      const p=knifeAttackProgress();
      knifeState.parryWindow=p>=.18&&p<=.58?.04:0;
    }
  }
  updateKnifePoseMotion(dt);
  if(!knifeState.attack)return;
  tryKnifeHit();
  tryKnifeParryHit();
  if(knifeState.attack==='combo'&&knifeState.queuedCombo&&knifeAttackProgress()>=.67){
    const next=knifeState.comboStep%3+1;
    knifeState.attack=null;
    knifeState.queuedCombo=false;
    startKnifeComboStage(next);
    return;
  }
  if(knifeState.elapsed>=knifeState.duration){
    const completedAttack=knifeState.attack;
    const completedStep=knifeState.comboStep;
    knifeState.attack=null;
    knifeState.elapsed=0;
    knifeState.hitDone=false;
    knifeState.parryWindow=0;
    knifeState.parryPreviousTip=null;
    knifeState.queuedCombo=false;
    if(completedAttack==='combo'){
      if(completedStep<3)knifeState.comboWindow=.38;
      else knifeState.comboStep=0;
    }
  }
}

// 팔과 몸통을 타임라인 좌표에 바로 붙이지 않고, 속도가 남는 2차 모션으로 추적한다.
// 이 속도는 잽에서 스트레이트로 넘어갈 때 초기화하지 않아 원투가 한 동작처럼 이어진다.
const meleeMotion={
  extension:0,
  extensionVelocity:0,
  bodyTurn:0,
  bodyTurnVelocity:0
};

// 권총을 놓지 않은 채 이어지는 스페이스 2타: 왼손 밀기 -> 탄창 바닥 후려치기.
const pistolMelee={
  attack:null,
  elapsed:0,
  duration:0,
  queuedSecond:false,
  secondWindow:0,
  hitDone:false,
  palmDamage:6,
  magazineDamage:65
};

const smgMelee={
  attack:null,
  elapsed:0,
  duration:0,
  queuedSecond:false,
  secondWindow:0,
  flowingFromMuzzle:false,
  hitDone:false,
  muzzleDamage:25,
  bodyPushDamage:30
};

const rifleMelee={
  attack:null,
  elapsed:0,
  duration:0,
  queuedNext:false,
  secondWindow:0,
  nextWindowStep:0,
  chainedEntry:false,
  flowingFromMuzzle:false,
  hitDone:false,
  hitAtElapsed:-1,
  muzzleDamage:60,
  sweepDamage:115,
  stockDamage:170
};

function rifleMeleeProgress(){
  if(!rifleMelee.attack||rifleMelee.duration<=0)return 0;
  return clamp(rifleMelee.elapsed/rifleMelee.duration,0,1);
}

function rifleMuzzlePulse01(p){
  p=clamp(p,0,1);
  if(p<.27)return 1-Math.pow(1-p/.27,4);
  if(p<.39)return 1;
  return 1-smoothStep01((p-.39)/.61);
}

function rifleStockSweepPose(p){
  p=clamp(p,0,1);
  if(rifleMelee.flowingFromMuzzle){
    // 뻗은 총구를 회수하지 않고 그 전진 관성을 바로 몸통 회전과 개머리판에 넘긴다.
    if(p<.14){
      const t=smoothStep01(p/.14);
      return{turn:-.18*t,side:-1.2*t,forward:7.5-1.2*t,
        bodyTurn:-.08*t,drive:.22+.18*t,grip:0};
    }
    if(p<.61){
      const drive=1-Math.pow(1-(p-.14)/.47,4);
      return{turn:-.18+(-2.68+.18)*drive,
        side:-1.2+(-7.5+1.2)*drive,forward:6.3+(9-6.3)*drive,
        bodyTurn:-.08+(-.46+.08)*drive,drive:.4+.6*drive,grip:0};
    }
    if(p<.82)return{turn:-2.68,side:-7.5,forward:9,bodyTurn:-.46,drive:1,grip:0};
    const t=smoothStep01((p-.82)/.18);
    return{turn:-2.68*(1-t),side:-7.5*(1-t),forward:9*(1-t),
      bodyTurn:-.46*(1-t),drive:1-t,grip:0};
  }
  // 오른발을 내딛기 전 오른쪽에 짧게 싣고, 몸통과 총을 함께 왼쪽으로 돌린다.
  // 끝에서는 총이 왼쪽 어깨에 걸리고 총구는 뒤, 개머리판은 정확히 전방을 향한다.
  if(p<.22){
    const t=smoothStep01(p/.22);
    return{turn:.28*t,side:2*t,forward:-2*t,bodyTurn:.18*t,drive:0,grip:0};
  }
  if(p<.66){
    const drive=1-Math.pow(1-(p-.22)/.44,4);
    return{
      turn:.28+(-2.68-.28)*drive,
      side:2+(-7.5-2)*drive,
      forward:-2+11*drive,
      bodyTurn:.18+(-.46-.18)*drive,drive,grip:0
    };
  }
  if(p<.84)return{turn:-2.68,side:-7.5,forward:9,bodyTurn:-.46,drive:1,grip:0};
  const t=smoothStep01((p-.84)/.16);
  return{
    turn:-2.68*(1-t),side:-7.5*(1-t),forward:9*(1-t),
    bodyTurn:-.46*(1-t),drive:1-t,grip:0
  };
}

function rifleStockStrikePose(p){
  p=clamp(p,0,1);
  const chained=rifleMelee.chainedEntry;
  const prepEnd=chained?.12:.22;
  const start=chained
    ?{turn:-2.68,side:-7.5,forward:9,bodyTurn:-.46}
    :{turn:0,side:0,forward:0,bodyTurn:0};
  if(p<prepEnd){
    const t=smoothStep01(p/prepEnd);
    return{
      // 왼쪽 어깨의 총을 회수하지 않는다. 개머리판이 앞을 본 채 왼발만 준비한다.
      turn:start.turn+(-2.94-start.turn)*t,
      side:start.side+(-4-start.side)*t,
      forward:start.forward+(10-start.forward)*t,
      bodyTurn:start.bodyTurn+(-.20-start.bodyTurn)*t,
      drive:0,grip:t
    };
  }
  if(p<.38){
    const drive=1-Math.pow(1-(p-prepEnd)/(.38-prepEnd),4);
    return{
      turn:-2.94+(-Math.PI+2.94)*drive,
      side:-4*(1-drive),forward:10+10*drive,
      bodyTurn:-.20*(1-drive),drive,grip:1
    };
  }
  // 적중한 정확한 순간부터 즉시 회수한다. 별도의 반동 대기 구간은 없고,
  // 개머리판을 먼저 몸 쪽으로 빼낸 뒤 총을 돌려 기본 파지로 복귀하는 후딜을 둔다.
  if(rifleMelee.hitDone&&rifleMelee.hitAtElapsed>=0){
    const sinceHit=rifleMelee.elapsed-rifleMelee.hitAtElapsed;
    if(sinceHit<.10){
      const u=clamp(sinceHit/.10,0,1);
      const t=1-Math.pow(1-u,3);
      const spring=Math.sin(u*Math.PI);
      return{
        turn:-Math.PI+.08*spring,
        side:-.65*spring,
        forward:20-15*t,
        bodyTurn:.04*spring,
        drive:1-.78*t,grip:1
      };
    }
    const u=clamp((sinceHit-.10)/.18,0,1);
    const t=smoothStep01(u);
    const spring=Math.sin(u*Math.PI*2)*Math.pow(1-u,1.8);
    return{
      turn:-Math.PI*(1-t)+.09*spring,
      side:-.55*spring,
      forward:5*(1-t)-.8*spring,
      bodyTurn:.035*spring,
      drive:.22*(1-t),grip:1-t
    };
  }
  // 헛쳐도 먼저 개머리판을 즉시 당기고, 이후 총을 돌리는 후딜을 분리한다.
  if(p<.56){
    const u=clamp((p-.38)/.18,0,1);
    const t=1-Math.pow(1-u,3);
    return{turn:-Math.PI,side:0,forward:20-15*t,bodyTurn:0,drive:1-.78*t,grip:1};
  }
  const u=clamp((p-.56)/.38,0,1);
  const t=smoothStep01(u);
  return{
    turn:-Math.PI*(1-t),side:0,forward:5*(1-t),bodyTurn:0,
    drive:.22*(1-t),grip:1-t
  };
}

function beginRifleMeleeStage(attack,chained=false,flowingFromMuzzle=false){
  rifleMelee.attack=attack;
  rifleMelee.elapsed=0;
  const weaponId=currentWeaponDef().id;
  const lighterAssaultRifle=weaponId==='assaultRifle';
  const heavyPumpShotgun=weaponId==='pumpShotgun';
  const heavyLmg=weaponId==='lmg';
  rifleMelee.duration=attack==='muzzle'
    ?(heavyLmg?.30:(heavyPumpShotgun?.28:(lighterAssaultRifle?.21:.23)))
    :(attack==='stockSweep'
      ?(heavyLmg?.71:(heavyPumpShotgun?.64:(lighterAssaultRifle?.49:.54)))
      :(heavyLmg?.68:(heavyPumpShotgun?.62:.52)));
  rifleMelee.hitDone=false;
  rifleMelee.hitAtElapsed=-1;
  rifleMelee.queuedNext=false;
  rifleMelee.secondWindow=0;
  rifleMelee.nextWindowStep=0;
  rifleMelee.chainedEntry=chained;
  rifleMelee.flowingFromMuzzle=flowingFromMuzzle;
}

function beginRifleMelee(){
  if(player.hp<=0||meleeState.active||
    !['battleRifle','assaultRifle','lmg','pumpShotgun'].includes(currentWeaponDef().id)||
    pistol.reloading||magazinePickup.active||weaponSwitch.active||
    meleeBlockedBySprint())return false;
  if(rifleMelee.attack){
    if(rifleMelee.attack==='stockSweep'&&rifleMeleeProgress()>=.30){
      // 2타가 실제로 전개된 뒤 새로 누른 입력만 3타로 인정한다.
      rifleMelee.queuedNext=true;
    }
    return true;
  }
  // 총검이 없는 현재 무장은 총구 찌르기를 쓰지 않는다.
  // 첫 입력은 곧바로 개머리판 후려치기, 그 뒤의 명시적인 추가 입력만 찍기로 이어진다.
  const step=rifleMelee.secondWindow>0?rifleMelee.nextWindowStep:2;
  beginRifleMeleeStage(step===3?'stockStrike':'stockSweep',step===3);
  mouse.down=false;
  mouse.aim=false;
  return true;
}

// 왼손으로 총열을 잡고 소드오프의 손잡이 밑동을 정면으로 찍는 단발 공격.
const shotgunMelee={
  attack:null,
  elapsed:0,
  duration:0,
  recovery:0,
  hitDone:false,
  damage:200
};

function meleeBlockedBySprint(){
  // 근접공격은 실제 질주 중에만 막는다. 키를 놓은 뒤 남은 시각적 블렌드는 입력을 먹지 않는다.
  return player.sprinting;
}

function shotgunMeleeProgress(){
  if(!shotgunMelee.attack||shotgunMelee.duration<=0)return 0;
  return clamp(shotgunMelee.elapsed/shotgunMelee.duration,0,1);
}

function shotgunSwingPose(p){
  p=clamp(p,0,1);
  // 먼저 총열을 왼손 쪽으로 세워 손잡이 밑면이 정확히 전방을 보게 한다.
  if(p<.52){
    const t=smoothStep01(p/.52);
    return{turn:-Math.PI*t,side:-7.0*t,forward:1.5*t,drive:0};
  }
  // 각도를 고정한 채 손잡이 밑동을 직선으로 짧고 세게 찍어 넣는다.
  if(p<.74){
    const drive=1-Math.pow(1-(p-.52)/.22,4);
    return{
      turn:-Math.PI,
      side:-7.0+6.4*drive,
      forward:1.5+11.5*drive,
      drive
    };
  }
  if(p<.81){
    return{turn:-Math.PI,side:-.6,forward:13,drive:1};
  }
  const t=smoothStep01((p-.81)/.19);
  return{
    turn:-Math.PI*(1-t),
    side:-.6*(1-t),
    forward:13*(1-t),
    drive:1-t
  };
}

function beginShotgunMelee(){
  if(player.hp<=0||meleeState.active||currentWeaponDef().id!=='shotgun'||
    pistol.reloading||magazinePickup.active||weaponSwitch.active||
    shotgunMelee.recovery>0||meleeBlockedBySprint())return false;
  if(shotgunMelee.attack)return false;
  shotgunMelee.attack='buttStrike';
  shotgunMelee.elapsed=0;
  shotgunMelee.duration=.72;
  shotgunMelee.hitDone=false;
  mouse.down=false;
  mouse.aim=false;
  return true;
}

function smgMeleeProgress(){
  if(!smgMelee.attack||smgMelee.duration<=0)return 0;
  return clamp(smgMelee.elapsed/smgMelee.duration,0,1);
}

function smgMuzzlePulse01(p){
  p=clamp(p,0,1);
  if(p<.25)return 1-Math.pow(1-p/.25,4);
  if(p<.36)return 1;
  return 1-smoothStep01((p-.36)/.64);
}

function smgBodyPushPose(p){
  p=clamp(p,0,1);
  const flow=smgMelee.flowingFromMuzzle;
  if(p<.18){
    const t=smoothStep01(p/.18);
    return {turn:t,drive:flow?.28*t:0,forward:flow?5*(1-t):0};
  }
  if(p<.46)return {turn:1,drive:1-Math.pow(1-(p-.18)/.28,4),forward:0};
  if(p<.57)return {turn:1,drive:1,forward:0};
  const recover=1-smoothStep01((p-.58)/.42);
  return {turn:recover,drive:recover,forward:0};
}

function beginSmgMelee(){
  if(player.hp<=0||meleeState.active||currentWeaponDef().id!=='smg'||
    pistol.reloading||magazinePickup.active||weaponSwitch.active||
    meleeBlockedBySprint())return false;
  if(smgMelee.attack)return false;
  // 총검 없는 기관단총은 총구로 찌르지 않고 곧바로 총몸을 가로세워 민다.
  smgMelee.attack='bodyPush';
  smgMelee.elapsed=0;
  smgMelee.duration=.40;
  smgMelee.hitDone=false;
  smgMelee.flowingFromMuzzle=false;
  smgMelee.queuedSecond=false;
  smgMelee.secondWindow=0;
  mouse.down=false;
  mouse.aim=false;
  return true;
}

function beginSmgBodyPush(flowingFromMuzzle=false){
  smgMelee.attack='bodyPush';
  smgMelee.elapsed=0;
  smgMelee.duration=.40;
  smgMelee.hitDone=false;
  smgMelee.queuedSecond=false;
  smgMelee.flowingFromMuzzle=flowingFromMuzzle;
  smgMelee.secondWindow=0;
}

function pistolMeleeProgress(){
  if(!pistolMelee.attack||pistolMelee.duration<=0)return 0;
  return clamp(pistolMelee.elapsed/pistolMelee.duration,0,1);
}

function pistolPalmPulse01(p){
  p=clamp(p,0,1);
  if(p<.18)return 1-Math.pow(1-p/.18,4);
  if(p<.48)return 1;
  return 1-smoothStep01((p-.48)/.52);
}

function pistolMagazineStrikePose(p){
  p=clamp(p,0,1);
  // 감아 돌리지 않는다. 숨겨 둔 오른손에서 바로 직선으로 밀어 박고 회수한다.
  if(p<.30)return {phase:'drive',amount:1-Math.pow(1-p/.30,4)};
  return {phase:'recover',amount:1-smoothStep01((p-.30)/.70)};
}

function beginPistolMelee(){
  if(player.hp<=0||meleeState.active||!['pistol','revolver','plasmaPistol'].includes(currentWeaponDef().id)||
    pistol.reloading||magazinePickup.active||weaponSwitch.active||
    meleeBlockedBySprint())return false;
  if(pistolMelee.attack==='palm'){
    if(currentWeaponDef().plasma)return false;
    pistolMelee.queuedSecond=true;
    return true;
  }
  if(pistolMelee.attack)return false;
  const second=!currentWeaponDef().plasma&&pistolMelee.secondWindow>0;
  pistol.reloadExitPose=null;
  pistol.reloadExitElapsed=0;
  pistol.meleeEntryPose=snapshotCurrentWeaponPose();
  pistolMelee.attack=second?'magazine':'palm';
  pistolMelee.elapsed=0;
  const revolver=currentWeaponDef().id==='revolver';
  pistolMelee.duration=second?(revolver?.39:.32):(revolver?.36:(currentWeaponDef().plasma?.34:.30));
  pistolMelee.hitDone=false;
  pistolMelee.queuedSecond=false;
  pistolMelee.secondWindow=0;
  mouse.down=false;
  mouse.aim=false;
  return true;
}

function beginPistolMagazineStrike(){
  pistol.meleeEntryPose=null;
  pistolMelee.attack='magazine';
  pistolMelee.elapsed=0;
  pistolMelee.duration=currentWeaponDef().id==='revolver'?.39:.32;
  pistolMelee.hitDone=false;
  pistolMelee.queuedSecond=false;
  pistolMelee.secondWindow=0;
}

function pistolMeleeWorldPoint(local){
  const ca=Math.cos(player.bodyAngle),sa=Math.sin(player.bodyAngle);
  return{
    x:player.x+local.x*ca-local.y*sa,
    y:player.y+local.x*sa+local.y*ca
  };
}

function pistolMeleeContactTarget(point,magazine){
  const radius=magazine?4.8:4.7;
  const touched=firstTouchedMeleeDummy(point.x,point.y,radius);
  if(touched)return touched;

  // 몸/조준의 미세한 회전차로 화면상 접촉이 한 점 검사에서 새는 경우를 막는다.
  // 범위 공격이 아니라 현재 팔 길이 안의 좁은 전방 접촉 띠만 보조 검사한다.
  const maxForward=magazine?34:31;
  const ca=Math.cos(player.angle),sa=Math.sin(player.angle);
  return meleeDummies.find(dummy=>{
    if(!actorCanReceiveHit(dummy))return false;
    const dx=dummy.x-player.x,dy=dummy.y-player.y;
    const forward=dx*ca+dy*sa;
    const side=-dx*sa+dy*ca;
    return forward>=10&&forward<=maxForward&&Math.abs(side)<=10.5;
  })||null;
}

function tryPistolMeleeHit(){
  if(pistolMelee.hitDone||!pistolMelee.attack)return;
  const p=pistolMeleeProgress();
  const magazine=pistolMelee.attack==='magazine';
  if(p<(magazine?.22:.30)||p>(magazine?.66:.68))return;
  const rig=buildPistolRig();
  // 판정점은 화면에 그려지는 왼손 또는 임시 권총의 탄창 바닥 좌표 그 자체다.
  const local=magazine
    ?gunPoint(
      rig.pose,0,currentWeaponDef().id==='revolver'?8.4:12*PISTOL_MELEE_SIDE_SCALE
    )
    :rig.supportHand;
  const point=pistolMeleeWorldPoint(local);
  const target=pistolMeleeContactTarget(point,magazine);
  if(!target)return;
  pistolMelee.hitDone=true;
  const revolver=currentWeaponDef().id==='revolver';
  const plasma=currentWeaponDef().plasma;
  damageMeleeDummy(
    magazine
      ?(revolver?90:pistolMelee.magazineDamage)
      :(revolver?8:(plasma?5:pistolMelee.palmDamage)),
    player.bodyAngle,point.x,point.y,
    magazine?null:2,magazine?'blunt':'shove',target
  );
  if(target.hp>0){
    // 1타가 2타 사거리 밖으로 적을 날리지 않도록 밀림은 짧게만 준다.
    const push=magazine?(revolver?48:36):255;
    const angle=Math.atan2(target.y-player.y,target.x-player.x);
    target.pushVelocityX=Math.cos(angle)*push;
    target.pushVelocityY=Math.sin(angle)*push;
    target.hitFlash=magazine?.20:.15;
  }
}

function updatePistolMelee(dt){
  pistolMelee.secondWindow=Math.max(0,pistolMelee.secondWindow-dt);
  if(!pistolMelee.attack)return;
  pistolMelee.elapsed+=dt;
  if(pistolMelee.attack==='magazine'){
    // 1타에 밀린 상대를 놓치지 않도록 오른팔 신전과 함께 짧게 따라 들어간다.
    const p=pistolMeleeProgress();
    const follow=Math.sin(clamp(p/.48,0,1)*Math.PI);
    if(p<.48&&follow>0){
      moveMeleeSandboxPlayer(
        Math.cos(player.angle)*180*follow*dt,
        Math.sin(player.angle)*180*follow*dt
      );
    }
  }
  tryPistolMeleeHit();
  if(pistolMelee.elapsed<pistolMelee.duration)return;
  if(pistolMelee.attack==='palm'&&pistolMelee.queuedSecond){
    beginPistolMagazineStrike();
    return;
  }
  if(pistolMelee.attack==='palm'&&!currentWeaponDef().plasma)pistolMelee.secondWindow=.20;
  pistolMelee.attack=null;
  pistolMelee.elapsed=0;
  pistolMelee.duration=0;
  pistolMelee.hitDone=false;
  pistolMelee.queuedSecond=false;
  pistol.meleeEntryPose=null;
}
