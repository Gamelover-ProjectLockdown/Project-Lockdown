  const transfer=hydrogenAudioTransfer;
  // Keep the current flow voice across frame gaps and integer transfer ticks.
  // Explicit input, tank-swap and capacity state control when the hose closes.
  const filling=alive&&keys.has('KeyR')&&transfer&&
    transfer.state.hydrogenTankSwap<=0&&transfer.state.hydrogen<transfer.state.hydrogenCapacity&&
    transfer.state.hydrogenReserve>0&&transfer.state.thermalLock<=0&&
    (inventory.open?inventory.loadHold.active&&workbenchWeaponState()===transfer.state:
      equipped&&pistol===transfer.state&&pistol.reloading&&pistol.hydrogenFilling&&currentReloadProgress(currentWeaponDef())>=.34);
  setPlasmaBed('gas',!!filling,.23);
  const venting=equipped&&plasma.thermalLock>0&&plasma.plasmaCoolingVenting;
  const heat=clamp(plasma.thermalLock/(.4+3.6*(plasma.plasmaLastShotPower||0)),0,1);
  setPlasmaBed('smoke',!!venting,(.13+.12*(plasma.plasmaLastShotPower||0))*Math.min(1,heat*4),1);
}
function stopPlasmaCoolingSound(){
  if(!plasmaCoolingAudio)return;
  const {source,gain}=plasmaCoolingAudio;plasmaCoolingAudio=null;
  const now=gunAudioContext.currentTime;
  gain.gain.cancelScheduledValues(now);
  gain.gain.setTargetAtTime(0,now,.018);
  try{source.stop(now+.09);}catch(_error){}
}
function playPlasmaSample(name,{duration=null,volume=.5,fadeIn=.006,fadeOut=.12,rate=1}={}){
  const buffer=plasmaEffectBuffers[name];
  if(!buffer||!gunAudioContext||!masterGainNode)return null;
  gunAudioContext.resume().catch(()=>{});
  const source=gunAudioContext.createBufferSource(),gain=gunAudioContext.createGain();
  source.buffer=buffer;source.loop=false;
  // Crop the steam sample to cooling time without speeding up the entire recording.
  source.playbackRate.value=rate;
  const life=duration?Math.min(duration,buffer.duration/rate):buffer.duration/rate;
  const now=gunAudioContext.currentTime;
  const attack=Math.min(fadeIn,life*.15),release=Math.min(fadeOut,life*.45);
  gain.gain.setValueAtTime(0,now);
  gain.gain.linearRampToValueAtTime(volume,now+attack);
  gain.gain.setValueAtTime(volume,now+Math.max(attack,life-release));
  gain.gain.linearRampToValueAtTime(0,now+life);
  source.connect(gain).connect(masterGainNode);
  const voice={source,gain};
  source.onended=()=>{source.disconnect();gain.disconnect();if(plasmaCoolingAudio===voice)plasmaCoolingAudio=null;};
  source.start(now);source.stop(now+life+.01);
  return voice;
}
function startPlasmaChargeSound(){
  if(plasmaChargeSoundActive)return;
  const generation=++plasmaChargeFadeGeneration;
  plasmaChargeSoundActive=true;
  try{plasmaChargeVoice.currentTime=0;}catch(_error){}
  // L3(약 0.97초)를 0.20초 준비 + 1.15초 차징에 한 번만 펼친다.
  // 초반은 묵직하게 끌고 가고 끝에서 급격히 1.70배 피치까지 올라가므로
  // 음원의 클라이맥스와 완충 시점이 겹친다.
  plasmaChargeVoice.loop=false;
  plasmaChargeVoice.playbackRate=.55;
  plasmaChargeVoice.volume=clamp((masterVolumeLevel/100)*.25,0,1);
  const playback=typeof plasmaChargeVoice.play==='function'?plasmaChargeVoice.play():null;
  if(playback&&typeof playback.catch==='function')playback.catch(()=>{
    if(generation===plasmaChargeFadeGeneration)plasmaChargeSoundActive=false;
  });
}
function updatePlasmaChargeSound(power=0,chargeLimit=1){
  if(!plasmaChargeSoundActive)return;
  const p=clamp(power,0,1);
  if(p>=chargeLimit-1e-6){stopPlasmaChargeSound();return;}
  // p^5 곡선의 평균 재생률을 낮춰 짧은 L3를 최대 차징 시간까지 늘리되,
  // 마지막 클라이맥스에서는 이전보다 훨씬 높은 피치가 난다.
  plasmaChargeVoice.playbackRate=.55+1.15*Math.pow(p,5);
  plasmaChargeVoice.volume=clamp((masterVolumeLevel/100)*.25,0,1);
}
function stopPlasmaChargeSound(){
  if(!plasmaChargeSoundActive)return;
  plasmaChargeSoundActive=false;
  const generation=++plasmaChargeFadeGeneration;
  const volume=plasmaChargeVoice.volume;
  // A short release tail is also used at partial-H2 ceilings (e.g. 33 H2).
  // Generation checks prevent an old fade from muting a newly started charge.
  for(let step=1;step<=8;step++)setTimeout(()=>{
    if(generation!==plasmaChargeFadeGeneration)return;
    const remaining=1-step/8;
    plasmaChargeVoice.volume=Math.min(volume,(masterVolumeLevel/100)*.25)*remaining*remaining;
    if(step===8){
      if(typeof plasmaChargeVoice.pause==='function')plasmaChargeVoice.pause();
      try{plasmaChargeVoice.currentTime=0;}catch(_error){}
    }
  },step*18);
}
function playPlasmaShot(power=0){
  const p=clamp(power,0,1);
  playPlasmaSample('lightning',{volume:.50+.14*p,fadeIn:.003,fadeOut:.14,rate:1-.10*p});
  const voiceIndex=plasmaShotVoiceIndex++%plasmaShotLayerPools[0].length;
  const gains=[.52,.78];
  for(let layer=0;layer<plasmaShotLayerPools.length;layer++){
    const voice=plasmaShotLayerPools[layer][voiceIndex];
    if(typeof voice.pause==='function')voice.pause();
    try{voice.currentTime=0;}catch(_error){}
    // L1만 출력이 높아질수록 무겁게 내려간다. L2는 원본 피치의 강한 발사 어택이다.
    voice.preservesPitch=false;voice.webkitPreservesPitch=false;
    voice.playbackRate=layer===0?1-.18*p:1;
    voice.volume=clamp((masterVolumeLevel/100)*gains[layer],0,1);
    const playback=typeof voice.play==='function'?voice.play():null;
    if(playback&&typeof playback.catch==='function')playback.catch(()=>{});
  }
}

function plasmaShotDamage(power=0,distance=0,spentEnergy=0,penetrations=0){
  const p=clamp(power,0,1);
  // 5 H2 최소탄은 견제용으로 낮추고, 충전분의 열량 보상은 이전보다 훨씬 크게 잡는다.
  const muzzleDamage=70+650*p;
  const range=Math.max(1,plasmaShotRange(p));
  const travel=clamp(distance/range,0,1);
  const falloff=smoothStep01(clamp((travel-.08)/.92,0,1));
  // 열 관통탄은 비행 중 퍼진다. 고출력일수록 열 보존률이 조금 높지만 거리 손실은 항상 존재한다.
  const distanceRetention=1-falloff*(.48-.14*p);
  const sourceEnergy=Math.max(1,plasmaPenetrationEnergy(p,0));
  const remainingEnergy=clamp((plasmaPenetrationEnergy(p,distance)-spentEnergy)/sourceEnergy,0,1);
  const penetrationRetention=penetrations<=0?1:
    clamp(.68+remainingEnergy*.24-(penetrations-1)*.10,.30,.86);
  return Math.max(1,Math.round(muzzleDamage*distanceRetention*penetrationRetention));
}

function plasmaShotRange(power=0){
  // 고압 플라즈마가 멀리까지 직선으로 유지되기보다는 가까운 거리에서 에너지가 집중된다.
  return WEAPON_BY_ID.plasmaPistol.range+130*clamp(power,0,1);
}

function plasmaPenetrationEnergy(power=0,distance=0){
  // 고압 플라즈마는 비행하면서 빠르게 퍼진다. 가까운 과충전탄일수록 여러 몸을 관통할 여력이 크다.
  const p=clamp(power,0,1);
  return Math.max(0,50+185*p-Math.max(0,distance)*(.13-.03*p));
}

function plasmaCanPenetrate(power,distance,spentEnergy,thickness){
  return plasmaPenetrationEnergy(power,distance)-Math.max(0,spentEnergy)>=12+Math.max(1,thickness);
}

function plasmaPostPenetrationRange(power,exitDistance,spentEnergy){
  const totalRange=plasmaShotRange(power);
  const remainingDistance=Math.max(0,totalRange-exitDistance);
  const sourceEnergy=Math.max(1,plasmaPenetrationEnergy(power,0));
  const remainingEnergy=clamp(
    (plasmaPenetrationEnergy(power,exitDistance)-Math.max(0,spentEnergy))/sourceEnergy,0,1
  );
  // 관통 직후 남은 열이 적으면 빛줄기도 곧바로 흐트러지고, 충분하면 대부분의 사거리를 보존한다.
  const carry=.10+.90*Math.pow(remainingEnergy,.72);
  return Math.min(totalRange,exitDistance+remainingDistance*carry);
}

function firePlasmaPistol(projectileOwner='player',projectileSource=null){
  if(pistol.thermalLock>0||pistol.hydrogen<5){
    pistol.dryFireElapsed=0;return false;
  }
  const def=currentWeaponDef();
  stopPlasmaChargeSound();
  const power=clamp(pistol.plasmaCharge||0,0,1);
  // 기본탄은 5 H2, 완전 차징은 기존과 같은 50 H2를 사용한다.
  const hydrogenCost=Math.ceil(5+45*power);
  const shotRange=plasmaShotRange(power);
  const cooling=.4+3.6*power;
  const muzzle=plasmaMuzzleWorld();
  const dx=Math.cos(muzzle.angle),dy=Math.sin(muzzle.angle);
  const obstacleDistance=castObstacleRay(muzzle.x,muzzle.y,muzzle.angle,shotRange);
  const impactIntent=firearmImpactIntent(projectileOwner,def);
  const targets=[];
  for(const dummy of meleeDummies){
    if(dummy.hp<=0)continue;
    const toX=dummy.x-muzzle.x,toY=dummy.y-muzzle.y;
    const along=toX*dx+toY*dy;
    const sideSq=Math.max(0,toX*toX+toY*toY-along*along);
    if(along<0||sideSq>=15*15)continue;
    const halfChord=Math.sqrt(15*15-sideSq);
    const entry=Math.max(0,along-halfChord),exit=along+halfChord;
    if(entry>=obstacleDistance)continue;
    targets.push({dummy,entry,exit:Math.min(exit,obstacleDistance),thickness:Math.max(1,Math.min(exit,obstacleDistance)-entry)});
  }
  targets.sort((a,b)=>a.entry-b.entry);
  let spentEnergy=0,beamDistance=obstacleDistance,penetratedCount=0,hitIndex=0;
  for(const hit of targets){
    if(hit.entry>=beamDistance)break;
    const available=plasmaPenetrationEnergy(power,hit.entry)-spentEnergy;
    if(available<=0){beamDistance=Math.min(beamDistance,hit.entry);break;}
    const hitX=muzzle.x+dx*hit.entry,hitY=muzzle.y+dy*hit.entry;
    const headDistance=impactIntent.target===hit.dummy
      ?aimedHeadRayDistance(muzzle.x,muzzle.y,dx,dy,hit.dummy):Infinity;
    const headshot=headDistance<=Math.min(beamDistance,hit.exit);
    const baseDamage=plasmaShotDamage(power,hit.entry,spentEnergy,hitIndex);
    const hitDamage=baseDamage*(headshot?2:1);
    const damageScale=hitDamage/Math.max(1,plasmaShotDamage(power,0,0,0));
    damageMeleeDummy(hitDamage,muzzle.angle,hitX,hitY,
      10+Math.round(power*12),'plasma',hit.dummy,null,headshot);
    hit.dummy.pushVelocityX=dx*(52+power*60)*damageScale;
    hit.dummy.pushVelocityY=dy*(52+power*60)*damageScale;
    applyStoppingImpact(hit.dummy,{shotId:impactIntent.id,headshot,plasma:true,
      angle:muzzle.angle,stoppingPower:(200+power*300)*damageScale});
    hitIndex++;
    const penetrationCost=12+hit.thickness;
    if(!plasmaCanPenetrate(power,hit.entry,spentEnergy,hit.thickness)||hit.exit>=obstacleDistance-.01){
      const depth=hit.thickness*clamp(available/penetrationCost,.18,1);
      beamDistance=Math.min(beamDistance,hit.entry+depth);
      break;
    }
    spentEnergy+=penetrationCost;
    penetratedCount++;
    beamDistance=Math.min(beamDistance,
      plasmaPostPenetrationRange(power,hit.exit,spentEnergy));
    // 관통 입구와 별개로 실제 출구에서도 뜨거운 증기가 피어난다.
    spawnPlasmaHitVapor(muzzle.x+dx*hit.exit,muzzle.y+dy*hit.exit,
      muzzle.angle,hitDamage*.72,hit.dummy,true);
  }
  plasmaLances.push({x:muzzle.x,y:muzzle.y,angle:muzzle.angle,length:beamDistance,
    power,penetrated:penetratedCount>0,penetratedCount,age:0,life:.42+.06*power});
  pistol.hydrogen=Math.max(0,pistol.hydrogen-hydrogenCost);
  pistol.thermalLock=cooling;
  pistol.plasmaLastShotPower=power;
  pistol.cooldown=cooling;
  pistol.plasmaCharge=0;
  pistol.plasmaCharging=false;
  pistol.coolerSpin+=.8;
  pistol.steamClock=0;
  pistol.plasmaCoolingVenting=false;
  pistol.plasmaCoolingSoundPlayed=false;
  stopPlasmaCoolingSound();
  pistol.muzzleFlash=0;
  pistol.recoilVelocity=Math.min(110,pistol.recoilVelocity+def.recoilImpulse);
  playPlasmaShot(power);
  emitSoundEvent(player.x,player.y,700,'gunshot',projectileSource||player);
  return true;
}

function firePistol(requestedBarrel=null,projectileOwner='player',projectileSource=null){
  if(projectileOwner==='player'&&consumption.active)return false;
  const def=currentWeaponDef();
  if(
    player.hp<=0||levelComplete||
    magazinePickup.active||weaponSwitch.active||pistol.reloading||pistol.pumpActive||
    (projectileOwner==='player'&&(
      pistolMelee.attack||smgMelee.attack||rifleMelee.attack||
      shotgunMelee.attack||shotgunMelee.recovery>0
    ))||
    (def.id!=='shotgun'&&pistol.cooldown>0)
  )return false;

  if(projectileOwner==='player'&&player.sprintBlend>.35&&
    (def.id==='shotgun'||!mouse.aim)){
    pistol.aimDeniedElapsed=0;
    return false;
  }
  if(def.plasma)return firePlasmaPistol(projectileOwner,projectileSource);
  const firedBarrel=def.id==='shotgun'
    ?(requestedBarrel===1?1:0)
    :0;
  const selectedBarrelSpent=def.id==='shotgun'&&
    !!(pistol.shotgunFiredMask&(1<<firedBarrel));
  if(!pistol.chamberRound||selectedBarrelSpent){
    pistol.cooldown=.11;
    pistol.dryFireElapsed=0;
    return false;
  }

  const ammoId=pistol.chamberRound;
  pistol.chamberRound=null;
  if(pistol.fireMode==='BURST'){
    pistol.burstHeldShots=(pistol.burstHeldShots||0)+1;
  }
  if(def.id==='shotgun'){
    pistol.shotgunLastFiredBarrel=firedBarrel;
    pistol.shotgunNextBarrel=1-firedBarrel;
    pistol.shotgunFiredMask|=1<<firedBarrel;
    pistol.shotgunSpent++;
  }
  // 펌프액션은 발사 직후에는 빈 약실을 유지하고, 펌프 전후진이 끝날 때 다음 탄을 급탄한다.
  if(def.id==='pumpShotgun'){
    pistol.pumpActive=true;
    // 먼저 발사 반동을 아주 잠깐 받아낸 뒤 손이 펌프로 넘어간다.
    // 음수 구간에서는 펌프가 정위치에 머물고 약 90ms 후 실제 왕복이 시작된다.
    pistol.pumpElapsed=-.090;
    pistol.pumpEjected=false;
  }else{
    feedChamberFromMagazine();
  }
  const ammo=AMMO_BY_ID[ammoId]||AMMO_BY_ID.standard;
  pistol.cooldown=def.fireDelay;
  if(pistol.lastShotAge>.38)pistol.rapidShotCount=0;
  pistol.rapidShotCount=(pistol.rapidShotCount||0)+1;
  pistol.lastShotAge=0;
  pistol.accuracyBloom=Math.min(
    def.maxBloom,pistol.accuracyBloom+
    sustainedFireBloomImpulse(def)*(ammo.id==='shot'?1.12:1)*(projectileOwner==='player'?1-(player.adrenaline||0)*.0025:1)
  );
  pistol.recoilVelocity=Math.min(
    104,pistol.recoilVelocity+
    def.recoilImpulse*(ammo.id==='shot'?1.16:1)*(projectileOwner==='player'?1-(player.adrenaline||0)*.0025:1)
  );
  // 강한 연사감을 무작위 좌우 회전으로 꾸미지 않는다. 반동은 총몸 후퇴와
  // 실제 탄착군 블룸으로만 누적되어 조준선이 인위적으로 지그재그치지 않는다.
  if(def.id==='shotgun')pistol.shotgunFlashMask|=1<<firedBarrel;
  pistol.muzzleFlash=.050;
  playGunshot(def,ammoId);

  // 모든 총성은 월드 소리다. 각 진영 AI는 자기 편 소리는 무시하고 적대 총성만 조사한다.
  const soundActor=projectileOwner==='player'?player:(projectileSource||null);
  if(soundActor){
    emitSoundEvent(
      soundActor.x,soundActor.y,
      gunshotNoiseRadius(def),
      'gunshot',soundActor
    );
  }

  const lastRound=!pistol.chamberRound;

  const pose=pistolPoseAt(0);
  // 마우스는 목표일 뿐이다. 숨은 명중률 난수 없이 화면의 총열 축 그대로 쏜다.
  const barrelAngle=normAngle(player.bodyAngle+pose.turn);
  const shotAngle=barrelAngle;
  const muzzleLocal=gunPoint(
    pose,def.muzzleX,
    def.id==='shotgun'?(firedBarrel===0?-2.5:2.5):0
  );
  const bodyCos=Math.cos(player.bodyAngle);
  const bodySin=Math.sin(player.bodyAngle);
  const muzzleX=player.x+muzzleLocal.x*bodyCos-muzzleLocal.y*bodySin;
  const muzzleY=player.y+muzzleLocal.x*bodySin+muzzleLocal.y*bodyCos;

  spawnMuzzleDischarge(muzzleX,muzzleY,barrelAngle,def,player,firedBarrel);

  pistol.shotCycles.push({
    age:0,
    casingEjected:false,
    lastRound,
    ammoId:ammo.id,
    x:player.x,
    y:player.y,
    visualAngle:barrelAngle,
    barrelIndex:firedBarrel
  });
  if(pistol.shotCycles.length>4)pistol.shotCycles.shift();
  const projectileSourceRef=projectileSource||(projectileOwner==='player'?player:null);
  const pelletCount=(ammo.id==='shot'||ammo.id==='buckshot')
    ?((def.id==='shotgun'||def.id==='pumpShotgun')?20:(ammo.id==='buckshot'?9:6)):1;
  const impactIntent=firearmImpactIntent(projectileOwner,def,pelletCount);
  if(ammo.id==='shot'||ammo.id==='buckshot'){
    // 12게이지 산탄총은 현재 공통으로 10대미지 펠릿 20개를 발사한다.
    const pellets=(def.id==='shotgun'||def.id==='pumpShotgun')?20:(ammo.id==='buckshot'?9:6);
    // 벅샷 패턴을 기존보다 약 40% 조밀하게. 랜덤 흔들림도 같이 줄여
    // 가까운~중거리에서 '분무기'가 아니라 조준해서 쏘는 산탄총처럼 만든다.
    const cone=ammo.id==='buckshot'?.095:.13;
    const pelletJitter=ammo.id==='buckshot'?.012:.022;
    for(let i=0;i<pellets;i++){
      const lane=(i-(pellets-1)/2)/(pellets-1);
      const spread=lane*cone+(Math.random()-.5)*pelletJitter;
      fireProjectile(
        muzzleX,muzzleY,shotAngle+spread,ammo,
        ammo.id==='buckshot'?def.range:430,
        projectileOwner,projectileSourceRef,impactIntent
      );
    }
  }else{
    fireProjectile(muzzleX,muzzleY,shotAngle,ammo,def.range,projectileOwner,projectileSourceRef,impactIntent);
  }
  return true;
}

function updateDroppedObject(item,dt,radius,settle=null){
  if(item.settled)return;
  item.motionAge=(item.motionAge||0)+dt;

  const nextX=item.x+item.vx*dt;
  if(collidesWorld(nextX,item.y,radius))item.vx*=-.24;
  else item.x=nextX;

  const nextY=item.y+item.vy*dt;
  if(collidesWorld(item.x,nextY,radius))item.vy*=-.24;
  else item.y=nextY;

  item.angle+=item.spin*dt;
  const drag=Math.pow(settle?.drag??.045,dt);
  item.vx*=drag;
  item.vy*=drag;
  item.spin*=Math.pow(settle?.spinDrag??.08,dt);
  if(
    (Math.hypot(item.vx,item.vy)<(settle?.speed??3)&&Math.abs(item.spin)<(settle?.spin??.35))||
    item.motionAge>=(settle?.maxAge??Infinity)
  ){
    item.vx=0;
    item.vy=0;
    item.spin=0;
    item.settled=true;
  }
}

function armorPickupInRange(){
  if(!START_CELL_ARMOR.active)return false;
  return Math.hypot(
    START_CELL_ARMOR.x-player.x,
    START_CELL_ARMOR.y-player.y
  )<=ARMOR_PICKUP_RADIUS&&pointerNearWorld(START_CELL_ARMOR.x,START_CELL_ARMOR.y,24);
}

function startArmorPickup(){
  if(
    !START_CELL_ARMOR.active||
    inventory.open||
    magazinePickup.active||
    weaponSwitch.active||
    pistol.reloading||
    !armorPickupInRange()
  )return false;

  START_CELL_ARMOR.active=false;
  player.defense=PLAYER_BASE_DEFENSE+START_CELL_ARMOR.defenseBonus;
  player.armorEquipped=true;
  player.armorPickupFlash=1;
  return true;
}

function nearestDroppedMagazine(){
  if(magazinePickup.active)return null;
  let nearest=null;
  let nearestIndex=-1;
  let nearestDistance=MAGAZINE_PICKUP_RADIUS;
  for(let i=0;i<droppedMagazines.length;i++){
    const magazine=droppedMagazines[i];
    // 아직 구르거나 튀는 탄창은 손으로 낚아채지 못한다.
    if(!magazine.settled)continue;
    const distance=Math.hypot(magazine.x-player.x,magazine.y-player.y);
    if(distance>nearestDistance)continue;
    if(!pointerNearWorld(magazine.x,magazine.y,18))continue;
    nearest=magazine;
    nearestIndex=i;
    nearestDistance=distance;
  }
  return nearest?{magazine:nearest,index:nearestIndex,distance:nearestDistance}:null;
}

function startMagazinePickup(){
  if(
    inventory.open||magazinePickup.active||weaponSwitch.active||
    pistol.reloading
  )return false;
  const target=nearestDroppedMagazine();
  if(!target)return false;
  magazinePickup.active=true;
  magazinePickup.elapsed=0;
  magazinePickup.magazine=target.magazine;
  magazinePickup.rounds=magazineRoundCount(target.magazine.magazine);
  magazinePickup.collected=false;
  return true;
}

function updateMagazinePickup(dt){
  if(!magazinePickup.active)return;
  magazinePickup.elapsed+=dt;
  const progress=clamp(
    magazinePickup.elapsed/MAGAZINE_PICKUP_TIME,0,1
  );

  // 왼손이 닿는 순간 탄창과 내부 장탄 배열 전체를 인벤토리로 옮긴다.
  if(!magazinePickup.collected&&progress>=MAGAZINE_PICKUP_COMMIT){
    const index=droppedMagazines.indexOf(magazinePickup.magazine);
    if(index>=0){
      inventory.magazines.push(magazinePickup.magazine.magazine);
      droppedMagazines.splice(index,1);
    }
    magazinePickup.collected=true;
  }

  if(progress>=1){
    magazinePickup.active=false;
    magazinePickup.elapsed=0;
    magazinePickup.magazine=null;
    magazinePickup.rounds=0;
    magazinePickup.collected=false;
  }
}

function updateWeaponStateCore(dt){

  const def=currentWeaponDef();
  if(!pistol.reloading&&pistol.reloadExitPose){
    pistol.reloadExitElapsed+=dt;
  }
  pistol.cooldown=Math.max(0,pistol.cooldown-dt);
  if(def.plasma){
    pistol.thermalLock=Math.max(0,pistol.thermalLock-dt);
    if(pistol.plasmaCharging&&mouse.down&&!pistol.reloading&&pistol.thermalLock<=0){
      // 약 1.15초 동안 눌러 최대 과충전. 수소 잔량으로 가능한 단계까지만 올라간다.
      const affordable=clamp((pistol.hydrogen-5)/45,0,1);
      pistol.plasmaHoldElapsed+=dt;
      // 일반 클릭은 정확히 5 사용. 0.20초를 넘겨 누를 때부터 최대 50까지 과충전한다.
      pistol.plasmaCharge=Math.min(affordable,clamp((pistol.plasmaHoldElapsed-.20)/1.15,0,1));
      if(pistol===ownedWeaponState('plasmaPistol'))updatePlasmaChargeSound(pistol.plasmaCharge,affordable);
    }else if(pistol===ownedWeaponState('plasmaPistol')&&plasmaChargeSoundActive){
      stopPlasmaChargeSound();
    }
    pistol.coolerSpin+=dt*(pistol.thermalLock>0?9+6*(pistol.thermalLock/2):1.2);
    if(pistol.thermalLock>0){
      pistol.steamClock-=dt;
      if(pistol.steamClock<=0){
        pistol.plasmaCoolingVenting=true;
        pistol.steamClock=.055+Math.random()*.045;
        const pose=pistolPoseAt(0);
        const vent=gunPoint(pose,-8,(Math.random()-.5)*4);
        const ca=Math.cos(player.bodyAngle),sa=Math.sin(player.bodyAngle);
        plasmaSteam.push({
          x:player.x+vent.x*ca-vent.y*sa,
          y:player.y+vent.x*sa+vent.y*ca,
          vx:-Math.cos(player.weaponAngle)*(18+Math.random()*20)+(Math.random()-.5)*18,
          vy:-Math.sin(player.weaponAngle)*(18+Math.random()*20)+(Math.random()-.5)*18,
          age:0,life:.42+Math.random()*.28,size:2+Math.random()*3
        });
      }
    }else pistol.plasmaCoolingVenting=false;
  }
  pistol.muzzleFlash=Math.max(0,pistol.muzzleFlash-dt);
  if(pistol.muzzleFlash<=0)pistol.shotgunFlashMask=0;
  pistol.dryFireElapsed=Math.min(1,pistol.dryFireElapsed+dt);
  pistol.lastShotAge=Math.min(99,(pistol.lastShotAge||0)+dt);
  if(pistol.lastShotAge>.46)pistol.rapidShotCount=0;
  pistol.aimDeniedElapsed=Math.min(1,pistol.aimDeniedElapsed+dt);
  const recoveryScale=player.sprinting?.32:(player.moving?.68:1);
  const idleRecoveryBoost=pistol.cooldown<=0?1.7:1;
  const adsRecoveryBoost=1+player.aimBlend*.35;
  pistol.accuracyBloom=Math.max(
    0,pistol.accuracyBloom-def.bloomRecovery*recoveryScale*idleRecoveryBoost*adsRecoveryBoost*dt
  );

  // 총 전체는 순간 후퇴한 뒤 스프링처럼 빠르게 돌아온다. 빠른 연속
  // 사격은 아직 남은 속도 위에 새 충격을 더해 자연스럽게 누적된다.
  pistol.recoilVelocity+=(-pistol.recoil*205-pistol.recoilVelocity*24)*dt;
  pistol.recoil+=pistol.recoilVelocity*dt;
  if(pistol.recoil<0){
    pistol.recoil=0;
    if(pistol.recoilVelocity<0)pistol.recoilVelocity=0;
  }
  pistol.recoilYawVelocity+=(-pistol.recoilYaw*175-pistol.recoilYawVelocity*21)*dt;
  pistol.recoilYaw+=pistol.recoilYawVelocity*dt;
  if(Math.abs(pistol.recoilYaw)<.0001&&Math.abs(pistol.recoilYawVelocity)<.001){
    pistol.recoilYaw=0;
    pistol.recoilYawVelocity=0;
  }

  if(def.id==='pumpShotgun'&&pistol.pumpActive){
    const previousPumpElapsed=pistol.pumpElapsed;
    pistol.pumpElapsed+=dt;
    const pumpDuration=def.pumpDuration||.52;
    const pumpProgress=clamp(pistol.pumpElapsed/pumpDuration,0,1);
    // Threshold crossings cover firing delay, manual cycling and post-load cycling once each.
    if(previousPumpElapsed<pumpDuration*.03&&pistol.pumpElapsed>=pumpDuration*.03)
      playShotgunSample('pump-back');
    if(previousPumpElapsed<pumpDuration*.55&&pistol.pumpElapsed>=pumpDuration*.55)
      playShotgunSample('pump-forward');
    // 펌프가 뒤로 빠지는 순간 빈 탄피를 배출한다.
    if(!pistol.pumpEjected&&pumpProgress>=.38){
      const cycle=[...pistol.shotCycles].reverse().find(c=>!c.casingEjected);
      if(cycle){ejectCasing(cycle);cycle.casingEjected=true;}
      pistol.pumpEjected=true;
    }
    // 전진 완료 시 튜브 최상단 탄을 약실에 올린다.
    if(pumpProgress>=1){
      feedChamberFromMagazine();
      pistol.pumpActive=false;
      pistol.pumpElapsed=0;
      pistol.pumpEjected=false;
    }
  }

  for(let i=pistol.shotCycles.length-1;i>=0;i--){
    const cycle=pistol.shotCycles[i];
    cycle.age+=dt;
    if(
      !['shotgun','pumpShotgun','revolver'].includes(currentWeaponDef().id)&&cycle.lastRound&&cycle.age>=.018
    )pistol.slideLocked=true;
    if(
      !['shotgun','pumpShotgun','revolver'].includes(currentWeaponDef().id)&&
      !cycle.casingEjected&&cycle.age>=.026
    ){
      ejectCasing(cycle);
      cycle.casingEjected=true;
    }
    if(cycle.age>=(def.id==='pumpShotgun'?.65:.18))pistol.shotCycles.splice(i,1);
  }

  if(pistol.reloading){
    const reloadTime=currentReloadDuration(def);
    pistol.reloadElapsed+=dt;
    const reloadProgress=currentReloadProgress(def);
    if(def.plasma){
      if(reloadProgress>=.34&&keys.has('KeyR')){
        const amount=fillHydrogenUnits(pistol,dt);
        pistol.reloadCommitted=amount>0||pistol.reloadCommitted;
      }
      // R을 놓기 전에는 충전 손을 포트에 둔 채 타임라인 끝 직전에서 유지한다.
      if(keys.has('KeyR')&&pistol.hydrogen<pistol.hydrogenCapacity&&pistol.hydrogenReserve>0){
        pistol.reloadElapsed=Math.min(pistol.reloadElapsed,reloadTime*.82);
      }else{
        pistol.hydrogenTankVisible=reloadProgress>=.14;
        pistol.reloadExitPose=snapshotCurrentWeaponPose();
        pistol.reloadExitElapsed=0;
        pistol.reloading=false;
        pistol.hydrogenFilling=false;
        pistol.reloadElapsed=0;
        pistol.reloadEntryPose=null;
      }
    }else if(def.id==='revolver'){
      if(reloadProgress>=.28)ejectRevolverCases();
      if(reloadProgress>=.66)commitRevolverMoonClip();
    }else if(def.id==='pumpShotgun'){
      // 일반 R은 한 발, Shift+R은 스피드로더의 남은 탄을 튜브 빈칸만큼 밀어 넣는다.
      const insertAt=reloadTime*.70;
      const shouldHave=pistol.reloadElapsed>=insertAt?pistol.reloadShellsTarget:0;
      while(pistol.reloadShellsLoaded<shouldHave&&pistol.magazine.rounds.length<5){
        let ammoId='buckshot';
        if(pistol.pumpReloadUseSpeedloader){
          const loader=pistol.pumpReloadSpeedloader;
          if(!loader||loader.rounds.length===0)break;
          ammoId=loader.rounds.pop();
        }else{
          if(inventory.loose.buckshot<=0)break;
          inventory.loose.buckshot--;
        }
        pistol.magazine.rounds.push(ammoId);
        pistol.reloadShellsLoaded++;
      }
    }else if(def.id==='shotgun'){
      if(reloadProgress>=.12)ejectShotgunShells();
      // 필요한 쉘을 한 손에 함께 쥐고 두 약실에 동시에 밀어 넣는다.
      if(reloadProgress>=.62){
        while(pistol.reloadShellsLoaded<pistol.reloadShellsTarget){
          if(!loadShotgunShell())break;
        }
        if(pistol.reloadShellsLoaded>=pistol.reloadShellsTarget){
          pistol.shotgunFiredMask=0;
        }
      }
    }else{
      if(reloadProgress>=.16)discardMagazine();
      if(reloadProgress>=.68)commitReload();
    }
    if(!def.plasma&&!['shotgun','pumpShotgun','revolver'].includes(def.id)&&pistol.reloadWasEmpty&&reloadProgress>=.88){
      // 슬라이드/노리쇠를 놓아 전진하는 순간에만 새 탄이 약실로 들어간다.
      feedChamberFromMagazine();
    }
    if(pistol.reloadElapsed>=reloadTime){
      if(!def.plasma&&!['shotgun','pumpShotgun','revolver'].includes(def.id)){
        commitReload();
        if(pistol.reloadWasEmpty)feedChamberFromMagazine();
      }else if(def.id==='revolver'){
        commitRevolverMoonClip();
      }
      pistol.reloadExitPose=snapshotCurrentWeaponPose();
      pistol.reloadExitElapsed=0;
      pistol.reloading=false;
      pistol.reloadElapsed=0;
      pistol.reloadEntryPose=null;
      pistol.reloadMagazine=null;
      pistol.reloadKeepMagazine=false;
      pistol.reloadRetainedMagazine=null;
      if(def.id==='pumpShotgun'){
        const shouldPump=pistol.pumpAfterReload&&!pistol.chamberRound&&
          pistol.magazine&&pistol.magazine.rounds.length>0;
        pistol.pumpReloadUseSpeedloader=false;
        pistol.pumpReloadSpeedloader=null;
        pistol.pumpAfterReload=false;
        if(shouldPump){
          pistol.pumpActive=true;
          pistol.pumpElapsed=0;
          pistol.pumpEjected=false;
        }
      }
    }
  }

}

function updateTransientShotEffects(dt){
  updateSeveredWounds(dt);
  updateBarrelSmoke(dt);
  for(let i=bulletImpacts.length-1;i>=0;i--){
    bulletImpacts[i].life-=dt;
    if(bulletImpacts[i].life<=0){bakeBulletImpact(bulletImpacts[i]);bulletImpacts.splice(i,1);}
  }
  for(let i=muzzleDischarges.length-1;i>=0;i--){
    muzzleDischarges[i].age+=dt;
    if(muzzleDischarges[i].age>=muzzleDischarges[i].life)muzzleDischarges.splice(i,1);
  }
  for(let i=deflectedBullets.length-1;i>=0;i--){
    const fragment=deflectedBullets[i];
    fragment.age+=dt;
    fragment.x+=fragment.vx*dt;fragment.y+=fragment.vy*dt;
    fragment.vx*=Math.pow(.055,dt);fragment.vy*=Math.pow(.055,dt);
    fragment.angle+=fragment.spin*dt;
    if(fragment.age>=fragment.life)deflectedBullets.splice(i,1);
  }
  for(let i=ejectedCasings.length-1;i>=0;i--){
    const casing=ejectedCasings[i];
    // 탄창과 달리 탄피는 짧게 튀는 모습만 남기고 미세한 구름/회전을 오래 계산하지 않는다.
    updateDroppedObject(casing,dt,1.5,{speed:10,spin:2.5,drag:.008,spinDrag:.015,maxAge:.70});
    if(!casing.settled)continue;
    bakeGroundCasing(casing);
    ejectedCasings.splice(i,1);
  }
}

function updateWeapon(dt){
  updateWeaponStateCore(dt);
  if(pistol!==weaponStates.plasmaPistol){
    const plasma=weaponStates.plasmaPistol;
    plasma.thermalLock=Math.max(0,plasma.thermalLock-dt);
    plasma.cooldown=Math.max(0,plasma.cooldown-dt);
    plasma.coolerSpin+=dt*(plasma.thermalLock>0?10:1.2);
  }
  for(let i=plasmaLances.length-1;i>=0;i--){
    plasmaLances[i].age+=dt;
    if(plasmaLances[i].age>=plasmaLances[i].life)plasmaLances.splice(i,1);
  }
  for(let i=plasmaSteam.length-1;i>=0;i--){
    const puff=plasmaSteam[i];
    puff.age+=dt;
    if(puff.anchor){
      puff.offsetX+=puff.vx*dt;
      puff.offsetY+=puff.vy*dt;
      puff.x=puff.anchor.x+puff.offsetX;
      puff.y=puff.anchor.y+puff.offsetY;
    }else{
      puff.x+=puff.vx*dt;puff.y+=puff.vy*dt;
    }
    puff.vx*=Math.pow(.15,dt);puff.vy*=Math.pow(.15,dt);
    if(puff.age>=puff.life)plasmaSteam.splice(i,1);
  }
  for(let i=shotTraces.length-1;i>=0;i--){
    shotTraces[i].life-=dt;
    if(shotTraces[i].life<=0)shotTraces.splice(i,1);
  }
  for(const subject of testSubjects){
    subject.hitFlash=Math.max(0,(subject.hitFlash||0)-dt);
  }
  for(const magazine of droppedMagazines)updateDroppedObject(magazine,dt,3);
}

function ownedWeaponState(weaponId){
  if(weaponId===sidearmWeaponId)return sidearmWeaponState;
  if(weaponId===quickWeaponSlots[activeQuickSlot])return quickWeaponStates[activeQuickSlot];
  if(weaponId===quickWeaponSlots.one)return quickWeaponStates.one;
  if(weaponId===quickWeaponSlots.two)return quickWeaponStates.two;
  return weaponStates[weaponId];
}

function commitPlayerWeaponState(weaponId,instance=null){
  const next=instance||ownedWeaponState(weaponId);
  if(!next)return false;
  next.cooldown=0;
  next.recoil=0;
  next.recoilVelocity=0;
  next.recoilYaw=0;
  next.recoilYawVelocity=0;
  next.accuracyBloom=0;
  next.rapidShotCount=0;
  next.lastShotAge=99;
  next.burstHeldShots=0;
  next.aimDeniedElapsed=1;
  next.muzzleFlash=0;
  next.shotCycles.length=0;
  pistol=next;
  return true;
}

function updateWeaponSwitch(dt){
  if(!weaponSwitch.active)return;
  weaponSwitch.elapsed+=dt;
  const progress=clamp(weaponSwitch.elapsed/weaponSwitch.duration,0,1);
  if(!weaponSwitch.committed&&progress>=weaponSwitch.commitRatio){
    if(weaponSwitch.pendingMeleeWeapon){
      const target=weaponSwitch.pendingMeleeWeapon;
      weaponSwitch.active=false;
      weaponSwitch.committed=true;
      weaponSwitch.pendingWeaponId=null;
      weaponSwitch.pendingMeleeWeapon=null;
      weaponSwitch.pickupSwap=null;
      meleeState.active=true;
      meleeState.weapon=target==='fists'?'fists':meleeRigForWeapon(target);
      if(target==='fists'){
        meleeState.attack=null;
        meleeState.elapsed=0;
        meleeState.duration=0;
        meleeState.hitDone=false;
        meleeState.queuedAttack=null;
        meleeState.queuedAfterAttack=null;
        meleeState.comboStraight=false;
        meleeState.hookWindow=0;
        meleeState.hookFromStraight=false;
        meleeState.hookEntryPulse=0;
        knifeState.attack=null;
        knifeState.drawBlend=0;
        knifeState.drawTarget=0;
        knifeState.sheathing=false;
        knifeState.exitTarget=null;
        knifeState.exitWeaponId=null;
        knifeState.guardHeld=false;
        knifeState.guardBlend=0;
        longswordState.attack=false;
        longswordState.charging=false;
        longswordState.drawBlend=0;
        longswordState.drawTarget=0;
        longswordState.sheathing=false;
        longswordState.exitTarget=null;
        longswordState.exitWeaponId=null;
        longswordState.guardHeld=false;
        longswordState.guardBlend=0;
      }else if(target==='knife'){
        knifeState.attack=null;
        knifeState.drawBlend=0;
        knifeState.drawTarget=1;
        knifeState.sheathing=false;
        knifeState.guardHeld=false;
        knifeState.guardBlend=0;
        knifeState.poseReady=false;
      }else if(isSwordWeapon(target)){
        longswordState.drawBlend=0;
        longswordState.drawTarget=1;
        longswordState.sheathing=false;
        longswordState.exitTarget=null;
        longswordState.exitWeaponId=null;
        longswordState.guardHeld=false;
        longswordState.guardBlend=0;
        longswordState.guardFlash=0;
        longswordState.parry=false;
        longswordState.parryElapsed=0;
        longswordState.parryWindow=0;
        longswordState.parryPreviousBlade=null;
        longswordState.parryHitTargets=new Set();
      }
      return;
    }
    const swap=weaponSwitch.pickupSwap;
    let pickedInstance=null;
    if(swap){
      const pickup=swap.pickupRef;
      pickedInstance=pickup?.weaponState||cloneWeaponStateInstance(weaponStates[swap.pickedId]);
      if(swap.slot==='sidearm'){
        const droppedInstance=sidearmWeaponState;
        sidearmWeaponId=swap.pickedId;
        sidearmWeaponState=pickedInstance;
        const pickup=swap.pickupRef||
          (swap.pickupKind==='plasma'?testPlasmaPickup:testSidearmPickup);
        pickup.weaponId=swap.droppedId;
        pickup.weaponState=droppedInstance;
      }else{
        const droppedInstance=quickWeaponStates[swap.slot];
        quickWeaponSlots[swap.slot]=swap.pickedId;
        quickWeaponStates[swap.slot]=pickedInstance;
        activeQuickSlot=swap.slot;
        const pickup=swap.pickupRef||(swap.pickupKind==='assault'
          ?testAssaultWeaponPickup
          :(swap.pickupKind==='pump'?testPumpWeaponPickup:testWeaponPickup));
        pickup.weaponId=swap.droppedId;
        pickup.weaponState=droppedInstance;
      }
      // 같은 종류를 두 주무기 슬롯에 넣어도 한 슬롯의 교체가 다른 슬롯의
      // 소유권을 지우지 않도록 실제 세 슬롯을 기준으로 다시 계산한다.
      availableWeaponIds.clear();
      availableWeaponIds.add(sidearmWeaponId);
      availableWeaponIds.add(quickWeaponSlots.one);
      availableWeaponIds.add(quickWeaponSlots.two);
    }
    commitPlayerWeaponState(weaponSwitch.pendingWeaponId,pickedInstance);
    weaponSwitch.committed=true;
  }
  if(weaponSwitch.elapsed>=weaponSwitch.duration){
    weaponSwitch.elapsed=weaponSwitch.duration;
    weaponSwitch.active=false;
    weaponSwitch.pendingWeaponId=null;
    weaponSwitch.pickupSwap=null;
    weaponSwitch.pendingMeleeWeapon=null;
  }
}

// ===== 입력 / 업데이트 =====
function toggleInventory(){
  inventory.open=!inventory.open;
  if(inventory.open&&inventory.section==='weapons'){
    const equippedIndex=WEAPON_DEFS.findIndex(def=>def.id===pistol.weaponId);
    inventory.selectedWeapon=equippedIndex>=0
      ?equippedIndex
      :Math.max(0,WEAPON_DEFS.findIndex(def=>availableWeaponIds.has(def.id)));
  }
  if(!inventory.open&&inventory.dragMagazine.active)finishInventoryDrag();
  if(!inventory.open&&inventory.loadHold)inventory.loadHold.active=false;
  keys.clear();
  mouse.down=false;
  mouse.aim=false;
  player.aimBlend=0;
  player.longGunBraceBlend=0;
  player.moving=false;
  player.sprinting=false;
  return true;
}

function cycleInventoryAmmo(direction){
  const compatible=compatibleWorkbenchAmmo();
  if(!compatible.length)return;
  const current=compatible.indexOf(ensureWorkbenchAmmoSelection());
  const next=compatible[(Math.max(0,current)+direction+compatible.length)%compatible.length];
  inventory.selectedAmmo=AMMO_TYPES.indexOf(next);
}

function cycleInventoryWeapon(direction){
  if(inventory.unloadSequence.active||pistol.reloading)return;
  const visible=availableWorkbenchWeapons();
  if(!visible.length)return;
  const currentId=workbenchWeaponDef().id;
  const current=Math.max(0,visible.findIndex(def=>def.id===currentId));
  const next=visible[(current+direction+visible.length)%visible.length];
  inventory.selectedWeapon=WEAPON_DEFS.indexOf(next);
  ensureWorkbenchAmmoSelection(next);
}

// 몸통·팔·총을 한 묶음으로 돌리는 선회 배율. 3단계가 기준 속도다.
// 5단계는 마우스를 거의 즉시 따라가는 풀업 기준, 3단계는 적당한 전투 선회 기준이다.
const AIM_SPEED_LEVELS=[.80,1,1.25,1.72,3.0];
function aimSpeedMultiplier(){
  return AIM_SPEED_LEVELS[clamp((inventory.aimUpgradeLevel||3)-1,0,AIM_SPEED_LEVELS.length-1)];
}

// 근접 자세도 조준점을 즉시 복사하지 않고 몸의 질량에 맞춰 따라간다.
// 공격 중에는 회전량만 줄여 기존 타격 궤적이 마우스에 끌려 뒤틀리지 않게 한다.
function updateMeleeAimMotion(targetAngle,dt,kind='fists',actionActive=false){
  player.angle=normAngle(targetAngle);
  if(player.meleeAimMode!==kind||!Number.isFinite(player.meleeAimAngle)){
    player.meleeAimMode=kind;
    player.meleeAimAngle=player.bodyAngle;
  }
  // 장검도 초인인 플레이어가 양손으로 적극적으로 이끈다. 무게감은 공격 궤적과
  // 회수에 남기고, 평상시 선회 자체가 입력을 한참 뒤쫓지는 않게 한다.
  const baseRate=kind==='knife'?4.35:(kind==='armingSword'?7.15:(kind==='longsword'?6.35:4.05));
  const actionScale=actionActive?(kind==='longsword'?.34:(kind==='armingSword'?.40:.46)):1;
  const error=normAngle(player.angle-player.meleeAimAngle);
  const step=clamp(
    error,
    -baseRate*aimSpeedMultiplier()*actionScale*dt,
    baseRate*aimSpeedMultiplier()*actionScale*dt
  );
  player.meleeAimAngle=normAngle(player.meleeAimAngle+step);
  player.headAngle=normAngle(
    player.headAngle+normAngle(player.angle-player.headAngle)*Math.min(1,dt*30)
  );
  player.weaponAngle=player.meleeAimAngle;
  player.weaponAngularVelocity=dt>0?step/dt:0;
  return player.meleeAimAngle;
}

function setInventorySection(section){
  if(section!=='weapons'&&section!=='upgrades')return false;
  if(inventory.unloadSequence.active||pistol.reloading)return false;
  inventory.section=section;
  if(section==='weapons'){
    const equippedIndex=WEAPON_DEFS.findIndex(def=>def.id===pistol.weaponId);
    if(equippedIndex>=0)inventory.selectedWeapon=equippedIndex;
  }
  if(inventory.loadHold)inventory.loadHold.active=false;
  finishInventoryDrag();
  return true;
}

function setAimUpgradeLevel(level){
  inventory.aimUpgradeLevel=clamp(Math.round(level),1,5);
  return inventory.aimUpgradeLevel;
}

function cycleInventoryMagazine(direction){
  if(inventory.unloadSequence.active||pistol.reloading)return;
  const def=workbenchWeaponDef();
  const magazines=compatibleInventoryMagazines(def);
  if(magazines.length===0)return;
  const key=def.magazineType;
  inventory.selectedMagazineByType[key]=(
    (inventory.selectedMagazineByType[key]||0)+direction+magazines.length
  )%magazines.length;
}

function plasmaHolsterLocked(){
  return !meleeState.active&&!!currentWeaponDef().plasma&&pistol.thermalLock>0;
}

function equipWeaponById(weaponId,animate=true,options=null){
  if(plasmaHolsterLocked())return false;
  if(pistol.reloading||magazinePickup.active||pistolMelee.attack||smgMelee.attack||rifleMelee.attack||
    shotgunMelee.attack||shotgunMelee.recovery>0||weaponSwitch.active)return false;
  const pickupSwap=options&&options.pickupSwap||null;
  const next=ownedWeaponState(weaponId);
  if(!next||(!pickupSwap&&next===pistol)||(!pickupSwap&&!availableWeaponIds.has(weaponId)))return false;
  mouse.down=false;
  mouse.aim=false;
  player.longGunBraceBlend=0;
  if(!animate){
    commitPlayerWeaponState(weaponId);
    weaponSwitch.active=false;
    weaponSwitch.elapsed=0;
    weaponSwitch.committed=false;
    weaponSwitch.pendingWeaponId=null;
    weaponSwitch.pickupSwap=null;
    weaponSwitch.pendingMeleeWeapon=null;
    return true;
  }
  weaponSwitch.active=true;
  weaponSwitch.elapsed=0;
  weaponSwitch.duration=pickupSwap?.86:.62;
  weaponSwitch.commitRatio=pickupSwap?.58:.46;
  weaponSwitch.committed=false;
  weaponSwitch.pendingWeaponId=weaponId;
  weaponSwitch.pickupSwap=pickupSwap;
  weaponSwitch.pendingMeleeWeapon=null;
  return true;
}

function equipWorkbenchWeapon(){
  if(inventory.unloadSequence.active||pistol.reloading)return false;
  // 작업대는 일시정지 화면이므로 전투 중 드로우 모션을 재생하지 않는다.
  return equipWeaponById(workbenchWeaponDef().id,false);
}

function equipNextSidearm(){
  return equipWeaponById(sidearmWeaponId);
}

function loadWorkbenchRevolverMoonClip(){
  if(!inventory.open||pistol.reloading||inventory.unloadSequence.active)return false;
  const def=workbenchWeaponDef();
  if(def.id!=='revolver')return false;
  const clip=selectedInventoryMagazine(def);
  const ammo=ensureWorkbenchAmmoSelection(def);
  if(!clip||!ammo)return false;
  if(clip.rounds.length>=clip.capacity){
    inventory.loadMotion={active:true,kind:'full',elapsed:0,duration:.28,ammoId:ammo.id};
    return false;
  }
  if((inventory.loose[ammo.id]||0)<=0){
    inventory.loadMotion={active:true,kind:'empty',elapsed:0,duration:.28,ammoId:ammo.id};
    return false;
  }
  inventory.loose[ammo.id]--;
  clip.rounds.push(ammo.id);
  inventory.loadMotion={active:true,kind:'load',elapsed:0,duration:.24,ammoId:ammo.id};
  return true;
}

function unloadWorkbenchRevolverCylinder(){
  if(workbenchWeaponDef().id!=='revolver'||pistol.reloading)return false;
  return unloadSelectedMagazineAll();
}

function currentHydrogenSource(state){
  return state.hydrogenTanks.find(tank=>tank.id===state.hydrogenSourceTankId)||null;
}

function fillHydrogenUnits(state,dt){
  if(state.hydrogenTankSwap>0){
    state.hydrogenTankSwap=Math.max(0,state.hydrogenTankSwap-dt);
    state.hydrogenFillAccumulator=0;
    return 0;
  }
  // 시간만 누적하고 실제 수소는 0.01초마다 정수 1단위씩 이동시킨다.
  state.hydrogenFillAccumulator=(state.hydrogenFillAccumulator||0)+dt*100;
  const due=Math.floor(state.hydrogenFillAccumulator+1e-9);
  state.hydrogenFillAccumulator-=due;
  let tank=currentHydrogenSource(state);
  if(!tank||tank.remaining<=0){
    tank=state.hydrogenTanks.find(item=>item.remaining>0);
    state.hydrogenSourceTankId=tank? tank.id:null;
  }
  if(!tank)return 0;
  const amount=Math.max(0,Math.min(due,state.hydrogenCapacity-state.hydrogen,tank.remaining));
  // 공급통에서 실제 빠진 양만 총에 넣는다. 표시와 충전은 같은 통을 참조한다.
  const before=tank.remaining;
  tank.remaining=Math.max(0,before-amount);
  const transferred=before-tank.remaining;
  state.hydrogen+=transferred;
  if(transferred>0)hydrogenAudioTransfer={state,time:lightingTime};
  if(tank.remaining===0&&state.hydrogen<state.hydrogenCapacity&&state.hydrogenReserve>0){
    state.hydrogenTankSwap=.55;
    state.hydrogenFillAccumulator=0;
  }
  return transferred;
}

function refillWorkbenchPlasma(dt=0){
  const def=workbenchWeaponDef();
  const state=workbenchWeaponState();
  if(!def.plasma||state.thermalLock>0||state.reloading)return false;
  const remaining=Math.min(state.hydrogenCapacity-state.hydrogen,state.hydrogenReserve);
  if(remaining<=0)return false;
  if(dt<=0){state.hydrogenFillAccumulator=0;state.hydrogenTankSwap=0;return true;}
  const amount=fillHydrogenUnits(state,dt);
  if(amount<=0)return true;
  inventory.loadMotion={active:true,kind:'load',elapsed:0,duration:.36,ammoId:'standard'};
  return true;
}

function swapWorkbenchRevolverMoonClip(){
  if(workbenchWeaponDef().id!=='revolver'||pistol.reloading)return false;
  const state=weaponStates.revolver;
  const incoming=selectedInventoryMagazine();
  if(!incoming||incoming.rounds.length===0)return false;
  const index=inventory.magazines.indexOf(incoming);
  if(index<0)return false;
  const outgoing=state.magazine;
  if(state.chamberRound&&outgoing.rounds.length<outgoing.capacity){
    outgoing.rounds.push(state.chamberRound);
  }
  state.chamberRound=null;
  for(const ammoId of outgoing.rounds){
    inventory.loose[ammoId]=(inventory.loose[ammoId]||0)+1;
  }
  outgoing.rounds.length=0;
  inventory.magazines.splice(index,1,outgoing);
  state.magazine=incoming;
  state.chamberRound=incoming.rounds.pop()||null;
  inventory.selectedMagazineByType.revolver22=Math.max(
    0,compatibleInventoryMagazines().indexOf(outgoing)
  );
  inventory.loadMotion={active:true,kind:'moonclip',elapsed:0,duration:.46,ammoId:state.chamberRound||'standard'};
  return true;
}

function startWorkbenchMagazineSwap(){
  if(
    !inventory.open||inventory.unloadSequence.active||
    magazinePickup.active||pistol.reloading
  )return false;
  const def=workbenchWeaponDef();
  if(def.id==='revolver')return swapWorkbenchRevolverMoonClip();
  if(def.id==='pumpShotgun')return false;
  const replacement=selectedInventoryMagazine(def);
  if(!replacement)return false;

  const state=weaponStates[def.id];
  if(pistol!==state)equipWeaponById(def.id,false);
  pistol.reloadEntryPose=snapshotCurrentWeaponPose();
  pistol.reloadExitPose=null;
  pistol.reloadExitElapsed=0;
  pistol.reloading=true;
  pistol.reloadElapsed=0;
  pistol.reloadCommitted=false;
  pistol.reloadDiscarded=false;
  pistol.reloadWasEmpty=!pistol.chamberRound;
  pistol.reloadKeepMagazine=true;
  pistol.reloadRetainedMagazine=null;
  pistol.reloadMagazine=replacement;
  inventory.loadMotion.active=false;
  inventory.dragMagazine.active=false;
  mouse.down=false;
  mouse.aim=false;
  player.aimBlend=0;
  player.longGunBraceBlend=0;
  return true;
}

function loadSelectedMagazineRound(){
  if(inventory.unloadSequence.active||pistol.reloading)return false;
  const magazine=selectedInventoryMagazine();
  const ammo=AMMO_TYPES[inventory.selectedAmmo];
  if(!magazine)return false;
  const rifle762Magazine=magazine.magazineType==='rifle762';
  const rifle556Magazine=magazine.magazineType==='rifle556';
  const lmg556Box=magazine.magazineType==='lmg556';
  const pumpSpeedloader=magazine.magazineType==='pump12tube';
  const wrongCaliber=(pumpSpeedloader&&ammo.id!=='buckshot')||
    (!pumpSpeedloader&&ammo.id==='buckshot')||
    (rifle762Magazine&&ammo.id!=='rifle762')||
    (rifle556Magazine&&ammo.id!=='rifle556')||
    (lmg556Box&&ammo.id!=='rifle556')||
    (!pumpSpeedloader&&!rifle762Magazine&&!rifle556Magazine&&!lmg556Box&&
      (ammo.id==='rifle762'||ammo.id==='rifle556'));
  if(wrongCaliber){
    inventory.loadMotion={
      active:true,kind:'wrongammo',elapsed:0,duration:.24,ammoId:ammo.id
    };
    return false;
  }
  if(magazine.rounds.length>=magazine.capacity){
    inventory.loadMotion={
      active:true,kind:'full',elapsed:0,duration:.24,ammoId:ammo.id
    };
    return false;
  }
  if(inventory.loose[ammo.id]<=0){
    inventory.loadMotion={
      active:true,kind:'empty',elapsed:0,duration:.24,ammoId:ammo.id
    };
    return false;
  }
  magazine.rounds.push(ammo.id);
  inventory.loose[ammo.id]--;
  // 빈 탄창이 첫 발을 받아 위쪽 그룹으로 이동해도 연속 장전 대상은 그대로 유지한다.
  inventory.selectedMagazineByType[magazine.magazineType]=
    compatibleInventoryMagazines(
      WEAPON_DEFS.find(weapon=>weapon.magazineType===magazine.magazineType)||workbenchWeaponDef()
    ).indexOf(magazine);
  inventory.loadMotion={
    active:true,kind:'load',elapsed:0,duration:.24,ammoId:ammo.id
  };
  return true;
}

function updateInventoryLoadHold(dt){
  const hold=inventory.loadHold;
  if(!hold||!hold.active)return;
  if(workbenchWeaponDef().plasma){
    hold.active=refillWorkbenchPlasma(dt);
    return;
  }
  hold.elapsed+=dt;
  while(hold.active&&hold.elapsed>=hold.nextAt){
    // 첫 발은 키를 누른 순간 이미 들어갔다. 충분히 누른 뒤부터만 연속 장전한다.
    const def=workbenchWeaponDef();
    const loaded=def.plasma?refillWorkbenchPlasma():
      (def.id==='revolver'?loadWorkbenchRevolverMoonClip():loadSelectedMagazineRound());
    if(!loaded){
      hold.active=false;
      break;
    }
    hold.nextAt+=hold.interval;
  }
}

function ejectWorkbenchMagazineRound(sequence){
  const magazine=sequence.magazine;
  if(!magazine||magazine.rounds.length===0)return false;
  const ammoId=magazine.rounds.pop();
  inventory.loose[ammoId]=(inventory.loose[ammoId]||0)+1;
  const serial=sequence.serial++;
  sequence.ejected.push({
    ammoId,age:0,life:.46,
    slot:magazine.rounds.length,
    side:serial%2===0?1:-1,
    spin:(serial%3-1)*2.4+(serial%2===0?2.7:-2.7)
  });
  return true;
}

function unloadSelectedMagazineAll(){
  if(inventory.unloadSequence.active||pistol.reloading)return false;
  const magazine=selectedInventoryMagazine();
  if(!magazine||magazine.rounds.length===0){
    inventory.loadMotion={
      active:true,kind:'magempty',elapsed:0,duration:.24,ammoId:'standard'
    };
    return false;
  }
  inventory.loadMotion.active=false;
  inventory.unloadSequence={
    active:true,magazine,elapsed:0,accumulator:0,
    interval:magazine.magazineType==='revolver22'
      ?.075:(magazine.magazineType==='pump12tube'?.065:.045),
    serial:0,ejected:[]
  };
  // 첫 발은 키를 누르는 순간 바로 빠져야 입력감이 산다.
  ejectWorkbenchMagazineRound(inventory.unloadSequence);
  return true;
}

function updateInventoryUnload(dt){
  const sequence=inventory.unloadSequence;
  if(!sequence.active)return;
  sequence.elapsed+=dt;
  for(const round of sequence.ejected)round.age+=dt;
  sequence.ejected=sequence.ejected.filter(round=>round.age<round.life);
  if(sequence.magazine&&sequence.magazine.rounds.length>0){
    sequence.accumulator+=dt;
    while(
      sequence.accumulator>=sequence.interval&&
      sequence.magazine.rounds.length>0
    ){
      sequence.accumulator-=sequence.interval;
      ejectWorkbenchMagazineRound(sequence);
    }
  }else if(sequence.ejected.length===0){
    sequence.active=false;
    sequence.magazine=null;
  }
  if(sequence.magazine){
    const def=WEAPON_DEFS.find(
      weapon=>weapon.magazineType===sequence.magazine.magazineType
    );
    if(def){
      inventory.selectedMagazineByType[def.magazineType]=
        compatibleInventoryMagazines(def).indexOf(sequence.magazine);
    }
  }
}

function inventoryPointerPosition(event){
  if(gameplayCrosshairVisible()&&(document.fullscreenElement||document.pointerLockElement===canvas)){
    return{x:mouse.x,y:mouse.y};
  }
  const rect=canvas.getBoundingClientRect();
  return{
    x:(event.clientX-rect.left)*W/rect.width,
    y:(event.clientY-rect.top)*H/rect.height
  };
}

function inventoryMagazineLayout(){
  const panel={x:86,y:38,w:788,h:464};
  const def=workbenchWeaponDef();
  const magazines=compatibleInventoryMagazines(def);
  const selectedIndex=clamp(
    inventory.selectedMagazineByType[def.magazineType]||0,0,
    Math.max(0,magazines.length-1)
  );
  const visible=6;
  const first=Math.max(0,Math.min(
    selectedIndex-2,
    Math.max(0,magazines.length-visible)
  ));
  return{panel,def,magazines,selectedIndex,visible,first};
}

function inventoryMagazineAt(x,y){
  const layout=inventoryMagazineLayout();
  if(x<layout.panel.x+18||x>layout.panel.x+232)return null;
  for(let row=0;row<layout.visible;row++){
    const rowY=layout.panel.y+186+row*36;
    if(y<rowY||y>rowY+30)continue;
    const index=layout.first+row;
    const magazine=layout.magazines[index];
    return magazine?{...layout,index,magazine,row,rowY}:null;
  }
  return null;
}

function inventorySwapButtonRect(){
  const panel={x:86,y:38};
  const infoX=panel.x+258+224;
  return{x:infoX+143,y:panel.y+326,w:118,h:29};
}

function availableWorkbenchWeapons(){
  return WEAPON_DEFS.filter(def=>availableWeaponIds.has(def.id));
}

function inventoryWeaponCardRect(index,count=availableWorkbenchWeapons().length){
  const panel={x:86,y:38};
  const gap=8;
  const width=Math.floor((752-gap*(Math.max(1,count)-1))/Math.max(1,count));
  return{x:panel.x+18+index*(width+gap),y:panel.y+38,w:width,h:46};
}

function inventorySectionRect(section){
  const panel={x:86,y:38};
  return section==='weapons'
    ?{x:panel.x+18,y:panel.y+8,w:148,h:24}
    :{x:panel.x+174,y:panel.y+8,w:148,h:24};
}

function inventoryUpgradeCardRect(level){
  const panel={x:86,y:38};
  const gap=10,w=138;
  return{x:panel.x+29+(level-1)*(w+gap),y:panel.y+116,w,h:172};
}

function pointInRect(x,y,rect){
  return x>=rect.x&&x<=rect.x+rect.w&&y>=rect.y&&y<=rect.y+rect.h;
}

function moveInventoryMagazineToIndex(magazine,def,targetIndex){
  const fromGlobal=inventory.magazines.indexOf(magazine);
  if(fromGlobal<0)return false;
  const compatible=compatibleInventoryMagazines(def);
  const currentIndex=compatible.indexOf(magazine);
  targetIndex=clamp(targetIndex,0,compatible.length-1);
  if(currentIndex===targetIndex)return false;

  inventory.magazines.splice(fromGlobal,1);
  const remaining=inventory.magazines.filter(
    item=>item.magazineType===def.magazineType
  );
  if(targetIndex>=remaining.length){
    const last=remaining[remaining.length-1];
    const insertAt=last?inventory.magazines.indexOf(last)+1:inventory.magazines.length;
    inventory.magazines.splice(insertAt,0,magazine);
  }else{
    const anchor=remaining[targetIndex];
    inventory.magazines.splice(inventory.magazines.indexOf(anchor),0,magazine);
  }
  inventory.selectedMagazineByType[def.magazineType]=
    compatibleInventoryMagazines(def).indexOf(magazine);
  return true;
}

function handleInventoryPointerDown(event){
  if(event.button!==0)return;
  event.preventDefault();
  const point=inventoryPointerPosition(event);
  mouse.x=point.x;
  mouse.y=point.y;
  for(const section of ['weapons','upgrades']){
    if(pointInRect(point.x,point.y,inventorySectionRect(section))){
      setInventorySection(section);
      return;
    }
  }
  if(inventory.section==='upgrades'){
    for(let level=1;level<=5;level++){
      if(pointInRect(point.x,point.y,inventoryUpgradeCardRect(level))){
        setAimUpgradeLevel(level);
        return;
      }
    }
    return;
  }
  if(pistol.reloading||inventory.unloadSequence.active)return;

  const swapRect=inventorySwapButtonRect();
  if(pointInRect(point.x,point.y,swapRect)){
    startWorkbenchMagazineSwap();
    return;
  }

  const panel={x:86,y:38};
  const visibleWeapons=availableWorkbenchWeapons();
  for(let i=0;i<visibleWeapons.length;i++){
    const weapon=visibleWeapons[i];
    const rect=inventoryWeaponCardRect(i,visibleWeapons.length);
    if(pointInRect(point.x,point.y,rect)){
      inventory.selectedWeapon=WEAPON_DEFS.indexOf(weapon);
      ensureWorkbenchAmmoSelection(weapon);
      return;
    }
  }
  const rightX=panel.x+258;
  const compatibleAmmo=compatibleWorkbenchAmmo();
  const ammoCardGap=7;
  const ammoCardWidth=Math.floor(
    (514-ammoCardGap*(compatibleAmmo.length-1))/Math.max(1,compatibleAmmo.length)
  );
  for(let i=0;i<compatibleAmmo.length;i++){
    const ammo=compatibleAmmo[i];
    const rect={
      x:rightX+i*(ammoCardWidth+ammoCardGap),
      y:panel.y+120,w:ammoCardWidth,h:58
    };
    if(pointInRect(point.x,point.y,rect)){
      inventory.selectedAmmo=AMMO_TYPES.indexOf(ammo);
      return;
    }
  }

  const hit=inventoryMagazineAt(point.x,point.y);
  if(!hit)return;
  inventory.selectedMagazineByType[hit.def.magazineType]=hit.index;
  inventory.dragMagazine={
    active:true,moved:false,magazine:hit.magazine,
    startX:point.x,startY:point.y
  };
}

function handleInventoryPointerMove(event){
  const point=inventoryPointerPosition(event);
  mouse.x=point.x;
  mouse.y=point.y;
  const drag=inventory.dragMagazine;
  if(!inventory.open||!drag.active||pistol.reloading)return;
  if(Math.hypot(point.x-drag.startX,point.y-drag.startY)>4)drag.moved=true;
  if(!drag.moved)return;
  const hit=inventoryMagazineAt(point.x,point.y);
  if(!hit||hit.magazine===drag.magazine)return;
  moveInventoryMagazineToIndex(drag.magazine,hit.def,hit.index);
}

function finishInventoryDrag(){
  inventory.dragMagazine.active=false;
  inventory.dragMagazine.moved=false;
  inventory.dragMagazine.magazine=null;
}

addEventListener('keydown',event=>{
  
  if(player.hp<=0&&event.code==='Enter'){
    event.preventDefault();
    if(!event.repeat)respawnPlayer();
    return;
  }
  if(levelComplete&&event.code==='Enter'){
    event.preventDefault();
    if(!event.repeat)restartGame();
    return;
  }
  if(event.code==='Tab'){
    event.preventDefault();
    if(!event.repeat)toggleInventory();
    return;
  }
  if(event.code==='KeyI'){
    event.preventDefault();
    if(!event.repeat){
      player.invincible=!player.invincible;
      player.hitFlash=0;
    }
    return;
  }
  if(inventory.open){
    if([
      'ArrowLeft','ArrowRight','ArrowUp','ArrowDown',
      'KeyQ','KeyE','KeyR','KeyM','KeyU','Backspace','Enter',
      'Digit1','Digit2','Digit3','Digit4','Digit5'
    ].includes(event.code))event.preventDefault();
    if(event.repeat)return;
    if(event.code==='KeyM')setInventorySection('weapons');
    if(event.code==='KeyU')setInventorySection('upgrades');
    if(inventory.section==='upgrades'){
      if(event.code==='ArrowLeft'||event.code==='ArrowDown')setAimUpgradeLevel(inventory.aimUpgradeLevel-1);
      if(event.code==='ArrowRight'||event.code==='ArrowUp')setAimUpgradeLevel(inventory.aimUpgradeLevel+1);
      if(/^Digit[1-5]$/.test(event.code))setAimUpgradeLevel(Number(event.code.slice(-1)));
      return;
    }
    if(event.code==='ArrowLeft')cycleInventoryAmmo(-1);
    if(event.code==='ArrowRight')cycleInventoryAmmo(1);
    if(event.code==='ArrowUp')cycleInventoryMagazine(-1);
    if(event.code==='ArrowDown')cycleInventoryMagazine(1);
    if(event.code==='KeyQ')cycleInventoryWeapon(-1);
    if(event.code==='KeyE')cycleInventoryWeapon(1);
    if(event.code==='KeyR'){
      const loaded=workbenchWeaponDef().plasma
        ?refillWorkbenchPlasma()
        :(workbenchWeaponDef().id==='revolver'
          ?loadWorkbenchRevolverMoonClip():loadSelectedMagazineRound());
      const hold=inventory.loadHold;
      hold.active=loaded;
      hold.elapsed=0;
      hold.nextAt=hold.initialDelay;
    }
    if(event.code==='Backspace'){
      if(workbenchWeaponDef().id==='revolver')unloadWorkbenchRevolverCylinder();
      else unloadSelectedMagazineAll();
    }
    if(event.code==='Enter')equipWorkbenchWeapon();
    return;
  }
  keys.add(event.code);
  if(event.code==='Digit1'&&!event.repeat){activeQuickSlot='one';equipWeaponById(quickWeaponSlots.one);}
  if(event.code==='Digit2'&&!event.repeat){activeQuickSlot='two';equipWeaponById(quickWeaponSlots.two);}
  if(event.code==='KeyE'&&!event.repeat)equipNextSidearm();
  if(event.code==='KeyB'&&!event.repeat)toggleCurrentFireMode();
  if(event.code==='KeyR'&&!event.repeat)startReload(event.shiftKey);
  if(event.code==='KeyF'&&!event.repeat){
    if(!toggleTestRoomLight()&&!tryPickupLongsword()&&!trySwapTestWeaponPickup()&&!startArmorPickup()&&!pickupBuckshotSupply())startMagazinePickup();
  }
});

function updateAimMotion(targetAngle,dt){
  player.meleeAimMode=null;
  player.angle=normAngle(targetAngle);
  const aimSpeed=aimSpeedMultiplier();
  const def=currentWeaponDef();
  const baseTurnRate=['pistol','revolver','plasmaPistol'].includes(def.id)?5.8:
    (def.id==='smg'?5.2:(def.id==='assaultRifle'?4.7:
      (def.id==='battleRifle'?4.1:(def.id==='lmg'?3.55:(def.id==='shotgun'?4.4:4.0)))));
  const turnRate=baseTurnRate*aimSpeed*(magazinePickup.active?.78:1);

  // 1. 머리가 마우스를 가장 먼저 본다.
  const headFollow=normAngle(player.angle-player.headAngle)*Math.min(1,dt*42);
  player.headAngle=normAngle(
    player.headAngle+headFollow
  );

  // 2. 몸통이 기본 선회를 담당한다.
  const bodyError=normAngle(player.angle-player.bodyAngle);
  const bodyStep=clamp(bodyError,-turnRate*dt,turnRate*dt);
  player.bodyAngle=normAngle(player.bodyAngle+bodyStep);

  // 3. 팔과 총은 몸통보다 조금 빠르게 목표를 잡지만, 몸과 벌어지는 각도는 작게 제한한다.
  // 목표를 넘지 않는 선행점만 따라가므로 총과 몸이 서로 반대 방향으로 선회하지 않는다.
  const maxWeaponLead=['pistol','revolver','plasmaPistol'].includes(def.id)?.22:
    (def.id==='smg'?.18:.14);
  const remainingFromBody=normAngle(player.angle-player.bodyAngle);
  const desiredWeaponAngle=normAngle(
    player.bodyAngle+clamp(remainingFromBody,-maxWeaponLead,maxWeaponLead)
  );
  const weaponError=normAngle(desiredWeaponAngle-player.weaponAngle);
  const weaponStep=clamp(weaponError,-turnRate*1.28*dt,turnRate*1.28*dt);
  player.weaponAngle=normAngle(player.weaponAngle+weaponStep);
  const weaponLead=normAngle(player.weaponAngle-player.bodyAngle);
  if(Math.abs(weaponLead)>maxWeaponLead){
    player.weaponAngle=normAngle(player.bodyAngle+Math.sign(weaponLead)*maxWeaponLead);
  }
  player.weaponAngularVelocity=dt>0?weaponStep/dt:0;
  const headFromBody=normAngle(player.headAngle-player.bodyAngle);
  const maxHeadTurn=.52;
  if(Math.abs(headFromBody)>maxHeadTurn){
    player.headAngle=normAngle(
      player.bodyAngle+Math.sign(headFromBody)*maxHeadTurn
    );
  }

}

const MAX_HEAD_BODY_TURN=Math.PI/2;
function constrainHeadToTorso(actor,maxTurn=MAX_HEAD_BODY_TURN){
  if(!actor||!Number.isFinite(actor.bodyAngle)||!Number.isFinite(actor.headAngle))return;
  const offset=normAngle(actor.headAngle-actor.bodyAngle);
  if(Math.abs(offset)<=maxTurn)return;
  actor.headAngle=normAngle(actor.bodyAngle+Math.sign(offset)*maxTurn);
}

function constrainAllActorHeads(){
  constrainHeadToTorso(player);
  for(const actor of meleeDummies)constrainHeadToTorso(actor);
}

function update(dt){
  applyStraightLunge(dt);
  lightingTime+=dt;
  if(!gameStarted){
    if(introPlaying){
      introElapsed+=dt;
      updateMissionSupplyDrops(dt);
  for(const t of TRANSMITTERS)t.hitFlash=Math.max(0,(t.hitFlash||0)-dt);
      updateInsertionMission(dt);
    }
    return;
  }
  updatePlayerDeath(dt);
  updateBlood(dt);
  updateSoundEvents(dt);
  player.armorPickupFlash=Math.max(0,(player.armorPickupFlash||0)-dt);
  if(levelComplete){mouse.down=false;mouse.aim=false;keys.clear();return}
  updateInventoryUnload(dt);
  if(inventory.open){
    // 인벤토리 안에서는 모션을 숨기되 진행 중인 장전 자체는 계속 처리한다.
    if(pistol.reloading||currentWeaponDef().plasma||plasmaLances.length||plasmaSteam.length)updateWeapon(dt);
    updateInventoryLoadHold(dt);
    if(inventory.loadMotion.active){
      inventory.loadMotion.elapsed+=dt;
      if(inventory.loadMotion.elapsed>=inventory.loadMotion.duration){
        inventory.loadMotion.active=false;
      }
    }
    player.moving=false;
    player.sprinting=false;
    player.moveBlend+=(0-player.moveBlend)*Math.min(1,dt*10);
    player.sprintBlend+=(0-player.sprintBlend)*Math.min(1,dt*8);
    player.aimBlend=0;
    player.longGunBraceBlend=0;
    return;
  }
  updateGuards(dt);
  updateSquadAllies(dt);
  updateProjectiles(dt);
  updateGuardRespawns(dt);
  updateHelicopterReinforcement(dt);
  updateMissionSupplyDrops(dt);
  updateInsertionMission(dt);
  updateLabEntryMission(dt);
  updateLabDefenseAllies(dt);
  if(missionObjectiveComplete){
    missionCompleteDelay+=dt;
    if(missionCompleteDelay>=2.4)levelComplete=true;
  }
  const canAim=!magazinePickup.active&&!pistol.reloading&&!weaponSwitch.active;
  const aimTarget=mouse.aim&&canAim?1:0;
  player.aimBlend+=(aimTarget-player.aimBlend)*Math.min(
    1,dt*(aimTarget?13:18)
  );
  updateWeaponSwitch(dt);
  updateWeapon(dt);
  updateMagazinePickup(dt);

  if(magazinePickup.active&&magazinePickup.magazine){
    const magazine=magazinePickup.magazine;
    updateAimMotion(
      Math.atan2(magazine.y-player.y,magazine.x-player.x),dt
    );
  }else{
    const target=screenToWorld(mouse.x,mouse.y);
    updateAimMotion(
      Math.atan2(target.y-player.y,target.x-player.x),dt
    );
  }

  if(player.hp>0&&currentWeaponDef().automatic&&currentModeAllowsHeldFire())firePistol();

  let x=0;
  let y=0;
  if(keys.has('KeyA'))x--;
  if(keys.has('KeyD'))x++;
  if(keys.has('KeyW'))y--;
  if(keys.has('KeyS'))y++;
  if(player.hp<=0){x=0;y=0}
  player.moving=!!(x||y);
  player.sprinting=player.moving&&!magazinePickup.active&&(
    keys.has('ShiftLeft')||keys.has('ShiftRight')
  );
  player.moveBlend+=(
    (player.moving?1:0)-player.moveBlend
  )*Math.min(1,dt*(player.moving?14:10));
  player.sprintBlend+=(
    (player.sprinting?1:0)-player.sprintBlend
  )*Math.min(1,dt*(player.sprinting?11:8));
  const braceTarget=(
    !['pistol','revolver','shotgun'].includes(currentWeaponDef().id)&&
    !pistol.reloading&&player.sprinting&&mouse.aim
  )?1:0;
  player.longGunBraceBlend+=(
    braceTarget-player.longGunBraceBlend
  )*Math.min(1,dt*(braceTarget?10:8));

  if(player.moving){
    const length=Math.hypot(x,y);
    const sprintAimBlend=player.sprinting&&currentWeaponDef().id!=='shotgun'
      ?player.aimBlend:0;
    const aimedJogSpeed=aimedMovementSpeed(true);
    const aimedWalkSpeed=aimedMovementSpeed(false);
    let speed=player.sprinting
      ?SPRINT_SPEED+(aimedJogSpeed-SPRINT_SPEED)*smoothStep01(sprintAimBlend)
      :PLAYER_SPEED+(aimedWalkSpeed-PLAYER_SPEED)*smoothStep01(player.aimBlend);
    if(!meleeState.active&&currentWeaponDef().id==='lmg')speed*=player.sprinting?.88:.84;
    if(pistol.reloading)speed*=RELOAD_MOVE_MULTIPLIER;
    if(magazinePickup.active){
      speed=PLAYER_SPEED*MAGAZINE_PICKUP_MOVE_MULTIPLIER;
    }
    const beforeX=player.x;
    const beforeY=player.y;
    moveCircle(player,x/length*speed*dt,y/length*speed*dt);
    const moved=Math.hypot(player.x-beforeX,player.y-beforeY);
    // 질주는 걷기보다 실제 보폭이 길다. 정조준 조깅은 걷기와 질주의 중간 주기를 쓴다.
    const gaitRate=player.sprinting?.045+.010*sprintAimBlend:.060;
    player.movePhase+=moved*gaitRate;

    // 실제로 움직인 거리만큼 누적해서 발걸음마다 소리를 낸다.
    // 벽에 막힌 채 이동키만 누를 때는 발소리가 남발되지 않는다.
    player.noiseStepDistance=(player.noiseStepDistance||0)+moved;
    const stepDistance=player.sprinting
      ?108+(76-108)*sprintAimBlend:62;

    if(player.noiseStepDistance>=stepDistance){
      player.noiseStepDistance%=stepDistance;

      emitSoundEvent(
        player.x,player.y,
        player.sprinting
          ?NOISE_FOOTSTEP_SPRINT_RADIUS
          :NOISE_FOOTSTEP_WALK_RADIUS,
        player.sprinting?'sprintStep':'walkStep',
        'player'
      );
      playFootstepSound(player.sprinting);
    }
  }else{
    player.noiseStepDistance=Math.min(
      player.noiseStepDistance||0,30
    );
  }

  updatePlayerAimCamera(dt);
}

function fillWorldRect(rect,color){
  const point=worldToScreen(rect.x,rect.y);
  ctx.fillStyle=color;
  ctx.fillRect(point.x,point.y,rect.w,rect.h);
}

function drawWorldGrid(rect,tile,color){
  const left=rect.x-camera.x;
  const top=rect.y-camera.y;
  const right=left+rect.w;
  const bottom=top+rect.h;
  ctx.save();
  ctx.beginPath();
  ctx.rect(left,top,rect.w,rect.h);
  ctx.clip();
  ctx.strokeStyle=color;
  ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=left;x<=right;x+=tile){ctx.moveTo(x,top);ctx.lineTo(x,bottom)}
  for(let y=top;y<=bottom;y+=tile){ctx.moveTo(left,y);ctx.lineTo(right,y)}
  ctx.stroke();
  ctx.restore();
}

function drawOneEjectedCasing(casing){
  const point=worldToScreen(casing.x,casing.y);
  if(point.x<-8||point.x>W+8||point.y<-8||point.y>H+8)return;
  ctx.save();
  ctx.translate(Math.round(point.x),Math.round(point.y));
  ctx.rotate(casing.angle);
  drawCasingLocal(casing);
  ctx.restore();
}
function drawCasingLocal(casing){
  if(casing.shell){
    ctx.fillStyle=casing.color||'#a83d31';
    ctx.fillRect(-3,-1,6,3);
    ctx.fillStyle='#c7a052';
    ctx.fillRect(-3,-1,1,3);
  }else if(casing.rifle){
    ctx.fillStyle='#a88743';ctx.fillRect(-3,-1,6,2);
    ctx.fillStyle='#dfbd68';ctx.fillRect(-3,-1,1,2);
  }else{
    ctx.fillStyle='#b79a45';ctx.fillRect(-1,0,3,1);
    ctx.fillStyle='#e0c66b';ctx.fillRect(-1,0,1,1);
  }
}

function drawAirborneCasingsAboveWeapon(){
  for(const casing of ejectedCasings){
    if(casing.aboveWeapon&&!casing.settled)drawOneEjectedCasing(casing);
  }
}

function drawWeaponDebris(){
  drawGroundBloodChunks();
  drawGroundCasingChunks();
  for(const pool of bloodPools){
    const point=worldToScreen(pool.x,pool.y);
    const grow=.35+.65*pool.grow;
    const rx=(pool.rx??(pool.r||2)*1.45)*grow;
    const ry=(pool.ry??(pool.r||2))*grow;
    ctx.fillStyle=`rgba(${pool.color||'74,10,12'},${pool.alpha??.78})`;
    ctx.beginPath();ctx.ellipse(point.x,point.y,rx,ry,pool.angle??.2,0,Math.PI*2);ctx.fill();
    if(rx>2.2){
      ctx.fillStyle='rgba(154,28,28,.32)';
      ctx.fillRect(Math.round(point.x-rx*.20),Math.round(point.y-ry*.20),Math.max(1,rx*.34),1);
    }
  }
  drawAirborneBloodDrops(false);
  for(const item of guardDrops){
    const point=worldToScreen(item.x,item.y);ctx.save();ctx.translate(Math.round(point.x),Math.round(point.y));ctx.rotate(item.angle);
    if(item.type==='pistol'){ctx.fillStyle='#1a1e20';ctx.fillRect(-5,-2,12,4);ctx.fillStyle='#62696b';ctx.fillRect(-3,-2,8,1)}
    else if(item.type==='smg'){ctx.fillStyle='#171c1e';ctx.fillRect(-10,-3,24,6);ctx.fillStyle='#566063';ctx.fillRect(-7,-2,18,2);ctx.fillStyle='#111516';ctx.fillRect(-2,3,6,4)}
    else{ctx.fillStyle='#242829';ctx.fillRect(-11,-2,22,3);ctx.fillStyle='#555b5b';ctx.fillRect(7,-3,5,5)}
    drawBloodSurface(item,'weapon',-5,-2,12,4);
    ctx.restore();
  }
  drawGroundWeaponDebris();
}

function drawAirborneBloodDrops(above=true){
  for(const drop of bloodParticles){
    const ground=worldToScreen(drop.x,drop.y);
    const lift=drop.z*.42;
    const point={x:ground.x,y:ground.y-lift};
    const shadowScale=clamp(1-drop.z/42,.18,.72);
    if(!above){
      ctx.fillStyle=`rgba(24,3,5,${.16*shadowScale})`;
      ctx.beginPath();ctx.ellipse(ground.x,ground.y,drop.size*shadowScale,Math.max(.45,drop.size*.38*shadowScale),0,0,Math.PI*2);ctx.fill();
    }
    if(!above)continue;
    ctx.fillStyle=drop.color||'#731317';
    if(drop.chunk){
      ctx.save();ctx.translate(Math.round(point.x),Math.round(point.y));
      ctx.rotate(drop.age*11+drop.vx*.003);
      ctx.fillRect(-drop.size/2,-drop.size/3,drop.size,Math.max(2,drop.size*.66));
      ctx.fillStyle='#431014';ctx.fillRect(-1,-1,Math.max(1,drop.size*.45),1);
      ctx.restore();
    }else{
      const size=Math.max(1,drop.size);
      ctx.fillRect(Math.round(point.x-size/2),Math.round(point.y-size/2),size,size);
      if(size>=2){
        ctx.fillStyle='rgba(151,38,37,.34)';
        ctx.fillRect(Math.round(point.x-size/2),Math.round(point.y-size/2),1,1);
      }
    }
  }
}

function drawGroundWeaponDebris(){
  // .22 탄피와 더블배럴에서 빠진 12게이지 셸을 크기와 색으로 구분한다.
  for(const casing of ejectedCasings){
    if(casing.aboveWeapon&&!casing.settled)continue;
    drawOneEjectedCasing(casing);
  }

  // 버린 탄창은 남은 탄 수까지 가진 독립 월드 오브젝트다.
  for(const magazine of droppedMagazines){
    const point=worldToScreen(magazine.x,magazine.y);
    if(point.x<-12||point.x>W+12||point.y<-12||point.y>H+12)continue;
    ctx.save();
    ctx.translate(Math.round(point.x),Math.round(point.y));
    ctx.rotate(magazine.angle);
    const droppedType=magazine.magazine.magazineType;
    const rifleMagazine=droppedType==='rifle762';
    const assaultMagazine=droppedType==='rifle556';
    const lmgBox=droppedType==='lmg556';
    const length=lmgBox?13:(rifleMagazine?10:(assaultMagazine?12:(droppedType==='smg22'?12:8)));
    const thickness=lmgBox?9:(rifleMagazine?6:(assaultMagazine?5:4));
    ctx.fillStyle='#171a1c';
    ctx.fillRect(-length/2,-thickness/2,length,thickness);
    ctx.fillStyle='#4c5254';
    ctx.fillRect(-length/2+1,-thickness/2+1,length-2,1);
    ctx.fillStyle='#0d0f10';
