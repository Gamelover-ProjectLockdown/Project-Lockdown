function damagePlayer(amount,attackAngle=null,hitX=null,hitY=null,sourceKind='generic',sourceRef=null){
  if(player.hp<=0||player.invincible||player.respawnProtection>0)return;
  if(
    attackAngle!==null&&meleeState.active&&meleeState.weapon==='longsword'&&
    longswordState.guardBlend>.58&&!longswordState.attack
  ){
    const sourceDirection=normAngle(attackAngle+Math.PI);
    const frontal=Math.abs(normAngle(sourceDirection-player.bodyAngle))<1.32;
    if(frontal){
      if(longswordState.parry&&longswordState.parryWindow>0){
        longswordState.guardFlash=.22;
        longswordState.parryWindow=0;
        if(sourceKind!=='projectile')stunParriedMeleeSource(sourceRef);
        return;
      }
      // 장검은 총알을 가만히 막아 내지 못한다. 실제 패링 유효 프레임에
      // 들어온 탄환만 위에서 소거되고, 평상 가드는 탄환 피해를 그대로 받는다.
      if(sourceKind!=='projectile'){
        // 아밍소드/장검의 양손 가드는 정면 근접 타격을 완전히 받쳐 낸다.
        // 일반 가드는 공격자를 경직시키지 않고, 능동 패링만 위에서 경직을 건다.
        longswordState.guardFlash=.13;
        return;
      }
    }
  }
  if(
    sourceKind!=='projectile'&&attackAngle!==null&&meleeState.active&&meleeState.weapon==='knife'&&
    knifeState.guardBlend>.58
  ){
    const sourceDirection=normAngle(attackAngle+Math.PI);
    const frontal=Math.abs(normAngle(sourceDirection-player.bodyAngle))<1.18;
    if(frontal){
      if(knifeState.attack==='parry'&&knifeState.parryWindow>0){
        knifeState.parryFlash=.18;
        knifeState.parryWindow=0;
        stunParriedMeleeSource(sourceRef);
        return;
      }
      amount*=.35;
      knifeState.parryFlash=.09;
    }
  }
  const damage=Math.max(1,amount-(player.defense||0));
  if(sourceKind==='blunt'||sourceKind==='melee')playMeleeImpactSound(amount<=8?'shove':'fist',damage,player.x,player.y);
  player.hp=Math.max(0,player.hp-damage);
  // No per-hit adrenaline bonus: only the health-based update changes combat stress.
  player.bleedTime=Math.max(player.bleedTime||0,sourceKind==='projectile'?6:3);
  player.lastDamageAge=0;
  player.hitFlash=.16;
  player.screenHitTint=1;
  if(player.hp<=0)beginPlayerDeath(sourceKind,sourceRef,damage,attackAngle);
  const bloodIncomingAngle=attackAngle!==null?attackAngle:player.angle+Math.PI;
  spawnBlood(
    player,hitX===null?player.x:hitX,hitY===null?player.y:hitY,
    bloodIncomingAngle,player.hp<=0?20:8,'firearm'
  );
}

function stunParriedMeleeSource(source){
  if(!source||source.hp<=0)return false;
  if(source.simulationEnemy){
    if(!source.meleeAttack&&!source.pistolMeleeAttack)return false;
    const duration=source.enemyKind==='tanker'?.38:
      (source.enemyKind==='soldier'?.50:(source.enemyKind==='researcher'?.78:.62));
    source.meleeStun=Math.max(source.meleeStun||0,duration);
    source.meleeAttack=null;source.meleeElapsed=0;source.meleeHitDone=false;
    source.pistolMeleeAttack=null;source.pistolMeleeElapsed=0;source.pistolMeleeHitDone=false;
    source.meleeComboQueued=null;source.meleeComboPlan=[];
    source.meleeCooldown=Math.max(source.meleeCooldown||0,duration+.12);
    source.fireTimer=Math.max(source.fireTimer||0,duration);
    source.hitFlash=Math.max(source.hitFlash||0,.16);
    return true;
  }
  if((source.attackTime||0)>0||source.combatMode==='baton'){
    source.attackTime=0;source.stagger=Math.max(source.stagger||0,.62);
    source.state='stagger';source.stateTime=0;source.hitFlash=Math.max(source.hitFlash||0,.16);
    return true;
  }
  return false;
}

function guardFire(guard){
  const state=guard.weaponState;
  if(!state||guard.combatMode==='baton')return false;

  // 약실도 탄창도 비었으면 플레이어와 같은 장전/무기교체 판단으로 넘긴다.
  if(!state.chamberRound&&(!state.magazine||state.magazine.rounds.length===0)){
    startGuardReload(guard);
    return false;
  }

  const fired=withGuardWeaponContext(
    guard,
    ()=>firePistol(null,'guard',guard)
  );

  if(fired){
    // 마지막 탄을 쐈다면 즉시 다음 행동(재장전/보조무기)을 판단한다.
    const now=guard.weaponState;
    if(!now.chamberRound&&(!now.magazine||now.magazine.rounds.length===0)){
      startGuardReload(guard);
    }
  }
  return !!fired;
}

function dropGuardMagazine(guard,magazine,sideOffset=0){
  if(!magazine)return;
  const side=guard.angle+Math.PI/2;
  droppedMagazines.push({
    x:guard.x-Math.cos(guard.angle)*3+Math.cos(side)*sideOffset,
    y:guard.y-Math.sin(guard.angle)*3+Math.sin(side)*sideOffset,
    vx:Math.cos(side)*(35+Math.random()*18),vy:Math.sin(side)*(35+Math.random()*18),
    angle:guard.angle+.35,spin:5,magazine,settled:false,droppedByGuard:true
  });
}

function startGuardReload(guard){
  if(!guard.weaponState||guard.weaponState.reloading||guard.combatMode==='baton')return false;

  const state=guard.weaponState;
  const empty=!state.chamberRound&&(!state.magazine||state.magazine.rounds.length===0);
  const compatible=guardCompatibleMagazines(guard,state.weaponId);

  if(compatible.length>0){
    const started=withGuardWeaponContext(guard,()=>startReload());
    if(started){
      guard.state='reload';
      guard.stateTime=0;
      guard.burstRemaining=0;
      guard.burstPause=.12;
      guard.shotCooldown=Math.max(guard.shotCooldown||0,.12);
      syncGuardWeaponAliases(guard);
    }
    return !!started;
  }

  if(empty&&guard.role==='soldier'&&state.weaponId==='smg'){
    // 주무기 30발 x 3을 모두 썼을 때 실제 별도 권총 weaponState로 교체.
    if(switchGuardWeapon(guard,'pistol')){
      guard.state='rangedEngage';
      guard.aimStableTime=0;
      // 권총을 꺼내는 동안에는 사격 불가. 드로우 종료 직후 반응할 정도만 남긴다.
      guard.shotCooldown=.16;
      return true;
    }
  }

  if(empty){
    switchGuardToBaton(guard);
    return true;
  }
  return false;
}


function moveGuardSmart(guard,vx,vy,speed,dt){
  let desiredX=vx,desiredY=vy;

  // 준비실에서 플레이어가 이미 밖으로 나간 경우, 조력자는 먼저 문 중앙으로 정렬한 뒤
  // 문을 통과한다. 시작 위치가 문 위/아래 벽선에 걸려 영원히 비비던 문제를 막는다.
  if(guard.isAlly&&!pointInRect(player.x,player.y,PREP_ROOM)&&
     guard.x<PREP_ROOM.x+PREP_ROOM.w+42&&
     guard.y>PREP_ROOM.y-12&&guard.y<PREP_ROOM.y+PREP_ROOM.h+12){
    const laneY=guard.exitLaneY||600;
    const aligned=Math.abs(guard.y-laneY)<14;
    const waypoint=(!aligned||guard.x<410)?{x:414,y:laneY}:{x:500,y:laneY};
    desiredX=waypoint.x-guard.x;
    desiredY=waypoint.y-guard.y;
  }

  // 조력자는 다른 살아있는 캐릭터를 단순한 '벽'로만 보지 않고 미리 비켜간다.
  // 특히 조력자끼리 마주 보며 서로 영원히 막는 교착을 방지한다.
  if(guard.isAlly){
    let avoidX=0,avoidY=0;
    for(const other of livingSolidActors()){
      if(other===guard)continue;
      const dx=guard.x-other.x,dy=guard.y-other.y;
      const d=Math.hypot(dx,dy)||.001;
      const personal=(guard.r||12)+(other.r||12)+(other.isAlly?24:14);
      if(d>=personal)continue;
      const strength=(personal-d)/personal;
      avoidX+=dx/d*strength*(other.isAlly?1.55:1.05);
      avoidY+=dy/d*strength*(other.isAlly?1.55:1.05);
    }
    // 진행방향은 유지하되 가까운 개체가 있으면 측면 회피 성분을 섞는다.
    const dl=Math.hypot(desiredX,desiredY)||1;
    desiredX=desiredX/dl+avoidX*1.25;
    desiredY=desiredY/dl+avoidY*1.25;
  }

  let length=Math.hypot(desiredX,desiredY)||1;
  let base=Math.atan2(desiredY,desiredX);
  const beforeX=guard.x,beforeY=guard.y;
  const step=speed*dt;

  // 일정 시간 거의 못 움직였으면 같은 방향을 계속 고집하지 않고 강제 우회한다.
  // allyId로 좌/우를 갈라 두 조력자가 동시에 같은 쪽으로 피하는 현상도 줄인다.
  if(guard.isAlly&&(guard.navStuckTime||0)>.34){
    guard.navEscapeTimer=Math.max(guard.navEscapeTimer||0,.42);
    if(!guard.navEscapeSide)guard.navEscapeSide=((guard.allyId||1)%2?1:-1);
  }
  if(guard.isAlly&&(guard.navEscapeTimer||0)>0){
    guard.navEscapeTimer=Math.max(0,guard.navEscapeTimer-dt);
    const side=guard.navEscapeSide||1;
    base+=side*(guard.navStuckTime>.85?1.34:.88);
    // 오래 끼면 한 번 방향을 뒤집어 반대쪽 통로도 시험한다.
    if(guard.navStuckTime>1.35){
      guard.navEscapeSide=-side;
      guard.navStuckTime=.55;
    }
  }

  // 작은 각도부터 큰 우회각까지 실제 충돌 결과를 시험해 가장 많이 전진하는 방향을 고른다.
  // 끼임 상태에서는 뒤로 한 발 빠지는 후보도 넣어 막다른 모서리에서 탈출할 수 있게 한다.
  const choices=(guard.isAlly&&(guard.navStuckTime||0)>.34)
    ?[0,.28,-.28,.56,-.56,.9,-.9,1.22,-1.22,1.55,-1.55,Math.PI*.88,-Math.PI*.88]
    :[0,.30,-.30,.62,-.62,.96,-.96,1.30,-1.30,1.62,-1.62];
  let bestX=beforeX,bestY=beforeY,bestScore=-Infinity;
  for(const offset of choices){
    guard.x=beforeX;guard.y=beforeY;
    const angle=base+offset;
    moveCircle(guard,Math.cos(angle)*step,Math.sin(angle)*step);
    const mx=guard.x-beforeX,my=guard.y-beforeY;
    const moved=Math.hypot(mx,my);
    const forward=(mx*desiredX+my*desiredY)/(length||1);
    let clearance=0;
    if(guard.isAlly&&moved>0){
      // 이동 후 주변 캐릭터와 거리가 넓어지는 방향을 조금 우대한다.
      let nearest=999;
      for(const other of livingSolidActors()){
        if(other===guard)continue;
        nearest=Math.min(nearest,Math.hypot(guard.x-other.x,guard.y-other.y)-(guard.r||12)-(other.r||12));
      }
      clearance=Math.min(18,Math.max(-10,nearest))*.035;
    }
    const reversePenalty=Math.abs(offset)>2.3?step*.10:0;
    const score=forward+moved*.26+clearance-Math.abs(offset)*step*.038-reversePenalty;
    if(score>bestScore){bestScore=score;bestX=guard.x;bestY=guard.y}
  }
  guard.x=bestX;guard.y=bestY;
  const moved=Math.hypot(guard.x-beforeX,guard.y-beforeY);
  guard.movePhase+=moved*.065;
  guard.navStuckTime=moved<Math.max(.35,step*.16)?(guard.navStuckTime||0)+dt:Math.max(0,(guard.navStuckTime||0)-dt*3.2);
  if(moved>step*.55){guard.navEscapeTimer=Math.max(0,(guard.navEscapeTimer||0)-dt*2.5)}
}

const GUARD_AMBUSH_POINTS=[
  {x:650,y:620},{x:875,y:620},{x:1075,y:625},
  {x:1260,y:610},{x:1410,y:715},{x:1665,y:650},{x:1775,y:640}
];

function chooseGuardAmbushPoint(guard){
  let best=null;
  let bestScore=Infinity;
  for(const point of GUARD_AMBUSH_POINTS){
    if(collidesWorld(point.x,point.y,guard.r))continue;
    const travel=Math.hypot(point.x-guard.x,point.y-guard.y);
    const hidden=lineBlocked(point.x,point.y,player.x,player.y);
    const score=travel+(hidden?0:280);
    if(score<bestScore){bestScore=score;best=point}
  }
  return best||{x:guard.x,y:guard.y};
}

function switchGuardToBaton(guard){
  if(guard.combatMode==='baton')return;
  guard.combatMode='baton';
  guard.state=ARENA_EXPERIMENT?'meleeChase':'seekCover';
  guard.stateTime=0;
  guard.aimTime=0;
  guard.aimStableTime=0;
  guard.lockedShot=null;
  guard.lockDelay=0;
  guard.attackTime=0;
  guard.reloading=false;guard.reloadMagazine=null;
  guard.fullAuto=false;guard.volleyRemaining=0;
  if(ARENA_EXPERIMENT){
    guard.coverX=guard.x;
    guard.coverY=guard.y;
  }else{
    const cover=chooseGuardAmbushPoint(guard);
    guard.coverX=cover.x;
    guard.coverY=cover.y;
  }
}

function updateBatonGuard(guard,dx,dy,distance,targetAngle,dt){
  guard.angle=normAngle(
    guard.angle+normAngle(targetAngle-guard.angle)*Math.min(1,dt*8)
  );
  guard.aimAngle=guard.angle;

  if(guard.state==='seekCover'){
    // 들키기 전에 지정 엄폐점으로 빠지고, 너무 가까이 따라오면 즉시 덤빈다.
    if(distance<90){guard.state='meleeChase';guard.stateTime=0}
    else{
      const coverDX=guard.coverX-guard.x;
      const coverDY=guard.coverY-guard.y;
      if(Math.hypot(coverDX,coverDY)>10){
        moveGuardSmart(guard,coverDX,coverDY,82,dt);
      }else{
        guard.state='ambush';
        guard.stateTime=0;
      }
      return;
    }
  }

  if(guard.state==='ambush'){
    // 엄폐물 뒤에서는 정지해 있다가 플레이어가 바로 옆을 지날 때 튀어나온다.
    if(distance<145){guard.state='meleeChase';guard.stateTime=0}
    else return;
  }

  if(distance>27)moveGuardSmart(guard,dx,dy,116,dt);
  else if(guard.attackTime<=0)guard.attackTime=.72;
  if(guard.attackTime>0){
    const before=guard.attackTime;
    guard.attackTime-=dt;
    if(before>.43&&guard.attackTime<=.43&&distance<34){
      damagePlayer(80,Math.atan2(player.y-guard.y,player.x-guard.x),null,null,'melee',guard);
    }
  }
}

// 적 군인: 더 낮고 거칠고 목이 굵은 SAM.
// 조력자: 더 빠르고 선명하며 피치/공명값을 확실히 다르게 잡는다.
// 두 조력자도 아주 조금씩 달라서 한 목소리의 복제처럼 들리지 않는다.
const SAM_VOICE_PRESETS={
  enemy:{speed:78,pitch:44,throat:154,mouth:116},
  ally1:{speed:72,pitch:60,throat:118,mouth:138},
  ally2:{speed:75,pitch:55,throat:126,mouth:146}
};
const SAM_SAMPLE_RATE=22050;
const samVoiceCache=new Map();
const activeSamVoices=new Set();

function voiceTeam(actor){return actor&&actor.isAlly?'ally':'enemy'}
function randomVoiceLine(actor,event){
  const bank=VOICE_LINES[voiceTeam(actor)]||VOICE_LINES.enemy;
  const list=bank[event];
  if(!list||!list.length)return null;
  // 같은 개체가 직전에 한 대사를 바로 반복하지 않게 한다.
  let text=list[Math.floor(Math.random()*list.length)];
  if(list.length>1&&actor&&text===actor.lastVoiceText){
    const start=list.indexOf(text);
    text=list[(start+1+Math.floor(Math.random()*(list.length-1)))%list.length];
  }
  if(actor)actor.lastVoiceText=text;
  return text;
}
function samVoicePreset(actor){
  if(!actor||!actor.isAlly)return SAM_VOICE_PRESETS.enemy;
  return actor.allyId===2?SAM_VOICE_PRESETS.ally2:SAM_VOICE_PRESETS.ally1;
}
function samVoiceKey(text,preset){
  return `${text}|${preset.speed}|${preset.pitch}|${preset.throat}|${preset.mouth}`;
}
function makeSamVoiceBuffer(text,preset){
  if(typeof window.SamJs!=='function'||!gunAudioContext)return null;
  const key=samVoiceKey(text,preset);
  if(samVoiceCache.has(key))return samVoiceCache.get(key);
  try{
    const sam=new window.SamJs({
      speed:preset.speed|0,
      pitch:preset.pitch|0,
      throat:preset.throat|0,
      mouth:preset.mouth|0
    });
    let pcm=null;
    if(typeof sam.buf32==='function')pcm=sam.buf32(text);
    else if(typeof sam.buf8==='function'){
      const u8=sam.buf8(text);
      if(u8&&u8.length){
        pcm=new Float32Array(u8.length);
        for(let i=0;i<u8.length;i++)pcm[i]=(u8[i]-128)/128;
      }
    }
    if(!pcm||!pcm.length)return null;
    const buffer=gunAudioContext.createBuffer(1,pcm.length,SAM_SAMPLE_RATE);
    buffer.copyToChannel(pcm,0);
    samVoiceCache.set(key,buffer);
    return buffer;
  }catch(error){
    console.warn('SAM voice render failed:',error);
    return null;
  }
}
function fallbackCombatTts(text,actor,volume){
  if(!('speechSynthesis' in window))return false;
  try{
    const u=new SpeechSynthesisUtterance(text);
    u.volume=clamp(volume*(masterVolumeLevel/100),0,.34);
    u.rate=actor&&actor.isAlly?1.05:.99;
    u.pitch=actor&&actor.isAlly?.82:.68;
    u.lang='en-US';
    speechSynthesis.speak(u);
    return true;
  }catch(_e){return false}
}
function playSamCombatVoice(text,actor,samOnly=false){
  // 날카로운 SAM 음성이 한꺼번에 겹쳐 전투음을 덮지 않도록 실제 재생은 최대 3개.
  // 청각용 soundEvent는 이 함수 전에 이미 발생하므로 AI 감지는 그대로 유지된다.
  if(samOnly&&activeSamVoices.size){
    for(const activeSource of activeSamVoices){
      try{activeSource.stop()}catch(_error){}
    }
    activeSamVoices.clear();
  }
  if(activeSamVoices.size>=3)return false;
  const d=Math.hypot(player.x-actor.x,player.y-actor.y);
  const attenuation=clamp(1-d/930,.055,1);
  const volume=clamp(COMBAT_VOICE_VOLUME*attenuation,.015,.34);
  const preset=samVoicePreset(actor);
  const buffer=makeSamVoiceBuffer(text,preset);
  if(!buffer||!gunAudioContext){
    // 샌드박스 군인은 잘못된 기본 TTS로 바꾸지 않고 SAM이 준비될 때만 말한다.
    if(!samOnly)fallbackCombatTts(text,actor,volume);
    return false;
  }
  try{
    gunAudioContext.resume().catch(()=>{});
    const source=gunAudioContext.createBufferSource();
    const gain=gunAudioContext.createGain();
    gain.gain.value=volume;
    source.buffer=buffer;
    source.connect(gain);
    if(typeof gunAudioContext.createStereoPanner==='function'){
      const pan=gunAudioContext.createStereoPanner();
      // 화면 좌우 기준의 가벼운 패닝. 전투 중에도 위치를 귀로 대충 구별할 수 있다.
      pan.pan.value=clamp((actor.x-player.x)/620,-.78,.78);
      gain.connect(pan);
      pan.connect(masterGainNode);
    }else gain.connect(masterGainNode);
    activeSamVoices.add(source);
    source.onended=()=>activeSamVoices.delete(source);
    source.start();
    return true;
  }catch(error){
    console.warn('SAM voice playback failed:',error);
    if(!samOnly)fallbackCombatTts(text,actor,volume);
    return false;
  }
}
function speakCombatLine(actor,event,loudness='combat',chance=1){
  if(!actor||actor.hp<=0||Math.random()>chance)return false;
  const now=performance.now();
  if(now<globalVoiceReadyAt)return false;
  if((actor.voiceCooldown||0)>0)return false;
  const text=randomVoiceLine(actor,event);if(!text)return false;
  actor.voiceCooldown=1.15+Math.random()*.95;
  actor.voiceText=text;
  actor.voiceTextUntil=now+Math.max(1250,Math.min(2600,650+text.length*78));
  globalVoiceReadyAt=now+300+Math.random()*240;
  const radius=VOICE_RADIUS[loudness]||VOICE_RADIUS.combat;

  // 중요: 음성은 실제 AI 청각 자극이다. 재생 엔진을 SAM으로 바꿔도 이 판정은 유지한다.
  emitSoundEvent(actor.x,actor.y,radius,'voice'+loudness[0].toUpperCase()+loudness.slice(1),actor);
  playSamCombatVoice(text,actor);
  return true;
}
function soundSourceTeam(source){
  if(source===player||source==='player')return 'ally';
  if(source&&source.isAlly)return 'ally';
  if(source&&testSubjects.includes(source))return 'enemy';
  return 'neutral';
}
function emitSoundEvent(x,y,radius,kind='noise',source='player'){
  soundEvents.push({
    id:++soundEventSerial,
    x,y,radius,kind,source,
    life:.72,maxLife:.72
  });
  if(soundEvents.length>64)soundEvents.shift();
}

function updateSoundEvents(dt){
  for(let i=soundEvents.length-1;i>=0;i--){
    soundEvents[i].life-=dt;
    if(soundEvents[i].life<=0)soundEvents.splice(i,1);
  }
}

function gunshotNoiseRadius(def){
  if(!def)return NOISE_PISTOL_RADIUS;
  if(def.id==='smg')return NOISE_SMG_RADIUS;
  if(def.id==='shotgun')return NOISE_SHOTGUN_RADIUS;
  if(def.id==='pumpShotgun')return NOISE_PUMP_SHOTGUN_RADIUS;
  if(def.id==='assaultRifle'||def.id==='battleRifle')return 1040;
  if(def.id==='lmg')return 1120;
  return NOISE_PISTOL_RADIUS;
}

function soundWallFactor(kind){
  // 총성은 벽 너머에서도 상당히 잘 들리지만 발소리는 크게 감쇠한다.
  if(kind==='gunshot')return .72;
  if(kind==='sprintStep')return .52;
  if(kind&&kind.startsWith('voice'))return .56;
  return .42;
}

function guardHearNewestSound(guard){
  for(let i=soundEvents.length-1;i>=0;i--){
    const sound=soundEvents[i];

    // 적 군인은 플레이어와 조력자의 총성/음성을 적대 소리로 듣는다.
    if(soundSourceTeam(sound.source)!=='ally')continue;
    if(sound.id<=guard.lastHeardSoundId)continue;

    const distance=Math.hypot(
      sound.x-guard.x,
      sound.y-guard.y
    );

    let audibleRadius=sound.radius;
    if(lineBlocked(
      guard.x,guard.y,
      sound.x,sound.y
    )){
      audibleRadius*=soundWallFactor(sound.kind);
    }

    if(distance>audibleRadius)continue;

    guard.lastHeardSoundId=sound.id;
    guard.heardX=sound.x;
    guard.heardY=sound.y;
    guard.heardKind=sound.kind;
    guard.heardTimer=sound.kind==='gunshot'
      ?NOISE_MEMORY_GUNSHOT
      :(sound.kind&&sound.kind.startsWith('voice')?1.45:NOISE_MEMORY_FOOTSTEP);

    // 총성은 즉시 확 돌아보고, 발소리는 덜 급하게 소리 방향을 본다.
    const soundAngle=Math.atan2(
      sound.y-guard.y,
      sound.x-guard.x
    );
    const reaction=sound.kind==='gunshot'?.72:(sound.kind&&sound.kind.startsWith('voice')?.54:.46);

    guard.angle=normAngle(
      guard.angle+
      normAngle(soundAngle-guard.angle)*reaction
    );
    guard.aimAngle=normAngle(
      guard.aimAngle+
      normAngle(soundAngle-guard.aimAngle)*
      Math.min(1,reaction+.16)
    );

    return sound;
  }

  return null;
}

function updateGuardSoundInvestigation(guard,dt){
  if(
    !Number.isFinite(guard.heardX)||
    !Number.isFinite(guard.heardY)
  ){
    guard.state='search';
    guard.stateTime=0;
    return;
  }

  guard.heardTimer=Math.max(0,guard.heardTimer-dt);

  const dx=guard.heardX-guard.x;
  const dy=guard.heardY-guard.y;
  const distance=Math.hypot(dx,dy);
  const soundAngle=Math.atan2(dy,dx);

  // 이동 방향과 시선 방향을 분리해서 항상 소리가 난 지점을 주시한다.
  guard.angle=normAngle(
    guard.angle+
    normAngle(soundAngle-guard.angle)*
    Math.min(1,dt*7.2)
  );
  guard.aimAngle=normAngle(
    guard.aimAngle+
    normAngle(soundAngle-guard.aimAngle)*
    Math.min(1,dt*9.2)
  );

  const investigateSpeed=guard.heardKind==='gunshot'
    ?guard.moveSpeed*.82
    :guard.moveSpeed*.58;

  if(distance>46){
    moveGuardSmart(
      guard,dx,dy,investigateSpeed,dt
    );
  }

  if(guard.heardTimer<=0){
    guard.heardX=null;
    guard.heardY=null;
    guard.heardKind=null;
    guard.state='search';
    guard.stateTime=0;
  }
}

function guardCanSeeTarget(guard,target,distance=null,targetAngle=null){
  if(!actorAlive(target))return false;
  if(distance===null)distance=actorDistance(guard,target);
  if(targetAngle===null)targetAngle=Math.atan2(target.y-guard.y,target.x-guard.x);
  if(distance>FOV_RADIUS)return false;
  if(Math.abs(normAngle(targetAngle-guard.angle))>FOV_ANGLE/2)return false;
  if(lineBlocked(guard.x,guard.y,target.x,target.y))return false;
  return true;
}

function guardCanSeePlayer(guard,distance,targetAngle){
  return guardCanSeeTarget(guard,player,distance,targetAngle);
}

function guardIsOnScreen(guard,margin=8){
  const p=worldToScreen(guard.x,guard.y);
  return p.x>=-margin&&p.x<=W+margin&&p.y>=-margin&&p.y<=H+margin;
}

function guardRangedProfile(guard,distance){
  const def=WEAPON_BY_ID[guard.weaponId]||WEAPON_BY_ID.pistol;
  const linear=clamp((FOV_RADIUS-distance)/(FOV_RADIUS-80),0,1);
  const proximity=linear*linear;

  if(def.id==='smg'){
    // 기관단총은 기존 거리 기반 단발→연사 템포 유지.
    return{
      weaponClass:'smg',
      proximity,
      cadence:.44-(.365*proximity),
      aimTolerance:.16,
      stableTime:0,
      trackingSpeed:14+4*proximity,
      bodyTracking:10+3*proximity
    };
  }

  // 권총만 장거리 조준 안정 시간을 가진다.
  // 일반 경비원은 군인의 보조권총보다 사격 간격을 살짝 길게 잡는다.
  const pistolCadence=guard.role==='guard'
    ?(.76-(.52*proximity))     // 약 .76s -> .24s
    :(.66-(.47*proximity));    // 약 .66s -> .19s

  return{
    weaponClass:'pistol',
    proximity,
    cadence:pistolCadence,
    aimTolerance:.026+.085*proximity,
    stableTime:(.22-.15*proximity)*guard.reactionScale,
    trackingSpeed:(3.9+4.3*proximity)/Math.max(.58,guard.reactionScale),
    bodyTracking:(5.4+2.8*proximity)/Math.max(.62,guard.reactionScale)
  };
}

function updateGuardRangedEngage(guard,dx,dy,distance,targetAngle,dt,target=player){
  if(!guardCanSeeTarget(guard,target,distance,targetAngle)){
    guard.state='search';
    guard.stateTime=0;
    guard.aimStableTime=0;
    return;
  }

  const profile=guardRangedProfile(guard,distance);

  if(profile.weaponClass==='smg'){
    // 기관단총 총구는 빠르게 플레이어를 추적.
    guard.aimAngle=normAngle(
      guard.aimAngle+
      normAngle(targetAngle-guard.aimAngle)*
      Math.min(1,dt*profile.trackingSpeed)
    );

    // 몸은 총구축을 따라가는 게 아니라 실제 플레이어 방향을 직접 본다.
    // 반동/보간 때문에 적이 엉뚱한 곳을 보는 현상을 막는다.
    guard.angle=normAngle(
      guard.angle+
      normAngle(targetAngle-guard.angle)*
      Math.min(1,dt*profile.bodyTracking)
    );

    const radial=distance<170?-0.22:(distance>390?.10:0);
    const mx=
      Math.cos(targetAngle+Math.PI/2)*guard.strafe*.46+
      Math.cos(targetAngle)*radial;
    const my=
      Math.sin(targetAngle+Math.PI/2)*guard.strafe*.46+
      Math.sin(targetAngle)*radial;
    moveGuardSmart(guard,mx,my,guard.moveSpeed*.58,dt);

    if(
      !guard.weaponDrawActive&&
      guardIsOnScreen(guard)&&
      guard.shotCooldown<=0
    ){
      guard.shotSpread=.035+.14*profile.proximity;
      if(guardFire(guard)){
        guard.shotCooldown=profile.cadence;
      }
    }
    return;
  }

  // 권총은 총구축을 플레이어 쪽으로 부드럽게 맞춘다.
  const aimError=normAngle(targetAngle-guard.aimAngle);
  guard.aimAngle=normAngle(
    guard.aimAngle+
    clamp(
      aimError,
      -profile.trackingSpeed*dt,
      profile.trackingSpeed*dt
    )
  );

  // 몸 역시 플레이어를 직접 보도록 한다.
  guard.angle=normAngle(
    guard.angle+
    normAngle(targetAngle-guard.angle)*
    Math.min(1,dt*profile.bodyTracking)
  );

  const strafeScale=guard.role==='soldier'?.58:.30;
  const radial=distance<165?-0.34:(distance>360?.10:0);
  const mx=
    Math.cos(targetAngle+Math.PI/2)*guard.strafe*strafeScale+
    Math.cos(targetAngle)*radial;
  const my=
    Math.sin(targetAngle+Math.PI/2)*guard.strafe*strafeScale+
    Math.sin(targetAngle)*radial;

  if(Math.abs(mx)+Math.abs(my)>.01){
    moveGuardSmart(
      guard,mx,my,
      guard.moveSpeed*(guard.role==='soldier'?.68:.43),dt
    );
  }

  const currentError=Math.abs(
    normAngle(targetAngle-guard.aimAngle)
  );
  guard.aimStableTime=currentError<=profile.aimTolerance
    ?guard.aimStableTime+dt
    :Math.max(0,guard.aimStableTime-dt*2.2);

  if(
    !guard.weaponDrawActive&&
    guardIsOnScreen(guard)&&
    guard.shotCooldown<=0&&
    guard.aimStableTime>=profile.stableTime
  ){
    guard.shotSpread=.012+.12*profile.proximity;
    if(guardFire(guard)){
      guard.shotCooldown=profile.cadence;
      guard.aimStableTime*=profile.proximity*.58;
      if(Math.random()<.14+.16*profile.proximity)guard.strafe*=-1;
    }
  }
}

function updateGuards(dt){
  updatePlayerResources(dt);
  player.hitFlash=Math.max(0,player.hitFlash-dt);

  for(const guard of testSubjects){
    guard.hitFlash=Math.max(0,(guard.hitFlash||0)-dt);
    if(guard.hp<=0)continue;

    guard.spawnAge=(guard.spawnAge||0)+dt;
    guard.stateTime+=dt;
    guard.shotCooldown=Math.max(0,(guard.shotCooldown||0)-dt);
    guard.voiceCooldown=Math.max(0,(guard.voiceCooldown||0)-dt);
    updateRetaliationLock(guard,dt,1150);

    if(guard.weaponDrawActive){
      guard.weaponDrawElapsed+=dt;
      if(guard.weaponDrawElapsed>=guard.weaponDrawDuration){
        guard.weaponDrawElapsed=guard.weaponDrawDuration;
        guard.weaponDrawActive=false;
      }
    }

    // 사격/장전/슬라이드/볼트/탄피는 플레이어 공통 weaponState 코어가 갱신한다.
    updateGuardWeaponState(guard,dt);
    syncGuardWeaponAliases(guard);

    if(guard.unarmedTest){
      guard.angle=normAngle(
        guard.angle+Math.sin(guard.stateTime*.7)*dt*.08
      );
      guard.aimAngle=guard.angle;
      continue;
    }

    // 적 군인도 플레이어만 고정 추적하지 않는다. 기본은 가장 가까운 적대 대상,
    // 자신을 쏜 대상이 있으면 그 보복 타겟이 거리보다 우선한다.
    const targetInfo=nearestHostileForGuard(guard,880);
    const targetActor=targetInfo?targetInfo.actor:player;
    if(targetInfo){
      if(guard.targetRef!==targetActor)speakCombatLine(guard,targetInfo.revenge?'retaliation':'contact',targetInfo.revenge?'yell':'combat',targetInfo.revenge?.78:.32);
      guard.targetRef=targetActor;
    }
    const dx=targetActor.x-guard.x;
    const dy=targetActor.y-guard.y;
    const distance=Math.hypot(dx,dy);
    const targetAngle=Math.atan2(dy,dx);

    const currentlySeesPlayer=!!targetInfo&&guardCanSeeTarget(
      guard,targetActor,distance,targetAngle
    );
    const heardSound=guardHearNewestSound(guard);

    // 소리는 위치만 알려준다. 시야에 없으면 조사하러 가고, hasSeen은 건드리지 않는다.
    if(
      heardSound&&
      !currentlySeesPlayer&&
      guard.stagger<=0&&
      guard.combatMode!=='baton'&&
      !guard.reloading
    ){
      guard.state='investigateSound';
      guard.stateTime=0;
      guard.aimStableTime=0;
    }

    if(guard.stagger>0){
      guard.stagger-=dt;

      if(guard.hasSeen&&Number.isFinite(guard.lastSeenX)&&Number.isFinite(guard.lastSeenY)){
        const rememberedAngle=Math.atan2(
          guard.lastSeenY-guard.y,
          guard.lastSeenX-guard.x
        );
        // 피격 움찔은 남기되 기본 방향은 공격자/마지막 목격 지점이다.
        guard.angle=normAngle(
          guard.angle+
          normAngle(rememberedAngle-guard.angle)*Math.min(1,dt*12)+
          Math.sin(guard.stateTime*34)*dt*.34
        );
        guard.aimAngle=normAngle(
          guard.aimAngle+
          normAngle(rememberedAngle-guard.aimAngle)*Math.min(1,dt*15)
        );
      }else{
        guard.angle=normAngle(
          guard.angle+Math.sin(guard.stateTime*34)*dt*2.4
        );
        guard.aimAngle=guard.angle;
      }

      guard.aimTime=0;
      guard.aimStableTime=0;
      if(guard.stagger<=0){
        if(guard.combatMode==='pistol'){
          const postHitDX=targetActor.x-guard.x;
          const postHitDY=targetActor.y-guard.y;
          const postHitDistance=Math.hypot(postHitDX,postHitDY);
          const postHitAngle=Math.atan2(postHitDY,postHitDX);
          guard.state=guardCanSeeTarget(
            guard,targetActor,postHitDistance,postHitAngle
          )?'rangedEngage':'search';
        }else{
          guard.state='meleeChase';
        }
        guard.alertedByHit=false;
        guard.stateTime=0;
      }
      continue;
    }

    if(guard.combatMode==='baton'){
      updateBatonGuard(guard,dx,dy,distance,targetAngle,dt);
      continue;
    }

    if(guard.reloading){
      // 장전 중에도 소리는 기억하지만 행동 전환은 장전이 끝난 뒤 한다.
      continue;
    }

    if(guard.state==='investigateSound'){
      if(currentlySeesPlayer){
        // 조사 도중 실제로 플레이어를 보면 그때부터는 정상 시각 전투.
        guard.hasSeen=true;
        guard.lastSeenX=targetActor.x;
        guard.lastSeenY=targetActor.y;
        guard.lostSight=0;
        guard.state='rangedEngage';
        guard.stateTime=0;
        guard.aimStableTime=0;
      }else{
        updateGuardSoundInvestigation(guard,dt);
        continue;
      }
    }

    if(guard.state==='rangedEngage'){
      if(Math.abs(normAngle(guard.aimAngle-guard.angle))>Math.PI*.72){
        guard.aimAngle=guard.angle;
        guard.aimStableTime=0;
      }
      updateGuardRangedEngage(
        guard,dx,dy,distance,targetAngle,dt,targetActor
      );
      continue;
    }

    const seesPlayer=currentlySeesPlayer;

    if(seesPlayer){
      guard.hasSeen=true;
      guard.lastSeenX=targetActor.x;
      guard.lastSeenY=targetActor.y;
      guard.lostSight=0;
    }else{
      guard.lostSight=(guard.lostSight||0)+dt;
      guard.aimStableTime=0;

      let tx,ty;
      if(guard.hasSeen&&guard.lostSight<4){
        // 한 번이라도 플레이어를 봤다면, 시야를 놓친 직후에는
        // 이동 방향과 시선 방향을 분리한다.
        // 몸/총구는 마지막 목격 위치를 계속 보고, 발만 좌우 재배치한다.
        const lastDX=guard.lastSeenX-guard.x;
        const lastDY=guard.lastSeenY-guard.y;
        const lastDistance=Math.hypot(lastDX,lastDY)||1;
        const lastAngle=Math.atan2(lastDY,lastDX);

        const radial=lastDistance<190?-1:0;
        tx=
          guard.x+
          lastDX/lastDistance*radial*80-
          lastDY/lastDistance*guard.strafe*70;
        ty=
          guard.y+
          lastDY/lastDistance*radial*80+
          lastDX/lastDistance*guard.strafe*70;

        // 마지막 목격 위치를 몇 초간 계속 주시.
        guard.angle=normAngle(
          guard.angle+
          normAngle(lastAngle-guard.angle)*
          Math.min(1,dt*7.4)
        );
        guard.aimAngle=normAngle(
          guard.aimAngle+
          normAngle(lastAngle-guard.aimAngle)*
          Math.min(1,dt*9.5)
        );
      }else{
        guard.hasSeen=false;

        // 아직 플레이어를 못 봤거나 마지막 목격 기억이 끝났다면
        // 랜덤 배회 대신 맵에 맞춘 순찰 루트로 복귀한다.
        const patrolTarget=guardPatrolTarget(guard);
        tx=patrolTarget.x;
        ty=patrolTarget.y;
      }

      const searchDX=tx-guard.x;
      const searchDY=ty-guard.y;
      const searchDistance=Math.hypot(searchDX,searchDY);

      if(searchDistance>12){
        if(!(guard.hasSeen&&guard.lostSight<4)){
          // 플레이어를 아직 못 봤거나 마지막 목격 기억이 끝난 경우에만
          // 이동 방향을 보며 평범하게 순찰/수색한다.
          const searchAngle=Math.atan2(searchDY,searchDX);
          guard.angle=normAngle(
            guard.angle+
            normAngle(searchAngle-guard.angle)*
            Math.min(1,dt*6.2)
          );
          guard.aimAngle=normAngle(
            guard.aimAngle+
            normAngle(guard.angle-guard.aimAngle)*
            Math.min(1,dt*9)
          );
        }

        moveGuardSmart(
          guard,searchDX,searchDY,58,dt
        );
      }else if(!(guard.hasSeen&&guard.lostSight<4)){
        guard.hasSeen=false;
        // 다음 프레임 guardPatrolTarget()이 다음 순찰 포인트를 선택한다.
      }
      continue;
    }

    // 포착 직후: 몸/총구를 자연스럽게 빠르게 돌린다.
    const preferred=255;
    const radial=
      distance>preferred+70?1:
      (distance<preferred-55?-1:0);

    const mx=
      Math.cos(targetAngle)*radial+
      Math.cos(targetAngle+Math.PI/2)*guard.strafe*.78;
    const my=
      Math.sin(targetAngle)*radial+
      Math.sin(targetAngle+Math.PI/2)*guard.strafe*.78;

    moveGuardSmart(
      guard,mx,my,guard.moveSpeed,dt
    );

    guard.angle=normAngle(
      guard.angle+
      normAngle(targetAngle-guard.angle)*
      Math.min(1,dt*8.5)
    );
    guard.aimAngle=normAngle(
      guard.aimAngle+
      normAngle(targetAngle-guard.aimAngle)*
      Math.min(1,dt*7.2)
    );

    // 모든 총기 적이 같은 반응→사격 상태 진입 공식을 쓴다.
    // 병종 차이는 reactionScale 하나뿐이다.
    const profile=guardRangedProfile(
      guard,distance
    );
    const reactionDelay=
      (.32-.18*profile.proximity)*
      guard.reactionScale;

    if(guard.stateTime>=reactionDelay){
      guard.state='rangedEngage';
      guard.stateTime=0;
      guard.aimStableTime=0;

      // 순찰/탐색 중 남아 있던 총구 방향을 거의 플레이어 쪽으로 끌어와
      // 전투 시작 순간 엉뚱한 방향을 보는 프레임을 없앤다.
      guard.aimAngle=normAngle(
        guard.aimAngle+
        normAngle(targetAngle-guard.aimAngle)*.78
      );
    }
  }
}

function arenaSpawnInterval(){
  // 오래 버틸수록 증식 속도가 빨라진다.
  return Math.max(
    ARENA_SPAWN_INTERVAL_MIN,
    ARENA_SPAWN_INTERVAL_START-arenaElapsed*.018
  );
}

function chooseArenaSpawnPoint(){
  // 빈 공터이므로 화면에 갑자기 뿅 나타나지 않도록 플레이어 FOV 밖에서 생성한다.
  for(let attempt=0;attempt<24;attempt++){
    const angle=Math.random()*Math.PI*2;
    const radius=980+Math.random()*330;
    const x=player.x+Math.cos(angle)*radius;
    const y=player.y+Math.sin(angle)*radius;

    if(x<540||x>WORLD_W-90||y<90||y>WORLD_H-90)continue;
    if(false)continue;
    if(collidesWorld(x,y,12))continue;
    // 살아있는 플레이어/조력자/다른 군인 바로 위에 리젠하지 않는다.
    if(collidesActorAt(null,x,y,12))continue;
    return{x,y};
  }

  // 월드 모서리 근처 폴백도 캐릭터 위에 겹쳐 생성하지 않는다.
  const baseX=clamp(player.x+1050,560,WORLD_W-100);
  const baseY=clamp(player.y+700,100,WORLD_H-100);
  for(let offset=0;offset<=480;offset+=36){
    for(const sign of [1,-1]){
      const x=clamp(baseX+offset*sign,560,WORLD_W-100);
      const y=clamp(baseY+(offset*.55)*-sign,100,WORLD_H-100);
      if(!collidesWorld(x,y,12)&&!collidesActorAt(null,x,y,12))return{x,y};
    }
  }
  return{x:baseX,y:baseY};
}

function spawnArenaSoldier(){
  const point=chooseArenaSpawnPoint();
  const spawn=createGuard(
    point.x,point.y,0,
    Math.random()>.5?1:-1,
    'soldier'
  );

  // 신병은 플레이어를 '본' 상태로 치지 않는다.
  // 다만 투입 명령으로 현재 위치 주변을 조사하게 해서 결국 공터 안으로 들어온다.
  const towardPlayer=Math.atan2(
    player.y-spawn.y,
    player.x-spawn.x
  );
  spawn.angle=towardPlayer;
  spawn.aimAngle=towardPlayer;
  spawn.hasSeen=false;
  spawn.heardX=player.x;
  spawn.heardY=player.y;
  spawn.heardKind='gunshot';
  spawn.heardTimer=6.5;
  spawn.state='investigateSound';
  spawn.stateTime=0;
  spawn.lastHeardSoundId=soundEventSerial;
  spawn.arenaSpawnIndex=++arenaSpawnCount;

  testSubjects.push(spawn);
}

function cleanupArenaCorpses(){
  // 전투는 무한이지만 죽은 개체 객체까지 무한 누적시키면 브라우저가 먼저 죽는다.
  let deadCount=testSubjects.reduce(
    (count,guard)=>count+(guard.hp<=0?1:0),0
  );
  if(deadCount<=80)return;

  for(let i=0;i<testSubjects.length&&deadCount>80;){
    if(testSubjects[i].hp<=0){
      testSubjects.splice(i,1);
      deadCount--;
    }else i++;
  }
}

function updateGuardRespawns(dt){
  if(labEntryUnlocked||missionObjectiveComplete)return;
  if(!arenaActivated){
    
    arenaActivated=true;arenaElapsed=0;guardRespawnTimer=.55;
  }

  arenaElapsed+=dt;
  cleanupArenaCorpses();

  const alive=testSubjects.reduce((count,guard)=>count+(guard.hp>0?1:0),0);
  if(alive>=ARENA_MAX_ALIVE){
    guardRespawnTimer=Math.min(guardRespawnTimer,arenaSpawnInterval());
    return;
  }
  guardRespawnTimer-=dt;
  if(guardRespawnTimer>0)return;

  const batch=arenaElapsed>=115?3:(arenaElapsed>=55?2:1);
  for(let i=0;i<batch;i++){
    if(labEntryUnlocked)break;
    const currentAlive=testSubjects.reduce((count,guard)=>count+(guard.hp>0?1:0),0);
    if(currentAlive>=ARENA_MAX_ALIVE)break;
    spawnArenaSoldier();
  }
  guardRespawnTimer=arenaSpawnInterval();
}


function aliveEnemyCount(){
  let n=0;for(const g of testSubjects)if(g&&g.hp>0)n++;return n;
}
function aliveAllyCount(){
  let n=0;for(const a of squadAllies)if(a&&a.hp>0&&!a.airborne)n++;return n;
}
function enemyPressureOnFriendlies(){
  let n=0;
  for(const g of testSubjects){
    if(!g||g.hp<=0)continue;
    const t=g.targetRef||g.revengeTargetRef;
    if(t&&(t===player||t.isAlly)&&t.hp>0)n++;
  }
  return n;
}
function arenaEnemyPower(){
  let power=0;
  for(const g of testSubjects){
    if(!g||g.hp<=0)continue;
    const hpFrac=clamp(g.hp/(g.maxHp||g.hp||1),0,1);
    power+=.72+.28*hpFrac;
    const t=g.targetRef||g.revengeTargetRef;
    if(t&&(t===player||t.isAlly)&&t.hp>0)power+=.23;
  }
  return power;
}
function friendlyPower(){
  // 플레이어는 조력자보다 높은 전력으로 친다. 체력 저하는 즉시 반영한다.
  const playerFrac=clamp(player.hp/(PLAYER_MAX_HP||1),0,1);
  let power=5.2*(.45+.55*playerFrac);
  for(const a of squadAllies){
    if(!a||a.hp<=0||a.airborne)continue;
    const hpFrac=clamp(a.hp/(a.maxHp||1),0,1);
    power+=3.6*(.45+.55*hpFrac);
  }
  return power;
}
function chooseHelicopterLandingPoint(){
  // 플레이어 근처 공터 중 벽/캐릭터와 겹치지 않는 지점을 고른다.
  for(let i=0;i<28;i++){
    const a=Math.random()*Math.PI*2;
    const r=210+Math.random()*150;
    const x=clamp(player.x+Math.cos(a)*r,590,WORLD_W-100);
    const y=clamp(player.y+Math.sin(a)*r,100,WORLD_H-100);
    if(false||collidesWorld(x,y,24)||collidesActorAt(null,x,y,24))continue;
    return{x,y};
  }
  return{x:clamp(player.x+260,590,WORLD_W-100),y:clamp(player.y-180,100,WORLD_H-100)};
}
function reinforcementWaveSize(deficit,pressured){
  // 헬기 한 대당 1~3명. 전선이 크게 무너지면 한 기체가 더 많은 병력을 내려놓는다.
  let count=1;
  if(deficit>=ALLY_REINFORCEMENT_SEVERE_DEFICIT||pressured>=6)count=2;
  if(deficit>=ALLY_REINFORCEMENT_CRITICAL_DEFICIT||pressured>=10)count=3;
  return Math.max(1,count);
}
function reinforcementHelicopterCount(deficit,pressured){
  const friendly=Math.max(1,friendlyPower());
  const enemy=arenaEnemyPower();
  const ratio=enemy/friendly;
  let count=1;
  if(ratio>=2.0||deficit>=ALLY_REINFORCEMENT_SEVERE_DEFICIT*1.35||pressured>=10)count=2;
  if(ratio>=2.8||deficit>=ALLY_REINFORCEMENT_CRITICAL_DEFICIT*1.35||pressured>=15)count=3;
  return count;
}
function reinforcementCooldownFor(helicopters,deficit){
  if(helicopters>=3||deficit>=ALLY_REINFORCEMENT_CRITICAL_DEFICIT)return 7;
  if(helicopters>=2||deficit>=ALLY_REINFORCEMENT_SEVERE_DEFICIT)return 9.5;
  return ALLY_REINFORCEMENT_COOLDOWN;
}
function reinforcementHoldFor(helicopters){
  return helicopters>=3?1.1:helicopters>=2?1.7:ALLY_REINFORCEMENT_HOLD;
}
function reinforcementDropPoints(x,y,count){
  if(count<=1)return[{x,y}];
  if(count===2)return[{x:x-28,y:y+15},{x:x+28,y:y-15}];
  return[
    {x:x-34,y:y+22},
    {x:x+34,y:y+22},
    {x,y:y-34}
  ];
}
function chooseHelicopterLandingPointForWave(existing=[]){
  for(let i=0;i<36;i++){
    const a=Math.random()*Math.PI*2;
    const r=220+Math.random()*210;
    const x=clamp(player.x+Math.cos(a)*r,590,WORLD_W-100);
    const y=clamp(player.y+Math.sin(a)*r,100,WORLD_H-100);
    if(false||collidesWorld(x,y,28)||collidesActorAt(null,x,y,28))continue;
    if(existing.some(h=>Math.hypot(h.targetX-x,h.targetY-y)<210))continue;
    return{x,y};
  }
  return chooseHelicopterLandingPoint();
}
function beginHelicopterReinforcement(deficit=0,pressured=0){
  if(helicopterReinforcements.length||aliveAllyCount()>=ALLY_REINFORCEMENT_MAX)return false;
  const available=Math.max(0,ALLY_REINFORCEMENT_MAX-aliveAllyCount());
  if(available<=0)return false;
  const requestedHelos=reinforcementHelicopterCount(deficit,pressured);
  const heloCount=Math.max(1,Math.min(requestedHelos,available));
  const basePerHelo=reinforcementWaveSize(deficit,pressured);
  let remaining=available;
  const created=[];
  const phaseOffset=Math.random()*Math.PI*2;
  for(let i=0;i<heloCount&&remaining>0;i++){
    const target=chooseHelicopterLandingPointForWave(created);
    const deployCount=Math.max(1,Math.min(basePerHelo,remaining));
    remaining-=deployCount;
    const approachAngle=phaseOffset+(Math.PI*2*i/heloCount)+(Math.random()-.5)*.38;
    const approachRadius=1080+Math.random()*150;
    const startX=target.x+Math.cos(approachAngle)*approachRadius;
    const startY=target.y+Math.sin(approachAngle)*(820+Math.random()*120);
    const departAngle=approachAngle+Math.PI+(Math.random()-.5)*.35;
    const departX=target.x+Math.cos(departAngle)*1180;
    const departY=target.y+Math.sin(departAngle)*900;
    const h={
      phase:'queued',launchDelay:i*(.78+Math.random()*.28),t:0,targetX:target.x,targetY:target.y,
      x:startX,y:startY,startX,startY,departX,departY,
      deployCount,allies:[],rotorTick:0,gunTick:0,gunShots:0,gunTarget:null,
      waveIndex:i,waveCount:heloCount
    };
    created.push(h);
  }
  helicopterReinforcements.push(...created);
  reinforcementCooldown=reinforcementCooldownFor(created.length,deficit);
  reinforcementDeficitTime=0;
  return created.length>0;
}

function helicopterGunTarget(h){
  let best=null,bestScore=1e9;
  for(const g of testSubjects){
    if(!g||g.hp<=0)continue;
    const d=Math.hypot(g.x-h.x,g.y-h.y);
    if(d>760)continue;
    if(lineBlocked(h.x,h.y,g.x,g.y))continue;
    const landingDist=Math.hypot(g.x-h.targetX,g.y-h.targetY);
    const score=d*.45+landingDist*.55-Math.random()*55;
    if(score<bestScore){bestScore=score;best=g}
  }
  return best;
}

  gunAudioContext.resume().then(()=>gunshotBuffers.mixkit).then(buffer=>{
    const source=gunAudioContext.createBufferSource();
    const gain=gunAudioContext.createGain();
    source.buffer=buffer;source.playbackRate.value=.78+Math.random()*.08;
    gain.gain.value=.27;
    source.connect(gain).connect(masterGainNode);source.start();
  }).catch(()=>{});
}
function fireHelicopterGun(h){
  let target=h.gunTarget;
  if(!target||target.hp<=0||Math.hypot(target.x-h.x,target.y-h.y)>720||lineBlocked(h.x,h.y,target.x,target.y)){
    target=helicopterGunTarget(h);h.gunTarget=target;
  }
  if(!target)return false;
  // 도어에 걸터앉은 탑승 인원이 .22 SMG를 쏜다. 기체 고정기총이 아니다.
  const baseAngle=Math.atan2(target.y-h.y,target.x-h.x);
  const angle=baseAngle+(Math.random()-.5)*.095;
  const ux=Math.cos(baseAngle),uy=Math.sin(baseAngle);
  const sideX=-uy,sideY=ux;
  const muzzleX=h.x+ux*10+sideX*48;
  const muzzleY=h.y+uy*10+sideY*48;

  shotTraces.push({x1:muzzleX,y1:muzzleY,x2:muzzleX+Math.cos(angle)*46,y2:muzzleY+Math.sin(angle)*46,life:.05,maxLife:.05,color:'#f1e3b0'});
  if(shotTraces.length>120)shotTraces.shift();
  playGunshot(WEAPON_BY_ID.smg);
  emitSoundEvent(h.x,h.y,NOISE_SMG_RADIUS,'gunshot','player');
  h.gunShots++;

}
function updateOneHelicopter(h,dt){
  if(h.phase==='queued'){
    h.launchDelay-=dt;
    // 아직 출발 전인 후속기는 전세가 갑자기 회복되면 취소할 수 있다.
    if(h.launchDelay>0)return true;
    const deficit=arenaEnemyPower()-friendlyPower();
    if(deficit<ALLY_REINFORCEMENT_DEFICIT*.55&&enemyPressureOnFriendlies()<2)return false;
    h.phase='approach';h.t=0;
  }
  h.t+=dt;h.rotorTick-=dt;
  if(h.rotorTick<=0){
    h.rotorTick=.72;
    emitSoundEvent(h.x,h.y,520,'helicopter','player');
  }
  if(h.phase==='approach'){
    const q=smoothStep01(h.t/2.8);
    h.x=h.startX+(h.targetX-h.startX)*q;
    h.y=h.startY+(h.targetY-h.startY)*q;
    if(h.t>=2.8){h.phase='hover';h.t=0;h.x=h.targetX;h.y=h.targetY}
    return true;
  }
  if(h.phase==='hover'){
    h.x=h.targetX;h.y=h.targetY;
    if(!h.supplyChecked){
      h.supplyChecked=true;
      // 전투가 길어지면 일부 증원기가 12게이지 탄약 상자를 함께 내려놓는다.
      if(arenaElapsed>=nextBuckshotSupplyAt||Math.random()<.22){
        dropBuckshotSupply(h.targetX,h.targetY);
        nextBuckshotSupplyAt=arenaElapsed+32+Math.random()*30;
      }
    }
    if(h.t>=.65){
      h.phase='descent';h.t=0;
      const drops=reinforcementDropPoints(h.targetX,h.targetY,h.deployCount||1);
      h.allies=[];
      for(let i=0;i<drops.length;i++){
        if(aliveAllyCount()>=ALLY_REINFORCEMENT_MAX)break;
        const p=drops[i];
        const ally=createSquadAlly(p.x,p.y,i%2===0?-1:1);
        ally.initialExit=false;ally.holdOutsideUntilPlayerExits=false;
        ally.airborne=true;ally.airborneHeight=105;ally.state='reinforcementDrop';
        ally.roamX=p.x;ally.roamY=p.y;ally.roamTimer=.5;
        ally.angle=Math.atan2(player.y-p.y,player.x-p.x);ally.aimAngle=ally.angle;
        squadAllies.push(ally);h.allies.push(ally);
      }
    }
    return true;
  }
  if(h.phase==='descent'){
    h.x=h.targetX;h.y=h.targetY;
    const q=clamp(h.t/2.15,0,1);
    for(const ally of (h.allies||[])){
      if(!ally)continue;
      ally.airborneHeight=(1-smoothStep01(q))*105;
    }
    if(h.t>=2.15){
      let spoke=false;
      for(const ally of (h.allies||[])){
        if(!ally)continue;
        ally.airborne=false;ally.airborneHeight=0;ally.state='follow';ally.roamTimer=.2;
        if(!spoke){speakCombatLine(ally,'reinforcement','yell',.95);spoke=true}
      }
      h.phase='gunrun';h.t=0;h.gunTick=.08;h.gunShots=0;h.gunTarget=null;
    }
    return true;
  }
  if(h.phase==='gunrun'){
    h.x=h.targetX;h.y=h.targetY;
    h.gunTick-=dt;
    if(h.gunTick<=0){h.gunTick=.085+Math.random()*.045;fireHelicopterGun(h)}
    if(h.t>=1.65||h.gunShots>=15){h.phase='depart';h.t=0;h.gunTarget=null}
    return true;
  }
  if(h.phase==='depart'){
    const q=smoothStep01(h.t/2.7);
    h.x=h.targetX+(h.departX-h.targetX)*q;
    h.y=h.targetY+(h.departY-h.targetY)*q;
    if(h.t>=2.7)return false;
  }
  return true;
}
function updateHelicopterReinforcement(dt){
  reinforcementCooldown=Math.max(0,reinforcementCooldown-dt);
  if(labEntryUnlocked||missionObjectiveComplete){
    if(helicopterReinforcements.length)
      helicopterReinforcements=helicopterReinforcements.filter(h=>h.phase!=='queued').filter(h=>updateOneHelicopter(h,dt));
    return;
  }
  if(helicopterReinforcements.length){
    helicopterReinforcements=helicopterReinforcements.filter(h=>updateOneHelicopter(h,dt));
    return;
  }
  if(!arenaActivated||aliveAllyCount()>=ALLY_REINFORCEMENT_MAX)return;
  reinforcementCheckTimer-=dt;
  if(reinforcementCheckTimer>0)return;
  reinforcementCheckTimer=ALLY_REINFORCEMENT_CHECK_INTERVAL;
  const enemies=aliveEnemyCount();
  const deficit=arenaEnemyPower()-friendlyPower();
  const pressured=enemyPressureOnFriendlies();
  const pendingHelos=reinforcementHelicopterCount(deficit,pressured);
  if(enemies>=18&&deficit>=ALLY_REINFORCEMENT_DEFICIT&&(pressured>=3||enemies>=30)){
    const urgency=pendingHelos>=3?2.45:pendingHelos>=2?1.65:1;
    reinforcementDeficitTime+=ALLY_REINFORCEMENT_CHECK_INTERVAL*urgency;
  }else{
    reinforcementDeficitTime=Math.max(0,reinforcementDeficitTime-1.6*ALLY_REINFORCEMENT_CHECK_INTERVAL);
  }
  if(reinforcementCooldown<=0&&reinforcementDeficitTime>=reinforcementHoldFor(pendingHelos)){
    beginHelicopterReinforcement(deficit,pressured);
  }
}

function currentAccuracySpread(includeAmmoCone=false){
  const pose=pistolPoseAt(0);
  const barrelAngle=normAngle(player.bodyAngle+pose.turn);
  // UI의 오차도 숨은 확률값이 아니라 현재 보이는 총열과 목표선의 차이다.
  let spread=Math.abs(normAngle(player.angle-barrelAngle));

  // 산탄의 펠릿 원뿔만 총열 정렬과 무관한 탄약 고유 분산으로 남는다.
  if(includeAmmoCone){
    const nextAmmoId=pistol.chamberRound;
    if(nextAmmoId==='shot')spread+=.065;
    // 12G 벅샷은 총열 길이에 비해 과하게 벌어지지 않도록 더 조밀하게 표시한다.
    if(nextAmmoId==='buckshot')spread+=.050;
  }
  return Math.min(.18,spread);
}

function sustainedFireBloomImpulse(def){
  const shots=pistol.rapidShotCount||1;
  if(def.id==='assaultRifle'){
    // 5발까지는 제어 가능한 짧은 점사, 이후부터 가스총의 연속 반동이 빠르게 누적된다.
    const fatigue=clamp((shots-5)/8,0,1);
    return .0035+fatigue*.024;
  }
  if(def.id==='battleRifle'){
    // 첫 단발은 매우 정밀하지만 7.62를 빠르게 연타하면 세 번째 이후부터 급격히 흐트러진다.
    const fatigue=clamp((shots-2)/6,0,1);
    return .0025+fatigue*.034;
  }
  if(def.id==='lmg'){
    // 무거운 총몸으로 첫 점사는 버티지만, 긴 연발에서는 100발 탄통과 총열 진동이 누적된다.
    const fatigue=clamp((shots-4)/10,0,1);
    return .005+fatigue*.030;
  }
  return def.bloomPerShot;
}

function trimPlasmaEffectBuffer(buffer){
  const channels=Array.from({length:buffer.numberOfChannels},(_,i)=>buffer.getChannelData(i));
  const step=Math.max(1,Math.floor(buffer.sampleRate*.004));
  const levels=[];
  let peak=0;
  for(let i=0;i<buffer.length;i+=step){
    let energy=0,count=0;
    for(const channel of channels)for(let j=i;j<Math.min(i+step,buffer.length);j++){
      energy+=channel[j]*channel[j];count++;
    }
    const rms=Math.sqrt(energy/Math.max(1,count));levels.push(rms);peak=Math.max(peak,rms);
  }
  const threshold=Math.max(.001,peak*.025);
  let first=levels.findIndex(level=>level>threshold),last=levels.length-1;
  if(first<0)return buffer;
  while(last>first&&levels[last]<=threshold)last--;
  const start=Math.max(0,first*step-Math.floor(buffer.sampleRate*.003));
  const end=Math.min(buffer.length,(last+1)*step);
  const result=gunAudioContext.createBuffer(buffer.numberOfChannels,end-start,buffer.sampleRate);
  for(let c=0;c<channels.length;c++)result.getChannelData(c).set(channels[c].subarray(start,end));
  return result;
}
function makePlasmaBedBuffer(buffer,name=''){
  // Select a sustained interior section and crossfade its seam once at load time.
  const rate=buffer.sampleRate;
  const start=Math.floor(Math.min(.16,buffer.duration*.1)*rate);
  // Gas uses only the early injection hiss; discard the release/noise at the tail.
  const count=Math.min(buffer.length-start,Math.floor(rate*(name==='gas'?Math.min(.70,buffer.duration*.42):2.4)));
  const overlap=Math.max(1,Math.min(Math.floor(rate*.075),Math.floor(count/4)));
  const length=count-overlap;
  const result=gunAudioContext.createBuffer(buffer.numberOfChannels,length,rate);
  for(let c=0;c<buffer.numberOfChannels;c++){
    const input=buffer.getChannelData(c),out=result.getChannelData(c);
    out.set(input.subarray(start+overlap,start+count));
    for(let i=0;i<overlap;i++){
      const t=(i+1)/overlap,index=length-overlap+i;
      out[index]=out[index]*Math.cos(t*Math.PI/2)+input[start+i]*Math.sin(t*Math.PI/2);
    }
  }
  return result;
}

function setPlasmaBed(name,active,volume=.2,rate=1){

    source.connect(gain).connect(masterGainNode);
