function smgMeleeWorldPoint(local){
  const ca=Math.cos(player.bodyAngle),sa=Math.sin(player.bodyAngle);
  return{
    x:player.x+local.x*ca-local.y*sa,
    y:player.y+local.x*sa+local.y*ca
  };
}

function smgBodyTouchesDummy(rig){
  // 화면에 그려진 개머리판부터 총구 직전까지 총몸 전체를 짧은 원들로 검사한다.
  for(let gunX=-9;gunX<=16;gunX+=2.5){
    const point=smgMeleeWorldPoint(gunPoint(rig.pose,gunX,0));
    const target=firstTouchedMeleeDummy(point.x,point.y,4.2);
    if(target)return{point,target};
  }
  return null;
}

function smgMeleeContactFallback(maxForward,halfWidth){
  const ca=Math.cos(player.angle),sa=Math.sin(player.angle);
  return meleeDummies.find(dummy=>{
    if(!actorCanReceiveHit(dummy))return false;
    const dx=dummy.x-player.x,dy=dummy.y-player.y;
    const forward=dx*ca+dy*sa;
    const side=-dx*sa+dy*ca;
    return forward>=10&&forward<=maxForward&&Math.abs(side)<=halfWidth;
  })||null;
}

function trySmgMeleeHit(){
  if(smgMelee.hitDone||!smgMelee.attack)return;
  const p=smgMeleeProgress();
  const bodyPush=smgMelee.attack==='bodyPush';
  if(p<(bodyPush?.34:.24)||p>(bodyPush?.68:.62))return;
  const rig=buildPistolRig();
  let point=null;
  let target=null;
  if(bodyPush){
    const contact=smgBodyTouchesDummy(rig);
    if(contact){point=contact.point;target=contact.target;}
  }else{
    const muzzle=smgMeleeWorldPoint(gunPoint(rig.pose,currentWeaponDef().muzzleX,0));
    target=firstTouchedMeleeDummy(muzzle.x,muzzle.y,4.3);
    if(target)point=muzzle;
  }
  if(!point)target=smgMeleeContactFallback(bodyPush?36:39,bodyPush?14:8.5);
  if(!target)return;
  if(!point){
    point={
      x:player.x+Math.cos(player.angle)*(bodyPush?24:31),
      y:player.y+Math.sin(player.angle)*(bodyPush?24:31)
    };
  }
  smgMelee.hitDone=true;
  damageMeleeDummy(
    bodyPush?smgMelee.bodyPushDamage:smgMelee.muzzleDamage,
    player.angle,point.x,point.y,null,'blunt',target
  );
  if(target.hp>0){
    // 기관단총 2타는 권총의 왼손 밀치기보다 한 단계 더 묵직하게 날린다.
    const force=bodyPush?335:34;
    target.pushVelocityX=Math.cos(player.angle)*force;
    target.pushVelocityY=Math.sin(player.angle)*force;
    target.hitFlash=bodyPush?.18:.13;
  }
}

function updateSmgMelee(dt){
  smgMelee.secondWindow=Math.max(0,smgMelee.secondWindow-dt);
  if(!smgMelee.attack)return;
  smgMelee.elapsed+=dt;
  if(smgMelee.attack==='bodyPush'){
    // 총몸을 가로세운 직후부터 회수 직전까지만 몸 전체가 짧게 따라 들어간다.
    const p=smgMeleeProgress();
    if(p>=.14&&p<=.62){
      const follow=Math.sin(((p-.14)/.48)*Math.PI);
      moveMeleeSandboxPlayer(
        Math.cos(player.angle)*105*follow*dt,
        Math.sin(player.angle)*105*follow*dt
      );
    }
  }
  trySmgMeleeHit();
  // 찌른 팔을 회수하기 전에 총몸 회전을 시작해 거의 한 번의 타격처럼 잇는다.
  if(smgMelee.attack==='muzzle'&&smgMelee.queuedSecond&&smgMeleeProgress()>=.58){
    beginSmgBodyPush(true);
    return;
  }
  if(smgMelee.elapsed<smgMelee.duration)return;
  smgMelee.attack=null;
  smgMelee.elapsed=0;
  smgMelee.duration=0;
  smgMelee.hitDone=false;
  smgMelee.queuedSecond=false;
}

function rifleMeleeWorldPoint(local,bodyTurn=0){
  const angle=player.bodyAngle+bodyTurn;
  const ca=Math.cos(angle),sa=Math.sin(angle);
  return{
    x:player.x+local.x*ca-local.y*sa,
    y:player.y+local.x*sa+local.y*ca
  };
}

function tryRifleMeleeHit(){
  if(rifleMelee.hitDone||!rifleMelee.attack)return;
  const p=rifleMeleeProgress();
  const sweep=rifleMelee.attack==='stockSweep';
  const strike=rifleMelee.attack==='stockStrike';
  const contactStart=sweep?.48:(strike?(rifleMelee.chainedEntry?.30:.34):.22);
  const contactEnd=sweep?.82:(strike?.42:.64);
  if(p<contactStart||p>contactEnd)return;
  const rig=buildPistolRig();
  const bodyTurn=rig.rifleBodyTurn||0;
  const assault=currentWeaponDef().id==='assaultRifle';
  const sideStockX=assault?-13.5:-16;
  const sideMuzzleX=assault?34.5:38;
  const strikeStockX=assault?-11.8:-13.5;
  const contactPoints=sweep
    ?[
      {point:rifleMeleeWorldPoint(
        gunPoint(rig.pose,sideStockX*RIFLE_MELEE_SIDE_SCALE,0),bodyTurn
      ),radius:5.2},
      {point:rifleMeleeWorldPoint(
        gunPoint(rig.pose,sideMuzzleX*RIFLE_MELEE_SIDE_SCALE,0),bodyTurn
      ),radius:4.4}
    ]
    :[{
      point:rifleMeleeWorldPoint(
        strike?gunPoint(rig.pose,strikeStockX,0):gunPoint(rig.pose,currentWeaponDef().muzzleX,0),
        bodyTurn
      ),
      radius:strike?5.6:4.2
    }];
  // 2타는 전용 옆면 스프라이트의 개머리판 끝과 총구 끝을 모두 검사하되 피해는 한 번만 준다.
  let target=null;
  const touched=contactPoints.find(contact=>{
    target=firstTouchedMeleeDummy(contact.point.x,contact.point.y,contact.radius);
    return!!target;
  });
  let point=touched?touched.point:contactPoints[0].point;
  if(!target){
    const ca=Math.cos(player.angle),sa=Math.sin(player.angle);
    const maxForward=(strike?43:(sweep?38:48))*(assault?.92:1);
    const halfWidth=(strike?11:(sweep?15:7.5))*(assault?.94:1);
    target=meleeDummies.find(dummy=>{
      if(!actorCanReceiveHit(dummy))return false;
      const dx=dummy.x-player.x,dy=dummy.y-player.y;
      const forward=dx*ca+dy*sa;
      const side=-dx*sa+dy*ca;
      return forward>=10&&forward<=maxForward&&Math.abs(side)<=halfWidth;
    })||null;
    if(!target)return;
    const dx=target.x-player.x,dy=target.y-player.y;
    const forward=dx*ca+dy*sa;
    point={x:player.x+ca*Math.min(forward,maxForward-4),y:player.y+sa*Math.min(forward,maxForward-4)};
  }
  rifleMelee.hitDone=true;
  rifleMelee.hitAtElapsed=strike?rifleMelee.elapsed:-1;
  const pumpMultiplier=currentWeaponDef().id==='pumpShotgun'?1.28:1;
  const lmgMultiplier=currentWeaponDef().id==='lmg'?1.38:1;
  damageMeleeDummy(
    Math.round(
      (strike?rifleMelee.stockDamage:(sweep?rifleMelee.sweepDamage:rifleMelee.muzzleDamage))*
      pumpMultiplier*lmgMultiplier
    ),
    player.angle,point.x,point.y,null,'blunt',target
  );
  if(target.hp>0){
    const force=(strike?285:(sweep?135:42))*(pumpMultiplier>1?1.18:1)*(lmgMultiplier>1?1.16:1);
    const angle=Math.atan2(target.y-player.y,target.x-player.x);
    target.pushVelocityX=Math.cos(angle)*force;
    target.pushVelocityY=Math.sin(angle)*force;
    target.hitFlash=strike?.24:(sweep?.20:.15);
  }
}

function updateRifleMelee(dt){
  rifleMelee.secondWindow=Math.max(0,rifleMelee.secondWindow-dt);
  if(rifleMelee.secondWindow<=0)rifleMelee.nextWindowStep=0;
  if(!rifleMelee.attack)return;
  rifleMelee.elapsed+=dt;
  if(rifleMelee.attack==='stockSweep'){
    const p=rifleMeleeProgress();
    if(p>=.22&&p<=.70){
      // 2타: 오른발을 전방에 디디며 체중과 몸통 회전을 개머리판에 싣는다.
      const follow=Math.sin(((p-.22)/.48)*Math.PI);
      moveMeleeSandboxPlayer(
        Math.cos(player.angle)*78*follow*dt,
        Math.sin(player.angle)*78*follow*dt
      );
    }
    // 2타의 개머리판이 왼쪽 긋기를 끝낸 위치에서 회수하지 않고 3타로 넘긴다.
    if(rifleMelee.queuedNext&&p>=.70){
      beginRifleMeleeStage('stockStrike',true);
      return;
    }
  }else if(rifleMelee.attack==='stockStrike'){
    const p=rifleMeleeProgress();
    const start=rifleMelee.chainedEntry?.12:.26;
    if(!rifleMelee.hitDone&&p>=start&&p<=.38){
      // 3타: 2타 끝의 왼쪽 어깨 파지를 유지하고 왼발로 한 걸음 더 들어가며 정면을 찍는다.
      const follow=Math.sin(((p-start)/(.38-start))*Math.PI);
      moveMeleeSandboxPlayer(
        Math.cos(player.angle)*125*follow*dt,
        Math.sin(player.angle)*125*follow*dt
      );
    }else if(rifleMelee.hitDone&&rifleMelee.hitAtElapsed>=0&&
      rifleMelee.elapsed-rifleMelee.hitAtElapsed<.10){
      // 접촉 직후 발을 뽑지는 않되, 상체로 받은 반동만큼 중심이 아주 짧게 뒤로 튄다.
      const rebound=Math.sin(
        ((rifleMelee.elapsed-rifleMelee.hitAtElapsed)/.10)*Math.PI
      );
      moveMeleeSandboxPlayer(
        -Math.cos(player.angle)*34*rebound*dt,
        -Math.sin(player.angle)*34*rebound*dt
      );
    }
  }
  tryRifleMeleeHit();
  if(rifleMelee.attack==='stockStrike'&&rifleMelee.hitDone&&
    rifleMelee.hitAtElapsed>=0&&rifleMelee.elapsed-rifleMelee.hitAtElapsed>=.28){
    rifleMelee.elapsed=rifleMelee.duration;
  }else if(rifleMelee.attack==='stockStrike'&&!rifleMelee.hitDone&&
    rifleMeleeProgress()>=.94){
    rifleMelee.elapsed=rifleMelee.duration;
  }
  // 총구가 최대 전진한 직후 개머리판 회전을 걸어 찌르기 회수 프레임을 없앤다.
  if(rifleMelee.attack==='muzzle'&&rifleMelee.queuedNext&&rifleMeleeProgress()>=.60){
    beginRifleMeleeStage('stockSweep',true,true);
    return;
  }
  if(rifleMelee.elapsed<rifleMelee.duration)return;
  if(rifleMelee.queuedNext){
    beginRifleMeleeStage(
      rifleMelee.attack==='muzzle'?'stockSweep':'stockStrike',true,
      rifleMelee.attack==='muzzle'
    );
    return;
  }
  if(rifleMelee.attack!=='stockStrike'){
    rifleMelee.nextWindowStep=rifleMelee.attack==='muzzle'?2:3;
    rifleMelee.secondWindow=.22;
  }
  rifleMelee.attack=null;
  rifleMelee.elapsed=0;
  rifleMelee.duration=0;
  rifleMelee.hitDone=false;
  rifleMelee.hitAtElapsed=-1;
  rifleMelee.queuedNext=false;
  rifleMelee.chainedEntry=false;
  rifleMelee.flowingFromMuzzle=false;
}

function shotgunMeleeWorldPoint(local){
  const ca=Math.cos(player.bodyAngle),sa=Math.sin(player.bodyAngle);
  return{
    x:player.x+local.x*ca-local.y*sa,
    y:player.y+local.x*sa+local.y*ca
  };
}

function tryShotgunMeleeHit(){
  if(shotgunMelee.hitDone||!shotgunMelee.attack)return;
  const p=shotgunMeleeProgress();
  if(p<.53||p>.82)return;
  const rig=buildPistolRig();
  // 180도 뒤집혀 전방을 향한 목재 손잡이 끝 한 곳만 판정점으로 쓴다.
  let point=shotgunMeleeWorldPoint(gunPoint(rig.pose,-9.5,0));
  let target=firstTouchedMeleeDummy(point.x,point.y,5.0);
  if(!target){
    const ca=Math.cos(player.angle),sa=Math.sin(player.angle);
    target=meleeDummies.find(dummy=>{
      if(!actorCanReceiveHit(dummy))return false;
      const dx=dummy.x-player.x,dy=dummy.y-player.y;
      const forward=dx*ca+dy*sa;
      const side=-dx*sa+dy*ca;
      return forward>=10&&forward<=36&&Math.abs(side)<=9.5;
    })||null;
    if(!target)return;
    const dx=target.x-player.x,dy=target.y-player.y;
    const forward=dx*ca+dy*sa;
    point={
      x:player.x+ca*Math.min(27,forward),
      y:player.y+sa*Math.min(27,forward)
    };
  }
  shotgunMelee.hitDone=true;
  damageMeleeDummy(
    shotgunMelee.damage,
    player.angle,point.x,point.y,null,'blunt',target
  );
  if(target.hp>0){
    // 밀림은 권총 1타의 왼손 밀치기와 같은 세기로 제한한다.
    const angle=Math.atan2(target.y-player.y,target.x-player.x);
    target.pushVelocityX=Math.cos(angle)*255;
    target.pushVelocityY=Math.sin(angle)*255;
    target.hitFlash=.22;
  }
}

function updateShotgunMelee(dt){
  shotgunMelee.recovery=Math.max(0,shotgunMelee.recovery-dt);
  if(!shotgunMelee.attack)return;
  shotgunMelee.elapsed+=dt;
  const p=shotgunMeleeProgress();
  if(p>=.50&&p<=.78){
    // 손잡이를 박는 순간 발과 몸도 짧게 따라 들어가되 적을 관통하지는 않는다.
    const follow=Math.sin(((p-.50)/.28)*Math.PI);
    moveMeleeSandboxPlayer(
      Math.cos(player.angle)*78*follow*dt,
      Math.sin(player.angle)*78*follow*dt
    );
  }
  tryShotgunMeleeHit();
  if(shotgunMelee.elapsed<shotgunMelee.duration)return;
  shotgunMelee.attack=null;
  shotgunMelee.elapsed=0;
  shotgunMelee.duration=0;
  shotgunMelee.hitDone=false;
  shotgunMelee.recovery=.34;
}

function springMeleeValue(value,velocity,target,stiffness,damping,dt){
  velocity+=(target-value)*stiffness*dt;
  velocity*=Math.exp(-damping*dt);
  value+=velocity*dt;
  return {value,velocity};
}

function meleeAttackProgress(){
  if(!meleeState.attack||meleeState.duration<=0)return 0;
  return clamp(meleeState.elapsed/meleeState.duration,0,1);
}

function applyStraightLunge(dt){
  if(meleeState.attack!=='straight') return;
  const p=meleeAttackProgress();
  // Push forward mainly during the first half of the punch.
  const drive=Math.sin(Math.min(1,p)*Math.PI);
  const speed=34*drive; // subtle body-weight transfer, not a dash
  player.x+=Math.cos(player.aimAngle)*speed*dt;
  player.y+=Math.sin(player.aimAngle)*speed*dt;
}


function meleePulse01(p){
  p=Math.max(0,Math.min(1,p));
  // 초인적인 스트레이트 템포: 빠른 신전 뒤 짧게 꽂고 곧바로 회수한다.
  if(p<0.38){
    const t=p/0.38;
    return 1-Math.pow(1-t,3.4);
  }
  const t=(p-0.38)/0.62;
  return Math.max(0,1-Math.pow(t,1.7));
}

function meleeJabPulse01(p){
  p=clamp(p,0,1);
  // 발사 구간은 극단적으로 짧고, 회수는 그보다 약 3배 길게 두어 속도 차를 보인다.
  if(p<.22)return 1-Math.pow(1-p/.22,4);
  if(p<.31)return 1;
  return 1-smoothStep01((p-.31)/.69);
}

function meleeHookPulse01(p){
  p=clamp(p,0,1);
  // 리드 숄더를 빠르게 감아 넣고, 타격 뒤에는 조금 더 길게 풀어 준다.
  if(p<.34)return smoothStep01(p/.34);
  if(p<.43)return 1;
  return 1-smoothStep01((p-.43)/.57);
}

function meleeShovePulse01(p){
  p=clamp(p,0,1);
  // 별도 정지 구간 없이 최대 신전까지 밀어낸 흐름 그대로 회수한다.
  if(p<.24)return 1-Math.pow(1-p/.24,4);
  return 1-smoothStep01((p-.24)/.76);
}

function beginMeleeAttack(type){
  if(!meleeState.active||player.hp<=0||meleeBlockedBySprint())return false;

  // 잽 중 들어온 우클릭은 버리지 않고 잽이 완전히 끝난 뒤 스트레이트로 연결한다.
  // 기존 모션 속도는 그대로 넘겨서 두 동작 사이의 관성은 자연스럽게 이어진다.
  if(meleeState.attack){
    if(meleeState.attack==='jab'&&type==='jab'&&meleeState.jabChainCount<2){
      meleeState.queuedAttack='jab';
      return true;
    }
    if(meleeState.attack==='jab'&&type==='straight'){
      if(meleeState.queuedAttack==='jab')meleeState.queuedAfterAttack='straight';
      else meleeState.queuedAttack='straight';
      return true;
    }
    if(meleeState.attack==='straight'&&meleeState.comboStraight&&type==='jab'){
      // 잽-잽-투 뒤 좌클릭은 훅으로 변환하지 않고 다음 잽으로 예약한다.
      meleeState.queuedAttack=meleeState.poweredStraight?'jab':'hook';
      return true;
    }
    return false;
  }
  if(type==='jab'&&meleeState.hookWindow>0)type='hook';
  const poweredStraight=type==='straight'&&meleeState.doubleJabWindow>0;
  meleeState.attack=type;
  meleeState.elapsed=0;
  meleeState.duration=type==='straight'?.34:type==='hook'?.36:type==='shove'?.28:.26;
  meleeState.hitDone=false;
  meleeState.comboStraight=poweredStraight;
  meleeState.hookWindow=0;
  meleeState.hookFromStraight=false;
  meleeState.hookEntryPulse=0;
  meleeState.poweredStraight=poweredStraight;
  meleeState.doubleJabWindow=0;
  meleeState.jabChainCount=type==='jab'?1:0;
  meleeState.queuedAfterAttack=null;
  mouse.down=false;
  mouse.aim=false;
  return true;
}

function beginQueuedStraight(){
  const powered=meleeState.jabChainCount>=2;
  meleeState.attack='straight';
  meleeState.elapsed=0;
  meleeState.duration=.32;
  meleeState.hitDone=false;
  meleeState.queuedAttack=null;
  meleeState.comboStraight=true;
  meleeState.poweredStraight=powered;
  meleeState.jabChainCount=0;
  meleeState.doubleJabWindow=0;
  meleeState.queuedAfterAttack=null;
  // 잽이 가드까지 돌아온 정확한 지점에서 새 신전을 시작한다.
  meleeMotion.extension=0;
  meleeMotion.extensionVelocity=0;
}

function beginQueuedJab(){
  const followingAttack=meleeState.queuedAfterAttack;
  meleeState.attack='jab';
  meleeState.elapsed=0;
  meleeState.duration=.22;
  meleeState.hitDone=false;
  meleeState.queuedAttack=followingAttack||null;
  meleeState.queuedAfterAttack=null;
  meleeState.jabChainCount=Math.min(2,meleeState.jabChainCount+1);
  meleeState.comboStraight=false;
  meleeState.hookFromStraight=false;
  meleeState.hookEntryPulse=0;
  meleeState.poweredStraight=false;
  // 첫 잽의 회수 속도는 유지한다. 같은 팔이 뒤로 빠지는 탄성으로 두 번째 잽을 장전한다.
}

function beginQueuedHook(){
  const entryPulse=clamp(meleeMotion.extension,0,1);
  meleeState.attack='hook';
  meleeState.elapsed=0;
  meleeState.duration=.30;
  meleeState.hitDone=false;
  meleeState.queuedAttack=null;
  meleeState.comboStraight=false;
  meleeState.hookWindow=0;
  meleeState.hookFromStraight=true;
  meleeState.hookEntryPulse=entryPulse;
}

function toggleFists(){
  if(meleeState.active&&meleeState.weapon==='knife')return requestKnifeExit('fists');
  if(meleeState.active&&meleeState.weapon==='longsword')return requestLongswordExit('fists');
  if(meleeState.attack||pistolMelee.attack||smgMelee.attack||rifleMelee.attack||shotgunMelee.attack||
    shotgunMelee.recovery>0||weaponSwitch.active)return false;
  if(!meleeState.active)return beginMeleeFromGun('fists');
  if(meleeState.weapon==='fists')return beginWeaponDrawFromMelee(pistol.weaponId);
  meleeState.active=true;
  meleeState.weapon='fists';
  knifeState.drawBlend=0;knifeState.drawTarget=0;knifeState.sheathing=false;
  mouse.down=false;
  mouse.aim=false;
  player.aimBlend=0;
  player.longGunBraceBlend=0;
  return true;
}

function tryMeleeHit(){
  if(meleeState.hitDone||!meleeState.attack)return;
  const p=meleeAttackProgress();
  const isStraight=meleeState.attack==='straight';
  const isHook=meleeState.attack==='hook';
  const isShove=meleeState.attack==='shove';
  const comboBonus=isStraight&&meleeState.comboStraight;
  const impactAt=isShove?.36:isHook?.34:isStraight?(comboBonus?.35:.40):.32;
  const impactUntil=isShove?.64:isHook?.66:isStraight?(comboBonus?.72:.65):.68;
  if(p<impactAt)return;
  if(p>impactUntil){
    meleeState.hitDone=true;
    return;
  }

  // 공격 범위나 시야각으로 맞히지 않는다. 화면에 그려진 해당 주먹의 좌표만 판정한다.
  const fist=isStraight?'rear':'lead';
  const fistRadius=isShove?4.6:isHook?4.5:comboBonus?4.9:4.25;
  const hitLead=meleeFistHitsDummy(fist,fistRadius);
  const hitRear=isShove&&meleeFistHitsDummy('rear',fistRadius);
  if(hitLead||hitRear){
    const target=hitLead||hitRear;
    meleeState.hitDone=true;
    const damage=isShove?meleeState.shoveDamage:isHook?meleeState.hookDamage:
      isStraight&&meleeState.poweredStraight?meleeState.poweredStraightDamage:
      isStraight?meleeState.straightDamage:meleeState.jabDamage;
    const fistPoint=getMeleeFistWorldPos(hitLead?fist:'rear');
    damageMeleeDummy(
      damage,player.bodyAngle,fistPoint.x,fistPoint.y,
      isShove?2:null,isShove?'shove':'blunt',target,isShove?'shove':'fist'
    );
    if(!isShove&&target.hp>0){
      // 일반 타격은 접촉감만 보일 정도로 아주 약하게 밀린다.
      const lightKnockback=isHook?30:isStraight
        ?(meleeState.poweredStraight?44:34):22;
      target.pushVelocityX+=Math.cos(player.bodyAngle)*lightKnockback;
      target.pushVelocityY+=Math.sin(player.bodyAngle)*lightKnockback;
    }
    if(isShove&&target.hp>0){
      const pushAngle=Math.atan2(target.y-player.y,target.x-player.x);
      target.pushVelocityX=Math.cos(pushAngle)*310;
      target.pushVelocityY=Math.sin(pushAngle)*310;
      target.hitFlash=.22;
      // 맞닿은 순간 플레이어 쪽에도 아주 짧은 반작용을 줘 접촉감을 만든다.
      moveMeleeSandboxPlayer(-Math.cos(pushAngle)*3.2,-Math.sin(pushAngle)*3.2);
    }
    if(target.hp>0&&isStraight&&meleeState.poweredStraight)target.hitFlash=.19;
  }
}

function updateMeleeState(dt,targetAngle){
  const meleeAimBase=updateMeleeAimMotion(targetAngle,dt,'fists',!!meleeState.attack);
  if(!meleeState.attack){
    meleeState.hookWindow=Math.max(0,meleeState.hookWindow-dt);
    meleeState.doubleJabWindow=Math.max(0,meleeState.doubleJabWindow-dt);
    if(meleeState.doubleJabWindow<=0)meleeState.jabChainCount=0;
  }

  let extensionTarget=0;
  let bodyTurnTarget=0;
  if(meleeState.attack==='jab'){
    extensionTarget=meleeJabPulse01(meleeAttackProgress());
    bodyTurnTarget=-.11*extensionTarget;
  }else if(meleeState.attack==='straight'){
    extensionTarget=meleePulse01(meleeAttackProgress());
    // 뒷손 스트레잇은 골반/상체까지 확실히 말아 넣는다.
    bodyTurnTarget=(meleeState.poweredStraight?-.96:-.72)*extensionTarget;
  }else if(meleeState.attack==='hook'){
    extensionTarget=meleeHookPulse01(meleeAttackProgress());
    // 스트레이트에서 풀린 몸통을 반대 방향으로 되감아 리드 훅을 건다.
    bodyTurnTarget=.72*extensionTarget;
  }else if(meleeState.attack==='shove'){
    extensionTarget=meleeShovePulse01(meleeAttackProgress());
    bodyTurnTarget=0;
  }

  const extensionSpring=springMeleeValue(
    meleeMotion.extension,meleeMotion.extensionVelocity,extensionTarget,
    meleeState.attack==='jab'
      ?(extensionTarget>meleeMotion.extension?1800:560)
      :meleeState.attack==='shove'
      ?(extensionTarget>meleeMotion.extension?1400:650)
      :(extensionTarget>meleeMotion.extension?760:440),
    meleeState.attack==='jab'
      ?(extensionTarget>meleeMotion.extension?42:24)
      :meleeState.attack==='shove'
      ?(extensionTarget>meleeMotion.extension?39:25)
      :(extensionTarget>meleeMotion.extension?30:23),
    dt
  );
  meleeMotion.extension=clamp(extensionSpring.value,-.06,1.06);
  meleeMotion.extensionVelocity=extensionSpring.velocity;

  const bodySpring=springMeleeValue(
    meleeMotion.bodyTurn,meleeMotion.bodyTurnVelocity,bodyTurnTarget,
    390,23,dt
  );
  meleeMotion.bodyTurn=bodySpring.value;
  meleeMotion.bodyTurnVelocity=bodySpring.velocity;

  const desiredBody=normAngle(meleeAimBase+meleeState.stanceTurn+meleeMotion.bodyTurn);
  player.bodyAngle=normAngle(
    player.bodyAngle+normAngle(desiredBody-player.bodyAngle)*Math.min(1,dt*30)
  );
  player.weaponAngle=meleeAimBase;

  if(meleeState.attack){
    meleeState.elapsed+=dt;
    tryMeleeHit();
    // 첫 잽이 회수로 넘어간 순간 같은 팔을 다시 장전해 더블 잽으로 연결한다.
    if(meleeState.attack==='jab'&&meleeState.queuedAttack==='jab'&&
      meleeAttackProgress()>=.64){
      beginQueuedJab();
      return;
    }
    // 더블 잽의 두 번째 타격은 완전 정지까지 기다리지 않고 회수 막바지에서 투를 장전한다.
    if(meleeState.attack==='jab'&&meleeState.jabChainCount>=2&&
      meleeState.queuedAttack==='straight'&&meleeAttackProgress()>=.92&&
      Math.abs(meleeMotion.extension)<=.14){
      beginQueuedStraight();
      return;
    }
    // 스트레이트의 임팩트가 지난 뒤에는 회수가 끝나길 기다리지 않고
    // 남은 회전/팔 속도를 그대로 리드 훅 진입에 사용한다.
    if(meleeState.attack==='straight'&&meleeState.comboStraight&&
      meleeState.queuedAttack==='hook'&&meleeAttackProgress()>=.52){
      beginQueuedHook();
      return;
    }
    if(meleeState.elapsed>=meleeState.duration){
      // 타임라인이 끝나도 팔이 실제 가드 위치까지 돌아오기 전에는 공격 종류를 바꾸지 않는다.
      // 잽 자세의 잔여 신전값이 스트레이트 자세로 순간 변환되던 초반 끊김을 막는다.
      const quickDoubleJabExit=meleeState.attack==='jab'&&
        meleeState.jabChainCount>=2&&meleeState.queuedAttack==='straight';
      if(Math.abs(meleeMotion.extension)>(quickDoubleJabExit?.14:.06)){
        meleeState.elapsed=meleeState.duration;
        return;
      }
      if(meleeState.attack==='jab'&&meleeState.queuedAttack==='straight'){
        beginQueuedStraight();
        return;
      }
      if(meleeState.attack==='straight'&&meleeState.poweredStraight&&
        meleeState.queuedAttack==='jab'){
        beginQueuedJab();
        return;
      }
      if(meleeState.attack==='straight'&&meleeState.comboStraight&&
        !meleeState.poweredStraight){
        meleeState.hookWindow=.18;
      }
      if(meleeState.attack==='jab'&&meleeState.jabChainCount>=2){
        meleeState.doubleJabWindow=.18;
      }
      meleeState.attack=null;
      meleeState.elapsed=0;
      meleeState.duration=0;
      meleeState.hitDone=false;
      meleeState.queuedAttack=null;
      meleeState.queuedAfterAttack=null;
      meleeState.comboStraight=false;
      meleeState.hookFromStraight=false;
      meleeState.hookEntryPulse=0;
      meleeState.poweredStraight=false;
    }
  }
}


function getMeleeFistWorldPos(which){
  const motionPulse=clamp(meleeMotion.extension,0,1);
  const jab=meleeState.attack==='jab';
  const straight=meleeState.attack==='straight';
  const hook=meleeState.attack==='hook';
  const shove=meleeState.attack==='shove';
  const hookProgress=hook?meleeAttackProgress():0;
  const pulse=hook?meleeHookPulse01(hookProgress):motionPulse;
  const hookBlend=hook&&meleeState.hookFromStraight
    ?smoothStep01(clamp(hookProgress/.28,0,1)):1;
  const hookEntry=meleeState.hookEntryPulse;

  let leadShoulder={x:2.5,y:-4.5};
  let rearShoulder={x:-1.0,y:4.7};

  if(jab){
    // 어깨 이동을 작게 제한해 전진량 대부분이 팔꿈치 신전에서 나오게 한다.
    leadShoulder={x:2.5+.6*pulse,y:-4.5-.1*pulse};
    rearShoulder={x:-1.0-.2*pulse,y:4.7+.1*pulse};
  }else if(straight){
    leadShoulder={x:2.5-3.5*pulse,y:-4.5-1.6*pulse};
    rearShoulder={x:-1.0+5.8*pulse,y:4.7-4.4*pulse};
  }else if(hook){
    const hookLeadShoulder={x:2.5+1.6*pulse,y:-4.5+2.8*pulse};
    const hookRearShoulder={x:-1.0+.6*pulse,y:4.7-.8*pulse};
    const entryLeadShoulder={x:2.5-3.5*hookEntry,y:-4.5-1.6*hookEntry};
    const entryRearShoulder={x:-1.0+5.8*hookEntry,y:4.7-4.4*hookEntry};
    leadShoulder=lerpPoint(entryLeadShoulder,hookLeadShoulder,hookBlend);
    rearShoulder=lerpPoint(entryRearShoulder,hookRearShoulder,hookBlend);
  }else if(shove){
    leadShoulder={x:2.5+2.0*pulse,y:-4.5+.5*pulse};
    rearShoulder={x:-1.0+5.5*pulse,y:4.7-.7*pulse};
  }

  const leadGuard={x:15.4,y:-3.2};
  const rearGuard={x:11.9,y:3.6};
  // 정점에서 어깨-손 거리가 상완+전완 길이와 거의 같아 팔꿈치가 확실히 펴진다.
  const jabHand={x:20.5,y:-2.6};
  // 투의 주먹 끝은 몸통이 돌아가도 조준선 위에 남는다.
  const straightCorrection=(straight||(hook&&meleeState.hookFromStraight))
    ?normAngle(player.angle-player.bodyAngle):0;
  const straightHand={
    x:Math.cos(straightCorrection)*22.0,
    y:Math.sin(straightCorrection)*22.0
  };
  const hookHand={x:17.2,y:.6};
  const shoveLeadHand={x:21.9,y:-2.4};
  const shoveRearHand={x:21.9,y:2.4};
  const leadCover={x:6.0,y:-5.2};
  const hookArc=hook?-4*Math.sin(pulse*Math.PI):0;

  let leadHand={
    x:leadGuard.x+(jabHand.x-leadGuard.x)*(jab?pulse:0)
      +(leadCover.x-leadGuard.x)*(straight?pulse*.45:0)
      +(hookHand.x-leadGuard.x)*(hook?pulse:0),
    y:leadGuard.y+(jabHand.y-leadGuard.y)*(jab?pulse:0)
      +(leadCover.y-leadGuard.y)*(straight?pulse*.45:0)
      +(hookHand.y-leadGuard.y)*(hook?pulse:0)
      +(shoveLeadHand.y-leadGuard.y)*(shove?pulse:0)
      +hookArc
  };
  leadHand.x+=(shoveLeadHand.x-leadGuard.x)*(shove?pulse:0);

  let rearHand={
    x:rearGuard.x+(straightHand.x-rearGuard.x)*(straight?pulse:0)
      +(shoveRearHand.x-rearGuard.x)*(shove?pulse:0),
    y:rearGuard.y+(straightHand.y-rearGuard.y)*(straight?pulse:0)
      +(shoveRearHand.y-rearGuard.y)*(shove?pulse:0)
  };

  if(hook&&meleeState.hookFromStraight){
    const entryLeadHand={
      x:leadGuard.x+(leadCover.x-leadGuard.x)*hookEntry*.45,
      y:leadGuard.y+(leadCover.y-leadGuard.y)*hookEntry*.45
    };
    const entryRearHand={
      x:rearGuard.x+(straightHand.x-rearGuard.x)*hookEntry,
      y:rearGuard.y+(straightHand.y-rearGuard.y)*hookEntry
    };
    leadHand=lerpPoint(entryLeadHand,leadHand,hookBlend);
    rearHand=lerpPoint(entryRearHand,rearHand,hookBlend);
  }

  const hand=which==='lead'?leadHand:rearHand;
  const a=player.bodyAngle;
  const ca=Math.cos(a), sa=Math.sin(a);
  return {
    x:player.x + hand.x*ca - hand.y*sa,
    y:player.y + hand.x*sa + hand.y*ca
  };
}

function pointSegmentDistanceSquared(px,py,ax,ay,bx,by){
  const abx=bx-ax,aby=by-ay;
  const lengthSquared=abx*abx+aby*aby;
  const t=lengthSquared>.0001?clamp(((px-ax)*abx+(py-ay)*aby)/lengthSquared,0,1):0;
  const dx=px-(ax+abx*t),dy=py-(ay+aby*t);
  return dx*dx+dy*dy;
}

function circleTouchesMeleeActorSprite(x,y,radius,actor){
  if(!actorCanReceiveHit(actor))return false;
  if(actor.hp<=0){
    const pose=deathMotionPose(actor);
    const dx=x-actor.x-pose.x,dy=(y-actor.y-pose.y)/pose.scale;
    const a=actor.deathMotion.body+pose.turn,c=Math.cos(a),s=Math.sin(a);
    const lx=dx*c+dy*s,ly=-dx*s+dy*c;
    return Math.pow(lx-clamp(lx,-9,15),2)+Math.pow(ly-clamp(ly,-11,11),2)<=radius*radius;
  }
  const dx=x-actor.x,dy=y-actor.y;
  const ca=Math.cos(actor.bodyAngle),sa=Math.sin(actor.bodyAngle);
  const localX=dx*ca+dy*sa;
  const localY=-dx*sa+dy*ca;

  // 몸통은 실제 렌더 크기(-6.5..6.5, -9..9)의 회전 사각형으로 검사한다.
  const torsoX=clamp(localX,-6.5,6.5);
  const torsoY=clamp(localY,-9,9);
  const torsoDX=localX-torsoX,torsoDY=localY-torsoY;
  if(torsoDX*torsoDX+torsoDY*torsoDY<=radius*radius)return true;

  // 머리와 양팔도 화면에 그려진 가드 자세 그대로 접촉 가능하다.
  const headRadius=6.2+radius;
  if(localX*localX+localY*localY<=headRadius*headRadius)return true;
  if(actor.armHitSegments?.length){
    return actor.armHitSegments.some(segment=>pointSegmentDistanceSquared(localX,localY,segment.a.x,segment.a.y,segment.b.x,segment.b.y)<=Math.pow(radius+segment.radius,2));
  }
  const leadShoulder={x:2.5,y:-4.5},rearShoulder={x:-1.0,y:4.7};
  const leadHand={x:15.4,y:-3.2},rearHand={x:11.9,y:3.6};
  const leadElbow=solveElbow(leadShoulder.x,leadShoulder.y,leadHand.x,leadHand.y,8.5,9,-1);
  const rearElbow=solveElbow(rearShoulder.x,rearShoulder.y,rearHand.x,rearHand.y,8.5,9,1);
  const limbRadius=2.5+radius;
  const limbRadiusSquared=limbRadius*limbRadius;
  return pointSegmentDistanceSquared(localX,localY,leadShoulder.x,leadShoulder.y,leadElbow.x,leadElbow.y)<=limbRadiusSquared||
    pointSegmentDistanceSquared(localX,localY,leadElbow.x,leadElbow.y,leadHand.x,leadHand.y)<=limbRadiusSquared||
    pointSegmentDistanceSquared(localX,localY,rearShoulder.x,rearShoulder.y,rearElbow.x,rearElbow.y)<=limbRadiusSquared||
    pointSegmentDistanceSquared(localX,localY,rearElbow.x,rearElbow.y,rearHand.x,rearHand.y)<=limbRadiusSquared;
}

function meleeFistHitsDummy(which,radius){
  const fist=getMeleeFistWorldPos(which);
  return firstTouchedMeleeDummy(fist.x,fist.y,radius);
}

function rayActorSpriteDistance(x,y,ux,uy,actor,fallbackRadius,maxDistance){
  if(actor!==player&&!meleeDummies.includes(actor))return rayCircleDistance(x,y,ux,uy,actor.x,actor.y,fallbackRadius,maxDistance);
  const projection=(actor.x-x)*ux+(actor.y-y)*uy;
  const start=Math.max(0,projection-42),end=Math.min(maxDistance,projection+42);
  for(let d=start;d<end;d+=.75){
    if(circleTouchesMeleeActorSprite(x+ux*d,y+uy*d,.45,actor))return d;
  }
  return maxDistance;
}

const MELEE_SOLDIER_PALETTE={
  armorOuter:'#101914',armorBase:'#26382e',armorMid:'#3f5748',
  armorPlate:'#19261f',armorHighlight:'#627767',armorStrap:'#18251e',
  armorSide:'#0d1511',armorPouch:'#17231c',armorPouchHi:'#4e6656'
};

function drawMeleeActor(actor,attack,pulse,outfit=null){
  const savedBloodActor=bloodSurfaceActor;
  bloodSurfaceActor=actor;
  const actorPickupPose=actor.simulationEnemy
    ?buildActorMagazinePickupPose(actor,actor.magazinePickup):null;
  const pickupLean=actorPickupPose?.bodyLean||0;
  const point=worldToScreen(
    actor.x+Math.cos(actor.bodyAngle)*pickupLean,
    actor.y+Math.sin(actor.bodyAngle)*pickupLean
  );
  const jab=attack==='jab';
  const straight=attack==='straight';
  const hook=attack==='hook';
  const shove=attack==='shove';
  const hookProgress=hook&&actor===player?meleeAttackProgress():0;
  if(hook&&actor===player)pulse=meleeHookPulse01(hookProgress);
  const hookBlend=hook&&actor===player&&meleeState.hookFromStraight
    ?smoothStep01(clamp(hookProgress/.28,0,1)):1;
  const hookEntry=actor===player?meleeState.hookEntryPulse:0;
  const sleeveColor=outfit&&outfit.sleeveColor||null;

  ctx.save();
  ctx.translate(Math.round(point.x),Math.round(point.y));

  // 그림자
  ctx.fillStyle='rgba(0,0,0,.28)';
  ctx.beginPath();ctx.ellipse(-1,8,13,7,0,0,Math.PI*2);ctx.fill();
  // 그림자는 월드 바닥에 고정하고, 여기서부터 몸과 팔만 회전시킨다.
  ctx.rotate(actor.bodyAngle);

  // 복싱 기본 자세:
  // +X가 정면. 앞어깨(왼쪽/-Y)를 앞으로 빼고, 뒷어깨(+Y)는 뒤로 뺀다.
  // 팔 길이는 drawRiggedArm의 상완 8.5 + 전완 9로 항상 고정된다.
  let leadShoulder={x:2.5,y:-4.5};
  let rearShoulder={x:-1.0,y:4.7};

  if(jab){
    leadShoulder={x:2.5+.6*pulse,y:-4.5-.1*pulse};
    rearShoulder={x:-1.0-.2*pulse,y:4.7+.1*pulse};
  }else if(straight){
    leadShoulder={x:2.5-3.5*pulse,y:-4.5-1.6*pulse};
    rearShoulder={x:-1.0+5.8*pulse,y:4.7-4.4*pulse};
  }else if(hook){
    const hookLeadShoulder={x:2.5+1.6*pulse,y:-4.5+2.8*pulse};
    const hookRearShoulder={x:-1.0+.6*pulse,y:4.7-.8*pulse};
    const entryLeadShoulder={x:2.5-3.5*hookEntry,y:-4.5-1.6*hookEntry};
    const entryRearShoulder={x:-1.0+5.8*hookEntry,y:4.7-4.4*hookEntry};
    leadShoulder=lerpPoint(entryLeadShoulder,hookLeadShoulder,hookBlend);
    rearShoulder=lerpPoint(entryRearShoulder,hookRearShoulder,hookBlend);
  }else if(shove){
    leadShoulder={x:2.5+2.0*pulse,y:-4.5+.5*pulse};
    rearShoulder={x:-1.0+5.5*pulse,y:4.7-.7*pulse};
  }

  const leadGuard={x:15.4,y:-3.2};
  const rearGuard={x:11.9,y:3.6};

  // 잽: 손을 "늘리는" 게 아니라 목표점까지 관절을 펴며 팔꿈치가 펴진다.
  const jabHand={x:20.5,y:-2.6};

  // 스트레이트: 뒷손 관절을 펴고, 앞손은 살짝 턱 쪽으로 회수한다.
  const straightCorrection=(straight||(hook&&actor===player&&meleeState.hookFromStraight))
    ?normAngle(actor.angle-actor.bodyAngle):0;
  const straightHand={
    x:Math.cos(straightCorrection)*22.0,
    y:Math.sin(straightCorrection)*22.0
  };
  const hookHand={x:17.2,y:.6};
  const shoveLeadHand={x:21.9,y:-2.4};
  const shoveRearHand={x:21.9,y:2.4};
  const leadCover={x:6.0,y:-5.2};
  const hookArc=hook?-4*Math.sin(pulse*Math.PI):0;

  let leadHand={
    x:leadGuard.x+(jabHand.x-leadGuard.x)*(jab?pulse:0)
      +(leadCover.x-leadGuard.x)*(straight?pulse*.45:0)
      +(hookHand.x-leadGuard.x)*(hook?pulse:0),
    y:leadGuard.y+(jabHand.y-leadGuard.y)*(jab?pulse:0)
      +(leadCover.y-leadGuard.y)*(straight?pulse*.45:0)
      +(hookHand.y-leadGuard.y)*(hook?pulse:0)
      +(shoveLeadHand.y-leadGuard.y)*(shove?pulse:0)
      +hookArc
  };
  leadHand.x+=(shoveLeadHand.x-leadGuard.x)*(shove?pulse:0);

  let rearHand={
    x:rearGuard.x+(straightHand.x-rearGuard.x)*(straight?pulse:0)
      +(shoveRearHand.x-rearGuard.x)*(shove?pulse:0),
    y:rearGuard.y+(straightHand.y-rearGuard.y)*(straight?pulse:0)
      +(shoveRearHand.y-rearGuard.y)*(shove?pulse:0)
  };

  if(hook&&actor===player&&meleeState.hookFromStraight){
    const entryLeadHand={
      x:leadGuard.x+(leadCover.x-leadGuard.x)*hookEntry*.45,
      y:leadGuard.y+(leadCover.y-leadGuard.y)*hookEntry*.45
    };
    const entryRearHand={
      x:rearGuard.x+(straightHand.x-rearGuard.x)*hookEntry,
      y:rearGuard.y+(straightHand.y-rearGuard.y)*hookEntry
    };
    leadHand=lerpPoint(entryLeadHand,leadHand,hookBlend);
    rearHand=lerpPoint(entryRearHand,rearHand,hookBlend);
  }

  if(actor.simulationEnemy&&(actor.armed||actor.magazinePickup?.active)&&actor.hp>0){
    const pistolPose=simulationEnemyPistolPose(actor);
    leadHand=pistolPose.supportHand;
    rearHand=pistolPose.primaryHand;
  }else if(actor.simulationEnemy&&actor.hp>0){
    const pull=stoppingFlinchPull(actor);
    leadHand={...leadHand,x:leadHand.x-pull};
    rearHand={...rearHand,x:rearHand.x-pull};
  }

  if(actor.hp<=0&&actor.deathMotion){
    const d=actor.deathMotion,f=d.forcedFall;
    const t=f?f.startProgress+(1-f.startProgress)*smoothStep01(clamp((lightingTime-f.started)/f.duration,0,1)):
      clamp((lightingTime-d.started)/d.duration,0,1);
    const fold=smoothStep01(t);
    const bleeding=actor.deathMotion.kind==='bleed';
    leadHand=lerpPoint(leadHand,bleeding?{x:1,y:-3}:{x:-6,y:-12},fold);
    rearHand=lerpPoint(rearHand,bleeding?{x:2,y:3}:{x:-8,y:11},fold);
  }
  // 뒤팔부터 그린다. 기존 총기 모션과 동일한 2관절 팔 솔버를 사용.
  // 뒷팔은 아래쪽으로 접히고, 앞팔은 위쪽으로 접혀 가드가 평평해 보이지 않는다.
  drawRiggedArm(
    rearShoulder.x,rearShoulder.y,
    rearHand.x,rearHand.y,
    1,sleeveColor
  );
  drawRiggedArm(
    leadShoulder.x,leadShoulder.y,
    leadHand.x,leadHand.y,
    -1,sleeveColor
  );

  const previousPalette=activePlayerSpritePalette;
  const previousArmor=player.armorEquipped;
  activePlayerSpritePalette=outfit&&outfit.palette||null;
  if(outfit)player.armorEquipped=true;
  drawPlayerTorso(false);
  player.armorEquipped=previousArmor;
  activePlayerSpritePalette=previousPalette;

  if(actor.hitFlash>0){
    ctx.fillStyle=`rgba(190,58,47,${Math.min(.42,actor.hitFlash*3)})`;
    ctx.fillRect(-8,-9,16,18);
  }
  ctx.restore();

  // 머리 역시 플레이어 스프라이트를 그대로 사용하되 회전 상태만 대상 배우 것으로 바꾼다.
  const previousBodyAngle=player.bodyAngle;
  const previousHeadAngle=player.headAngle;
  player.bodyAngle=actor.bodyAngle;
  player.headAngle=actor.headAngle;
  drawPlayerHead(point,0);
  player.bodyAngle=previousBodyAngle;
  player.headAngle=previousHeadAngle;

  // All actors use the supplied head, without the old helmet overlay.
  bloodSurfaceActor=savedBloodActor;
}

function drawKnifePlayer(){
  const point=worldToScreen(player.x,player.y);
  const pose=knifeMotionPose();
  const supportShoulder={x:2.5,y:-4.5};
  const primaryShoulder={x:-1,y:4.7};
  const reverse=smoothStep01(knifeState.gripBlend);
  const supportIdle=lerpPoint({x:11.8,y:-3.4},{x:6.4,y:-8.0},reverse);
  const supportGuard=lerpPoint({x:8.6,y:-1.9},{x:7.2,y:-5.7},reverse);
  let supportHand=lerpPoint(
    supportIdle,supportGuard,smoothStep01(knifeState.guardBlend)
  );
  // 칼을 꺼내고 넣을 때 보조 손도 몸통에서 자연스럽게 따라 나온다.
  supportHand=lerpPoint({x:3.8,y:-2.2},supportHand,smoothStep01(knifeState.drawBlend));
  if(knifeState.attack==='parry'){
    const p=knifeAttackProgress();
    const tuck=p<.20?smoothStep01(p/.20):p<.68?1:1-smoothStep01((p-.68)/.32);
    supportHand=lerpPoint(supportHand,{x:2.8,y:-2.5},tuck);
  }
  ctx.save();
  ctx.translate(Math.round(point.x),Math.round(point.y));
  ctx.fillStyle='rgba(0,0,0,.28)';
  ctx.beginPath();ctx.ellipse(-1,8,13,7,0,0,Math.PI*2);ctx.fill();
  ctx.rotate(player.bodyAngle+pose.bodyTurn);
  if(knifeState.attack==='parry'){
    const p=knifeAttackProgress();
    const normalElbow=solveElbow(
      primaryShoulder.x,primaryShoulder.y,pose.hand.x,pose.hand.y,8.5,9,1
    );
    // 횡베기의 절정에는 오른쪽 팔꿈치가 몸 옆선까지 따라 나온다.
    // 손만 멀리 움직이는 모양이 아니라 어깨-상완-전완 전체가 한 번에 휘둘러진다.
    const elbowDrive=p<.18?0:
      (p<.48?smoothStep01((p-.18)/.30):(p<.68?1:1-smoothStep01((p-.68)/.32)));
    const elbow=lerpPoint(normalElbow,{x:2.6,y:13.8},elbowDrive);
    const forearmDX=pose.hand.x-elbow.x;
    const forearmDY=pose.hand.y-elbow.y;
    const forearmLength=Math.max(.001,Math.hypot(forearmDX,forearmDY));
    const wrist={
      x:pose.hand.x-forearmDX/forearmLength*2.2,
      y:pose.hand.y-forearmDY/forearmLength*2.2
    };
    drawLimbSegment(primaryShoulder.x,primaryShoulder.y,elbow.x,elbow.y,5,'#a96f52');
    drawJointBlock(elbow.x,elbow.y,5,'#b97b59');
    drawLimbSegment(elbow.x,elbow.y,wrist.x,wrist.y,4,'#c18460');
    drawJointBlock(wrist.x,wrist.y,3,'#9f654b');
    drawLimbSegment(wrist.x,wrist.y,pose.hand.x,pose.hand.y,4,'#c18460');
    drawJointBlock(pose.hand.x,pose.hand.y,4,'#cf9069');
    drawHandBloodSurface(pose.hand.x,pose.hand.y,4.4);
  }else{
    drawRiggedArm(primaryShoulder.x,primaryShoulder.y,pose.hand.x,pose.hand.y,1);
  }
  drawRiggedArm(supportShoulder.x,supportShoulder.y,supportHand.x,supportHand.y,-1);
  drawPlayerTorso(false);
  // 짧은 드롭포인트 나이프. 손잡이 뒤와 칼날 끝을 분리해 방향이 즉시 읽히게 한다.
  ctx.save();
  ctx.translate(pose.hand.x,pose.hand.y);
  ctx.rotate(pose.angle);
  ctx.fillStyle='#171a1b';ctx.fillRect(-5,-1.7,7,3.4);
  ctx.fillStyle='#59605f';ctx.fillRect(-4.3,-1.05,5.6,.7);
  ctx.fillStyle='#9ca4a3';
  ctx.beginPath();
  ctx.moveTo(1.5,-1.45);ctx.lineTo(10.2,-1.2);ctx.lineTo(13.5,0);
  ctx.lineTo(9.4,1.45);ctx.lineTo(1.5,1.45);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#252a2b';ctx.lineWidth=.7;ctx.stroke();
  drawBloodSurface(knifeState,'blade',1.5,-1.45,11.8,2.9);
  ctx.fillStyle='#d0d5d3';ctx.fillRect(2.2,-.75,8,.55);
  ctx.fillStyle='#303536';ctx.fillRect(.5,-2.2,1.4,4.4);
  ctx.restore();
  if(reverse>.01){
    // 역수는 손바닥 안에서 손잡이를 감싸므로 손/손가락이 단검보다 앞 레이어에 온다.
    ctx.save();
    ctx.globalAlpha=reverse;
    ctx.translate(pose.hand.x,pose.hand.y);
    ctx.rotate(pose.angle);
    ctx.fillStyle='#cf9069';
    ctx.fillRect(-2.7,-2.15,5.2,4.3);
    ctx.fillStyle='#a96f52';
    ctx.fillRect(-1.7,-2.25,.8,4.5);
    ctx.fillRect(.15,-2.25,.7,4.5);
    ctx.fillStyle='#8e5945';
    ctx.fillRect(-2.5,-.35,4.7,.7);
    drawBloodSurface(player,'knifeGripHand',-2.7,-2.25,5.2,4.5);
    ctx.restore();
  }
  ctx.restore();
  drawPlayerHead(point,0);
}

function longswordSwingCurve(start,middle,end,p){
  // 중간 자세에서도 속도가 이어지는 Hermite 곡선. 손과 칼의 각도를 같은 시간축으로 묶는다.
  const tangent=(end-start)/.64*.85;
  const first=p<.42;
  const span=first?.42:.22;
  const t=clamp(first?p/.42:(p-.42)/.22,0,1);
  const a=first?start:middle,b=first?middle:end;
  const m0=first?0:tangent*span,m1=first?tangent*span:0;
  return (2*t*t*t-3*t*t+1)*a+(t*t*t-2*t*t+t)*m0+
    (-2*t*t*t+3*t*t)*b+(t*t*t-t*t)*m1;
}

function longswordIdlePose(applyWallDeflect=true){
  const bladeLength=longswordBladeLength();
  const draw=smoothStep01(longswordState.drawBlend);
  const charge=smoothStep01(longswordState.charge);
  const blocking=smoothStep01(longswordState.guardBlend);
  // 참고 구도의 왼쪽 자세: 자루는 몸 오른쪽, 칼날은 정확히 뒤쪽을 향한다.
  const idleGuard={x:4.0,y:8.5};
  const idleAngle=Math.PI-.04;
  const chargedGuard={x:4.0-charge*6.2,y:8.5+charge*1.5};
  // 몸 기준 양의 회전으로 칼을 더 감아 올린다.
  const chargedAngle=idleAngle+charge*.18;
  const tuckedPrimary={x:-1,y:6.5},tuckedSupport={x:2.5,y:-2.5};
  const idlePrimaryElbow={x:-1.0,y:12.0};
  const idleSupportElbow={x:11.0,y:.5};
  const chargedPrimaryElbow={x:-2.0,y:13.0};
  const chargedSupportElbow={x:10.0,y:1.0};
  // 양손을 전방으로 모으고 긴 칼날을 몸 앞을 가로질러 세운 방어 자세.
  const blockGuard={x:9.2,y:-1.2};
  const blockAngle=1.12;
  const blockPrimaryElbow={x:1.2,y:10.2};
  // 왼손은 같은 손 위치에서도 IK 해가 둘이다. 팔꿈치 기준점을 왼쪽 바깥에 두어
  // 가드 진입·유지·회수 모두 몸 오른쪽으로 접히는 잘못된 해를 고르지 않게 한다.
  const blockSupportElbow={x:-3.0,y:-12.0};
  const readyGuard=lerpPoint(chargedGuard,blockGuard,blocking);
  const readyAngle=knifeAngleLerp(chargedAngle,blockAngle,blocking);
  const readyPrimaryElbow=lerpPoint(
    lerpPoint(idlePrimaryElbow,chargedPrimaryElbow,charge),blockPrimaryElbow,blocking
  );
  const readySupportElbow=lerpPoint(
    lerpPoint(idleSupportElbow,chargedSupportElbow,charge),blockSupportElbow,blocking
  );
  let guard=lerpPoint({x:-3,y:8.5},readyGuard,draw);
  let swordAngle=knifeAngleLerp(1.42,readyAngle,draw);
  let primaryElbow=lerpPoint(
    tuckedPrimary,readyPrimaryElbow,draw
  );
  let supportElbow=lerpPoint(
    tuckedSupport,readySupportElbow,draw
  );
  const chargeTurn=.14*charge*draw;
  let bodyTurn=chargeTurn*(1-blocking)+.08*blocking*draw;
  if(longswordState.parry){
    const phase=clamp(longswordState.parryElapsed/longswordState.parryDuration,0,1);
    // 칼끝을 축처럼 거의 고정하고 자루와 칼몸을 크게 앞으로 밀어 쳐낸다.
    // 쳐내는 속도는 유지하고, 이후 구간 대부분을 회수에 써서 가드로 천천히 감속한다.
    // 90% 지점에는 각도와 양손 모두 정확히 기존 가드로 돌아온다.
    const drive=phase<.28
      ?smoothStep01(phase/.28)
      :(phase<.90?1-smoothStep01((phase-.28)/.62):0);
    const fixedTip={
      // 역방향으로 휘두를 때 손이 닿지 않는 곳까지 끌려가지 않도록
      // 칼끝 기준점도 짧게 함께 물리되, 칼몸 회전량보다 훨씬 작게 제한한다.
      x:blockGuard.x+Math.cos(blockAngle)*bladeLength-drive*16,
      y:blockGuard.y+Math.sin(blockAngle)*bladeLength+drive*4
    };
    swordAngle=blockAngle+drive*.72;
    guard={
      x:fixedTip.x-Math.cos(swordAngle)*bladeLength,
      y:fixedTip.y-Math.sin(swordAngle)*bladeLength
    };
    primaryElbow=lerpPoint(blockPrimaryElbow,{x:7.2,y:11.3},drive);
    supportElbow=lerpPoint(blockSupportElbow,{x:12.2,y:-8.0},drive);
    // 몸통 회전으로 고정점이 흘러가지 않도록 가드 때의 몸 각도를 유지한다.
    bodyTurn=.08;
  }
  if(longswordState.attack){
    const phase=longswordAttackPhase();
    // 베기는 전체의 38% 안에 끝낸다. 나머지는 칼 무게를 받으며 회수하는 시간이다.
    const p=phase<.38?phase/.38*.64:.64+(phase-.38)/.62*.36;
    const startGuard=chargedGuard;
    // 사용자 스케치의 세 프레임을 그대로 쓴다.
    // 좌상 아이들 -> 좌하 중간: 자루를 전방으로 끌어내며 칼이 몸 옆을 통과한다.
    const middleGuard={x:12.0+charge*.5,y:4.0};
    const middleAngle=.50+charge*.08;
    const middlePrimaryElbow={x:1.0,y:10.0};
    const middleSupportElbow={x:9.0,y:-3.0};
    // 좌하 중간 -> 우상 끝: 양손이 반대편으로 넘어가며 칼끝이 위/전방으로 빠진다.
    const endAngle=-.58-charge*.06;
    // 오른팔이 먼저 왼쪽 전방으로 뻗는다. 그 손에서 자루와 칼 위치를 역산한다.
    // 상완 9.2 + 전완 9.8 중 18.6~18.75를 써 팔꿈치에 약간의 굽힘만 남긴다.
    const finishReach=18.6+charge*.15;
    const finishDirection=-.99-charge*.025;
    const endPrimaryHand={
      x:-1+Math.cos(finishDirection)*finishReach,
      y:4.7+Math.sin(finishDirection)*finishReach
    };
    const endGuard={
      x:endPrimaryHand.x+Math.cos(endAngle)*3.2,
      y:endPrimaryHand.y+Math.sin(endAngle)*3.2
    };
    const endPrimaryElbow=lerpPoint({x:-1,y:4.7},endPrimaryHand,9.2/19);
    const endSupportElbow={x:5.2,y:-10.8};
    // 베기 방향으로 몸통도 왼쪽 회전한다. 칼의 월드 판정도 이 회전을 공유한다.
    const torsoFinish=-.40-charge*.12;
    bodyTurn=p<.64
      ?chargeTurn+(torsoFinish-chargeTurn)*smoothStep01(clamp((p-.10)/.54,0,1))
      :torsoFinish*(1-smoothStep01((p-.64)/.36));
    if(p<.64){
      const curvePoint=(a,b,c)=>({
        x:longswordSwingCurve(a.x,b.x,c.x,p),
        y:longswordSwingCurve(a.y,b.y,c.y,p)
      });
      guard=curvePoint(startGuard,middleGuard,endGuard);
      swordAngle=longswordSwingCurve(chargedAngle,middleAngle,endAngle,p);
      primaryElbow=curvePoint(
        lerpPoint(idlePrimaryElbow,chargedPrimaryElbow,charge),middlePrimaryElbow,endPrimaryElbow
      );
      supportElbow=curvePoint(
        lerpPoint(idleSupportElbow,chargedSupportElbow,charge),middleSupportElbow,endSupportElbow
      );
    }else{
      const settle=clamp((phase-.38)/.12,0,1);
      const t=smoothStep01(clamp((phase-.50)/.50,0,1));
      // 끝점에서 짧게 더 넘어갔다가 돌아온다. 복귀는 몸 앞 여유를 둔 호를 따른다.
      const follow=Math.sin(settle*Math.PI)*.065;
      swordAngle=endAngle+(idleAngle-endAngle)*t-follow;
      const idlePrimaryHand={
        x:idleGuard.x-Math.cos(idleAngle)*3.2,
        y:idleGuard.y-Math.sin(idleAngle)*3.2
      };
      const returningHand=lerpPoint(endPrimaryHand,idlePrimaryHand,t);
      returningHand.x+=Math.sin(t*Math.PI)*1.2;
      guard={
        x:returningHand.x+Math.cos(swordAngle)*3.2,
        y:returningHand.y+Math.sin(swordAngle)*3.2
      };
      primaryElbow=lerpPoint(endPrimaryElbow,idlePrimaryElbow,t);
      supportElbow=lerpPoint(endSupportElbow,idleSupportElbow,t);
      bodyTurn=torsoFinish*(1-t)-follow*.45;
    }
  }
  if(longswordState.attack&&longswordState.rebound){
    const from=longswordState.rebound;
    const t=clamp(longswordState.elapsed/longswordState.duration,0,1);
    // First bounce clear of the contact, then deliberately gather the weapon back.
    // The short impulse is separate from returning to idle; both meet at zero velocity.
    const bounceEnd=.09/longswordState.duration;
    const bounce=1-Math.pow(1-clamp(t/bounceEnd,0,1),3);
    const recovery=smoothStep01(clamp((t-bounceEnd)/(1-bounceEnd),0,1));
    const bouncedGuard={x:from.guard.x-1.6*bounce,y:from.guard.y+.7*bounce};
    const bouncedAngle=from.swordAngle+.26*bounce;
    swordAngle=bouncedAngle+(idleAngle-bouncedAngle)*recovery;
    guard=lerpPoint(bouncedGuard,idleGuard,recovery);
    primaryElbow=lerpPoint({x:from.primaryElbow.x-.6*bounce,y:from.primaryElbow.y+.4*bounce},idlePrimaryElbow,recovery);
    supportElbow=lerpPoint({x:from.supportElbow.x-.6*bounce,y:from.supportElbow.y+.4*bounce},idleSupportElbow,recovery);
    bodyTurn=(from.bodyTurn+.045*bounce)*(1-recovery);
  }
  // 벽에서는 손과 검을 한 리그로 돌린다. 칼 그림만 잘라내거나 공격만 취소하지 않는다.
  if(applyWallDeflect)swordAngle+=longswordState.wallAngleOffset||0;
  const dx=Math.cos(swordAngle),dy=Math.sin(swordAngle);
  const primaryHand={x:guard.x-dx*3.2,y:guard.y-dy*3.2};
  const supportHand={x:guard.x-dx*7.35,y:guard.y-dy*7.35};
  primaryElbow=fitLongswordElbow({x:-1,y:4.7},primaryHand,primaryElbow);
  supportElbow=fitLongswordElbow({x:2.5,y:-4.5},supportHand,supportElbow);
  return{
    guard,swordAngle,bodyTurn,primaryElbow,supportElbow,
    // 오른손은 가드 바로 아래, 왼손은 폼멜 쪽. 양손 순서를 뒤집지 않는다.
    primaryHand,supportHand
  };
}

function fitLongswordElbow(shoulder,hand,preferred){
  // 장검 전용 양손 리그: 각 손의 목표점과 참고 그림의 팔꿈치 방향을 함께 사용한다.
  // 두 해 중 목표 자세에 가까운 쪽을 고르므로 관절이 반대로 뒤집히지 않는다.
  const a=solveElbow(shoulder.x,shoulder.y,hand.x,hand.y,9.2,9.8,1);
  const b=solveElbow(shoulder.x,shoulder.y,hand.x,hand.y,9.2,9.8,-1);
  return Math.hypot(a.x-preferred.x,a.y-preferred.y)<=Math.hypot(b.x-preferred.x,b.y-preferred.y)?a:b;
}

function drawLongswordArm(shoulder,elbow,hand){
  const forearmDX=hand.x-elbow.x,forearmDY=hand.y-elbow.y;
  const forearmLength=Math.max(.001,Math.hypot(forearmDX,forearmDY));
  const wrist={
    x:hand.x-forearmDX/forearmLength*2.2,
    y:hand.y-forearmDY/forearmLength*2.2
  };
  drawLimbSegment(shoulder.x,shoulder.y,elbow.x,elbow.y,5,'#a96f52');
  drawJointBlock(elbow.x,elbow.y,5,'#b97b59');
  drawLimbSegment(elbow.x,elbow.y,wrist.x,wrist.y,4,'#c18460');
  drawJointBlock(wrist.x,wrist.y,3,'#9f654b');
  drawLimbSegment(wrist.x,wrist.y,hand.x,hand.y,4,'#c18460');
  drawJointBlock(hand.x,hand.y,4,'#cf9069');
}

function longswordWorldBlade(pose){
  const bladeLength=longswordBladeLength();
  const angle=player.bodyAngle+pose.bodyTurn;
  const ca=Math.cos(angle),sa=Math.sin(angle);
  const localTip={
    x:pose.guard.x+Math.cos(pose.swordAngle)*bladeLength,
    y:pose.guard.y+Math.sin(pose.swordAngle)*bladeLength
  };
  return{
    base:{x:player.x+pose.guard.x*ca-pose.guard.y*sa,y:player.y+pose.guard.x*sa+pose.guard.y*ca},
    tip:{x:player.x+localTip.x*ca-localTip.y*sa,y:player.y+localTip.x*sa+localTip.y*ca}
  };
}

const LONGSWORD_BLADE_HIT_RADIUS=2.15;
const LONGSWORD_BLADE_START=.025;

function stainLongswordCleaveSweep(target,blade,previous,angle){
  previous=previous||blade;
  const distance=Math.max(Math.hypot(blade.tip.x-previous.tip.x,blade.tip.y-previous.tip.y),
    Math.hypot(blade.base.x-previous.base.x,blade.base.y-previous.base.y));
  const steps=Math.min(10,Math.max(1,Math.ceil(distance/3)));
  for(let i=0;i<=steps;i++)stainLongswordCleaveContact(target,{
    base:lerpPoint(previous.base,blade.base,i/steps),tip:lerpPoint(previous.tip,blade.tip,i/steps)
  },angle);
}
function stainLongswordCleaveContact(target,contactBlade,travelAngle){
  if(!target||!contactBlade)return 0;
  const dx=contactBlade.tip.x-contactBlade.base.x,dy=contactBlade.tip.y-contactBlade.base.y;
  const length=Math.max(.001,Math.hypot(dx,dy));
  const steps=Math.max(1,Math.ceil(length/1.45));
  let stained=0,lastAlong=-1;
  for(let i=Math.ceil(steps*LONGSWORD_BLADE_START);i<=steps;i++){
    const along=i/steps;
    const x=contactBlade.base.x+dx*along,y=contactBlade.base.y+dy*along;
    if(!circleTouchesMeleeActorSprite(x,y,LONGSWORD_BLADE_HIT_RADIUS,target))continue;
    // 맞닿은 신체 표면을 띄엄띄엄 한 점으로 처리하지 않고 절단 경로 전체에 젖게 한다.
    if(along-lastAlong>=.045){
      markBloodAtHit(target,x,y,2.35,travelAngle,'#5a0d12');
      addSurfaceBloodMark(
        longswordState,'blade',clamp(along*longswordBladeLength(),1,longswordBladeLength()-.5),(Math.random()-.5)*1.15,
        1.8+Math.random()*.55,travelAngle,'#571015',true
      );
      lastAlong=along;stained++;
    }
  }
  return stained;
}

function tryLongswordParryHit(){
  if(!longswordState.parry)return;
  const p=clamp(longswordState.parryElapsed/longswordState.parryDuration,0,1);
  const blade=longswordWorldBlade(longswordIdlePose());
  const previous=longswordState.parryPreviousBlade;
  longswordState.parryPreviousBlade=blade;
  if(!previous||p<.06||p>.36)return;
  // 칼끝은 의도적으로 거의 멈춰 있으므로 자루가 쳐내는 이동 방향을 충격 방향으로 쓴다.
  const travelAngle=Math.atan2(blade.base.y-previous.base.y,blade.base.x-previous.base.x);
  for(const {target,point,along} of sweptBladeContacts(
    blade,previous,LONGSWORD_BLADE_HIT_RADIUS,LONGSWORD_BLADE_START
  )){
    if(longswordState.parryHitTargets.has(target))continue;
    longswordState.parryHitTargets.add(target);
    const damage=activeSwordDamageProfile().parry;
    damageMeleeDummy(damage,travelAngle,point.x,point.y,target.hp<=damage?34:17,'bladeSlash',target);
    stunParriedMeleeSource(target);
    addSurfaceBloodMark(
      longswordState,'blade',clamp(along*longswordBladeLength(),1.2,longswordBladeLength()-1),(Math.random()-.5)*1.4,
      1.75,0,'#5f0e13',target.hp<=0
    );
    if(target.hp>0){
      target.pushVelocityX+=Math.cos(player.bodyAngle)*95;
      target.pushVelocityY+=Math.sin(player.bodyAngle)*95;
    }
  }
}

function longswordAttackPhase(){
  const s=longswordState;
  if(s.rebound||!s.swingDuration)return clamp(s.elapsed/s.duration,0,1);
  return s.elapsed<s.swingDuration?s.elapsed/s.swingDuration*.38:
    .38+clamp((s.elapsed-s.swingDuration)/s.recoveryDuration,0,1)*.62;
}
function swordSweepHitsHead(target,blade,previous){
  previous=previous||blade;
  const motion=Math.max(Math.hypot(blade.base.x-previous.base.x,blade.base.y-previous.base.y),
    Math.hypot(blade.tip.x-previous.tip.x,blade.tip.y-previous.tip.y));
  const steps=Math.max(1,Math.ceil(motion/1.5));
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const bx=previous.base.x+(blade.base.x-previous.base.x)*t;
    const by=previous.base.y+(blade.base.y-previous.base.y)*t;
    const tx=previous.tip.x+(blade.tip.x-previous.tip.x)*t;
    const ty=previous.tip.y+(blade.tip.y-previous.tip.y)*t;
    const dx=tx-bx,dy=ty-by,len=Math.hypot(dx,dy);
    if(len<.001)continue;
    const start=LONGSWORD_BLADE_START;
    if(aimedHeadRayDistance(bx+dx*start,by+dy*start,dx/len,dy/len,target)<=len*(1-start))return true;
  }
  return false;
}
function tryLongswordHit(){
  if(!longswordState.attack||longswordState.hitDone)return;
  const p=longswordAttackPhase();
  const pose=longswordIdlePose();
  const blade=longswordWorldBlade(pose);
  const previous=longswordState.previousTip;
  const previousBlade=longswordState.previousBlade;
  longswordState.previousBlade=blade;
  longswordState.previousTip={x:blade.tip.x,y:blade.tip.y};
  if(p<.055)return;
  const finishing=p>.40;
  if(!longswordState.hitTargets)longswordState.hitTargets=new Set();
  const contacts=finishing?[]:sweptBladeContacts(
    blade,previousBlade,LONGSWORD_BLADE_HIT_RADIUS,LONGSWORD_BLADE_START
  );
  const pending=longswordState.pendingHeadContact;
  if(pending&&!contacts.some(c=>c.target===pending.target))contacts.unshift(pending);
  for(const contact of contacts){
  const {target,point,along,contactBlade}=contact;
  if(target.hp<=0){
    collapseDyingActor(target,player.bodyAngle,activeSwordDamageProfile().slash,point.x,point.y,'bladeHeavy');
    continue;
  }
  if(longswordState.hitTargets.has(target))continue;
  const aimed=longswordState.headTarget===target;
  const headshot=aimed&&!finishing&&swordSweepHitsHead(target,blade,previousBlade);
  // The aimed actor's arms/torso cannot prematurely stop a head-directed cut.
  // Keep the first body contact as a fallback, and commit only once.
  if(aimed&&!headshot&&!finishing){
    if(!longswordState.pendingHeadContact)longswordState.pendingHeadContact=contact;
    continue;
  }
  if(aimed)longswordState.pendingHeadContact=null;
  longswordState.hitTargets.add(target);
  const travelAngle=previous
    ?Math.atan2(blade.tip.y-previous.y,blade.tip.x-previous.x)
    :player.bodyAngle;
  const charge=smoothStep01(longswordState.charge);
  const damageProfile=activeSwordDamageProfile();
  const damage=Math.round(
    (damageProfile.slash+(damageProfile.charged-damageProfile.slash)*charge)*(headshot?2:1)
  );
  const lethal=target.hp<=damage;
  if(lethal)stainLongswordCleaveContact(target,contactBlade||blade,travelAngle);
  damageMeleeDummy(
    damage,travelAngle,point.x,point.y,lethal?60:28+charge*24,'bladeHeavy',target,null,headshot
  );
  addSurfaceBloodMark(
    longswordState,'blade',clamp(along*longswordBladeLength(),1.2,longswordBladeLength()-1),(Math.random()-.5)*1.5,
    2.0+charge*.75,0,'#5f0e13',target.hp<=0
  );
  if(target.hp<=0){
    stainLongswordCleaveSweep(target,blade,previousBlade,travelAngle);
    if(!headshot)target.swordSplit={
      angle:travelAngle,
      contactPoint:{x:point.x,y:point.y},
      stains:Array.from({length:9},(_,index)=>({
        offset:-8+index*2+(Math.random()-.5)*1.3,
        depth:.5+Math.random()*2.4,
        radius:1.25+Math.random()*1.55,
        color:Math.random()<.32?'#8d171c':'#551015'
      }))
    };
    continue;
  }
  if(target.hp>0){
    const force=32+charge*24;
    target.pushVelocityX+=Math.cos(travelAngle)*force;
    target.pushVelocityY+=Math.sin(travelAngle)*force;
  }
  // Only the outermost 18% can cut through a surviving target.
  if(along<.82){
    longswordState.rebound=pose;
    longswordState.elapsed=0;
    longswordState.duration=.32;
    longswordState.hitDone=true;
    return;
  }
  }
  if(finishing)longswordState.hitDone=true;
}

function drawLongswordPlayer(){
  const bladeLength=longswordBladeLength();
  const point=worldToScreen(player.x,player.y);
  const{
    guard,swordAngle,bodyTurn,supportHand,primaryHand,supportElbow,primaryElbow
  }=longswordIdlePose();
  const supportShoulder={x:2.5,y:-4.5};
  const primaryShoulder={x:-1,y:4.7};

  ctx.save();
  ctx.translate(Math.round(point.x),Math.round(point.y));
  ctx.fillStyle='rgba(0,0,0,.30)';
  ctx.beginPath();ctx.ellipse(-2,8,15,7,0,0,Math.PI*2);ctx.fill();
  ctx.rotate(player.bodyAngle+bodyTurn);

  // 뒤로 향한 긴 칼날은 몸 아래 레이어에 두고, 자루와 손은 위에 다시 얹는다.
  ctx.save();ctx.translate(guard.x,guard.y);ctx.rotate(swordAngle);
  ctx.fillStyle='#7e8889';
  const shoulder=bladeLength-7;
  ctx.beginPath();ctx.moveTo(0,-2.2);ctx.lineTo(shoulder,-1.75);ctx.lineTo(bladeLength,0);
  ctx.lineTo(shoulder,1.75);ctx.lineTo(0,2.2);ctx.closePath();ctx.fill();
  ctx.fillStyle='#b8c1c0';ctx.fillRect(1,-1.3,Math.max(1,bladeLength-8),.75);
  ctx.strokeStyle='#252a2b';ctx.lineWidth=.75;ctx.stroke();
  drawBloodSurface(longswordState,'blade',1,-1.8,bladeLength-1.5,3.6);
  ctx.restore();

  // 몸통을 먼저 그리고 양팔을 항상 그 위에 둔다. 팔이 몸통과 겹치는 프레임에서도
  // 소매/전완 스프라이트가 통째로 가려져 사라지는 현상을 막는다.
  drawPlayerTorso(false);
  drawLongswordArm(supportShoulder,supportElbow,supportHand);
  drawLongswordArm(primaryShoulder,primaryElbow,primaryHand);

  ctx.save();ctx.translate(guard.x,guard.y);ctx.rotate(swordAngle);
  ctx.fillStyle='#8b7648';ctx.fillRect(-1,-6,2,12);
  ctx.fillStyle='#171a1b';ctx.fillRect(-10,-1.8,10,3.6);
  ctx.fillStyle='#5e4a2e';ctx.fillRect(-9,-1.05,8,.65);
  ctx.fillStyle='#8b7648';ctx.beginPath();ctx.arc(-11,0,2.2,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // 두 손이 실제로 자루를 덮어 잡은 레이어.
  let handIndex=0;
  for(const hand of [supportHand,primaryHand]){
    ctx.save();ctx.translate(hand.x,hand.y);ctx.rotate(swordAngle);
    ctx.fillStyle='#cf9069';ctx.fillRect(-2.1,-2.1,4.2,4.2);
    ctx.fillStyle='#9f654b';ctx.fillRect(-1.7,-1.8,.7,3.6);
    drawBloodSurface(player,'longswordHand'+handIndex++,-2.1,-2.1,4.2,4.2);
    ctx.restore();
  }
  ctx.restore();
  drawPlayerHead(point,0);
}

const consumption={active:false,item:null,elapsed:0,applied:false,tossed:false};
const lowHealthFeedback={darkness:0,fadePhase:0,beatTimer:0,source:null,buffer:null,layer:null,resumePending:false,audioGeneration:0};
function lowHealthFadeStrength(darkness,phase){
  // A slow eyelid-like fade, not a flash: one soft dip every 2.8–4.8 seconds.
  const wave=.5-.5*Math.cos(phase);
  return darkness*(.08+.92*Math.pow(wave,3));
}
function stopHeartbeat(){
  lowHealthFeedback.audioGeneration++;
  if(lowHealthFeedback.source){try{lowHealthFeedback.source.stop();}catch{}}
  lowHealthFeedback.source=null;lowHealthFeedback.beatTimer=0;
}
function playHeartbeat(severity){
  if(!gunAudioContext||!masterGainNode)return;
  if(gunAudioContext.state!=='running'){
    if(!lowHealthFeedback.resumePending){
      lowHealthFeedback.resumePending=true;
      const generation=lowHealthFeedback.audioGeneration;
      gunAudioContext.resume().then(()=>{
        lowHealthFeedback.resumePending=false;
        if(generation===lowHealthFeedback.audioGeneration&&gunAudioContext.state==='running'&&
          gameStarted&&!gamePaused&&player.hp>0&&player.hp/player.maxHp<=.50){
          playHeartbeat(1-player.hp/player.maxHp/.50);
        }
      }).catch(()=>{lowHealthFeedback.resumePending=false;});
    }
    return;
  }
  if(lowHealthFeedback.source)return;
  if(!lowHealthFeedback.buffer){
    const rate=gunAudioContext.sampleRate,buffer=gunAudioContext.createBuffer(1,Math.ceil(rate*.34),rate);
    const data=buffer.getChannelData(0);
    for(let i=0;i<data.length;i++){
      const t=i/rate;
      let value=0;
      for(const [start,volume,freq] of [[0,1,82],[.15,.72,68]]){
        const a=t-start;
        if(a>=0&&a<.16){
          const phase=2*Math.PI*(freq*a-35*a*a);
          value+=(Math.sin(phase)+.48*Math.sin(phase*2)+.24*Math.sin(phase*3))*Math.min(1,a/.006)*Math.exp(-a*26)*volume;
        }
      }

function updateLowHealthFeedback(dt){
  player.screenHitTint=Math.max(0,(player.screenHitTint||0)-dt);
  if(!gameStarted||player.hp<=0){lowHealthFeedback.darkness=0;lowHealthFeedback.fadePhase=0;stopHeartbeat();return;}
  if(gamePaused){stopHeartbeat();return;}
  const ratio=clamp(player.hp/Math.max(1,player.maxHp),0,1);
  const target=Math.pow(1-ratio,1.35);
  lowHealthFeedback.darkness+=(target-lowHealthFeedback.darkness)*(1-Math.exp(-dt*5));
  if(lowHealthFeedback.darkness>.001){
    lowHealthFeedback.fadePhase=(lowHealthFeedback.fadePhase+dt*Math.PI*2/(4.8-2*(1-ratio)))%(Math.PI*2);
  }else lowHealthFeedback.fadePhase=0;
  if(ratio>.50){stopHeartbeat();return;}
  const severity=1-ratio/.50;
  lowHealthFeedback.beatTimer-=dt;
  if(lowHealthFeedback.beatTimer<=0){
    playHeartbeat(severity);
    lowHealthFeedback.beatTimer=.86-.28*severity;
  }
}
function drawPlayerHitTint(){

}
function lowHealthRedOpacity(healthRatio){
  return .22*Math.pow(1-clamp(healthRatio,0,1),1.6);
}
function drawLowHealthFeedback(){
  if(!gameStarted||player.hp<=0||lowHealthFeedback.darkness<.001)return;
  let layer=lowHealthFeedback.layer;
  if(!layer||layer.width!==W||layer.height!==H){
    layer=document.createElement('canvas');layer.width=W;layer.height=H;
    const c=layer.getContext('2d');
    const gradient=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.12,W/2,H/2,Math.hypot(W,H)*.53);
    gradient.addColorStop(0,'rgba(0,0,0,0)');
    gradient.addColorStop(.55,'rgba(0,0,0,.18)');
    gradient.addColorStop(1,'rgba(0,0,0,.58)');
    c.fillStyle=gradient;c.fillRect(0,0,W,H);lowHealthFeedback.layer=layer;
  }
  ctx.save();ctx.setTransform(RENDER_SCALE,0,0,RENDER_SCALE,0,0);
  ctx.globalCompositeOperation='source-over';
  // Composited after the HUD: the whole view loses and regains clarity together.
  const fade=lowHealthFadeStrength(lowHealthFeedback.darkness,lowHealthFeedback.fadePhase);
  const critical=player.hp/player.maxHp<.25;
  // Health-based tint is continuous; the black fade is composited on top of it.
  ctx.globalAlpha=lowHealthRedOpacity(player.hp/player.maxHp);
  ctx.fillStyle='#922b2b';ctx.fillRect(0,0,W,H);
  if(critical){
    ctx.globalAlpha=.08;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  }
  const blackout=critical?smoothStep01(clamp((.5-.5*Math.cos(lowHealthFeedback.fadePhase)-.65)/.28,0,1)):0;
  ctx.globalAlpha=Math.max(fade*.56,blackout);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

  ctx.drawImage(layer,0,0);ctx.restore();
}

function updatePlayerResources(dt){
  if(player.hp<=0)return;
  player.energy=clamp(player.energy??100,0,100);
  player.adrenaline=clamp(player.adrenaline||0,0,100);
  player.lastDamageAge=(player.lastDamageAge??99)+dt;
  player.bleedTime=Math.max(0,(player.bleedTime||0)-dt);
  if(player.hp/player.maxHp<.10){
    // Critical health overrides peaceful decay, independently of hits or bleeding.
    player.adrenaline=Math.min(100,player.adrenaline+dt*25);
  }else if(player.lastDamageAge<6||player.bleedTime>0){
    if(player.hp<player.maxHp)player.adrenaline=Math.min(100,player.adrenaline+dt*(2+14*(1-player.hp/player.maxHp)));
  }else player.adrenaline=Math.max(0,player.adrenaline-dt*4);
  const a=player.adrenaline/100;
  const cost=.08+.05*a;
  const healed=Math.max(0,Math.min(player.maxHp-player.hp,(10+35*a)*dt,player.energy/cost));
  player.hp+=healed;player.energy=Math.max(0,player.energy-healed*cost);
}

function bakeCupFragments(x,y){
  // Reuse the static debris chunks, but never count ceramic fragments as ammunition.
  for(let i=0;i<7;i++){
    const angle=Math.random()*Math.PI*2,d=3+Math.random()*10;
    const wx=x+Math.cos(angle)*d,wy=y+Math.sin(angle)*d;
    const cx=Math.floor(wx/GROUND_BLOOD_CHUNK_SIZE),cy=Math.floor(wy/GROUND_BLOOD_CHUNK_SIZE);
    const chunk=groundCasingChunk(cx,cy,true),c=chunk.context;
    c.save();c.translate(wx-cx*GROUND_BLOOD_CHUNK_SIZE,wy-cy*GROUND_BLOOD_CHUNK_SIZE);c.rotate(angle);
    c.fillStyle=i%2?'#a5afab':'#d8d9cc';c.beginPath();c.moveTo(-2,-1);c.lineTo(2,0);c.lineTo(0,2);c.closePath();c.fill();c.restore();chunk.marks++;
  }
  playMeleeImpactSound('wall',12,x,y);
  emitSoundEvent(x,y,100,'noise',player);
}
function updateConsumption(dt){
  for(let i=thrownCups.length-1;i>=0;i--){
    const cup=thrownCups[i];cup.age+=dt;
    const p=clamp(cup.age/.42,0,1);
    cup.x=cup.sx+Math.cos(cup.angle)*cup.distance*p;cup.y=cup.sy+Math.sin(cup.angle)*cup.distance*p;
    if(p>=1){bakeCupFragments(cup.x,cup.y);thrownCups.splice(i,1);}
  }
  if(!consumption.active)return;
  if(player.hp<=0){consumption.active=false;return;}
  mouse.down=false;mouse.aim=false;
  consumption.elapsed+=dt;
  const t=consumption.elapsed,item=consumption.item;
  if(t>=1.35&&!consumption.applied){
    consumption.applied=true;item.used=true;
    if(item.kind==='coffee')player.adrenaline=Math.min(100,player.adrenaline+30);
    else player.energy=Math.min(100,player.energy+35);
  }
  if(t>=1.65&&item.kind==='coffee'&&!consumption.tossed){
    consumption.tossed=true;
    const angle=player.bodyAngle+.9;
    const hand=consumptionHandPose(t);
    const ca=Math.cos(player.bodyAngle),sa=Math.sin(player.bodyAngle);
    const sx=player.x+ca*hand.x-sa*hand.y,sy=player.y+sa*hand.x+ca*hand.y;
    const distance=Math.max(0,castObstacleRay(sx,sy,angle,24)-2);
    thrownCups.push({sx,sy,x:sx,y:sy,age:0,angle,distance});
  }
  if(t>=2.1){consumption.active=false;consumption.item=null;}
}

function updateTestBath(dt){
  testBath.ripple+=dt*(testBath.inside?4.8:1.15);
  testBath.washFlash=Math.max(0,testBath.washFlash-dt);
  const inside=playerInsideTestBath();
  if(inside){

    const hadBlood=surfaceBlood.has(player);
    surfaceBlood.delete(player);surfaceBloodLayers.delete(player);
    if(hadBlood)testBath.washFlash=.28;
  }
  testBath.inside=inside;
}

function circleTouchesTestRoomWall(x,y,r){
  return MELEE_SANDBOX_COLLIDERS.some(wall=>circleRectOverlap(x,y,r,wall));
}

function resolveTestRoomCircleMove(body,targetX,targetY,r){
  let x=targetX,y=targetY;
  if(circleTouchesTestRoomWall(x,body.y,r))x=body.x;
  if(circleTouchesTestRoomWall(x,y,r))y=body.y;
  return{x,y};
}

const SIM_BODY_SPACING=26;
const simulationBodyGrid=new Map();
let simulationBodyGridActive=false;
function indexSimulationBody(actor){
  const key=Math.floor(actor.x/80)+','+Math.floor(actor.y/80);
  if(actor._bodyGridKey===key&&simulationBodyGrid.get(key)?.has(actor))return;
  simulationBodyGrid.get(actor._bodyGridKey)?.delete(actor);
  let bucket=simulationBodyGrid.get(key);
  if(!bucket){bucket=new Set();simulationBodyGrid.set(key,bucket);}
  bucket.add(actor);actor._bodyGridKey=key;
}
function rebuildSimulationBodyGrid(){
  for(const bucket of simulationBodyGrid.values())bucket.clear();
  for(const actor of simulationEnemies)if(actor.hp>0)indexSimulationBody(actor);
  for(const [key,bucket] of simulationBodyGrid)if(!bucket.size)simulationBodyGrid.delete(key);
}
function nearbySimulationBodies(actor,radius=80){
  const result=actor._nearbyBodies||(actor._nearbyBodies=[]);result.length=0;
  for(let cy=Math.floor((actor.y-radius)/80);cy<=Math.floor((actor.y+radius)/80);cy++){
    for(let cx=Math.floor((actor.x-radius)/80);cx<=Math.floor((actor.x+radius)/80);cx++){
      const bucket=simulationBodyGrid.get(cx+','+cy);if(!bucket)continue;
      for(const other of bucket)if(other!==actor&&other.hp>0)result.push(other);
    }
  }
  return result;
}
function separateSimulationBodies(){
  rebuildSimulationBodyGrid();
  for(let i=0;i<simulationEnemies.length;i++)simulationEnemies[i]._bodyOrder=i;
  // Recover pre-existing overlaps, including coincident spawn/push positions.
  // Bounded passes: at the 24-actor cap this is at most 1104 pair checks.
  let changed=false;
  for(let pass=0;pass<4;pass++){
    let overlap=false;
    for(let i=0;i<simulationEnemies.length;i++){
      const a=simulationEnemies[i];if(a.hp<=0)continue;
      for(const b of nearbySimulationBodies(a,30)){
        const j=b._bodyOrder;if(j<=i)continue;
        if(Math.abs(b.x-a.x)>=SIM_BODY_SPACING||Math.abs(b.y-a.y)>=SIM_BODY_SPACING)continue;
        const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
        if(d>=SIM_BODY_SPACING-.001)continue;
        const angle=(i*13+j*7)*2.3999632297;
        const ux=d>.001?dx/d:Math.cos(angle),uy=d>.001?dy/d:Math.sin(angle);
        const correction=(SIM_BODY_SPACING-d)*.5+.001;
        for(const [actor,sign] of [[a,-1],[b,1]]){
          const p=resolveTestRoomCircleMove(actor,
            clamp(actor.x+ux*correction*sign,9,WORLD_W-9),
            clamp(actor.y+uy*correction*sign,9,WORLD_H-9),9);
          actor.x=p.x;actor.y=p.y;indexSimulationBody(actor);
        }
        // Preserve staggered perception timers during crowd contact.
        overlap=true;changed=true;
      }
    }
    if(!overlap)break;
  }
  if(changed)rebuildCombatSpatialHash();
}
function moveSandboxDummy(dummy,dx,dy){
  if(dummy.simulationEnemy&&dummy.hp>0){
    if(!simulationBodyGridActive)rebuildSimulationBodyGrid();
    // Short swept steps stop fast knockback from tunnelling through a teammate.
    const steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/5));
    for(let step=0;step<steps;step++){
      let x=dummy.x+dx/steps,y=dummy.y+dy/steps;
      const neighbors=nearbySimulationBodies(dummy,36);
      for(const other of neighbors){
        if(other===dummy||other.hp<=0)continue;
        const ox=x-other.x,oy=y-other.y,d=Math.hypot(ox,oy);
        if(d>=SIM_BODY_SPACING)continue;
        const oldDistance=Math.hypot(dummy.x-other.x,dummy.y-other.y);
        const needed=Math.min(SIM_BODY_SPACING,oldDistance);
        if(d>=needed||d<.001){if(d<.001){x=dummy.x;y=dummy.y;}continue;}
        x=other.x+ox/d*needed;y=other.y+oy/d*needed;
      }
      const p=resolveTestRoomCircleMove(dummy,clamp(x,9,WORLD_W-9),clamp(y,9,WORLD_H-9),9);
      const blocked=neighbors.some(other=>other!==dummy&&other.hp>0&&
        Math.hypot(p.x-other.x,p.y-other.y)<
          Math.min(SIM_BODY_SPACING,Math.hypot(dummy.x-other.x,dummy.y-other.y))-.001);
      if(!blocked){dummy.x=p.x;dummy.y=p.y;indexSimulationBody(dummy);}
    }
    return;
  }
  const r=Math.min(9,dummy.r||9);
  const resolved=resolveTestRoomCircleMove(
    dummy,
    clamp(dummy.x+dx,r,WORLD_W-r),
    clamp(dummy.y+dy,r,WORLD_H-r),
    r
  );
  dummy.x=resolved.x;dummy.y=resolved.y;
}
