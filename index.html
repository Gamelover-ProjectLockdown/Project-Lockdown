function pushDummyFromHeldWeapon(target,angle,force){
  if(!target||target.hp<=0)return;
  const ux=Math.cos(angle),uy=Math.sin(angle);
  const currentAlong=(target.pushVelocityX||0)*ux+(target.pushVelocityY||0)*uy;
  const added=Math.max(0,force-currentAlong);
  target.pushVelocityX+=ux*added;
  target.pushVelocityY+=uy*added;
  target.hitFlash=Math.max(target.hitFlash||0,.08);
}

function naturalWeaponPush(target,contactPoint,velocityX,velocityY,radius,baseForce){
  const toTargetX=target.x-contactPoint.x,toTargetY=target.y-contactPoint.y;
  const distance=Math.max(.001,Math.hypot(toTargetX,toTargetY));
  const normalX=toTargetX/distance,normalY=toTargetY/distance;
  const speed=Math.hypot(velocityX,velocityY);
  const velocityDirX=speed>.001?velocityX/speed:normalX;
  const velocityDirY=speed>.001?velocityY/speed:normalY;
  let pushX=normalX*.72+velocityDirX*.28;
  let pushY=normalY*.72+velocityDirY*.28;
  const pushLength=Math.max(.001,Math.hypot(pushX,pushY));
  pushX/=pushLength;pushY/=pushLength;
  const penetration=Math.max(0,radius+9.5-distance);
  // 작은 속도만 더하던 옛 처리는 다음 프레임까지 무기와 배우를 포갠 채 남겼다.
  // 실제 스프라이트 접촉이 풀릴 때까지 짧은 간격으로 위치를 해소한다.
  let blocked=false;
  for(let i=0;i<32&&circleTouchesMeleeActorSprite(contactPoint.x,contactPoint.y,radius,target);i++){
    const beforeX=target.x,beforeY=target.y;
    moveSandboxDummy(target,pushX*.85,pushY*.85);
    if(Math.hypot(target.x-beforeX,target.y-beforeY)<.08){blocked=true;break;}
  }
  // 벽에 몰린 적을 무기 안에 억지로 밀어 넣지 않는다. 그때는 플레이어 쪽이 반작용으로 물러난다.
  if(blocked&&circleTouchesMeleeActorSprite(contactPoint.x,contactPoint.y,radius,target)){
    moveMeleeSandboxPlayer(-pushX*Math.max(1.2,penetration*.55),-pushY*Math.max(1.2,penetration*.55));
  }
  pushDummyFromHeldWeapon(
    target,Math.atan2(pushY,pushX),
    clamp(baseForce+speed*.22+penetration*7,baseForce,145)
  );
}

function shoveFoldedGunContact(){
  if(meleeState.active||heldWeaponContact.pushCooldown>0||
    (player.weaponContactTurn||0)<.38)return false;
  let target=heldWeaponContact.actorTarget;
  if(target&&(target.hp<=0||Math.hypot(target.x-player.x,target.y-player.y)>62))target=null;
  for(const sample of heldWeaponContact.lastGunSamples||[]){
    if(target)break;
    target=firstTouchedMeleeDummy(sample.x,sample.y,5.5);
    if(target)break;
  }
  if(!target)return false;
  // 접어 둔 총을 실제로 앞으로 내미는 전용 근접 동작을 시작한다.
  heldWeaponContact.shoveActive=true;
  heldWeaponContact.shoveElapsed=0;
  heldWeaponContact.shoveDuration=.34;
  heldWeaponContact.shoveHitDone=false;
  heldWeaponContact.shoveTarget=target;
  heldWeaponContact.shoveLastPulse=0;
  heldWeaponContact.pushCooldown=.42;
  mouse.down=false;
  mouse.aim=false;
  return true;
}

function heldGunShovePulse(){
  if(!heldWeaponContact.shoveActive)return 0;
  const p=clamp(heldWeaponContact.shoveElapsed/heldWeaponContact.shoveDuration,0,1);
  return p<.38?smoothStep01(p/.38):1-smoothStep01((p-.38)/.62);
}

function firearmCollisionProfile(def){
  switch(def.id){
    case'pistol':return{rear:-8.5,front:def.muzzleX,width:3.5};
    case'revolver':return{rear:-7.5,front:def.muzzleX,width:4.1};
    case'plasmaPistol':return{rear:-10.5,front:def.muzzleX,width:5.1};
    case'smg':return{rear:-11.5,front:def.muzzleX,width:4.4};
    case'battleRifle':return{rear:-15,front:def.muzzleX,width:4.6};
    case'assaultRifle':return{rear:-14,front:def.muzzleX,width:4.4};
    case'lmg':return{rear:-16,front:def.muzzleX,width:5.2};
    case'shotgun':return{rear:-10,front:def.muzzleX,width:4.5};
    case'pumpShotgun':return{rear:-15,front:def.muzzleX,width:4.7};
    default:return{rear:-9,front:def.muzzleX,width:4};
  }
}

function firearmSpriteSamples(def,pose,compression=0,fold=0,actor=player){
  const profile=firearmCollisionProfile(def);
  const shifted={
    ...pose,
    gunX:pose.gunX-compression,
    gunY:pose.gunY+fold*weaponWallFoldSide(def),
    turn:pose.turn-fold*weaponWallFoldAngle(def)
  };
  const ca=Math.cos(actor.bodyAngle),sa=Math.sin(actor.bodyAngle);
  const samples=[];
  const span=profile.front-profile.rear;
  const count=Math.max(2,Math.ceil(span/1.6));
  for(let i=0;i<=count;i++){
    const x=profile.rear+span*i/count;
    const t=i/count;
    const muzzleHalfWidth=(def.id==='shotgun'||def.id==='pumpShotgun')?2.1:1.35;
    const taper=smoothStep01(clamp((t-.48)/.52,0,1));
    const halfWidth=profile.width+(muzzleHalfWidth-profile.width)*taper;
    // 중심 캡슐 하나가 아니라 그려진 총몸/배럴의 위·중앙·아래 표면을 따라 샘플링한다.
    for(const side of [-.56,0,.56]){
      const local=gunPoint(shifted,x,side*halfWidth);
      samples.push({
        x:actor.x+local.x*ca-local.y*sa,
        y:actor.y+local.x*sa+local.y*ca,
        r:Math.max(.9,halfWidth*.48+.22),index:samples.length
      });
    }
  }
  return samples;
}

function firearmSpriteWallContact(def,pose,compression=0,fold=0,actor=player){
  for(const sample of firearmSpriteSamples(def,pose,compression,fold,actor)){
    const wall=MELEE_SANDBOX_COLLIDERS.find(item=>circleRectOverlap(sample.x,sample.y,sample.r,item));
    if(wall)return{sample,wall};
  }
  return null;
}

function firearmSpriteDummyContact(def,pose,compression=0,fold=0){
  for(const sample of firearmSpriteSamples(def,pose,compression,fold)){
    const target=firstTouchedMeleeDummy(sample.x,sample.y,sample.r);
    if(target)return{target,sample};
  }
  return null;
}

function longswordBladeWallContact(blade,radius=2.2){
  const dx=blade.tip.x-blade.base.x,dy=blade.tip.y-blade.base.y;
  const length=Math.max(.001,Math.hypot(dx,dy));
  const steps=Math.max(2,Math.ceil(length/1.6));
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const sample={x:blade.base.x+dx*t,y:blade.base.y+dy*t,r:radius,t};
    const wall=MELEE_SANDBOX_COLLIDERS.find(item=>circleRectOverlap(sample.x,sample.y,radius,item));
    if(wall)return{sample,wall};
  }
  return null;
}

function resolveLongswordWallOffset(rawPose){
  if(!longswordBladeWallContact(longswordWorldBlade(rawPose)))return 0;
  const previous=longswordState.wallAngleOffset||0;
  const preferred=Math.sign(previous)||-1;
  // 가장 작은 회전부터 양쪽을 검사한다. 이전 프레임과 같은 쪽을 먼저 골라 떨림을 막는다.
  for(let amount=.055;amount<=2.85;amount+=.055){
    for(const sign of [preferred,-preferred]){
      const offset=sign*amount;
      const candidate={...rawPose,swordAngle:normAngle(rawPose.swordAngle+offset)};
      if(!longswordBladeWallContact(longswordWorldBlade(candidate)))return offset;
    }
  }
  return preferred*2.85;
}

function sparkHeldWeaponContact(x,y){
  heldWeaponContact.wallFlash=.09;
  bulletImpacts.push({x,y,life:.09,maxLife:.09,target:false,color:'210,198,151'});
  if(bulletImpacts.length>180)bulletImpacts.shift();
}

function updateHeldWeaponContacts(dt){
  heldWeaponContact.pushCooldown=Math.max(0,heldWeaponContact.pushCooldown-dt);
  heldWeaponContact.wallFlash=Math.max(0,heldWeaponContact.wallFlash-dt);
  if(heldWeaponContact.shoveActive){
    heldWeaponContact.shoveElapsed+=dt;
    const p=clamp(heldWeaponContact.shoveElapsed/heldWeaponContact.shoveDuration,0,1);
    const pulse=heldGunShovePulse();
    const target=heldWeaponContact.shoveTarget;
    const pushAdvance=Math.max(0,pulse-(heldWeaponContact.shoveLastPulse||0));
    if(target&&target.hp>0&&pushAdvance>0&&Math.hypot(target.x-player.x,target.y-player.y)<46){
      const angle=Math.atan2(target.y-player.y,target.x-player.x);
      // 총이 앞으로 나가는 거리만큼만 따라 밀린다. 속도 넉백은 주지 않는다.
      moveSandboxDummy(target,Math.cos(angle)*pushAdvance*6.2,Math.sin(angle)*pushAdvance*6.2);
    }
    heldWeaponContact.shoveLastPulse=pulse;
    if(!heldWeaponContact.shoveHitDone&&p>=.30){
      heldWeaponContact.shoveHitDone=true;
      if(target&&target.hp>0&&Math.hypot(target.x-player.x,target.y-player.y)<46){
        const angle=Math.atan2(target.y-player.y,target.x-player.x);
        const hitX=player.x+Math.cos(angle)*18,hitY=player.y+Math.sin(angle)*18;
        damageMeleeDummy(6,angle,hitX,hitY,0,'shove',target);
      }
    }
    if(p>=1){
      heldWeaponContact.shoveActive=false;
      heldWeaponContact.shoveTarget=null;
      heldWeaponContact.shoveLastPulse=0;
    }
  }

  if(meleeState.active&&meleeState.weapon==='longsword'){
    player.weaponContact=(player.weaponContact||0)+(0-(player.weaponContact||0))*Math.min(1,dt*22);
    player.weaponContactTurn=(player.weaponContactTurn||0)+(0-(player.weaponContactTurn||0))*Math.min(1,dt*22);
    heldWeaponContact.lastGunSamples=null;
    heldWeaponContact.actorTarget=null;
    const rawPose=longswordIdlePose(false);
    const rawWallContact=longswordBladeWallContact(longswordWorldBlade(rawPose));
    if(rawWallContact){
      // 관통한 뒤 천천히 돌아오는 보간이 아니라, 닿는 프레임에 가장 가까운 안전 각도로 제한한다.
      longswordState.wallAngleOffset=resolveLongswordWallOffset(rawPose);
    }else if(Math.abs(longswordState.wallAngleOffset||0)>.0001){
      const recovered=(longswordState.wallAngleOffset||0)*(1-Math.min(1,dt*13));
      const recoveredPose={...rawPose,swordAngle:normAngle(rawPose.swordAngle+recovered)};
      if(!longswordBladeWallContact(longswordWorldBlade(recoveredPose))){
        longswordState.wallAngleOffset=recovered;
      }
    }else longswordState.wallAngleOffset=0;
    const pose=longswordIdlePose();
    const blade=longswordWorldBlade(pose);
    const dx=blade.tip.x-blade.base.x,dy=blade.tip.y-blade.base.y;
    const length=Math.max(.001,Math.hypot(dx,dy));
    const ux=dx/length,uy=dy/length;
    const wallContact=rawWallContact||longswordBladeWallContact(blade);
    if(wallContact){
      const hitX=wallContact.sample.x,hitY=wallContact.sample.y;
      if(heldWeaponContact.wallFlash<=0)sparkHeldWeaponContact(hitX,hitY);
      if(longswordState.attack&&!longswordState.hitDone){
        longswordState.rebound=pose;
        longswordState.elapsed=0;
        longswordState.duration=.34;
        longswordState.hitDone=true;
        moveMeleeSandboxPlayer(-ux*2.2,-uy*2.2);
      }
    }

    // 칼날의 각 지점은 회전축에서 멀수록 실제 선속도가 빠르다.
    // 접촉 지점 자체의 프레임 이동량으로 베기·찌르기·선회 피해를 모두 통일한다.
    const hitBase={
      x:blade.base.x+dx*LONGSWORD_BLADE_START,
      y:blade.base.y+dy*LONGSWORD_BLADE_START
    };
    const hitDX=blade.tip.x-hitBase.x,hitDY=blade.tip.y-hitBase.y;
    const hitLengthSquared=Math.max(.001,hitDX*hitDX+hitDY*hitDY);
    const target=firstTouchedMeleeDummyAlongSegment(
      hitBase.x,hitBase.y,blade.tip.x,blade.tip.y,LONGSWORD_BLADE_HIT_RADIUS
    );
    let contactPoint=blade.tip;
    let along=1;
    if(target){
      const hitAlong=clamp(
        ((target.x-hitBase.x)*hitDX+(target.y-hitBase.y)*hitDY)/hitLengthSquared,0,1
      );
      along=LONGSWORD_BLADE_START+hitAlong*(1-LONGSWORD_BLADE_START);
      contactPoint={x:blade.base.x+dx*along,y:blade.base.y+dy*along};
    }
    const previousBlade=heldWeaponContact.lastSwordBlade;
    let contactVX=0,contactVY=0;
    if(previousBlade&&dt>0){
      const previousPoint={
        x:previousBlade.base.x+(previousBlade.tip.x-previousBlade.base.x)*along,
        y:previousBlade.base.y+(previousBlade.tip.y-previousBlade.base.y)*along
      };
      contactVX=(contactPoint.x-previousPoint.x)/dt;
      contactVY=(contactPoint.y-previousPoint.y)/dt;
    }else{
      const angularVelocity=player.weaponAngularVelocity||0;
      contactVX=-uy*angularVelocity*length*along;
      contactVY=ux*angularVelocity*length*along;
    }
    const contactSpeed=Math.hypot(contactVX,contactVY);
    const travelAngle=contactSpeed>.001?Math.atan2(contactVY,contactVX):player.bodyAngle;
    const forwardDot=(contactVX*ux+contactVY*uy)/Math.max(.001,contactSpeed);
    const thrusting=forwardDot>.52;
    if(target){
      // 무조건 정면으로 미는 대신 실제 접촉점의 법선과 칼날 이동 방향을 합성한다.
      naturalWeaponPush(
        target,contactPoint,contactVX,contactVY,LONGSWORD_BLADE_HIT_RADIUS,thrusting?105:82
      );
      // 한 점이 빠진 뒤 칼날의 다른 부분이 여전히 포개진 경우도 같은 프레임에 끝낸다.
      for(let pass=0;pass<6;pass++){
        const remaining=firstTouchedMeleeDummyAlongSegment(
          hitBase.x,hitBase.y,blade.tip.x,blade.tip.y,LONGSWORD_BLADE_HIT_RADIUS
        );
        if(remaining!==target)break;
        naturalWeaponPush(
          target,contactPoint,contactVX,contactVY,LONGSWORD_BLADE_HIT_RADIUS,thrusting?105:82
        );
      }
    }
    // 평상시에는 밀침만. 예외는 실제 베기, 또는 가드를 굳힌 채 질주해 날을 들이미는 경우다.
    // 패링 자체의 피해는 tryLongswordParryHit()가 스윕한 실제 날에만 별도로 처리한다.
    const runningGuardHit=longswordState.guardHeld&&longswordState.guardBlend>.55&&
      player.sprinting&&!longswordState.attack&&!longswordState.parry;
    const damagingContact=longswordState.attack||runningGuardHit;
    if(!target||!damagingContact)heldWeaponContact.lastSwordDamageTarget=null;
    if(damagingContact&&target&&target!==heldWeaponContact.lastSwordDamageTarget&&contactSpeed>16){
      const profile=activeSwordDamageProfile();
      // 아밍소드는 같은 속도에서도 장검보다 낮게 제한한다. 질주 가드 피해는 정식 베기보다 훨씬 약하다.
      const kineticDamage=runningGuardHit
        ?clamp(Math.round((contactSpeed-24)*profile.guardScale),2,profile.guardCap)
        :(thrusting
          ?clamp(Math.round((contactSpeed-8)*profile.kineticScale*1.3),3,profile.kineticCap)
          :clamp(Math.round((contactSpeed-10)*profile.kineticScale),3,profile.kineticCap));
      damageMeleeDummy(
        kineticDamage,travelAngle,contactPoint.x,contactPoint.y,
        clamp(Math.ceil(kineticDamage*.22),2,10),'bladeSlash',target
      );
      addSurfaceBloodMark(
        longswordState,'blade',clamp(along*longswordBladeLength(),1.2,longswordBladeLength()-1),(Math.random()-.5)*1.1,
        1.15+kineticDamage*.018,0,'#5f0e13',false
      );
      heldWeaponContact.lastSwordDamageTarget=target;
    }
    heldWeaponContact.lastSwordTip={x:blade.tip.x,y:blade.tip.y};
    heldWeaponContact.lastSwordBlade={
      base:{x:blade.base.x,y:blade.base.y},tip:{x:blade.tip.x,y:blade.tip.y}
    };
    return;
  }

  heldWeaponContact.lastSwordTip=null;
  heldWeaponContact.lastSwordBlade=null;
  heldWeaponContact.lastSwordDamageTarget=null;
  if(meleeState.active||pistol.reloading||weaponSwitch.active||magazinePickup.active||
    pistolMelee.attack||smgMelee.attack||rifleMelee.attack||shotgunMelee.attack){
    player.weaponContact=(player.weaponContact||0)+(0-(player.weaponContact||0))*Math.min(1,dt*22);
    player.weaponContactTurn=(player.weaponContactTurn||0)+(0-(player.weaponContactTurn||0))*Math.min(1,dt*22);
    heldWeaponContact.lastGunSamples=null;
    heldWeaponContact.actorTarget=null;
    return;
  }

  const def=currentWeaponDef();
  const existing=player.weaponContact||0;
  const existingFold=player.weaponContactTurn||0;
  const pose=pistolPoseAt(0);
  // 충돌 반응을 제거한 원래 스프라이트 자세에서 다시 벽 접촉을 푼다.
  pose.gunX+=existing;
  pose.gunY-=existingFold*weaponWallFoldSide(def);
  pose.turn+=existingFold*weaponWallFoldAngle(def);
  const maxCompression=['pistol','revolver','plasmaPistol'].includes(def.id)?5.5:12;
  const rawWallContact=firearmSpriteWallContact(def,pose,0);
  const touchedActorContact=firearmSpriteDummyContact(def,pose,0,0);
  // 총 끝이 먼저 닿았다는 이유만으로 접지 않는다. 몸통끼리 거의 맞닿은 거리에서만 접는다.
  const rawActorContact=touchedActorContact&&
    Math.hypot(touchedActorContact.target.x-player.x,touchedActorContact.target.y-player.y)<=28
      ?touchedActorContact:null;
  heldWeaponContact.actorTarget=rawActorContact?.target||
    (heldWeaponContact.shoveActive?heldWeaponContact.shoveTarget:null);
  let contactTarget=0;
  let foldTarget=0;
  if(rawWallContact||rawActorContact){
    contactTarget=maxCompression*.28;
    foldTarget=1;
    // 벽을 보면 타협된 소각도가 아니라 달리기 운반 자세만큼 확실히 왼쪽으로 접는다.
    // 완전히 접고도 닿는 좁은 구석에서만 몸 쪽 후퇴량을 추가한다.
    if(rawWallContact&&firearmSpriteWallContact(def,pose,contactTarget,1)){
      contactTarget=maxCompression;
      for(let compression=maxCompression*.35;compression<=maxCompression;compression+=.5){
        if(!firearmSpriteWallContact(def,pose,compression,1)){
          contactTarget=compression;
          break;
        }
      }
    }
  }else if(touchedActorContact){
    // 먼 거리에서 총 끝만 걸렸을 때는 완전히 접지 않고 아주 조금만 눌린다.
    contactTarget=maxCompression*.10;
    foldTarget=.08;
  }
  if(heldWeaponContact.shoveActive){
    const pulse=heldGunShovePulse();
    // 접힌 자세에서 총몸을 짧게 밀어 넣고, 맞는 즉시 다시 몸 쪽으로 회수한다.
    contactTarget=maxCompression*.28-pulse*(maxCompression*.28+4.4);
    foldTarget=1-pulse*.72;
  }
  player.weaponContact+=(contactTarget-existing)*Math.min(1,dt*(contactTarget>existing?25:13));
  player.weaponContactTurn=existingFold+
    (foldTarget-existingFold)*Math.min(1,dt*(foldTarget>existingFold?24:12));
  if(rawWallContact&&heldWeaponContact.wallFlash<=0){
    sparkHeldWeaponContact(rawWallContact.sample.x,rawWallContact.sample.y);
  }

  // 중심선이 아니라 화면에 그린 총 전체 길이와 폭을 다음 입력 판정용으로 보존한다.
  // 단순 접촉만으로 적을 튕겨내지는 않는다. 접촉 회피는 위의 접힘 자세가 담당한다.
  const actualSamples=firearmSpriteSamples(
    def,pose,player.weaponContact||0,player.weaponContactTurn||0
  );
  const handledTargets=new Set();
  for(const sample of actualSamples){
    const target=firstTouchedMeleeDummy(sample.x,sample.y,sample.r);
    if(!target||handledTargets.has(target))continue;
    handledTargets.add(target);
    const previous=heldWeaponContact.lastGunSamples?.[sample.index];
    const velocityX=previous&&dt>0?(sample.x-previous.x)/dt:0;
    const velocityY=previous&&dt>0?(sample.y-previous.y)/dt:0;
    const speed=Math.hypot(velocityX,velocityY);
    let normalX=target.x-sample.x,normalY=target.y-sample.y;
    let normalLength=Math.hypot(normalX,normalY);
    if(normalLength<.001){
      normalX=target.x-player.x;normalY=target.y-player.y;
      normalLength=Math.max(.001,Math.hypot(normalX,normalY));
    }
    normalX/=normalLength;normalY/=normalLength;
    const velocityDirX=speed>.01?velocityX/speed:normalX;
    const velocityDirY=speed>.01?velocityY/speed:normalY;
    let pushX=normalX*.62+velocityDirX*.38;
    let pushY=normalY*.62+velocityDirY*.38;
    const pushLength=Math.max(.001,Math.hypot(pushX,pushY));
    pushX/=pushLength;pushY/=pushLength;
    // 총보다 훨씬 느린 속도로 위치만 해소한다. 피격 반짝임이나 넉백 속도는 발생하지 않는다.
    const slowPushSpeed=clamp(5+speed*.08,5,24);
    moveSandboxDummy(target,pushX*slowPushSpeed*dt,pushY*slowPushSpeed*dt);
  }
  heldWeaponContact.lastGunSamples=actualSamples.map(sample=>({x:sample.x,y:sample.y}));
}

function playerNearSimulationConsole(){

function simulationPanelHit(event){
  if(!simulationControl.open||event.button!==0)return null;
  const point=inventoryPointerPosition(event),layout=simulationPanelLayout();
  const inside=rect=>point.x>=rect.x&&point.x<=rect.x+rect.w&&point.y>=rect.y&&point.y<=rect.y+rect.h;
  const card=layout.cards.find(inside);
  if(card)return{kind:'card',index:card.index};
  if(inside(layout.minus))return{kind:'minus'};
  if(inside(layout.plus))return{kind:'plus'};
  if(inside(layout.start))return{kind:'start'};
  if(inside(layout.clear))return{kind:'clear'};
  return{kind:'panel'};
}
function sameSimulationPanelHit(a,b){
  return!!a&&!!b&&a.kind===b.kind&&(a.kind!=='card'||a.index===b.index);
}
function performSimulationPanelAction(hit){
  if(!hit)return false;
  if(hit.kind==='card')simulationControl.typeIndex=hit.index;
  else if(hit.kind==='minus')simulationControl.count=Math.max(1,simulationControl.count-1);
  else if(hit.kind==='plus')simulationControl.count=Math.min(SIMULATION_MAX_COUNT,simulationControl.count+1);
  else if(hit.kind==='start'){
    spawnSimulationWave();
    simulationControl.open=false;
  }else if(hit.kind==='clear'){
    clearSimulationEnemies();simulationControl.flash=.22;
  }
  return true;
}
function beginSimulationPanelPointer(event){
  simulationControl.pressed=simulationPanelHit(event);
  return!!simulationControl.pressed;
}
function commitSimulationPanelPointer(event){
  const released=simulationPanelHit(event),pressed=simulationControl.pressed;
  simulationControl.pressed=null;
  if(!sameSimulationPanelHit(pressed,released))return false;
  return performSimulationPanelAction(released);
}

// 공터 전용 이동: 기존 속도/질주/조준 모션은 유지하되 기존 벽/송신기 충돌은 무시한다.
function moveMeleeSandboxPlayer(dx,dy){
  const r=player.r||PLAYER_RADIUS;
  let nextX=clamp(player.x+dx,r,WORLD_W-r);
  let nextY=clamp(player.y+dy,r,WORLD_H-r);

  // 두 축을 따로 막지 않고, 접촉면 안쪽으로 파고드는 속도만 제거한다.
  // 덕분에 군인 옆에 붙어도 접선 방향(위/아래) 이동은 그대로 살아 있다.
  // 두 배우 모두 실제 몸통 스프라이트 폭(약 18px)에 맞춘 코어 충돌을 공유한다.
  // 팔과 가드는 이동을 막지 않으므로 주먹이 몸에 닿을 거리까지 자연스럽게 접근할 수 있다.
  for(const dummy of meleeDummies){
    const minD=dummy.hp>0?18.2:0;
    let toNextX=nextX-dummy.x;
    let toNextY=nextY-dummy.y;
    if(toNextX*toNextX+toNextY*toNextY>=minD*minD)continue;
    let normalX=player.x-dummy.x;
    let normalY=player.y-dummy.y;
    let normalLength=Math.hypot(normalX,normalY);
    if(normalLength<.001){
      normalX=-dx;normalY=-dy;
      normalLength=Math.max(.001,Math.hypot(normalX,normalY));
    }
    normalX/=normalLength;
    normalY/=normalLength;

    const desiredX=nextX-player.x,desiredY=nextY-player.y;
    const inward=desiredX*normalX+desiredY*normalY;
    if(inward<0&&dummy.hp>0){
      // 몸으로 걸어 들어갈 때도 적을 아주 조금은 밀 수 있다. 위치만 옮기며 넉백 속도는 만들지 않는다.
      const gentlePush=Math.min(.32,-inward*.12);
      moveSandboxDummy(dummy,-normalX*gentlePush,-normalY*gentlePush);
      toNextX=nextX-dummy.x;
      toNextY=nextY-dummy.y;
      if(toNextX*toNextX+toNextY*toNextY>=minD*minD)continue;
    }
    const slideX=desiredX-normalX*Math.min(0,inward);
    const slideY=desiredY-normalY*Math.min(0,inward);
    nextX=clamp(player.x+slideX,r,WORLD_W-r);
    nextY=clamp(player.y+slideY,r,WORLD_H-r);

    // 수치 오차나 이미 겹친 상태에서도 한 프레임에 부드럽게 표면으로 복귀한다.
    toNextX=nextX-dummy.x;
    toNextY=nextY-dummy.y;
    const nextDistance=Math.hypot(toNextX,toNextY);
    if(nextDistance<minD){
      const pushX=nextDistance>.001?toNextX/nextDistance:normalX;
      const pushY=nextDistance>.001?toNextY/nextDistance:normalY;
      nextX=dummy.x+pushX*minD;
      nextY=dummy.y+pushY*minD;
    }
  }

  const roomResolved=resolveTestRoomCircleMove(player,nextX,nextY,r);
  player.x=clamp(roomResolved.x,r,WORLD_W-r);
  player.y=clamp(roomResolved.y,r,WORLD_H-r);
}
