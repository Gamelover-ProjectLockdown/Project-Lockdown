function startDoubleBarrelSmoke(owner,state,barrel,chamber=false,warmth=1){
  const keys=state.barrelSmokeKeys||(state.barrelSmokeKeys=[[{},{}],[{},{}]]);
  const key=keys[barrel][chamber?1:0];
  const base=BARREL_SMOKE_PROFILES.shotgun;
  const profile=chamber?{...base,rate:18,size:1.25,speed:4,spread:2.5,growth:4,life:1.1}:base;
  barrelSmokeEmitters.set(key,{owner,state,weaponId:'shotgun',barrel,chamber,profile,
    age:0,accumulator:chamber?1:0,heat:.65*warmth,duration:chamber?.85+.35*warmth:base.duration});
}
const MUZZLE_HEAT_DAMAGE={pistol:4,revolver:5,smg:4,assaultRifle:7,battleRifle:10,lmg:8,shotgun:14,pumpShotgun:12};
function muzzleObstacleDistance(x,y,angle,range){
  let distance=castObstacleRay(x,y,angle,range);
  const ux=Math.cos(angle),uy=Math.sin(angle);
  for(const wall of MELEE_SANDBOX_COLLIDERS)distance=Math.min(distance,rayRectDistance(x,y,ux,uy,wall,distance));
  return distance;
}
function applyMuzzleHeat(x,y,angle,def,owner){
  const damage=MUZZLE_HEAT_DAMAGE[def.id]||0;
  if(!damage||def.plasma)return;
  const range=def.id==='shotgun'?27:def.id==='pumpShotgun'?24:['assaultRifle','battleRifle','lmg'].includes(def.id)?22:18;
  const targets=owner===player||owner?.isAlly?[...new Set([...testSubjects,...meleeDummies])]:[player,...squadAllies];
  const candidates=targets.filter(t=>t!==owner&&t.hp>0&&Math.hypot(t.x-x,t.y-y)<range+42);
  const hits=new Map();
  for(let i=0;i<13;i++){
    const rayAngle=angle+(i/12-.5)*.66,ux=Math.cos(rayAngle),uy=Math.sin(rayAngle);
    let distance=muzzleObstacleDistance(x,y,rayAngle,range),target=null;
    for(const t of candidates){
      const d=rayActorSpriteDistance(x,y,ux,uy,t,t.r||9,distance);
      if(d<distance-.01){distance=d;target=t;}
    }
    if(target&&(!hits.has(target)||hits.get(target).distance>distance))hits.set(target,{distance,x:x+ux*distance,y:y+uy*distance});
  }
  for(const [target,hit] of hits){
    const amount=damage*(1-.65*hit.distance/range);
    if(target===player)damagePlayer(amount,angle,hit.x,hit.y,'muzzleHeat',owner);
    else if(target.isAlly)damageAlly(target,amount,angle,owner);
    else if(meleeDummies.includes(target))damageMeleeDummy(amount,angle,hit.x,hit.y,0,'heat',target);
    else{target.hp=Math.max(0,target.hp-Math.max(1,amount-(target.defense||0)));target.hitFlash=.12;}
  }
}
function spawnMuzzleDischarge(x,y,angle,def,owner=player,barrelIndex=0){
  if(def.plasma)return;
  // A protruding weapon must not originate flame on the far side of a wall.
  const reach=Math.hypot(x-owner.x,y-owner.y),reachAngle=Math.atan2(y-owner.y,x-owner.x);
  const clear=muzzleObstacleDistance(owner.x,owner.y,reachAngle,reach);
  const blocked=clear<reach-.01;
  if(blocked){x=owner.x+Math.cos(reachAngle)*Math.max(0,clear-.5);y=owner.y+Math.sin(reachAngle)*Math.max(0,clear-.5);}
  if(!blocked)applyMuzzleHeat(x,y,angle,def,owner);
  const clipPoints=Array.from({length:64},(_,i)=>{
    const a=i*Math.PI*2/64,d=Math.max(0,muzzleObstacleDistance(x,y,angle+a,100)-.15);
    return{x:Math.cos(a)*d,y:Math.sin(a)*d};
  });
  if(def.id==='shotgun'){
    const state=owner===player?pistol:owner.pistolState;
    const barrel=barrelIndex===1?1:0;
    if(!state.barrelLastShotAt)state.barrelLastShotAt=[-Infinity,-Infinity];
    state.barrelLastShotAt[barrel]=lightingTime;
    startDoubleBarrelSmoke(owner,state,barrel);
  }else{
  const previous=barrelSmokeEmitters.get(owner);
  const smoke=BARREL_SMOKE_PROFILES[def.id]||BARREL_SMOKE_PROFILES.pistol;
  const carry=previous?.weaponId===def.id?previous:null;
  const heat=Math.min(2,(carry?carry.heat*Math.max(0,1-carry.age/carry.duration):0)+smoke.heatGain);
  barrelSmokeEmitters.set(owner,{weaponId:def.id,state:owner===player?pistol:owner.pistolState,
    age:0,accumulator:carry?.accumulator||0,heat,profile:smoke,
    duration:smoke.duration+(def.automatic?heat*.18:0)});
  }
  const profile={
    pistol:[19,5,.052,.30],revolver:[22,6,.060,.34],smg:[23,5,.048,.29],
    battleRifle:[39,8,.064,.39],assaultRifle:[31,7,.055,.34],lmg:[37,8,.061,.38],
    shotgun:[43,12,.072,.44],pumpShotgun:[34,9,.065,.40]
  }[def.id]||[20,5,.052,.30];
  const variation=.85+Math.random()*.3;
  muzzleDischarges.push({x,y,angle,clipPoints,age:0,life:1.05,gasLife:profile[3],
    length:profile[0]*variation*1.28,width:profile[1]*1.20,flashLife:profile[2],
    seed:Math.random()*6.28,
    gas:Array.from({length:6},(_,i)=>({
      delay:i*.014,speed:48+Math.random()*72,
      side:(Math.random()-.5)*.8,size:2.5+Math.random()*3.5
    }))});
  if(muzzleDischarges.length>90)muzzleDischarges.shift();
}

function updateBarrelSmoke(dt){
  for(let i=barrelSmokeParticles.length-1;i>=0;i--){
    const p=barrelSmokeParticles[i];p.age+=dt;
    if(p.age>=p.life){barrelSmokeParticles.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    const drag=Math.exp(-2.4*dt);p.vx*=drag;p.vy*=drag;
    p.x+=Math.sin(p.seed+p.age*3)*dt*p.curl;p.y-=dt*3.5;
  }
  for(const [key,e] of barrelSmokeEmitters){
    const owner=e.owner||key;
    e.age+=dt;
    if(e.age>=e.duration||owner.hp<=0||
      (owner===player?(pistol!==e.state||meleeState.active||(pistol.reloading&&e.weaponId!=='shotgun')):(!owner.armed||owner.pistolState?.reloading))){
      barrelSmokeEmitters.delete(key);continue;
    }
    let muzzle;
    if(owner===player){
      const rig=buildPistolRig(),pose=rig.pose,def=currentWeaponDef();
      if(e.chamber&&(!pistol.reloading||rig.breakOpen<.45)){
        barrelSmokeEmitters.delete(key);continue;
      }
      const open=rig.breakOpen||0;
      // Match each drawn bore centre, including the breech shifting during break action.
      const localX=e.weaponId==='shotgun'?(e.chamber?5+open*3:25+open):def.muzzleX;
      const localY=e.weaponId==='shotgun'?(e.barrel===0?-3.8:1.3)+SHOTGUN_BARREL_THICKNESS/2:0;
      const local=gunPoint(pose,localX,localY);
      const c=Math.cos(player.bodyAngle),s=Math.sin(player.bodyAngle);
      muzzle={x:player.x+local.x*c-local.y*s,y:player.y+local.x*s+local.y*c,
        angle:player.bodyAngle+pose.turn+(e.chamber?Math.PI:0)};
    }else{
      const pose=simulationEnemyPistolPose(owner);
      muzzle={x:pose.muzzleX,y:pose.muzzleY,angle:pose.angle};
    }
    const fade=1-e.age/e.duration;
    const smoke=e.profile;
    e.accumulator+=dt*(smoke.rate+e.heat*5)*(.35+.65*fade);
    while(e.accumulator>=1){
      e.accumulator--;
      if(barrelSmokeParticles.length>=240)break;
      const speed=smoke.speed+Math.random()*5,side=(Math.random()-.5)*smoke.spread;
      barrelSmokeParticles.push({x:muzzle.x,y:muzzle.y,age:0,life:smoke.life+Math.random()*.35,
        vx:Math.cos(muzzle.angle)*speed-Math.sin(muzzle.angle)*side,
        vy:Math.sin(muzzle.angle)*speed+Math.cos(muzzle.angle)*side,
        size:smoke.size+e.heat*.35,alpha:(smoke.alpha+e.heat*.045)*(.45+.55*fade),
        growth:smoke.growth,curl:smoke.curl,seed:Math.random()*6.28});
    }
    e.accumulator=Math.min(e.accumulator,1);
  }
}
function drawBarrelSmoke(){
  if(!barrelSmokeParticles.length)return;
  if(!barrelSmokeStamp){
    barrelSmokeStamp=document.createElement('canvas');barrelSmokeStamp.width=32;barrelSmokeStamp.height=32;
    const c=barrelSmokeStamp.getContext('2d'),g=c.createRadialGradient(16,16,0,16,16,16);
    g.addColorStop(0,'rgba(190,197,200,.85)');g.addColorStop(.45,'rgba(174,183,187,.42)');g.addColorStop(1,'rgba(160,172,178,0)');
    c.fillStyle=g;c.fillRect(0,0,32,32);
  }
  ctx.save();ctx.imageSmoothingEnabled=true;
  for(const p of barrelSmokeParticles){
    const point=worldToScreen(p.x,p.y),t=p.age/p.life,r=p.size+p.age*p.growth;
    if(point.x<-32||point.y<-32||point.x>W+32||point.y>H+32)continue;
    ctx.globalAlpha=p.alpha*Math.min(1,p.age/.06)*Math.pow(1-t,1.25);
    ctx.drawImage(barrelSmokeStamp,point.x-r,point.y-r,r*2,r*2);
  }
  ctx.restore();
}
function drawMuzzleDischarges(){
  for(const shot of muzzleDischarges){
    const point=worldToScreen(shot.x,shot.y);
    ctx.save();ctx.translate(point.x,point.y);ctx.rotate(shot.angle);
    if(shot.clipPoints){
      ctx.beginPath();shot.clipPoints.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.clip();
    }
    // 배출 가스는 발사 위치에서 흘러가며 이후 총의 회전을 따라가지 않는다.
    for(const gas of shot.gas){
      const age=shot.age-gas.delay;
      if(age<=0||shot.age>=shot.gasLife)continue;
      const t=clamp(age/(shot.gasLife-gas.delay),0,1);
      const forward=gas.speed*(1-Math.exp(-age*5))/5;
      const side=gas.side*forward+Math.sin(shot.seed+age*8)*age*5;
      const radius=gas.size+age*20;
      const cloud=ctx.createRadialGradient(forward,side,0,forward,side,radius);
      cloud.addColorStop(0,`rgba(175,181,174,${Math.sin(Math.PI*Math.min(1,t*2))*(1-t)*.10})`);
      cloud.addColorStop(1,'rgba(151,158,153,0)');
      ctx.fillStyle=cloud;ctx.beginPath();ctx.ellipse(forward,side,radius,radius*.65,gas.side,0,Math.PI*2);ctx.fill();
    }
    const t=clamp(shot.age/shot.flashLife,0,1);
    if(t<1){
      const expansion=.4+.6*(1-Math.pow(1-t,3));
      const length=shot.length*expansion;
      const width=shot.width*(.55+.45*Math.sin(t*Math.PI));
      const alpha=Math.pow(1-t,1.1);
      ctx.globalCompositeOperation='lighter';
      // 흰 화염의 형태와 핵은 유지하고 외곽 후광에만 붉은 온기를 더한다.
      const halo=ctx.createRadialGradient(length*.28,0,0,length*.28,0,length*.72);
      halo.addColorStop(0,`rgba(255,209,194,${alpha*.19})`);
      halo.addColorStop(.65,`rgba(233,115,89,${alpha*.075})`);
      halo.addColorStop(1,'rgba(222,98,78,0)');
      ctx.fillStyle=halo;ctx.beginPath();ctx.ellipse(length*.28,0,length*.72,width*1.8,0,0,Math.PI*2);ctx.fill();
      const flame=ctx.createLinearGradient(0,0,length,0);
      flame.addColorStop(0,`rgba(255,255,247,${alpha})`);
      flame.addColorStop(.3,`rgba(255,249,231,${alpha*.88})`);
      flame.addColorStop(.72,`rgba(250,202,177,${alpha*.40})`);
      flame.addColorStop(.9,`rgba(235,125,101,${alpha*.23})`);
      flame.addColorStop(1,'rgba(223,105,86,0)');
      ctx.fillStyle=flame;
      const bend=Math.sin(shot.seed+t*8)*width*.18;
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.bezierCurveTo(length*.13,-width*.9,length*.3,-width,length*.46,-width*.38);
      ctx.lineTo(length*.65,-width*.65);ctx.lineTo(length*.61,-width*.17);
      ctx.quadraticCurveTo(length*.87,bend-width*.14,length,bend);
      ctx.quadraticCurveTo(length*.78,bend+width*.22,length*.57,width*.22);
      ctx.lineTo(length*.67,width*.58);ctx.lineTo(length*.42,width*.37);
      ctx.bezierCurveTo(length*.23,width*.85,length*.11,width*.62,0,0);ctx.fill();
      ctx.fillStyle=`rgba(255,255,250,${alpha*.93})`;
      ctx.beginPath();ctx.moveTo(0,-.65);
      ctx.quadraticCurveTo(length*.20,-width*.24,length*.54,bend*.4);
      ctx.quadraticCurveTo(length*.16,width*.22,0,.65);ctx.closePath();ctx.fill();
    }
    ctx.restore();
  }
}

function drawShotEffects(){
  drawMuzzleDischarges();
  for(const trace of shotTraces){
    const start=worldToScreen(trace.x1,trace.y1);
    const end=worldToScreen(trace.x2,trace.y2);
    const alpha=trace.life/trace.maxLife;
    ctx.strokeStyle=`rgba(${trace.color||'255,239,166'},${alpha*.78})`;
    ctx.lineWidth=trace.width||1;
    ctx.beginPath();
    ctx.moveTo(start.x,start.y);
    ctx.lineTo(end.x,end.y);
    ctx.stroke();
  }

  ctx.lineWidth=1;
  for(const impact of bulletImpacts){
    const point=worldToScreen(impact.x,impact.y);
    const alpha=impact.life/impact.maxLife;
    if(impact.fragments){
      ctx.save();
      ctx.globalAlpha=1;
      ctx.globalCompositeOperation='source-over';
      const age=impact.maxLife-impact.life;
      const travel=(1-Math.exp(-age*9))/9;
      for(const fragment of impact.fragments){
        const pos=worldToScreen(impact.x+fragment.vx*travel,impact.y+fragment.vy*travel);
        if(age<.075){
          const previousTravel=(1-Math.exp(-Math.max(0,age-.012)*9))/9;
          const previous=worldToScreen(impact.x+fragment.vx*previousTravel,impact.y+fragment.vy*previousTravel);
          ctx.strokeStyle=`rgba(${fragment.color},${(1-age/.075)*.4})`;
          ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(previous.x,previous.y);ctx.lineTo(pos.x,pos.y);ctx.stroke();
        }
        ctx.save();ctx.translate(pos.x,pos.y);ctx.rotate(fragment.rotation+fragment.spin*age);
        drawBulletChip(ctx,fragment);ctx.restore();
      }
      ctx.restore();
      continue;
    }
    ctx.strokeStyle=`rgba(${impact.color||'225,216,170'},${
      impact.target?alpha:alpha*.8
    })`;
    ctx.beginPath();
    ctx.moveTo(point.x-3,point.y);ctx.lineTo(point.x+3,point.y);
    ctx.moveTo(point.x,point.y-3);ctx.lineTo(point.x,point.y+3);
    ctx.stroke();
  }
  for(const fragment of deflectedBullets){
    const point=worldToScreen(fragment.x,fragment.y);
    const alpha=Math.pow(1-clamp(fragment.age/fragment.life,0,1),1.35);
    const speed=Math.hypot(fragment.vx,fragment.vy)||1;
    const ux=fragment.vx/speed,uy=fragment.vy/speed;
    ctx.strokeStyle=`rgba(255,224,154,${alpha*.42})`;
    ctx.lineWidth=.8;
    ctx.beginPath();ctx.moveTo(point.x-ux*5,point.y-uy*5);ctx.lineTo(point.x,point.y);ctx.stroke();
    ctx.save();ctx.translate(point.x,point.y);ctx.rotate(fragment.angle);
    // 칼날에 맞아 납작해진 탄두/탄편이 짧게 회전하며 튀는 실루엣.
    ctx.fillStyle=`rgba(118,106,82,${alpha})`;
    ctx.fillRect(-2.4,-.75,4.8,1.5);
    ctx.fillStyle=`rgba(210,188,132,${alpha*.82})`;
    ctx.fillRect(-1.8,-.35,3.1,.7);
    ctx.restore();
  }
}

function drawAirborneBloodSprays(){
  ctx.save();
  ctx.lineCap='round';
  for(const spray of airborneBloodSprays){
    const point=worldToScreen(spray.x,spray.y);
    const t=clamp(spray.age/spray.life,0,1);
    const alpha=Math.pow(1-t,1.7)*.82;
    const speed=Math.hypot(spray.vx,spray.vy)||1;
    const ux=spray.vx/speed,uy=spray.vy/speed;
    ctx.strokeStyle=`rgba(${spray.color},${alpha})`;
    ctx.lineWidth=spray.size;
    ctx.beginPath();
    ctx.moveTo(point.x-ux*spray.streak,point.y-uy*spray.streak);
    ctx.lineTo(point.x,point.y);
    ctx.stroke();
    ctx.fillStyle=`rgba(${spray.color},${alpha*.72})`;
    ctx.beginPath();
    ctx.arc(point.x,point.y,Math.max(.55,spray.size*.55),0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawProjectiles(){
  for(const projectile of projectiles){
    const point=worldToScreen(projectile.x,projectile.y);
    if(point.x<-20||point.x>W+20||point.y<-20||point.y>H+20)continue;
    const ammo=AMMO_BY_ID[projectile.ammoId]||AMMO_BY_ID.standard;
    ctx.save();
    ctx.translate(Math.round(point.x),Math.round(point.y));
    ctx.rotate(projectile.angle);
    // 탄환 바로 뒤 1~4px에만 공기가 찢기는 짧은 꼬리를 남긴다.
    ctx.fillStyle=`rgba(235,242,241,${ammo.id==='tracer'?.70:.38})`;
    ctx.fillRect(
      -projectile.tail-projectile.size*.5,
      -projectile.size*.35,
      projectile.tail,
      Math.max(1,projectile.size*.7)
    );
    ctx.fillStyle=ammo.projectileColor;
    ctx.fillRect(
      -projectile.size*.5,-projectile.size*.5,
      projectile.size,projectile.size
    );
    if(ammo.id==='shot'||ammo.id==='buckshot'){
      // 산탄은 탄피 색이 아니라 빛을 받은 작은 회색 쇠구슬로 표시한다.
      ctx.fillStyle=ammo.id==='buckshot'?'#c4c9c7':'#bac0be';
      ctx.fillRect(-projectile.size*.25,-projectile.size*.5,.7,.7);
    }
    ctx.restore();
  }
}

function drawPlasmaEffects(){
  for(const lance of plasmaLances){
    const t=clamp(lance.age/lance.life,0,1);
    // 창 물체가 날아가는 것이 아니라, 발사 순간 총구에서 목표까지 광주가 빠르게 뻗는다.
    const extension=smoothStep01(clamp(lance.age/.030,0,1));
    const visibleLength=lance.length*extension;
    const start=worldToScreen(lance.x,lance.y);
    const end=worldToScreen(
      lance.x+Math.cos(lance.angle)*visibleLength,
      lance.y+Math.sin(lance.angle)*visibleLength
    );
    const screenLength=Math.max(1,Math.hypot(end.x-start.x,end.y-start.y));
    const ux=(end.x-start.x)/screenLength,uy=(end.y-start.y)/screenLength;
    const nx=-uy,ny=ux;
    // 전체 윤곽을 연속 곡선으로 그린다. 총구와 끝은 모두 폭 0이다.
    const jetShape=width=>{
      const point=(q,w)=>({x:start.x+ux*screenLength*q+nx*w,y:start.y+uy*screenLength*q+ny*w});
      const a=point(.22,width*.42),b=point(.58,width),c=point(.68,width);
      const d=point(.84,width),e=point(.94,width*.16);
      const ar=point(.22,-width*.42),br=point(.58,-width),cr=point(.68,-width);
      const dr=point(.84,-width),er=point(.94,-width*.16);
      ctx.beginPath();ctx.moveTo(start.x,start.y);
      ctx.bezierCurveTo(a.x,a.y,b.x,b.y,c.x,c.y);
      ctx.bezierCurveTo(d.x,d.y,e.x,e.y,end.x,end.y);
      ctx.bezierCurveTo(er.x,er.y,dr.x,dr.y,cr.x,cr.y);
      ctx.bezierCurveTo(br.x,br.y,ar.x,ar.y,start.x,start.y);
      ctx.closePath();ctx.fill();
    };
    // 백열 줄기는 먼저 끊기고, 전체 수명은 확산하는 기체와 잔상에만 사용한다.
    const flashLife=.065+.015*(lance.power||0);
    const fade=Math.pow(clamp(1-(lance.age-.015)/(flashLife-.015),0,1),1.5);
    const afterglow=Math.pow(1-t,1.8);
    const cool=clamp((lance.age-.010)/.050,0,1);
    const widthScale=(.72+(lance.power||0)*.38)*(lance.penetrated?.6:1);
    const red=255,green=Math.round(252-105*cool),blue=Math.round(238-196*cool);
    ctx.save();ctx.lineCap='round';
    // 분출 직후 경로 양옆으로 팽창하는 기체층. 총구는 한 점으로 유지한다.
    ctx.save();
    ctx.translate(start.x,start.y);ctx.rotate(lance.angle);
    const pressureScale=(1+(lance.power||0)*.35)*(lance.penetrated?.6:1);
    // 총구에서 순간적으로 팽창하는 압력파. 불꽃 없이 얇은 공기 경계만 번진다.
    const muzzleWave=clamp(lance.age/.13,0,1);
    if(!lance.penetrated&&muzzleWave>0&&muzzleWave<1){
      const expansion=1-Math.pow(1-muzzleWave,3);
      const radius=(22+16*(lance.power||0))*expansion;
      const opacity=Math.pow(1-muzzleWave,1.5);
      ctx.save();
      ctx.translate(radius*.32,0);
      // 압력파를 옆에서 보는 투영: 총열 축은 압축하고 좌우 폭은 넓힌다.
      // 후광과 윤곽선을 함께 변환해 원형 후광이 따로 남지 않게 한다.
      ctx.scale(.36,1.25);
      const air=ctx.createRadialGradient(0,0,Math.max(.01,radius*.68),0,0,Math.max(.02,radius));
      air.addColorStop(0,'rgba(204,227,228,0)');
      air.addColorStop(.65,`rgba(224,242,241,${opacity*.23})`);
      air.addColorStop(1,'rgba(224,242,241,0)');
      ctx.fillStyle=air;
      ctx.beginPath();ctx.ellipse(0,0,radius,radius*.78,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=`rgba(230,248,246,${opacity*.82})`;
      ctx.lineWidth=1.8*(1-muzzleWave)+.45;
      ctx.beginPath();ctx.ellipse(0,0,radius*.93,radius*.73,0,-2.25,2.25);ctx.stroke();
      ctx.strokeStyle=`rgba(103,143,151,${opacity*.4})`;
      ctx.lineWidth=1;
      ctx.beginPath();ctx.ellipse(0,0,radius*.78,radius*.62,0,-2.0,2.0);ctx.stroke();
      ctx.restore();
    }
    for(let i=0;i<9;i++){
      const q=.10+i*.095;
      const arrival=q*.030;
      const gasAge=lance.age-arrival;
      if(gasAge<=0)continue;
      const expansion=clamp(gasAge/.36,0,1);
      const envelope=Math.sin(q*Math.PI);
      const spread=(2+(1-Math.pow(1-expansion,2))*32)*envelope*pressureScale;
      const alpha=Math.pow(1-expansion,1.3)*.13;
      const along=Math.min(visibleLength,lance.length*q+gasAge*26);
      for(const side of [-1,1]){
        const offset=side*spread;
        const radius=(3+expansion*10)*envelope;
        const haze=ctx.createRadialGradient(along,offset,0,along,offset,Math.max(.1,radius*2));
        haze.addColorStop(0,`rgba(219,${Math.round(210-48*cool)},${Math.round(188-65*cool)},${alpha})`);
        haze.addColorStop(1,'rgba(185,166,143,0)');
        ctx.fillStyle=haze;
        ctx.beginPath();ctx.ellipse(along,offset,radius*2,radius,side*.18,0,Math.PI*2);ctx.fill();
        // 가벼운 입자 조각은 기체와 함께 바깥으로 이동하며 짧게 흐려진다.
        ctx.strokeStyle=`rgba(202,216,211,${alpha*.9})`;
        ctx.lineWidth=.65;
        const drift=Math.sin(i*2.4+expansion*5)*3;
        ctx.beginPath();ctx.moveTo(along+drift,offset);
        ctx.lineTo(along+drift+2,offset+side*(1+expansion*3));ctx.stroke();
      }
    }
    // 짧은 압력 전선이 차례로 벌어진다. 완전한 원 대신 전방으로 휘는 얇은 호다.
    for(let i=0;i<3;i++){
      const q=.18+i*.27;
      const waveAge=lance.age-q*.030;
      if(waveAge<=0||waveAge>=.14)continue;
      const wave=waveAge/.14;
      const span=(2+wave*22)*pressureScale*Math.sin(q*Math.PI);
      const x=Math.min(visibleLength,lance.length*q+wave*9);
      ctx.strokeStyle=`rgba(221,229,225,${Math.sin(Math.PI*wave)*.18})`;
      ctx.lineWidth=.7+(.5*(1-wave));
      ctx.beginPath();ctx.moveTo(x-4,-span);
      ctx.bezierCurveTo(x+5,-span*.55,x+5,span*.55,x-4,span);
      ctx.stroke();
    }
    ctx.restore();
    // 넓은 후광도 끝에서 미리 가늘어져 삼각형 창촉처럼 보이지 않는다.
    ctx.fillStyle=`rgba(255,${Math.round(224-92*cool)},${Math.round(191-145*cool)},${fade*(.13+.05*(1-cool))})`;
    jetShape((4.4+Math.sin(t*28)*.35)*widthScale);
    const outer=ctx.createLinearGradient(start.x,start.y,end.x,end.y);
    outer.addColorStop(0,`rgba(${red},${green},${blue},${fade*.52})`);
    outer.addColorStop(.55,`rgba(${red},${green},${blue},${fade*.82})`);
    outer.addColorStop(1,`rgba(255,255,247,${fade})`);
    ctx.fillStyle=outer;
    jetShape(2.9*widthScale);
    // 백열 핵 역시 긴 곡선으로 소멸해 별도의 창날이나 탄두가 생기지 않는다.
    const core=ctx.createLinearGradient(start.x,start.y,end.x,end.y);
    core.addColorStop(0,`rgba(255,${Math.round(210-55*cool)},${Math.round(135-88*cool)},${fade*.62})`);
    core.addColorStop(.7,`rgba(255,250,218,${fade*.94})`);
    core.addColorStop(1,`rgba(255,255,255,${fade})`);
    ctx.fillStyle=core;
    jetShape(1.05*widthScale);
    // 광주가 꺼진 자리에는 밝은 탄체 대신 빠르게 일렁이다 사라지는 아지랑이만 남는다.
    ctx.strokeStyle=`rgba(194,151,104,${afterglow*.075})`;ctx.lineWidth=1.0;
    for(let lane=-1;lane<=1;lane+=2){
      ctx.beginPath();
      for(let i=0;i<=12;i++){
        const q=i/12;
        const ripple=lane*(3.5+t*24+Math.sin(i*1.7+t*22)*2.3)*Math.sin(q*Math.PI);
        const x=start.x+(end.x-start.x)*q+nx*ripple;
        const y=start.y+(end.y-start.y)*q+ny*ripple;
        i?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  for(const puff of plasmaSteam){
    const t=clamp(puff.age/puff.life,0,1),point=worldToScreen(puff.x,puff.y);
    if(puff.impact){
      const radius=puff.size*(1+t*(puff.woundSteam?2.6:2));
      const vapor=ctx.createRadialGradient(point.x,point.y,0,point.x,point.y,radius);
      const alpha=puff.woundSteam
        ?Math.sin(Math.PI*Math.min(1,t*1.08))*.30
        :(1-t)*.38;
      vapor.addColorStop(0,`rgba(194,188,181,${alpha})`);
      vapor.addColorStop(1,'rgba(145,140,135,0)');
      ctx.fillStyle=vapor;ctx.beginPath();ctx.arc(point.x,point.y,radius,0,Math.PI*2);ctx.fill();
      continue;
    }
    ctx.fillStyle=`rgba(196,190,181,${(1-t)*.34})`;
    ctx.fillRect(point.x-puff.size*t,point.y-puff.size*t,puff.size*(1+t),puff.size*(1+t));
  }
}

function subjectIsVisible(subject){
  if(lineBlocked(player.x,player.y,subject.x,subject.y))return false;
  if(!isInDarkZone(subject.x,subject.y))return true;

  const distance=Math.hypot(subject.x-player.x,subject.y-player.y);
  if(distance<=NEAR_LIGHT_RADIUS+SUBJECT_OCCLUDER_RADIUS)return true;
  if(hasLineOfSight(subject.x,subject.y,subject))return true;

  if(brokenFixtures.some(fixture=>fixtureLightsPoint(
    fixture,subject.x,subject.y
  )))return true;

  // 총구 섬광 안에 들어온 적은 그 순간 실제로 보인다.
  return pointLitByMuzzleFlash(
    subject.x,subject.y,frameMuzzleFlashLights
  );
}

function drawGuardSharedWeapon(subject,soldier){
  if(!subject.weaponState)return;
  withGuardWeaponContext(subject,()=>{
    const rig=buildPistolRig();
    const shoulders=playerShoulders();
    const sleeve=soldier?'#35483d':'#40515d';

    let supportHand=rig.supportHand;
    let primaryHand=rig.primaryHand;

    if(subject.weaponDrawActive&&subject.weaponId==='pistol'){
      const drawT=smoothStep01(clamp(
        subject.weaponDrawElapsed/subject.weaponDrawDuration,0,1
      ));
      // 권총을 허리 쪽에서 뽑아 앞으로 올리는 느낌.
      // 끝점은 플레이어 리그의 실제 손 위치라 드로우가 끝나면 완전히 동일해진다.
      const holsterPrimary={x:-4.5,y:8.5};
      const chestSupport={x:-2.5,y:-6.5};
      primaryHand=lerpPoint(
        holsterPrimary,rig.primaryHand,drawT
      );
      supportHand=lerpPoint(
        chestSupport,rig.supportHand,
        smoothStep01(clamp((drawT-.28)/.72,0,1))
      );
    }

    drawRiggedArm(
      shoulders.support.x,shoulders.support.y,
      supportHand.x,supportHand.y,-1,sleeve
    );
    drawRiggedArm(
      shoulders.primary.x,shoulders.primary.y,
      primaryHand.x,primaryHand.y,1,sleeve
    );

    // 총 자체도 플레이어 weaponSwitch 보간을 그대로 사용해 허리 쪽에서 앞으로 올라온다.
    drawPistolWeapon(rig);
  });
}


function drawTestSubjects(){
  for(const subject of testSubjects){
    const point=worldToScreen(subject.x,subject.y);
    if(point.x<-40||point.x>W+40||point.y<-40||point.y>H+40)continue;
    if(!subjectIsVisible(subject))continue;
    ctx.save();
    ctx.translate(Math.round(point.x),Math.round(point.y));
    ctx.rotate(subject.hp<=0?subject.deathAngle:subject.angle);
    const hit=subject.hitFlash>0;
    if(subject.hp<=0){
      const soldier=subject.role==='soldier';
      ctx.rotate(subject.corpseTurn||.55);
      ctx.fillStyle='#3a080b';ctx.fillRect(-13,-5,25,11);
      ctx.fillStyle=soldier?'#18201c':'#202a31';ctx.fillRect(-10,-8,19,16);
      ctx.fillStyle=soldier?'#35483d':'#40515d';ctx.fillRect(-8,-6,15,12);
      if(soldier){
        // 방탄조끼와 파우치가 남아 교도관 시체와 실루엣부터 다르게 보인다.
        ctx.fillStyle='#1c2922';ctx.fillRect(-7,-7,11,13);
        ctx.fillStyle='#536557';ctx.fillRect(-5,-6,3,4);ctx.fillRect(-1,-6,3,4);
        ctx.fillStyle='#101713';ctx.fillRect(-7,3,11,3);
      }
      ctx.save();ctx.translate(8,-1);drawSharedHeadLocal();ctx.restore();
      ctx.fillStyle='#171b1e';ctx.fillRect(-8,-5,3,10);
      const pose=(subject.armPose||0)-.5;
      const sleeve=soldier?'#2e4136':'#40515d';
      ctx.save();ctx.rotate(-.9+pose);ctx.fillStyle=sleeve;ctx.fillRect(-2,-3,18,5);ctx.fillStyle='#b88969';ctx.fillRect(13,-3,7,5);ctx.restore();
      ctx.save();ctx.rotate(.85-pose);ctx.fillStyle=sleeve;ctx.fillRect(-2,-2,17,5);ctx.fillStyle='#b88969';ctx.fillRect(12,-2,7,5);ctx.restore();
      ctx.fillStyle=soldier?'#17221c':'#22292d';ctx.fillRect(-10,-5,4,19);ctx.fillRect(-3,3,4,19);
      if(soldier){
        ctx.fillStyle='#0d1210';ctx.fillRect(-11,12,6,8);ctx.fillRect(-4,20,6,6);
        // 충격으로 벗겨져 머리 옆에 떨어진 헬멧.
        ctx.save();ctx.translate(13,-12);ctx.rotate(.55+pose*.4);
        ctx.fillStyle='#1b2821';ctx.fillRect(-5,-3,10,6);
        ctx.fillStyle='#536257';ctx.fillRect(-4,-3,8,2);
        ctx.fillStyle='#101612';ctx.fillRect(-5,2,10,2);ctx.restore();
      }
      ctx.restore();continue;
    }
    const sway=subject.stagger>0?Math.sin(subject.stateTime*34)*3:Math.sin(subject.movePhase||0)*1.2;ctx.translate(0,sway);
    const soldier=subject.role==='soldier';
    ctx.fillStyle=hit?'#7b3932':soldier?'#18201c':'#202a31';ctx.fillRect(-9,-9,18,18);
    ctx.fillStyle=hit?'#bd7967':soldier?'#35483d':'#40515d';ctx.fillRect(-7,-9,14,17);
    ctx.fillStyle='#171b1e';ctx.fillRect(-7,-8,3,14);
    drawSharedHeadLocal();
    if(subject.unarmedTest){
      // P키 시험용 군인: 무기는 들지 않고 양팔만 자연스럽게 내린 표적 상태.
      ctx.save();ctx.rotate(-.18);ctx.fillStyle='#2e4136';ctx.fillRect(3,-6,15,5);ctx.fillStyle='#b88969';ctx.fillRect(15,-6,6,5);ctx.restore();
      ctx.save();ctx.rotate(.22);ctx.fillStyle='#2e4136';ctx.fillRect(3,2,15,5);ctx.fillStyle='#b88969';ctx.fillRect(15,2,6,5);ctx.restore();
    }else if(subject.combatMode==='baton'){
      const swing=subject.attackTime>0?Math.sin((.72-subject.attackTime)/.72*Math.PI)*1.2:0;
      const batonSleeve=soldier?'#35483d':'#40515d';
      ctx.save();ctx.rotate(-.35+swing);
      ctx.fillStyle=batonSleeve;ctx.fillRect(3,-3,9,5);
      ctx.fillStyle='#b88969';ctx.fillRect(11,-3,4,5);
      ctx.fillStyle='#25292a';ctx.fillRect(13,-2,17,3);
      ctx.fillStyle='#44494a';ctx.fillRect(26,-3,5,5);ctx.restore();
    }else{
      drawGuardSharedWeapon(subject,soldier);
    }
    if(subject.hp>0&&subject.hp<subject.maxHp){ctx.fillStyle='#17191a';ctx.fillRect(-11,-18,22,3);ctx.fillStyle='#9d3e35';ctx.fillRect(-11,-18,22*subject.hp/subject.maxHp,3)}
    ctx.restore();
  }
}


function allyIsVisibleToPlayer(ally){
  if(!ally)return false;
  // 조력자도 적과 똑같이 벽 뒤에서는 렌더하지 않는다. 어둠/순간광원 규칙도 공유한다.
  return subjectIsVisible(ally);
}

function drawSquadAllies(){
  for(const ally of squadAllies){
    const point=worldToScreen(ally.x,ally.y);
    if(point.x<-80||point.x>W+80||point.y<-100||point.y>H+80)continue;
    if(ally.airborne){
      // 헬기 아래 로프를 타고 내려오는 동안은 AI/충돌 없이 플레이어 공유 스프라이트만 보인다.
      const dropPoint={x:point.x,y:point.y-(ally.airborneHeight||0)*.34};
      withGuardWeaponContext(ally,()=>{
        const savedPalette=activePlayerSpritePalette;activePlayerSpritePalette=ALLY_PLAYER_SPRITE_PALETTE;
        try{drawPlayer(dropPoint)}finally{activePlayerSpritePalette=savedPalette}
      });
      continue;
    }
    if(!allyIsVisibleToPlayer(ally))continue;

    if(ally.hp<=0){
      ctx.save();
      ctx.translate(Math.round(point.x),Math.round(point.y));
      ctx.rotate((ally.deathAngle||ally.angle)+(ally.corpseTurn||.5));
      ctx.fillStyle='#233238';ctx.fillRect(-10,-8,19,16);
      ctx.fillStyle='#45616b';ctx.fillRect(-8,-6,15,12);
      ctx.fillStyle='#2f7188';ctx.fillRect(-7,-8,4,16);
      ctx.restore();
      continue;
    }

    // 살아있는 조력자는 플레이어의 몸/팔/총기/탄창 줍기 리그를 그대로 사용한다.
    // 차이는 렌더 팔레트뿐이라 같은 모션에서 다른 팀 색으로 보인다.
    withGuardWeaponContext(ally,()=>{
      const savedPalette=activePlayerSpritePalette;
      activePlayerSpritePalette=ALLY_PLAYER_SPRITE_PALETTE;
      try{drawPlayer(point)}finally{activePlayerSpritePalette=savedPalette}
    });

    if(ally.hp<ally.maxHp){
      ctx.fillStyle='#17191a';ctx.fillRect(Math.round(point.x)-11,Math.round(point.y)-23,22,3);
      ctx.fillStyle='#4f9bb0';ctx.fillRect(Math.round(point.x)-11,Math.round(point.y)-23,22*ally.hp/ally.maxHp,3);
    }
  }
}

function drawLimbSegment(x1,y1,x2,y2,width,color){
  const dx=x2-x1;
  const dy=y2-y1;
  const length=Math.hypot(dx,dy);
  ctx.save();
  ctx.translate(x1,y1);
  ctx.rotate(Math.atan2(dy,dx));
  ctx.fillStyle='#5a382e';
  ctx.fillRect(0,-(width+1)/2,length,width+1);
  ctx.fillStyle=color;
  ctx.fillRect(0,-width/2,length,width);
  const owner=bloodSurfaceActor||player;
  let frame=armSurfaceFrames.get(owner);
  if(!frame||frame.frame!==armSurfaceFrame){
    frame={frame:armSurfaceFrame,count:0};armSurfaceFrames.set(owner,frame);
    owner.armHitSegments=[];
  }
  const matrix=ctx.getTransform();
  if(matrix&&Number.isFinite(matrix.a)){
    const origin=worldToScreen(owner.x,owner.y);
    const ca=Math.cos(owner.bodyAngle),sa=Math.sin(owner.bodyAngle);
    const local=(sx,sy)=>{const dx=sx-origin.x,dy=sy-origin.y;return{x:dx*ca+dy*sa,y:-dx*sa+dy*ca};};
    const me=matrix.e/RENDER_SCALE,mf=matrix.f/RENDER_SCALE;
    const ma=matrix.a/RENDER_SCALE,mb=matrix.b/RENDER_SCALE;
    owner.armHitSegments.push({a:local(me,mf),b:local(me+ma*length,mf+mb*length),radius:(width+1)/2});
  }
  drawBloodSurface(owner,'arm'+frame.count++,0,-width/2,length,width);
  ctx.restore();
}

function drawJointBlock(x,y,size,color){
  ctx.fillStyle=color;
  ctx.fillRect(Math.round(x-size/2),Math.round(y-size/2),size,size);
}

function drawHandBloodSurface(x,y,size=4){
  const owner=bloodSurfaceActor||player;
  let frame=armSurfaceFrames.get(owner);
  if(!frame||frame.frame!==armSurfaceFrame){
    frame={frame:armSurfaceFrame,count:0};armSurfaceFrames.set(owner,frame);
    owner.armHitSegments=[];
  }
  ctx.save();ctx.translate(x,y);
  drawBloodSurface(owner,'hand'+frame.count++,-size/2,-size/2,size,size);
  ctx.restore();
}

function solveElbow(shoulderX,shoulderY,handX,handY,upper,forearm,bendSign){
  const dx=handX-shoulderX;
  const dy=handY-shoulderY;
  const rawDistance=Math.max(.001,Math.hypot(dx,dy));
  const distance=clamp(rawDistance,Math.abs(upper-forearm)+.01,upper+forearm-.01);
  const ux=dx/rawDistance;
  const uy=dy/rawDistance;
  const along=(upper*upper-forearm*forearm+distance*distance)/(2*distance);
  const height=Math.sqrt(Math.max(0,upper*upper-along*along));
  return{
    x:shoulderX+ux*along-uy*height*bendSign,
    y:shoulderY+uy*along+ux*height*bendSign
  };
}

function drawRiggedArm(shoulderX,shoulderY,handX,handY,bendSign,sleeveColor=null){
  const elbow=solveElbow(
    shoulderX,shoulderY,handX,handY,
    8.5,9,bendSign
  );
  const forearmDX=handX-elbow.x;
  const forearmDY=handY-elbow.y;
  const forearmLength=Math.max(.001,Math.hypot(forearmDX,forearmDY));
  const wristX=handX-forearmDX/forearmLength*2.2;
  const wristY=handY-forearmDY/forearmLength*2.2;

  if(sleeveColor){
    // 적군은 손만 맨살로 남기고 상완/팔꿈치/전완은 제복 소매로 덮는다.
    drawLimbSegment(shoulderX,shoulderY,elbow.x,elbow.y,5,sleeveColor);
    drawJointBlock(elbow.x,elbow.y,5,sleeveColor);
    drawLimbSegment(elbow.x,elbow.y,wristX,wristY,4,sleeveColor);
    drawJointBlock(wristX,wristY,3,sleeveColor);
    drawLimbSegment(wristX,wristY,handX,handY,4,'#c18460');
    drawJointBlock(handX,handY,4,'#cf9069');
  }else{
    // 플레이어 팔은 기존 맨팔 표현을 유지한다.
    drawLimbSegment(shoulderX,shoulderY,elbow.x,elbow.y,5,'#a96f52');
    drawJointBlock(elbow.x,elbow.y,5,'#b97b59');
    drawLimbSegment(elbow.x,elbow.y,wristX,wristY,4,'#c18460');
    drawJointBlock(wristX,wristY,3,'#9f654b');
    drawLimbSegment(wristX,wristY,handX,handY,4,'#c18460');
    drawJointBlock(handX,handY,4,'#cf9069');
  }
  drawHandBloodSurface(handX,handY,4.4);
}

function drawPistolSprintArm(rig){
  const shoulder={x:-.35,y:-5.5};
  const normalElbow=solveElbow(
    shoulder.x,shoulder.y,
    rig.supportGrip.x,rig.supportGrip.y,
    8.5,9,-1
  );
  const pump=Math.sin(player.movePhase+Math.PI);
  // 팔을 머리 위로 벌리지 않고 몸의 왼쪽 옆선을 따라 앞뒤로만 흔든다.
  const sprintElbow={x:-1+pump*2.8,y:-8.5};
  const sprintHand={x:-5+pump*4,y:-9.5};
  const blend=smoothStep01(rig.sprintSupport);
  const elbow=lerpPoint(normalElbow,sprintElbow,blend);
  const hand=lerpPoint(rig.supportGrip,sprintHand,blend);
  const forearmDX=hand.x-elbow.x;
  const forearmDY=hand.y-elbow.y;
  const forearmLength=Math.max(.001,Math.hypot(forearmDX,forearmDY));
  const wrist={
    x:hand.x-forearmDX/forearmLength*1.8,
    y:hand.y-forearmDY/forearmLength*1.8
  };
  drawLimbSegment(
    shoulder.x,shoulder.y,elbow.x,elbow.y,5,'#a96f52'
  );
  drawJointBlock(elbow.x,elbow.y,5,'#b97b59');
  drawLimbSegment(elbow.x,elbow.y,wrist.x,wrist.y,4,'#c18460');
  drawJointBlock(wrist.x,wrist.y,3,'#9f654b');
  drawLimbSegment(wrist.x,wrist.y,hand.x,hand.y,4,'#c18460');
  drawJointBlock(hand.x,hand.y,4,'#cf9069');
  drawHandBloodSurface(hand.x,hand.y,4.4);
}

function drawPistolSprintPrimaryArm(rig){
  const shoulder={x:-1.65,y:5.5};
  const normalElbow=solveElbow(
    shoulder.x,shoulder.y,
    rig.primaryHand.x,rig.primaryHand.y,
    8.5,9,1
  );
  // 질주 중에는 로우캐리든 정조준이든 오른팔을 한 줄로 편다. 우클릭하면
  // 이 직선 전체가 아래쪽에서 목표 방향으로 회전할 뿐 팔꿈치는 접히지 않는다.
  const straightElbow=lerpPoint(shoulder,rig.primaryHand,.47);
  const blend=smoothStep01(rig.sprintPrimaryStraight);
  const elbow=lerpPoint(normalElbow,straightElbow,blend);
  const hand=rig.primaryHand;
  const wrist=lerpPoint(elbow,hand,.80);
  drawLimbSegment(
    shoulder.x,shoulder.y,elbow.x,elbow.y,5,'#a96f52'
  );
  drawJointBlock(elbow.x,elbow.y,5,'#b97b59');
  drawLimbSegment(elbow.x,elbow.y,wrist.x,wrist.y,4,'#c18460');
  drawJointBlock(wrist.x,wrist.y,3,'#9f654b');
  drawLimbSegment(wrist.x,wrist.y,hand.x,hand.y,4,'#c18460');
  drawJointBlock(hand.x,hand.y,4,'#cf9069');
  drawHandBloodSurface(hand.x,hand.y,4.4);
}

function drawMagazineLocal(x,y,angle,alpha=1,magazineType=null){
  const type=magazineType||currentWeaponDef().magazineType;
  const rifleMagazine=type==='rifle762';
  const assaultMagazine=type==='rifle556';
  const lmgBox=type==='lmg556';
  const length=lmgBox?13:(rifleMagazine?10:(assaultMagazine?12:(type==='smg22'?12:8)));
  const thickness=lmgBox?9:(rifleMagazine?6:(assaultMagazine?5:3));
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.translate(x,y);
  ctx.rotate(angle);
  ctx.fillStyle='#202427';
  if(rifleMagazine||assaultMagazine||lmgBox){
    // 20발들이 7.62mm 박스탄창: 길쭉한 막대가 아니라 짧고 폭이 넓은 직선형 몸체.
    ctx.beginPath();
    ctx.moveTo(-length/2+1,-thickness/2);ctx.lineTo(length/2,-thickness/2);
    ctx.lineTo(length/2,thickness/2-1);ctx.lineTo(length/2-1,thickness/2);
    ctx.lineTo(-length/2,thickness/2);ctx.lineTo(-length/2,-thickness/2+1);
    ctx.closePath();ctx.fill();
  }else{
    ctx.fillRect(-length/2,-thickness/2,length,thickness);
  }
  ctx.fillStyle='#53595b';
  ctx.fillRect(-length/2+1,-thickness/2+1,length-3,1);
  if(rifleMagazine||assaultMagazine||lmgBox){
    ctx.fillStyle='#3b4143';ctx.fillRect(-2,-thickness/2+1,1,thickness-2);
    ctx.fillRect(2,-thickness/2+1,1,thickness-2);
  }
  ctx.fillStyle='#111416';
  ctx.fillRect(-length/2,thickness/2-1,length,1);
  ctx.restore();
}

const SHOTGUN_BARREL_THICKNESS=2.5;

function drawPistolFrame(breakOpen=0){
  if(currentWeaponDef().id==='pistol'){
    drawAutoPistolFrame();
    return;
  }
  if(currentWeaponDef().plasma){
    const shotPower=pistol.plasmaLastShotPower||0;
    const coolingFraction=clamp(pistol.thermalLock/(.4+3.6*shotPower),0,1);
    const heat=coolingFraction*(.5+.5*shotPower);
    const overheat=shotPower*Math.pow(coolingFraction,.8);
    // 참고 이미지의 두꺼운 상부 본체, 아래 수소 셀, 후방 원통 냉각기를 탑뷰로 압축했다.
    ctx.fillStyle='#171b1e';ctx.fillRect(-4,-3.1,13,6.2);
    ctx.fillStyle='#3b4246';ctx.fillRect(-3,-2.5,12,4.5);
    ctx.fillStyle='#687075';ctx.fillRect(-2.1,-1.9,8.7,.6);
    ctx.fillStyle='#202529';ctx.fillRect(7.4,-2,6.8,4);
    ctx.fillStyle='#727a7e';ctx.fillRect(8.1,-1.35,4.9,.7);
    ctx.fillStyle='#111517';ctx.fillRect(13,-2.4,2,4.8);
    // 수소 저장부는 돌출 탄창이 아니라 총몸 아래에 밀착된 얇은 밀폐 셀이다.
    ctx.fillStyle='#12171a';ctx.fillRect(-2,2.35,6.8,2);
    ctx.fillStyle='#454d51';ctx.fillRect(-1.1,2.7,5.1,1.2);
    ctx.fillStyle='#718086';ctx.fillRect(-.5,2.9,3.4,.4);
    // 뒤쪽 원통 냉각기: 슬롯 속 적열이 회전 위상에 따라 위치를 바꾼다.
    ctx.fillStyle='#0b0e10';ctx.fillRect(-6.1,-3.5,2.6,7);
    ctx.fillStyle='#464e52';ctx.fillRect(-7.7,-3,2.1,6);
    ctx.fillStyle='#747d80';ctx.fillRect(-7.7,-3,2.1,.55);
    // 과충전은 슬롯뿐 아니라 원통 외피까지 열이 번진다.
    if(overheat>0){
      ctx.fillStyle=`rgba(211,66,30,${overheat*.62})`;
      ctx.fillRect(-7.7,-3,4.2,6);
    }
    const phase=Math.floor(pistol.coolerSpin*3)%4;
    for(let i=0;i<4;i++){
      const y=-2.35+i*1.55;
      ctx.fillStyle='#050708';ctx.fillRect(-7.4,y,3.6,.95);
      if(heat>0){
        const rotation=(i+phase)%4===0?1:.62;
        const glow=clamp(coolingFraction*.28+heat*.55*rotation+overheat*.20,0,1);
        ctx.fillStyle=`rgba(${Math.round(214+overheat*36)},${Math.round(103+overheat*32)},55,${glow})`;
        ctx.fillRect(-7.05,y+.16,2.6,.62);
      }
    }
    ctx.fillStyle='#858d90';ctx.fillRect(-7.7,-3.5,4.5,.6);
    ctx.fillStyle='#1a1f21';ctx.fillRect(-7.9,2.8,4.3,.7);
    if(overheat>0){
      ctx.fillStyle=`rgba(239,108,49,${overheat*.45})`;
      ctx.fillRect(-7.7,-3.5,4.5,.6);
      ctx.fillRect(-7.9,2.8,4.3,.7);
    }
    return;
  }
  if(currentWeaponDef().id==='revolver'){
    // 소형 .22 LR 리볼버. 자동권총보다 짧고 얇은 프레임 안에 작은 실린더가 묻힌다.
    ctx.fillStyle='#513323';
    ctx.beginPath();ctx.moveTo(-5.5,-2.5);ctx.lineTo(-1,-2.1);ctx.lineTo(.5,1.8);
    ctx.lineTo(-2.5,4);ctx.lineTo(-6,2.5);ctx.closePath();ctx.fill();
    ctx.fillStyle='#86563a';ctx.fillRect(-4.8,-1.6,3.2,1);
    const cylinderY=-breakOpen*5.2;
    // 손에 든 탑뷰에서는 약실의 둥근 정면이 아니라 총열과 평행한 실린더의
    // 윗면/옆면이 보여야 한다. 축은 항상 +X(총구) 방향으로 놓는다.
    ctx.fillStyle='#252b2d';
    ctx.beginPath();
    ctx.moveTo(-.5,cylinderY-2.8);ctx.lineTo(4.5,cylinderY-2.8);
    ctx.lineTo(5.8,cylinderY-1.8);ctx.lineTo(5.8,cylinderY+1.8);
    ctx.lineTo(4.5,cylinderY+2.8);ctx.lineTo(-.5,cylinderY+2.8);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#626a6c';ctx.lineWidth=.8;ctx.stroke();
    // 길이 방향 플루트가 총열 축을 다시 읽히게 한다.
    ctx.fillStyle='#111516';
    ctx.fillRect(.3,cylinderY-1.9,4.5,.7);
    ctx.fillRect(.3,cylinderY+1.2,4.5,.7);
    ctx.fillStyle='#596163';ctx.fillRect(.2,cylinderY-.35,5,.7);
    // 실린더는 먼저 그린 뒤 프레임 브리지를 덮어 총 위에 얹힌 레이어처럼 보이지 않게 한다.
    ctx.fillStyle='#303638';
    ctx.fillRect(-1.5,-3.2,7.5,1.2);
    ctx.fillRect(-1.5,2,7.5,1.2);
    ctx.fillRect(-1.5,-2,1.3,4);
    ctx.fillStyle='#5f6769';ctx.fillRect(-.7,-2.8,5.8,.6);
    if(breakOpen>.04){
      ctx.fillStyle='#171b1c';ctx.fillRect(.2,-2.1,4.8,4.2);
    }
    // 뒤 프레임과 총열 뿌리를 잇는 상부 탑 스트랩. 탑뷰에서는 실린더
    // 중앙 위를 가로질러 보여야 하며, 양옆으로 실린더 곡면만 드러난다.
    ctx.fillStyle='#353b3d';ctx.fillRect(-1.4,-1.15,7.6,2.3);
    ctx.fillStyle='#737b7c';ctx.fillRect(-.5,-.75,6.1,.55);
    ctx.fillStyle='#181c1d';ctx.fillRect(4.9,.45,1.3,.7);
    ctx.fillStyle='#343a3c';ctx.fillRect(5,-1.5,9.5,3);
    ctx.fillStyle='#737b7c';ctx.fillRect(6,-1,7.2,.7);
    ctx.fillStyle='#15191a';ctx.fillRect(13.5,-1.9,1.5,3.8);
    return;
  }
  if(currentWeaponDef().id==='pumpShotgun'){
    const def=currentWeaponDef();
    const pumpProgress=pistol.pumpActive?clamp(pistol.pumpElapsed/(def.pumpDuration||.52),0,1):0;
    const back=pumpProgress<.5?smoothStep01(pumpProgress/.5):1-smoothStep01((pumpProgress-.5)/.5);
    const pumpShift=-6*back;
    // 소드오프보다 길지만 전체 두께는 얇은 전술형 펌프액션 실루엣.
    ctx.fillStyle='#5b3928';ctx.fillRect(-13,-2.5,11,5);
    ctx.fillStyle='#8a5739';ctx.fillRect(-12,-1.8,8,1.4);
    ctx.fillStyle='#24292b';ctx.fillRect(-2,-3,10,6);
    ctx.fillStyle='#555b5d';ctx.fillRect(-1,-2.2,8,1.4);
    // 총열 아래의 5발 튜브와 그 튜브를 감싸는 펌프를 먼저 그린다.
    // 총열은 마지막 레이어에 올려 핸드가드가 총열 위를 덮는 것처럼 보이지 않게 한다.
    ctx.fillStyle='#24292b';ctx.fillRect(8,1.2,25,1.7);
    ctx.fillStyle='#66412d';ctx.fillRect(15+pumpShift,-2.45,10,4.9);
    ctx.fillStyle='#946041';ctx.fillRect(16+pumpShift,-1.85,8,1.05);
    ctx.fillStyle='#3e281f';ctx.fillRect(16+pumpShift,1.35,8,0.62);
    // 단일 총열은 펌프보다 위 레이어에서 끝까지 이어진다.
    const barrelY=-SHOTGUN_BARREL_THICKNESS/2-.7;
    ctx.fillStyle='#33383a';ctx.fillRect(8,barrelY,28,SHOTGUN_BARREL_THICKNESS);
    ctx.fillStyle='#666c6d';ctx.fillRect(9,barrelY+.45,25,.8);
    ctx.fillStyle='#171a1b';ctx.fillRect(34,barrelY-.35,2,SHOTGUN_BARREL_THICKNESS+.7);
    return;
  }
  if(currentWeaponDef().id==='shotgun'){
    // 참고 스프라이트의 핵심 비율: 짧은 목재 개머리판, 짧은 브리치,
    // 동일 굵기의 평행 총열 두 개. +X가 총구 방향이다.
    const barrelLength=20-breakOpen*2;
    const barrelX=5+breakOpen*3;
    ctx.fillStyle='#5b3928';
    ctx.beginPath();
    ctx.moveTo(-10,-3.5);
    ctx.lineTo(-2,-3.5);
    ctx.lineTo(0,-3);
    ctx.lineTo(0,3);
    ctx.lineTo(-2,3.5);
    ctx.lineTo(-10,3.5);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle='#8a5739';

    ctx.fillStyle='#303638';ctx.fillRect(-3,-4,15,8);
    ctx.fillStyle='#697174';ctx.fillRect(-1,-3,11,1.2);
    ctx.fillStyle='#15191b';ctx.fillRect(7,-2,5,4);
    ctx.strokeStyle='#737b7d';ctx.strokeRect(0,3,6,3.8);
    ctx.fillStyle='#252b2d';
    ctx.beginPath();ctx.moveTo(-1,3);ctx.lineTo(5,3);ctx.lineTo(3,9);ctx.lineTo(-2,8.5);ctx.closePath();ctx.fill();
    if(pistol.magazine){
      ctx.fillStyle='#1a1f21';
      ctx.beginPath();ctx.moveTo(5,3);ctx.lineTo(12,3);ctx.lineTo(13,10);ctx.lineTo(7,10);ctx.closePath();ctx.fill();
      ctx.fillStyle='#4d5558';ctx.fillRect(7,4,1,5);ctx.fillRect(10,4,1,5);
    }
    ctx.fillStyle='#252b2d';ctx.fillRect(11,-3.2,13,6.4);
    ctx.fillStyle='#586164';ctx.fillRect(12,-2.3,11,1.1);
    ctx.fillStyle='#15191b';ctx.fillRect(23,-1.8,9,3.6);
    ctx.fillStyle='#697174';ctx.fillRect(24,-.8,8,.9);
    ctx.fillStyle='#111516';ctx.fillRect(31,-2.2,4,4.4);
    ctx.fillStyle='#92999a';ctx.fillRect(19,-5,1.4,2);
    ctx.restore();
    return;
  }

  // 목재 개머리판과 견착판
  ctx.fillStyle='#5a3827';
  ctx.beginPath();
  ctx.moveTo(-16,-4);ctx.lineTo(-5,-3.5);ctx.lineTo(-1,-1.8);
  ctx.lineTo(-1,3);ctx.lineTo(-7,4);ctx.lineTo(-16,3);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#8a5739';ctx.fillRect(-14,-2.8,9,1.3);
  ctx.fillStyle='#24292b';ctx.fillRect(-17,-4,2,7);
  ctx.fillStyle='#697073';ctx.fillRect(-17,-3,1,5);

  // 리시버, 방아쇠울과 권총손잡이
  ctx.fillStyle='#272d2f';ctx.fillRect(-3,-4,15,8);
  ctx.fillStyle='#5b6264';ctx.fillRect(-1,-3,11,1.3);
  ctx.fillStyle='#171b1d';ctx.fillRect(7,-2,5,4);
  ctx.strokeStyle='#72797b';ctx.strokeRect(0,3,6,4);
  ctx.fillStyle='#593a28';
  ctx.beginPath();ctx.moveTo(-1,3);ctx.lineTo(5,3);ctx.lineTo(3,10);ctx.lineTo(-2,9);ctx.closePath();ctx.fill();

  // 곧은 20발들이 7.62mm 탄창
  if(pistol.magazine){
    ctx.fillStyle='#1a1f21';
    ctx.beginPath();ctx.moveTo(5,3);ctx.lineTo(13,3);ctx.lineTo(12,10);ctx.lineTo(5,10);ctx.closePath();ctx.fill();
    ctx.fillStyle='#596164';ctx.fillRect(6,4,1.2,5);
    ctx.fillStyle='#363c3e';ctx.fillRect(9,4,1,5);ctx.fillRect(11,4,1,5);
    ctx.fillStyle='#0e1112';ctx.fillRect(5,9,7,1);
  }

  // 목재 핸드가드와 긴 총열
  ctx.fillStyle='#593925';ctx.fillRect(11,-3,14,6);
  ctx.fillStyle='#8b5b3b';ctx.fillRect(12,-2.2,12,1.2);
  ctx.fillStyle='#313739';ctx.fillRect(24,-1.7,13,3.4);
  ctx.fillStyle='#687174';ctx.fillRect(25,-1,10,1);
  ctx.fillStyle='#171b1d';ctx.fillRect(36,-2.2,3,4.4);
  ctx.fillStyle='#9aa09f';ctx.fillRect(19,-5,1.5,2);
  ctx.restore();
}

function buildActorMagazinePickupPose(actor,pickup){
  if(!actor||!pickup?.active||!pickup.magazine)return null;
  const progress=clamp(
    pickup.elapsed/MAGAZINE_PICKUP_TIME,0,1
  );
  let reach=1;
  if(progress<MAGAZINE_PICKUP_COMMIT){
    reach=smoothStep01(progress/MAGAZINE_PICKUP_COMMIT);
  }else if(progress>.58){
    reach=1-smoothStep01((progress-.58)/.42);
  }

  const magazine=pickup.magazine;
  const dx=magazine.x-actor.x;
  const dy=magazine.y-actor.y;
  const cos=Math.cos(actor.bodyAngle);
  const sin=Math.sin(actor.bodyAngle);
  const localX=dx*cos+dy*sin;
  const localY=-dx*sin+dy*cos;
  // 몸 전체도 탄창 쪽으로 숙여 짧은 팔이 실제 바닥 물체까지 닿도록 한다.
  const bodyLean=clamp(Math.hypot(dx,dy)-14,0,7)*reach;
  const shoulder={x:-.35,y:-5.5};
  const target={x:localX-bodyLean,y:localY};
  const armDX=target.x-shoulder.x;
  const armDY=target.y-shoulder.y;
  const armDistance=Math.max(.001,Math.hypot(armDX,armDY));
  const reachScale=Math.min(1,17.1/armDistance);

  return{
    progress,
    reach,
    bodyLean,
    handTarget:{
      x:shoulder.x+armDX*reachScale,
      y:shoulder.y+armDY*reachScale
    },
    magazineInHand:pickup.collected&&progress<.92
  };
}

function buildMagazinePickupPose(){
  return buildActorMagazinePickupPose(player,magazinePickup);
}

function buildWeaponPickupPose(){
  const swap=weaponSwitch.pickupSwap;
  if(!weaponSwitch.active||!swap||weaponSwitch.committed)return null;
  const progress=clamp(weaponSwitch.elapsed/weaponSwitch.duration,0,1);
  const start=.24;
  const end=weaponSwitch.commitRatio;
  const reach=smoothStep01(clamp((progress-start)/(end-start),0,1));
  if(reach<=0)return null;
  const pickup=swap.pickupRef||(swap.slot==='sidearm'
    ?(swap.pickupKind==='plasma'?testPlasmaPickup:testSidearmPickup)
    :(swap.pickupKind==='assault'
      ?testAssaultWeaponPickup
      :(swap.pickupKind==='pump'?testPumpWeaponPickup:testWeaponPickup)));
  const dx=pickup.x-player.x;
  const dy=pickup.y-player.y;
  const cos=Math.cos(player.bodyAngle),sin=Math.sin(player.bodyAngle);
  const localX=dx*cos+dy*sin;
  const localY=-dx*sin+dy*cos;
  const bodyLean=clamp(Math.hypot(dx,dy)-15,0,7)*reach;
  const center={x:localX-bodyLean,y:localY};
  const makeHand=(shoulder,side)=>{
    const target={x:center.x,y:center.y+side*2.1};
    const ax=target.x-shoulder.x,ay=target.y-shoulder.y;
    const distance=Math.max(.001,Math.hypot(ax,ay));
    const scale=Math.min(1,17.4/distance);
    return{x:shoulder.x+ax*scale,y:shoulder.y+ay*scale};
  };
  return{
    reach,bodyLean,
    supportHand:makeHand({x:1.5,y:-5.8},-1),
    primaryHand:makeHand({x:-2.5,y:5.8},1)
  };
}

function buildPistolRig(){
  const def=currentWeaponDef();
  const progress=pistol.reloading?currentReloadProgress(def):0;
  const pistolAttackActive=['pistol','revolver','plasmaPistol'].includes(def.id)&&!!pistolMelee.attack;
  let pose;
  if(pistolAttackActive){
    // 질주 잔상 자세를 근접공격 목표 자세로 쓰지 않는다. 직전 모습은 아래 진입 보간이 담당한다.
    const savedSprintBlend=player.sprintBlend;
    player.sprintBlend=0;
    pose=pistolPoseAt(progress);
    player.sprintBlend=savedSprintBlend;
  }else{
    pose=pistolPoseAt(progress);
  }
  const weaponPickupPose=buildWeaponPickupPose();
  const meleeAttack=['pistol','revolver','plasmaPistol'].includes(def.id)?pistolMelee.attack:null;
  const meleeProgress=meleeAttack?pistolMeleeProgress():0;
  const smgAttack=def.id==='smg'?smgMelee.attack:null;
  const smgProgress=smgAttack?smgMeleeProgress():0;
  const rifleAttack=['battleRifle','assaultRifle','lmg','pumpShotgun'].includes(def.id)?rifleMelee.attack:null;
  const rifleProgress=rifleAttack?rifleMeleeProgress():0;
  const shotgunAttack=def.id==='shotgun'?shotgunMelee.attack:null;
  const shotgunProgress=shotgunAttack?shotgunMeleeProgress():0;
  let meleePulse=0;
  let meleeSideView=0;
  let rifleMeleeSideView=0;
  let rifleBodyTurn=0;

  if(meleeAttack==='palm'){
    meleePulse=pistolPalmPulse01(meleeProgress);
    // 오른손과 권총은 갈비뼈 쪽으로 숨기고 왼손이 정면을 연다.
    pose.gunX+=(5.2-pose.gunX)*meleePulse;
    pose.gunY+=(5.1-pose.gunY)*meleePulse;
    pose.turn+=.48*meleePulse;
  }else if(meleeAttack==='magazine'){
    const strike=pistolMagazineStrikePose(meleeProgress);
    const base={x:pose.gunX,y:pose.gunY,turn:pose.turn};
    // 손잡이 바닥이 앞을 향한 파지로 부드럽게 넘어간 뒤 정면으로만 왕복한다.
    // 실제 타격 구간에서는 각도를 고정해 권총을 휘돌리는 인상이 생기지 않는다.
    const tucked={x:4.4,y:3.5,turn:base.turn-Math.PI/2};
    // 오른손의 실제 손 위치가 어깨에서 팔 길이 한계까지 도달하도록 전진시킨다.
    const impact={x:13.9,y:0,turn:tucked.turn};
    pose.gunX=tucked.x+(impact.x-tucked.x)*strike.amount;
    pose.gunY=tucked.y+(impact.y-tucked.y)*strike.amount;
    meleeSideView=meleeProgress<.24
      ?smoothStep01(meleeProgress/.24)
      :meleeProgress>.72?1-smoothStep01((meleeProgress-.72)/.28):1;
    // 옆면 그림이 섞이는 비율과 파지 전환을 묶어 시작·종료 프레임의 튐을 없앤다.
    pose.turn=base.turn+normAngle(tucked.turn-base.turn)*meleeSideView;
  }
  if(smgAttack==='muzzle'){
    // 양손 파지를 유지한 채 총 전체를 짧고 빠르게 전진시켜 총구로 찌른다.
    pose.gunX+=5.0*smgMuzzlePulse01(smgProgress);
  }else if(smgAttack==='bodyPush'){
    const push=smgBodyPushPose(smgProgress);
    // 총몸을 가로세운 뒤 그 각도를 유지하며 옆면으로 확 밀어낸다.
    pose.turn-=1.35*push.turn;
    pose.gunX+=(push.forward||0)+6.0*push.drive;
    pose.gunY-=1.0*push.drive;
  }
  if(rifleAttack==='muzzle'){
    pose.gunX+=(def.id==='assaultRifle'?6.5:7.5)*rifleMuzzlePulse01(rifleProgress);
  }else if(rifleAttack==='stockSweep'){
    const sweep=rifleStockSweepPose(rifleProgress);
    pose.turn+=sweep.turn;
    const reach=def.id==='assaultRifle'?.92:1;
    pose.gunX+=sweep.forward*reach;
    pose.gunY+=sweep.side*reach;
    rifleBodyTurn=sweep.bodyTurn;
    rifleMeleeSideView=rifleMelee.flowingFromMuzzle
      ?(rifleProgress<.09?smoothStep01(rifleProgress/.09):
        (rifleProgress>.84?1-smoothStep01((rifleProgress-.84)/.16):1))
      :rifleProgress<.16
      ?smoothStep01(rifleProgress/.16)
      :rifleProgress>.84?1-smoothStep01((rifleProgress-.84)/.16):1;
  }else if(rifleAttack==='stockStrike'){
    const strike=rifleStockStrikePose(rifleProgress);
    pose.turn+=strike.turn;
    const reach=def.id==='assaultRifle'?.92:1;
    pose.gunX+=strike.forward*reach;
    pose.gunY+=strike.side*reach;
    rifleBodyTurn=strike.bodyTurn||0;
    // 2타 끝자세에서 바로 들어온 경우 옆면이 갑자기 사라지지 않게 파지 전환과 함께 걷어낸다.
    if(rifleMelee.chainedEntry&&rifleProgress<.22){
      rifleMeleeSideView=1-smoothStep01(rifleProgress/.22);
    }
  }
  if(shotgunAttack){
    const swing=shotgunSwingPose(shotgunProgress);
    pose.turn+=swing.turn;
    pose.gunX+=swing.forward;
    pose.gunY+=swing.side;
  }
  const reloadExitActive=!pistol.reloading&&!meleeAttack&&!!pistol.reloadExitPose;
  const hydrogenExitElapsed=pistol.reloadExitElapsed;
  const actionEntryPose=pistol.reloading
    ?pistol.reloadEntryPose
    :(meleeAttack?pistol.meleeEntryPose:(reloadExitActive?pistol.reloadExitPose:null));
  let actionEntryBlend=1;
  if(actionEntryPose){
    const entryElapsed=pistol.reloading
      ?pistol.reloadElapsed:(meleeAttack?pistolMelee.elapsed:pistol.reloadExitElapsed);
    const entryDuration=pistol.reloading?.14:(meleeAttack?.085:(def.plasma?.42:.18));
    actionEntryBlend=smoothStep01(clamp(entryElapsed/entryDuration,0,1));
    pose.gunX=actionEntryPose.gunX+(pose.gunX-actionEntryPose.gunX)*actionEntryBlend;
    pose.gunY=actionEntryPose.gunY+(pose.gunY-actionEntryPose.gunY)*actionEntryBlend;
    pose.turn=actionEntryPose.turn+normAngle(pose.turn-actionEntryPose.turn)*actionEntryBlend;
    if(actionEntryBlend>=1){
      if(pistol.reloading)pistol.reloadEntryPose=null;
      else if(meleeAttack)pistol.meleeEntryPose=null;
      else{
        pistol.reloadExitPose=null;
        pistol.reloadExitElapsed=0;
      }
    }
  }
  // 로컬 +Y가 캐릭터의 오른쪽이다. 오른손은 그립의 오른쪽 면을 잡고,
  // 왼손은 -Y 쪽의 몸 옆과 탄창 주머니에서 움직인다.
  let primaryHand=gunPoint(pose,def.primaryGrip.x,def.primaryGrip.y);
  let supportGrip=gunPoint(pose,def.supportGrip.x,def.supportGrip.y);
  const rifleForwardSupportGrip=def.id==='battleRifle'&&!rifleAttack&&
    !pistol.reloading&&!magazinePickup.active&&!weaponSwitch.active;
  if(rifleForwardSupportGrip){
    // 정상 운용 때만 핸드가드 거의 끝을 잡아 7.62mm 반동을 눌러내는 긴 지지 자세를 만든다.
    supportGrip=gunPoint(pose,16.3,-2.2);
  }
  if(def.id==='pumpShotgun'&&pistol.pumpActive){
    const pp=clamp(pistol.pumpElapsed/(def.pumpDuration||.52),0,1);
    const back=pp<.5?smoothStep01(pp/.5):1-smoothStep01((pp-.5)/.5);
    supportGrip=gunPoint(pose,def.supportGrip.x-6*back,def.supportGrip.y);
  }
  const pouchHand={x:-5,y:-11.5};
  const stagingHand={x:def.id==='smg'?12:10,y:-11.5};
  const magazineWell=gunPoint(
    pose,def.magazineWell.x,def.magazineWell.y
  );
  const pickupPose=buildMagazinePickupPose();
  let weaponAlpha=1;
  if(weaponSwitch.active&&weaponSwitch.pickupSwap){
    const wp=clamp(weaponSwitch.elapsed/weaponSwitch.duration,0,1);
    const wc=weaponSwitch.commitRatio;
    weaponAlpha=weaponSwitch.committed
      ?smoothStep01(clamp((wp-wc)/(1-wc),0,1))
      :1-smoothStep01(clamp(wp/wc,0,1));
  }
  let supportHand=supportGrip;
  let newMagazine=false;
  let oldMagazine=false;
  let newMagazineAngle=-.12;
  let breakOpen=0;
  let shotgunShellsInHand=0;
  let moonClipInHand=0;
  let slideOffset=shotSlideOffset();
  const slideTravel=def.slideTravel;
  // 빈 총 장전에서는 잠긴 위치보다 더 뒤로 확실히 당겼다가 놓는다.
  const pulledSlide=slideTravel+(def.id==='smg'?2.8:2.2);
  const actionX=def.id==='smg'?6:8;
  const actionY=def.id==='smg'?-4:-2.5;

  // 평상시에는 왼손도 그립을 감싸 양손으로 파지한다. 장전할 때만 총에서
  // 손을 떼고 몸 바깥쪽을 돌아 탄창 주머니로 이동한다.
  if(pistol.reloading){
    if(def.plasma){
      const tankPort=gunPoint(pose,1,-7);
      if(progress<.14) supportHand=lerpPoint(supportGrip,pouchHand,smoothStep01(progress/.14));
      else if(progress<.34) supportHand=lerpPoint(pouchHand,tankPort,smoothStep01((progress-.14)/.20));
      else supportHand=tankPort;
    }else if(def.id==='revolver'){
      const cylinderHand=gunPoint(pose,3,-5.8);
      const clipHand={x:9,y:-11.5};
      if(progress<.16){
        supportHand=lerpPoint(supportGrip,cylinderHand,smoothStep01(progress/.16));
        breakOpen=smoothStep01(progress/.16);
      }else if(progress<.34){
        supportHand=cylinderHand;
        breakOpen=1;
      }else if(progress<.52){
        supportHand=lerpPoint(cylinderHand,clipHand,smoothStep01((progress-.34)/.18));
        breakOpen=1;
        moonClipInHand=1;
      }else if(progress<.68){
        supportHand=lerpPoint(clipHand,cylinderHand,smoothStep01((progress-.52)/.16));
        breakOpen=1;
        moonClipInHand=1;
      }else if(progress<.84){
        supportHand=cylinderHand;
        breakOpen=1-smoothStep01((progress-.68)/.16);
      }else{
        supportHand=lerpPoint(cylinderHand,supportGrip,smoothStep01((progress-.84)/.16));
      }
    }else if(def.id==='pumpShotgun'){
      const loadPort=gunPoint(pose,3,-3.4);
      // 한 발을 꺼내 삽입한 뒤 손이 다시 주머니로 되돌아가지 않고,
      // 로딩 포트에서 그 길로 전방 펌프 가드를 잡는다.
      if(progress<.40){
        supportHand=lerpPoint(supportGrip,pouchHand,smoothStep01(progress/.40));
      }else if(progress<.70){
        supportHand=lerpPoint(pouchHand,loadPort,smoothStep01((progress-.40)/.30));
      }else{
        supportHand=lerpPoint(loadPort,supportGrip,smoothStep01((progress-.70)/.30));
      }
      shotgunShellsInHand=progress>=.34&&progress<.73
        ?(pistol.pumpReloadUseSpeedloader?pistol.reloadShellsTarget:1):0;
    }else if(def.id==='shotgun'){
      const hingeHand=gunPoint(pose,9,-3.5);
      const breechHand=gunPoint(pose,7,-4.5);
      if(progress<.40){
        // Right thumb releases the latch; the spring opens the barrels without a left-hand pull.
        breakOpen=smoothStep01((progress-.035)/.085);
        const latch=Math.sin(Math.PI*clamp(progress/.12,0,1));
        primaryHand={x:primaryHand.x+.35*latch,y:primaryHand.y-.6*latch};
        supportHand=lerpPoint(supportGrip,pouchHand,smoothStep01(progress/.40));
      }else if(progress<.62){
        breakOpen=1;
        supportHand=lerpPoint(pouchHand,breechHand,(progress-.40)/.22);
        shotgunShellsInHand=pistol.reloadShellsTarget;
      }else if(progress<.76){
        breakOpen=1;
        supportHand=lerpPoint(breechHand,hingeHand,(progress-.62)/.14);
      }else if(progress<.87){
        breakOpen=1-smoothStep01((progress-.76)/.11);
        supportHand=hingeHand;
      }else{
        supportHand=lerpPoint(hingeHand,supportGrip,(progress-.87)/.13);
      }
    }else if(pistol.reloadKeepMagazine&&progress<.68){
      // 작업대 교환: 기존 탄창을 왼손으로 뽑아 주머니에 넣은 다음
      // 선택 탄창을 꺼낸다. 어느 순간에도 탄창을 바닥으로 떨어뜨리지 않는다.
      if(progress<.08){
        supportHand=lerpPoint(supportGrip,stagingHand,progress/.08);
      }else if(progress<.16){
        supportHand=lerpPoint(stagingHand,magazineWell,(progress-.08)/.08);
      }else if(progress<.34){
        supportHand=lerpPoint(magazineWell,pouchHand,(progress-.16)/.18);
        oldMagazine=progress>=.16;
      }else if(progress<.52){
        supportHand=lerpPoint(pouchHand,stagingHand,(progress-.34)/.18);
        newMagazine=true;
      }else{
        const t=(progress-.52)/.16;
        supportHand=lerpPoint(stagingHand,magazineWell,t);
        newMagazine=true;
        newMagazineAngle=-.12*(1-smoothStep01(t));
      }
    }else if(pistol.reloadKeepMagazine){
      // 빈 탄창에서 교환했을 때만 슬라이드/볼트를 조작한다.
      if(pistol.reloadWasEmpty&&progress<.74){
        const slideHand=gunPoint(pose,actionX,actionY);
        supportHand=lerpPoint(magazineWell,slideHand,(progress-.68)/.06);
        slideOffset=-slideTravel;
      }else if(pistol.reloadWasEmpty&&progress<.82){
        const t=(progress-.74)/.08;
        slideOffset=-slideTravel-smoothStep01(t)*(pulledSlide-slideTravel);
        supportHand=gunPoint(pose,actionX+slideOffset,actionY);
      }else if(pistol.reloadWasEmpty&&progress<.84){
        slideOffset=-pulledSlide;
        supportHand=gunPoint(pose,actionX-pulledSlide,actionY);
      }else if(pistol.reloadWasEmpty&&progress<.88){
        const t=(progress-.84)/.04;
        slideOffset=-pulledSlide*(1-smoothStep01(t));
        supportHand=gunPoint(pose,actionX-pulledSlide,actionY);
      }else if(pistol.reloadWasEmpty&&progress<.93){
        const releaseHand=gunPoint(pose,actionX-pulledSlide,actionY);
        supportHand=lerpPoint(releaseHand,stagingHand,(progress-.88)/.05);
      }else if(pistol.reloadWasEmpty){
        supportHand=lerpPoint(stagingHand,supportGrip,(progress-.93)/.07);
      }else if(progress<.78){
        supportHand=lerpPoint(magazineWell,stagingHand,(progress-.68)/.10);
      }else{
        supportHand=lerpPoint(stagingHand,supportGrip,(progress-.78)/.22);
      }
    }else if(progress<.08){
      supportHand=lerpPoint(supportGrip,stagingHand,progress/.08);
    }else if(progress<.22){
      supportHand=lerpPoint(stagingHand,pouchHand,(progress-.08)/.14);
    }else if(progress<.50){
      const t=(progress-.22)/.28;
      // 몸통을 가로지르지 않고 왼쪽 외곽을 따라 총 앞쪽까지 운반한다.
      supportHand=lerpPoint(pouchHand,stagingHand,t);
      newMagazine=true;
      newMagazineAngle=-.12;
    }else if(progress<.68){
      const t=(progress-.50)/.18;
      // 몸통 앞을 완전히 지난 뒤에만 탄창 삽입구 쪽으로 손을 당긴다.
      supportHand=lerpPoint(stagingHand,magazineWell,t);
      newMagazine=true;
      newMagazineAngle=-.12*(1-smoothStep01(t));
    }else if(pistol.reloadWasEmpty&&progress<.74){
      const slideHand=gunPoint(pose,actionX,actionY);
      supportHand=lerpPoint(magazineWell,slideHand,(progress-.68)/.06);
      slideOffset=-slideTravel;
    }else if(pistol.reloadWasEmpty&&progress<.82){
      const t=(progress-.74)/.08;
      slideOffset=-slideTravel-smoothStep01(t)*(pulledSlide-slideTravel);
      supportHand=gunPoint(pose,actionX+slideOffset,actionY);
    }else if(pistol.reloadWasEmpty&&progress<.84){
      slideOffset=-pulledSlide;
      supportHand=gunPoint(pose,actionX-pulledSlide,actionY);
    }else if(pistol.reloadWasEmpty&&progress<.88){
      const t=(progress-.84)/.04;
      slideOffset=-pulledSlide*(1-smoothStep01(t));
      supportHand=gunPoint(pose,actionX-pulledSlide,actionY);
    }else if(pistol.reloadWasEmpty&&progress<.93){
      const releaseHand=gunPoint(pose,actionX-pulledSlide,actionY);
      supportHand=lerpPoint(releaseHand,stagingHand,(progress-.88)/.05);
    }else if(pistol.reloadWasEmpty){
      supportHand=lerpPoint(stagingHand,supportGrip,(progress-.93)/.07);
    }else if(progress<.78){
      supportHand=lerpPoint(magazineWell,stagingHand,(progress-.68)/.10);
    }else{
      supportHand=lerpPoint(stagingHand,supportGrip,(progress-.78)/.22);
    }
  }else if(pickupPose){
    supportHand=lerpPoint(
      supportGrip,pickupPose.handTarget,pickupPose.reach
    );
  }

  if(weaponPickupPose){
    supportHand=lerpPoint(
      supportHand,weaponPickupPose.supportHand,weaponPickupPose.reach
    );
    primaryHand=lerpPoint(
      primaryHand,weaponPickupPose.primaryHand,weaponPickupPose.reach
    );
  }

  if(pose.longGunSprint>0){
    const carry=pose.longGunSprint;
    const supportX=def.id==='battleRifle'?16.3:
      (def.id==='smg'?5.5:(def.id==='shotgun'?6.5:10));
    // 질주 중에도 손이 몸에서 따로 노는 모양이 되지 않도록 오른손은 총몸 뒤,
    // 왼손은 핸드가드에 고정한다. 총은 머리 앞에서 거의 가로로 놓인다.
    primaryHand=lerpPoint(
      primaryHand,gunPoint(pose,-3.5,1.5),carry
    );
    supportHand=lerpPoint(
      supportHand,gunPoint(pose,supportX,-1.5),carry
    );
  }

  if(meleeAttack==='palm'){
    supportHand=lerpPoint(supportGrip,{x:21.6,y:-3.3},meleePulse);
  }else if(meleeAttack==='magazine'){
    // 손잡이 바닥을 밀어 넣는 동안 왼손은 얼굴 앞을 지킨다.
    const cover=meleeProgress<.52
      ?smoothStep01(meleeProgress/.52)
      :1-smoothStep01((meleeProgress-.52)/.48);
    supportHand=lerpPoint(supportGrip,{x:7.0,y:-6.2},cover);
  }else if(smgAttack==='bodyPush'){
    // 오른손은 개머리판, 왼손은 핸드가드 쪽을 잡아 총몸 양 끝을 고정한다.
    primaryHand=gunPoint(pose,-8.0,1.6);
    supportHand=gunPoint(pose,10.5,-2.0);
  }else if(rifleAttack==='stockStrike'){
    const strike=rifleStockStrikePose(rifleProgress);
    // 왼손은 총구 가까이, 오른손은 리시버를 잡은 채 개머리판을 정면으로 민다.
    supportHand=lerpPoint(
      supportGrip,gunPoint(pose,30,-1.2),strike.grip
    );
    primaryHand=lerpPoint(
      primaryHand,gunPoint(pose,5,1.5),strike.grip
    );
  }else if(shotgunAttack){
    // 양손을 총열의 서로 다른 지점으로 옮겨 잡아 손잡이 밑동을 망치처럼 쓴다.
    const take=smoothStep01(clamp(shotgunProgress/.40,0,1));
    const release=shotgunProgress<.84
      ?take:take*(1-smoothStep01((shotgunProgress-.84)/.16));
    supportHand=lerpPoint(supportGrip,gunPoint(pose,14.2,-1.5),release);
    primaryHand=lerpPoint(primaryHand,gunPoint(pose,11.0,1.5),release);
  }

  if(actionEntryPose&&actionEntryPose.supportHand){
    supportHand=lerpPoint(actionEntryPose.supportHand,supportHand,actionEntryBlend);
    primaryHand=lerpPoint(actionEntryPose.primaryHand,primaryHand,actionEntryBlend);
  }

  let hydrogenTankAlpha=def.plasma&&pistol.reloading&&progress>=.14?1:0;
  if(def.plasma&&pistol.reloading&&pistol.hydrogenTankSwap>0){
    const swap=clamp(1-pistol.hydrogenTankSwap/.55,0,1);
    const port=gunPoint(pose,1,-7),withdrawn=gunPoint(pose,1,-11);
    if(swap<.20) supportHand=lerpPoint(port,withdrawn,smoothStep01(swap/.20));
    else if(swap<.50) supportHand=lerpPoint(withdrawn,pouchHand,smoothStep01((swap-.20)/.30));
    else if(swap<.64) supportHand=pouchHand;
    else supportHand=lerpPoint(pouchHand,port,smoothStep01((swap-.64)/.36));
    hydrogenTankAlpha=swap<.50?1:swap<.57?1-smoothStep01((swap-.50)/.07):smoothStep01(clamp((swap-.57)/.07,0,1));
  }
  if(def.plasma&&reloadExitActive&&actionEntryPose){
    const exit=clamp(hydrogenExitElapsed/.42,0,1);
    const withdrawn={x:actionEntryPose.supportHand.x,y:actionEntryPose.supportHand.y-4};
    if(exit<.22) supportHand=lerpPoint(actionEntryPose.supportHand,withdrawn,smoothStep01(exit/.22));
    else if(exit<.65) supportHand=lerpPoint(withdrawn,pouchHand,smoothStep01((exit-.22)/.43));
    else supportHand=lerpPoint(pouchHand,supportGrip,smoothStep01((exit-.65)/.35));
    hydrogenTankAlpha=pistol.hydrogenTankVisible?1-smoothStep01(clamp((exit-.50)/.15,0,1)):0;
  }

  return{
    progress,pose,primaryHand,supportHand,supportGrip,hydrogenTankAlpha,
    sprintSupport:(!pistol.reloading&&!(def.plasma&&reloadExitActive)&&!pickupPose&&!meleeAttack&&['pistol','revolver','plasmaPistol'].includes(def.id))
      ?player.sprintBlend:0,
    sprintPrimaryStraight:(!pistol.reloading&&!pickupPose&&!meleeAttack&&['pistol','revolver','plasmaPistol'].includes(def.id))
      ?player.sprintBlend:0,
    newMagazine,newMagazineAngle,slideOffset,breakOpen,shotgunShellsInHand,moonClipInHand,
    oldMagazine,
    bodyLean:Math.max(
      pickupPose?pickupPose.bodyLean:0,
      weaponPickupPose?weaponPickupPose.bodyLean:0
    ),
    weaponAlpha,
    pickupMagazineInHand:!!(pickupPose&&pickupPose.magazineInHand),
    meleeAttack,meleeProgress,meleePulse,meleeSideView,
    smgAttack,smgProgress,rifleAttack,rifleProgress,rifleMeleeSideView,rifleBodyTurn,
    shotgunAttack,shotgunProgress
  };
}

function playerShoulders(){
  const longGunStance=!['pistol','revolver','plasmaPistol'].includes(currentWeaponDef().id);
  // 오른손잡이 기본 자세부터 왼쪽 어깨가 조금 앞서고 오른쪽 어깨가
  // 뒤로 빠진다. 장총을 견착할 때만 이 사선이 한 단계 더 깊어진다.
  // 몸통 그림만 비트는 대신 팔 관절의 실제 시작점도 같은 사선을 따른다.
  const support=longGunStance?{x:1.5,y:-5.8}:{x:-.35,y:-5.5};
  const primary=longGunStance?{x:-2.5,y:5.8}:{x:-1.65,y:5.5};
  if(currentWeaponDef().id==='smg'&&smgMelee.attack){
    if(smgMelee.attack==='muzzle'){
      const reach=smgMuzzlePulse01(smgMeleeProgress());
      // 총구만 빠지는 대신 양쪽 어깨도 함께 밀고 들어가 찌르기를 크게 만든다.
      support.x+=1.55*reach;
      primary.x+=1.25*reach;
    }else if(smgMelee.attack==='bodyPush'){
      const drive=smgBodyPushPose(smgMeleeProgress()).drive;
      // 총몸 양 끝을 잡은 채 양팔이 거의 펴질 때까지 상체 전체로 밀어낸다.
      support.x+=1.85*drive;
      primary.x+=1.45*drive;
    }
  }else if(['battleRifle','assaultRifle','lmg','pumpShotgun'].includes(currentWeaponDef().id)&&rifleMelee.attack){
    if(rifleMelee.attack==='muzzle'){
      const reach=rifleMuzzlePulse01(rifleMeleeProgress());
      support.x+=1.8*reach;
      primary.x+=1.5*reach;
    }else if(rifleMelee.attack==='stockSweep'){
      const sweep=rifleStockSweepPose(rifleMeleeProgress());
      const twist=clamp(sweep.turn,-1,1);
      support.x+=1.0*sweep.drive+1.1*twist;
      primary.x+=.8*sweep.drive-1.1*twist;
      support.y+=.16*sweep.side;
      primary.y+=.12*sweep.side;
    }else{
      const strike=rifleStockStrikePose(rifleMeleeProgress());
      support.x+=2.3*strike.drive;
      primary.x+=2.0*strike.drive;
      support.y+=.20*strike.side;
      primary.y+=.16*strike.side;
    }
  }else if(currentWeaponDef().id==='shotgun'&&shotgunMelee.attack){
    const strike=shotgunSwingPose(shotgunMeleeProgress());
    // 두 어깨가 함께 잠겼다가 타격 순간 동시에 전진해 양손 힘을 전달한다.
    support.x+=2.9*strike.drive;
    primary.x+=2.65*strike.drive;
    support.y+=.22*strike.side;
    primary.y+=.18*strike.side;
  }
  return{support,primary};
}

function drawSupportArm(rig){
  const supportShoulder=playerShoulders().support;
  if(rig.sprintSupport>0)drawPistolSprintArm(rig);
  else drawRiggedArm(
    supportShoulder.x,supportShoulder.y,
    rig.supportHand.x,rig.supportHand.y,-1
  );
}

function drawPrimaryArm(rig){
  const primaryShoulder=playerShoulders().primary;
  if(rig.sprintPrimaryStraight>0)drawPistolSprintPrimaryArm(rig);
  else drawRiggedArm(
    primaryShoulder.x,primaryShoulder.y,
    rig.primaryHand.x,rig.primaryHand.y,1
  );
}

function drawPistolArms(rig){
  // 보조 손인 왼팔을 가장 뒤에 두고, 주손인 오른팔을 그 위에 둔다.
  // 두 팔 모두 몸통보다 먼저 그려져 어깨 뿌리가 몸 안으로 자연스럽게 묻힌다.
  drawSupportArm(rig);
  drawPrimaryArm(rig);
}

function drawPistolWeapon(rig){
  const def=currentWeaponDef();
  const{progress,pose,supportHand}=rig;

  if(rig.hydrogenTankAlpha>0){
    ctx.save();
    ctx.globalAlpha*=rig.hydrogenTankAlpha;
    ctx.translate(supportHand.x,supportHand.y);
    ctx.rotate(pose.turn);
    // 둥근 압력 용기와 가는 연결 노즐. 총 아래 포트로 +Y 방향으로 결합한다.
    ctx.fillStyle='#161f22';
    ctx.beginPath();ctx.ellipse(0,-.5,3.3,5.2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#537780';ctx.fillRect(-2.7,-3.4,5.4,6);
    ctx.fillStyle='#93b5b9';ctx.fillRect(-1.9,-3.1,.9,5.3);
    ctx.fillStyle='#273b40';ctx.fillRect(-2.7,1.8,5.4,1.1);
    ctx.fillStyle='#acb6b6';ctx.fillRect(-.95,3,1.9,3.2);
    ctx.fillStyle='#b8dbd8';ctx.font='bold 3px monospace';ctx.fillText('H2',-1.8,.5);
    // 탱크를 감싸는 손가락을 용기 위 레이어에 다시 올린다.
    ctx.fillStyle='#c18460';ctx.fillRect(-3.2,-1.5,1.8,3.6);
    ctx.fillStyle='#a96f52';ctx.fillRect(-2.2,1,3.6,1.1);
    ctx.restore();
  }

  if(rig.pickupMagazineInHand){
    const pickedType=magazinePickup.magazine
      ?magazinePickup.magazine.magazine.magazineType
      :def.magazineType;
    drawMagazineLocal(supportHand.x,supportHand.y,.18,1,pickedType);
  }

  if(rig.newMagazine){
    drawMagazineLocal(
      supportHand.x,supportHand.y,
      rig.newMagazineAngle,1
    );
  }
  if(rig.oldMagazine){
    const retained=pistol.reloadRetainedMagazine;
    drawMagazineLocal(
      supportHand.x,supportHand.y,.16,1,
      retained?retained.magazineType:def.magazineType
    );
  }

  if(rig.shotgunShellsInHand>0){
    ctx.save();
    ctx.translate(supportHand.x,supportHand.y);
    ctx.rotate(-.18);
    if(currentWeaponDef().id==='pumpShotgun'&&pistol.pumpReloadUseSpeedloader){
      const span=Math.max(4,rig.shotgunShellsInHand*1.55);
      ctx.fillStyle='#252b2d';ctx.fillRect(-4.8,-span/2-1,9.2,span+2);
      ctx.fillStyle='#697173';ctx.fillRect(-4.2,-span/2-.4,1.1,span+.8);
    }
    for(let i=0;i<rig.shotgunShellsInHand;i++){
      const shellY=(i-(rig.shotgunShellsInHand-1)/2)*1.55;
      ctx.fillStyle='#a83d31';
      ctx.fillRect(-4,shellY-1.25,7,2.5);
      ctx.fillStyle='#c7a052';
      ctx.fillRect(-4,shellY-1.25,1.5,2.5);
    }
    ctx.restore();
  }

  if(rig.moonClipInHand>0){
    ctx.save();
    ctx.translate(supportHand.x,supportHand.y);
    ctx.rotate(-.18);
    // 총열 축이 화면 평면에 놓인 탑뷰이므로 문클립의 둥근 정면이 아니라
    // 얇은 가장자리와 서로 겹쳐 보이는 탄의 옆면만 표시한다.
    ctx.fillStyle='#24292b';ctx.fillRect(-1,-4.8,2,9.6);
    ctx.fillStyle='#727a7c';ctx.fillRect(-.5,-4.2,1,8.4);
    for(let i=0;i<5;i++){
      const y=-4+i*2;
      // 원둘레 앞·뒤의 두 발이 살짝 어긋난 한 쌍으로 투영된다.
      ctx.fillStyle='#8d7439';ctx.fillRect(-2.2,y-.65,4.8,1.3);
      ctx.fillStyle='#bea052';ctx.fillRect(-1.5,y-.45,4.3,.7);
      ctx.fillStyle='#7b6534';ctx.fillRect(-2.5,y-.75,.8,1.5);
      ctx.strokeStyle='rgba(7,8,8,.42)';ctx.lineWidth=.45;
      ctx.strokeRect(-2.2,y-.65,4.8,1.3);
    }
    ctx.fillStyle='#171b1c';ctx.fillRect(-1.3,-.8,2.6,1.6);
    ctx.restore();
  }

  ctx.save();
  ctx.globalAlpha*=rig.weaponAlpha===undefined?1:rig.weaponAlpha;
  ctx.translate(pose.gunX,pose.gunY);
  ctx.rotate(pose.turn);

  // 탄창 멈치를 누르면 왼손의 도움 없이 기존 탄창이 자유 낙하한다.
  if(
    pistol.reloading&&def.detachableMagazine!==false&&!pistol.reloadKeepMagazine&&
    progress>=.10&&progress<.16
  ){
    const t=smoothStep01((progress-.10)/.06);
    drawMagazineLocal(-3,-2.8,.15+t*.25,1);
  }

  if(rig.rifleMeleeSideView>0&&['battleRifle','assaultRifle','lmg','pumpShotgun'].includes(def.id)){
    // 2타에서는 각 소총 길이에 맞춘 전용 옆면으로 넘어간다.
    ctx.save();
    ctx.globalAlpha=1-rig.rifleMeleeSideView;
    drawPistolFrame(rig.breakOpen);
    drawPistolSlide(rig.slideOffset);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha=rig.rifleMeleeSideView;
    drawRifleMeleeSideProfile();
    ctx.restore();
  }else if(rig.meleeSideView>0){
    // 손목이 비트는 동안 기존 탑뷰에서 임시 옆면으로 짧게 크로스페이드한다.
    ctx.save();
    ctx.globalAlpha=1-rig.meleeSideView;
    drawPistolFrame(rig.breakOpen);
    drawPistolSlide(rig.slideOffset);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha=rig.meleeSideView;
    if(def.id==='revolver')drawRevolverMeleeSideProfile();
    else drawPistolMeleeSideProfile();
    ctx.restore();
  }else{
    drawPistolFrame(rig.breakOpen);
    drawPistolSlide(rig.slideOffset);
  }

  // 발사 시 생성한 월드 효과가 섬광부터 잔류 가스까지 독립적으로 소멸한다.
  drawBloodSurface(pistol,'receiver',-4,-2,13,4);
  drawBloodSurface(pistol,'barrel',9,-1,def.id==='pistol'||def.id==='revolver'?6:14,2);
  ctx.restore();
}

let activePlayerSpritePalette=null;
const ALLY_PLAYER_SPRITE_PALETTE={
  armorOuter:'#18262c',armorBase:'#31505b',armorMid:'#47707c',
  armorPlate:'#223a42',armorHighlight:'#6e97a1',armorStrap:'#1e3037',
  armorSide:'#132126',armorPouch:'#1b2c32',armorPouchHi:'#527986'
};
function spritePaletteColor(key,fallback){
  return activePlayerSpritePalette&&activePlayerSpritePalette[key]||fallback;
}

function drawPlayerTorso(longGunStance=false){
  ctx.save();
  // +X가 정면이다. 오른손잡이 기본 사선을 항상 유지하고 장총 견착 시
  // 왼쪽(-Y)은 더 앞으로, 오른쪽(+Y)은 더 뒤로 보낸다. 중심은 고정된다.
  ctx.transform(1,0,longGunStance?-.25:-.12,1,0,0);

  // 어깨와 목의 기본 맨살.
  ctx.fillStyle='#5a382e';
  ctx.fillRect(-5.5,-8,11,16);
  ctx.fillStyle='#aa7053';
  ctx.fillRect(-4.5,-7,9,14);

  if(player.armorEquipped){
    // 방탄조끼 착용 상태.
    // 탱크탑 위를 덮는 짙은 플레이트 캐리어 + 어깨끈 + 옆 스트랩.
    ctx.fillStyle=spritePaletteColor('armorOuter','#1a211e');
    ctx.fillRect(-6.5,-6,12,12);

    // 메인 캐리어 몸판.
    ctx.fillStyle=spritePaletteColor('armorBase','#364139');
    ctx.fillRect(-5.5,-5,10.5,10);
    ctx.fillStyle=spritePaletteColor('armorMid','#536158');
    ctx.fillRect(-4.5,-4,8.5,8);

    // 전면 플레이트 윤곽.
    ctx.fillStyle=spritePaletteColor('armorPlate','#263029');
    ctx.fillRect(-3.5,-3,6.5,6);
    ctx.fillStyle=spritePaletteColor('armorHighlight','#68766b');
    ctx.fillRect(-2.5,-2,4.5,1);

    // 어깨끈. 팔 끝까지 덮지 않고 몸통 쪽에만 보여 맨팔과 구분된다.
    ctx.fillStyle=spritePaletteColor('armorStrap','#252e29');
    ctx.fillRect(1.5,-7,4,-2);
    ctx.fillRect(1.5,5,4,2);

    // 양옆 고정 스트랩.
    ctx.fillStyle=spritePaletteColor('armorSide','#171d1a');
    ctx.fillRect(-6.5,-4,2,8);
    ctx.fillRect(4.5,-4,2,8);

    // 하단 파우치/벨트.
    ctx.fillStyle=spritePaletteColor('armorPouch','#202722');
    ctx.fillRect(-5.5,3,10,3);
    ctx.fillStyle=spritePaletteColor('armorPouchHi','#59665d');
    ctx.fillRect(-4.5,3,3,2);
    ctx.fillRect(-.5,3,3,2);
  }else{
    // 방어구가 없을 때는 기존 흰 탱크탑.
    ctx.fillStyle='#a8aaa4';
    ctx.fillRect(-5.5,-5,10.5,10);
    ctx.fillStyle='#ecebe2';
    ctx.fillRect(-4.5,-4,9,8);
    ctx.fillRect(2,-6,3.5,2);
    ctx.fillRect(2,4,3.5,2);
    ctx.fillStyle='#c7c8c1';
    ctx.fillRect(-4.5,3,9,1);
  }

  // 목은 방어구 여부와 관계없이 머리 아래에 짧게 남긴다.
  ctx.fillStyle='#5a382e';
  ctx.fillRect(-2,-3,5,6);
  ctx.fillStyle='#b97b59';
  ctx.fillRect(-1,-2,4,4);

  drawBloodSurface(bloodSurfaceActor||player,'torso',-5.5,-7,10.5,14);
  ctx.restore();
}

function drawSharedHeadLocal(context=ctx){
  if(!sharedHeadSprite.complete||!sharedHeadSprite.naturalWidth)return;
  context.save();context.imageSmoothingEnabled=false;
  // Circle spans x=30..60, y=50..80: pivot=(45.5,65.5), excluding the nose.
  // Uniform 1/3 scale preserves the original silhouette (no independent axis fitting).
  context.rotate(Math.PI/2);
  context.drawImage(sharedHeadSprite,30,46,31,35,-15.5/3,-19.5/3,31/3,35/3);
