},true);
window.addEventListener('mousedown',event=>{
  if(!simulationControl.open)return;
  event.preventDefault();event.stopImmediatePropagation();
  mouse.down=false;mouse.aim=false;
  beginSimulationPanelPointer(event);
},true);
window.addEventListener('mouseup',event=>{
  if(!simulationControl.open||event.button!==0)return;
  event.preventDefault();event.stopImmediatePropagation();
  mouse.down=false;mouse.aim=false;
  commitSimulationPanelPointer(event);
},true);
window.addEventListener('blur',()=>{simulationControl.pressed=null});

// 시작화면 문구도 테스트 목적에 맞게 정리한다.
setLanguage(uiLanguage);

// Separate inspection scene: reuse real sprite painters without advancing the test yard.
const spriteRoomEntries=[];
const spriteRoomActor=createExtraMeleeDummy(0,0,'SPRITE PREVIEW');
Object.assign(spriteRoomActor,{bodyAngle:0,headAngle:0,angle:0,hp:100,maxHp:100});
function spriteRoomWorld(draw,x=0,y=0){
  const p=worldToScreen(x,y);ctx.save();ctx.translate(-p.x,-p.y);try{draw();}finally{ctx.restore();}
}
function spriteRoomWeapon(def,draw){
  const saved=pistol;
  try{pistol={...weaponStates[def.id],weaponId:def.id,thermalLock:0,reloading:false};draw();}
  finally{pistol=saved;}
}
function buildSpriteRoomEntries(){
  spriteRoomEntries.length=0;
  const add=(group,label,draw)=>spriteRoomEntries.push({group,label,draw});
  add('캐릭터 / CHARACTER','머리 / HEAD',drawSharedHeadLocal);
  for(const armor of [false,true])add('캐릭터 / CHARACTER',armor?'몸통 · 방어구 / ARMORED TORSO':'몸통 / TORSO',()=>{
    const saved=player.armorEquipped;try{player.armorEquipped=armor;drawPlayerTorso(false);}finally{player.armorEquipped=saved;}
  });
  add('캐릭터 / CHARACTER','팔·손 / ARM + HAND',()=>drawRiggedArm(-9,0,9,0,1));
  add('캐릭터 / CHARACTER','위팔 / UPPER ARM',()=>drawLimbSegment(-4.25,0,4.25,0,5,'#a96f52'));
  add('캐릭터 / CHARACTER','아래팔 / FOREARM',()=>drawLimbSegment(-4.5,0,4.5,0,4,'#c18460'));
  add('캐릭터 / CHARACTER','손 / HAND',()=>drawJointBlock(0,0,4,'#cf9069'));
  add('캐릭터 / CHARACTER','팔꿈치 / ELBOW',()=>drawJointBlock(0,0,5,'#b97b59'));
  add('캐릭터 / CHARACTER','손목 / WRIST',()=>drawJointBlock(0,0,3,'#9f654b'));
  add('캐릭터 / CHARACTER','전신 기본 / BASE CHARACTER',()=>spriteRoomWorld(()=>drawMeleeActor(spriteRoomActor,null,0)));
  for(const type of SIMULATION_ENEMY_TYPES)add('캐릭터 / CHARACTER',simulationEnemyLabel(type),()=>
    spriteRoomWorld(()=>drawMeleeActor(spriteRoomActor,null,0,{sleeveColor:type.id==='researcher'?'#c5c8bf':type.id==='soldier'?'#40503a':'#30383b',palette:MELEE_SOLDIER_PALETTE})));
  for(const def of WEAPON_DEFS){
    add('총기 / FIREARMS',localizedWeaponName(def),()=>spriteRoomWeapon(def,()=>{drawPistolFrame(0);drawPistolSlide(0);}));
    add('총기 조각 / WEAPON PARTS',localizedWeaponName(def)+' · FRAME',()=>spriteRoomWeapon(def,()=>drawPistolFrame(0)));
    if(!def.plasma&&!['shotgun','pumpShotgun','revolver'].includes(def.id))
      for(const offset of [0,-3])add('총기 조각 / WEAPON PARTS',localizedWeaponName(def)+' · SLIDE / BOLT '+offset,()=>spriteRoomWeapon(def,()=>drawPistolSlide(offset)));
    const zones=def.plasma?[['냉각기 / COOLER',-8,-4,4.8,8],['총몸 / BODY',-3.2,-4,10.6,9],['총열 / BARREL',7.4,-3,8,6]]:
      def.id==='pumpShotgun'?[['개머리판 / STOCK',-13,-3,11,6],['총몸 / RECEIVER',-2,-3,10,6],['펌프 영역 / PUMP REGION',15,-3,10,6],['총열 끝 / MUZZLE',25,-3,11,6]]:
      def.id==='shotgun'?[['손잡이 / GRIP',-10,-4,8,8],['약실 / BREECH',-2,-5,7,10],['쌍열 / BARRELS',5,-5,20,10]]:
      def.id==='revolver'?[['손잡이 / GRIP',-6,-3,4.5,7],['실린더·프레임 / CYLINDER FRAME',-1.5,-3.2,7.5,6.4],['총열 / BARREL',6,-2,9,4]]:
      [['후방 / REAR',-16,-8,12,16],['총몸 / RECEIVER',-4,-8,17,20],['전방 / FRONT',13,-8,28,16]];
    for(const [label,x,y,w,h] of zones)add('총기 조각 / WEAPON PARTS',localizedWeaponName(def)+' · '+label,()=>{
      ctx.save();ctx.translate(-x-w/2,-y-h/2);ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
      try{spriteRoomWeapon(def,()=>{drawPistolFrame(0);drawPistolSlide(0);});}finally{ctx.restore();}
    });
    if(['shotgun','revolver'].includes(def.id))add('총기 / FIREARMS',localizedWeaponName(def)+' · OPEN',()=>spriteRoomWeapon(def,()=>drawPistolFrame(1)));
    if(['pistol','revolver','battleRifle','assaultRifle','lmg','pumpShotgun'].includes(def.id))
      add('총기 / FIREARMS',localizedWeaponName(def)+' · SIDE',()=>spriteRoomWeapon(def,()=>{
        if(def.id==='pistol')drawPistolMeleeSideProfile();else if(def.id==='revolver')drawRevolverMeleeSideProfile();else drawRifleMeleeSideProfile();
      }));
  }
  for(const id of ['knife','armingSword','longsword'])add('근접무기 / MELEE',meleePickupName(id),()=>spriteRoomWorld(()=>drawTestLongswordPickup({x:0,y:0,weaponId:id})));
  for(const ammo of AMMO_TYPES)add('탄약 / AMMO',ammo.name||ammo.id,()=>drawWorkbenchCartridge(0,0,12,4,ammo));
  for(const type of ['pistol22','smg22','rifle556','rifle762','lmg556'])add('탄창 / MAGAZINES',type,()=>drawMagazineLocal(0,0,0,1,type));
  for(const id of ['revolver','pumpShotgun']){
    const def=WEAPON_BY_ID[id];
    add('탄창 / MAGAZINES',localizedWeaponName(def)+' · INVENTORY',()=>{
      ctx.save();ctx.scale(.2,.2);
      spriteRoomWeapon(def,()=>drawWorkbenchMagazine({rounds:Array(def.magSize||10).fill(id==='pumpShotgun'?'buckshot':'standard'),capacity:def.magSize||10,hydrogen:200},def,0,-75));ctx.restore();
    });
  }
  add('소품 / PROPS','수소통 · 충전 파지 / H2 REFILL',()=>spriteRoomWeapon(WEAPON_BY_ID.plasmaPistol,()=>drawPistolWeapon({
    progress:0,pose:{gunX:0,gunY:-10,turn:0},supportHand:{x:0,y:3},hydrogenTankAlpha:1
  })));
  add('소품 / PROPS','문클립 · 장전 측면 / MOONCLIP SIDE',()=>spriteRoomWeapon(WEAPON_BY_ID.revolver,()=>drawPistolWeapon({
    progress:0,pose:{gunX:0,gunY:-12,turn:0},supportHand:{x:0,y:4},moonClipInHand:1
  })));
  for(const kind of ['pistol','rifle','shell'])add('탄피 / CASINGS',kind,()=>drawCasingLocal({shell:kind==='shell',rifle:kind==='rifle'}));
  for(const def of WEAPON_DEFS.filter(d=>d.magazineType&&!d.plasma))add('탄창 / MAGAZINES',localizedWeaponName(def)+' · FULL INVENTORY',()=>{
    ctx.save();ctx.scale(.2,.2);
    try{spriteRoomWeapon(def,()=>drawWorkbenchMagazine({magazineType:def.magazineType,rounds:Array(def.magSize||10).fill(def.ammoType||'standard'),capacity:def.magSize||10},def,0,-75));}finally{ctx.restore();}
  });
  for(const kind of ['food','coffee'])add('소품 / PROPS',kind,()=>drawConsumableIcon(kind,0,0));
  add('환경 / ENVIRONMENT','욕탕 / BATH',()=>{ctx.save();ctx.scale(.35,.35);spriteRoomWorld(drawTestBath,testBath.x,testBath.y);ctx.restore();});
  add('환경 / ENVIRONMENT','무기고 / ARMORY',()=>{ctx.save();ctx.scale(.055,.055);spriteRoomWorld(drawTestArmory,TEST_ARMORY.x+TEST_ARMORY.w/2,TEST_ARMORY.y+TEST_ARMORY.h/2);ctx.restore();});
  add('환경 / ENVIRONMENT','방어구 / ARMOR PICKUP',()=>spriteRoomWorld(drawArmorPickup,START_CELL_ARMOR.x,START_CELL_ARMOR.y));
  add('환경 / ENVIRONMENT','사격장 / SHOOTING RANGE',()=>{ctx.save();ctx.scale(.04,.04);spriteRoomWorld(drawShootingRange,SHOOTING_RANGE.x+SHOOTING_RANGE.w/2,SHOOTING_RANGE.y+SHOOTING_RANGE.h/2);ctx.restore();});
  const select=document.getElementById('spriteRoomSelect');
  select.innerHTML=spriteRoomEntries.map((entry,i)=>`<option value="${i}">${entry.group} — ${entry.label}</option>`).join('');
}
function openSpriteRoom(){
  buildSpriteRoomEntries();spriteRoom.open=true;spriteRoom.index=0;
  keys.clear();mouse.down=false;mouse.aim=false;
  if(document.pointerLockElement)document.exitPointerLock();
  startScreen.classList.add('hidden');
  document.getElementById('spriteRoomTools').hidden=false;
  document.getElementById('spriteRoomButton').hidden=true;
  canvas.style.cursor='default';
}
function closeSpriteRoom(){
  spriteRoom.open=false;keys.clear();mouse.down=false;mouse.aim=false;
  document.getElementById('spriteRoomTools').hidden=true;
  startScreen.classList.remove('hidden');
}
document.getElementById('spriteRoomButton').addEventListener('click',openSpriteRoom);
document.getElementById('spriteRoomBack').addEventListener('click',closeSpriteRoom);
document.getElementById('spriteRoomSelect').addEventListener('change',e=>{spriteRoom.index=Number(e.target.value);});
document.getElementById('spriteRoomZoom').addEventListener('input',e=>{spriteRoom.zoom=Number(e.target.value);});
document.getElementById('spriteRoomAngle').addEventListener('input',e=>{spriteRoom.angle=Number(e.target.value)*Math.PI/180;});
document.getElementById('spriteRoomBackground').addEventListener('change',e=>{spriteRoom.light=e.target.value==='light';});
function renderSpriteRoom(){
  ctx.save();ctx.clearRect(0,0,W,H);ctx.fillStyle=spriteRoom.light?'#aaaeb0':'#283236';ctx.fillRect(0,0,W,H);
  const cx=W/2,cy=H/2+40;
  ctx.strokeStyle=spriteRoom.light?'#989da0':'#303c41';ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=cx%spriteRoom.zoom;x<W;x+=spriteRoom.zoom){ctx.moveTo(x,0);ctx.lineTo(x,H);}
  for(let y=cy%spriteRoom.zoom;y<H;y+=spriteRoom.zoom){ctx.moveTo(0,y);ctx.lineTo(W,y);}ctx.stroke();
  ctx.save();ctx.translate(cx,cy);ctx.scale(spriteRoom.zoom,spriteRoom.zoom);ctx.rotate(spriteRoom.angle);
  spriteRoomEntries[spriteRoom.index]?.draw();ctx.restore();
  // Pivot cross remains screen-sized, making off-centre rotation immediately visible.
  ctx.strokeStyle='#e5b957';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-5,cy);ctx.lineTo(cx+5,cy);ctx.moveTo(cx,cy-5);ctx.lineTo(cx,cy+5);ctx.stroke();
  ctx.fillStyle=spriteRoom.light?'#172024':'#e2e5d8';ctx.textAlign='center';ctx.font='bold 18px monospace';
  ctx.fillText(spriteRoomEntries[spriteRoom.index]?.label||'',W/2,H-38);
  ctx.restore();document.getElementById('spriteRoomZoomValue').textContent=spriteRoom.zoom+'×';
}
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);
  last=now;
  document.getElementById('spriteRoomButton').hidden=gameStarted||spriteRoom.open;
  if(spriteRoom.open)renderSpriteRoom();
  else{update(dt);render();}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
